<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<title>Yellow Jacket Tour · Stroke-Honey Edition</title>
<style>
  :root {
    /* --- raw palette (never changes between themes) --- */
    --cream: #F5F1E8;
    --cream-soft: #FBF8F1;
    --white: #FFFFFF;
    --green: #006747;
    --green-deep: #0B5544;
    --green-mid: #14724E;
    --pine-bg: #0C3D2A;
    --gold: #C9A857;
    --gold-soft: #E0C68C;
    --honey: #FFC107;
    --honey-soft: #FFE082;
    --azalea: #FCE4EC;
    --azalea-mid: #F8BBD0;
    --charcoal: #1B1B1B;
    --fairway: #6D7066;

    /* --- semantic tokens: day theme defaults (WCAG AA ≥ 4.5:1 on bg-app/surface) --- */
    --bg-app: #F5F1E8;
    --bg-surface: #FFFFFF;
    --bg-elevated: #FBF8F1;
    --bg-dark: #0B5544;              /* always-dark elements (sidebar, toast, table header stripe) */
    --bg-tint-gold: rgba(201, 168, 87, 0.10);
    --bg-tint-green: rgba(0, 103, 71, 0.08);
    --bg-tint-pink: rgba(252, 228, 236, 0.55);

    --text-primary: #1B1B1B;         /* body text on bg-app/bg-surface */
    --text-secondary: #5C6159;       /* captions, labels (contrast-bumped from #6D7066) */
    --text-heading: #006747;         /* h1/h2/h3 and accent greens */
    --text-heading-deep: #004F37;    /* darker on buzz-bubble / moment-narr */

    --text-accent-gold: #8A6F2B;     /* dark-gold chip text on light gold bg */
    --text-accent-pink: #8E3A5F;     /* dark-pink chip text on azalea bg */
    --text-accent-honey: #8B6914;    /* dark honey on light honey bg */

    --text-on-dark: #F5F1E8;         /* always cream — for sidebar, toast, game-table */
    --text-on-dark-soft: #E0C68C;    /* brand-name style on sidebar */
    --text-on-gold: #1B1B1B;         /* gold buttons always have dark text */

    --border: rgba(11, 85, 68, 0.18);
    --border-strong: rgba(11, 85, 68, 0.35);

    --chart-text: #1B1B1B;
    --chart-grid: rgba(11, 85, 68, 0.12);
    --chart-axis: rgba(11, 85, 68, 0.25);
    --chart-series-primary: #006747;
    --chart-series-accent: #C9A857;
    --chart-series-tertiary: #8E3A5F;
    --chart-pos: #B85A3A;
    --chart-neg: #1E7A4E;

    --shadow-soft: 0 1px 3px rgba(27, 27, 27, 0.06), 0 4px 10px rgba(11, 85, 68, 0.06);
    --shadow-med: 0 4px 16px rgba(11, 85, 68, 0.10);
    --line: 1px solid var(--border);
    --radius: 10px;
    --nav-w: 232px;
  }

  [data-theme="sunday"] {
    /* Flip semantic tokens only — raw palette stays constant (Tailwind / Radix pattern). */
    --bg-app: #0A2A1B;
    --bg-surface: #143E2B;
    --bg-elevated: #103826;
    --bg-dark: #072218;              /* push sidebar even darker than app-bg */
    --bg-tint-gold: rgba(224, 198, 140, 0.14);
    --bg-tint-green: rgba(143, 220, 165, 0.10);
    --bg-tint-pink: rgba(248, 187, 208, 0.14);

    --text-primary: #F1ECDF;         /* 12.8:1 on bg-surface */
    --text-secondary: #C6D0BE;       /* 7.4:1 on bg-surface */
    --text-heading: #E8CF92;         /* gold-soft warmer tint · 9.2:1 on bg-surface */
    --text-heading-deep: #F3D99B;

    --text-accent-gold: #F0D89C;
    --text-accent-pink: #F8BBD0;
    --text-accent-honey: #FFE082;

    --text-on-dark: #F5F1E8;
    --text-on-dark-soft: #E0C68C;
    --text-on-gold: #1B1B1B;

    --border: rgba(224, 198, 140, 0.22);
    --border-strong: rgba(224, 198, 140, 0.48);

    --chart-text: #EFE8D5;
    --chart-grid: rgba(224, 198, 140, 0.14);
    --chart-axis: rgba(224, 198, 140, 0.35);
    --chart-series-primary: #7ED6A0;
    --chart-series-accent: #E8CF92;
    --chart-series-tertiary: #F8BBD0;
    --chart-pos: #F3A889;
    --chart-neg: #7ED6A0;

    --shadow-soft: 0 1px 3px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.35);
    --shadow-med: 0 4px 16px rgba(0,0,0,0.45);

    /* keep these raw-palette aliases flipped for legacy selectors using them as surface/text */
    --cream: #0A2A1B;
    --cream-soft: #103826;
    --white: #143E2B;
    --charcoal: #F1ECDF;
    --fairway: #C6D0BE;
    --green: #E8CF92;                /* legacy uses of var(--green) become readable gold-tint */
    --green-deep: #F3D99B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .ui-sans { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }

  /* Layout */
  .app { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100vh; }
  aside.sidebar {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    padding: 22px 14px;
    border-right: 2px solid var(--gold);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 0 4px; }
  .brand-mark { width: 46px; height: 46px; flex-shrink: 0; }
  .brand-name { font-family: Georgia, serif; font-size: 17px; letter-spacing: 1px; color: var(--text-on-dark-soft); line-height: 1.1; }
  .brand-sub { font-size: 10px; letter-spacing: 2.5px; color: var(--honey-soft); opacity: 0.85; }

  nav.nav { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
  nav.nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    color: var(--text-on-dark);
    text-decoration: none;
    border-radius: 7px;
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.3px;
    transition: background 120ms;
  }
  nav.nav a:hover { background: rgba(201, 168, 87, 0.14); }
  nav.nav a.active { background: var(--gold); color: var(--text-on-gold); font-weight: 600; }
  nav.nav a .ico { width: 20px; text-align: center; font-size: 15px; }

  .sidebar-foot {
    margin-top: auto; padding-top: 14px;
    border-top: 1px solid rgba(201, 168, 87, 0.28);
    font-size: 11px; color: var(--text-on-dark-soft);
    font-family: -apple-system, sans-serif;
    letter-spacing: 0.4px;
  }
  .sidebar-foot .kbd {
    display: inline-block;
    background: rgba(245, 241, 232, 0.15);
    padding: 1px 5px;
    border-radius: 3px;
    margin: 0 2px;
    font-family: monospace; font-size: 10px;
  }

  main#content { padding: 28px 40px 80px; max-width: 1280px; width: 100%; }
  main#content.view-wide { max-width: none; padding: 28px 32px 80px; }

  .page-header {
    border-bottom: var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
    display: flex; align-items: flex-end; gap: 18px; justify-content: space-between;
    flex-wrap: wrap;
  }
  .page-header h1 {
    font-family: Georgia, serif;
    font-size: 34px;
    font-weight: 400;
    color: var(--green);
    letter-spacing: -0.2px;
  }
  .page-header .sub {
    font-family: -apple-system, sans-serif;
    font-size: 12px; color: var(--fairway);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 4px;
  }
  .page-header h1::before {
    content: ''; display: inline-block;
    width: 6px; height: 20px;
    background: var(--gold);
    margin-right: 14px;
    vertical-align: middle;
    border-radius: 1px;
  }
  .crumb {
    font-family: -apple-system, sans-serif;
    font-size: 11px; color: var(--fairway);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .crumb a { color: var(--green-mid); text-decoration: none; }
  .crumb a:hover { color: var(--gold); }

  .card {
    background: var(--white);
    border: var(--line);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-soft);
    position: relative;
  }
  .card.accent { border-top: 3px solid var(--gold); }
  .card.green { border-top: 3px solid var(--green); }
  .card h2 {
    font-family: Georgia, serif; font-size: 20px; font-weight: 400;
    color: var(--green); margin-bottom: 12px; letter-spacing: 0.2px;
  }
  .card h3 {
    font-family: -apple-system, sans-serif; font-size: 11px;
    letter-spacing: 2px; color: var(--fairway);
    text-transform: uppercase; margin-bottom: 10px;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 14px; margin-bottom: 22px;
  }
  .stat {
    background: var(--white); border: var(--line); border-radius: var(--radius);
    padding: 14px 16px; position: relative;
  }
  .stat .label {
    font-family: -apple-system, sans-serif; font-size: 10px;
    color: var(--fairway); letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 6px;
  }
  .stat .value {
    font-family: Georgia, serif; font-size: 28px; color: var(--green);
    font-weight: 400; line-height: 1.1;
  }
  .stat .value.gold { color: var(--gold); }
  .stat .delta { font-family: monospace; font-size: 11px; color: var(--fairway); margin-top: 4px; }

  .btn {
    font-family: -apple-system, sans-serif; font-size: 13px;
    padding: 9px 18px; border: none; border-radius: 6px;
    cursor: pointer; background: var(--green); color: var(--white);
    transition: all 150ms; letter-spacing: 0.3px; font-weight: 500;
  }
  .btn:hover { background: var(--green-mid); transform: translateY(-1px); box-shadow: var(--shadow-med); }
  .btn:active { transform: translateY(0); }
  .btn.gold { background: var(--gold); color: var(--charcoal); }
  .btn.gold:hover { background: var(--gold-soft); }
  .btn.outline { background: transparent; color: var(--green); border: 1px solid var(--green); }
  .btn.outline:hover { background: var(--green); color: var(--white); }
  .btn.ghost { background: transparent; color: var(--fairway); padding: 6px 12px; font-size: 12px; }
  .btn.ghost:hover { background: rgba(0,0,0,0.04); color: var(--charcoal); }
  .btn.small { font-size: 11px; padding: 5px 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  table {
    width: 100%; border-collapse: collapse;
    font-family: -apple-system, sans-serif; font-size: 13px;
  }
  thead th {
    font-family: -apple-system, sans-serif; font-size: 10px;
    color: var(--fairway); letter-spacing: 1.5px; text-transform: uppercase;
    text-align: left; padding: 10px 8px;
    border-bottom: var(--line); font-weight: 500;
  }
  tbody td {
    padding: 9px 8px; border-bottom: 1px solid rgba(11, 85, 68, 0.08);
    color: var(--charcoal);
  }
  tbody tr:hover td { background: rgba(201, 168, 87, 0.06); }
  td.num, th.num { font-family: monospace; text-align: right; }
  td.gold { color: var(--gold); font-weight: 600; }
  td.green { color: var(--green); font-weight: 600; }
  tr.gold-row td { background: rgba(201, 168, 87, 0.10); font-weight: 600; }

  input[type="text"], input[type="search"], select, textarea {
    font-family: -apple-system, sans-serif; font-size: 13px;
    padding: 8px 11px; border: 1px solid rgba(11, 85, 68, 0.25);
    border-radius: 5px; background: var(--white); color: var(--charcoal);
    outline: none; transition: border 120ms;
  }
  input[type="text"]:focus, input[type="search"]:focus, select:focus { border-color: var(--gold); }

  .chip {
    display: inline-block; padding: 2px 8px;
    border-radius: 10px; font-family: -apple-system, sans-serif;
    font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    background: var(--bg-tint-green); color: var(--text-heading);
  }
  .chip.gold { background: var(--bg-tint-gold); color: var(--text-accent-gold); }
  .chip.azalea { background: var(--bg-tint-pink); color: var(--text-accent-pink); }
  .chip.honey { background: rgba(255, 193, 7, 0.18); color: var(--text-accent-honey); }

  .buzz-bubble {
    position: relative; padding: 14px 16px;
    background: var(--cream-soft); border-left: 4px solid var(--gold);
    border-radius: 6px; font-family: Georgia, serif; font-style: italic;
    font-size: 14px; color: var(--green-deep); margin-top: 12px;
  }

  #toast-container {
    position: fixed; top: 22px; right: 22px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 5000; pointer-events: none;
  }
  .toast {
    background: var(--bg-dark); color: var(--text-on-dark);
    padding: 10px 16px; border-radius: 6px;
    font-family: -apple-system, sans-serif; font-size: 13px;
    border-left: 3px solid var(--gold);
    box-shadow: var(--shadow-med);
    animation: slide-in 220ms ease-out; max-width: 340px;
  }
  @keyframes slide-in { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  #modal-root {
    position: fixed; inset: 0; z-index: 4000;
    display: none; background: rgba(11, 85, 68, 0.75);
    backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 28px;
  }
  #modal-root.show { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius);
    max-width: 720px; width: 100%; max-height: 88vh; overflow-y: auto;
    padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-box.large { max-width: 1000px; }

  .hr-gold { height: 1px; background: var(--gold); opacity: 0.3; margin: 20px 0; }

  .view { display: none; animation: fade-in 200ms ease-out; }
  .view.active { display: block; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }

  .game-wrap { max-width: 900px; margin: 0 auto; }
  .game-table {
    background: linear-gradient(to bottom, #0F5B3E 0%, #0A3F2A 100%);
    border-radius: 180px / 80px; padding: 30px;
    border: 4px solid #6D4F21;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    color: var(--cream); font-family: Georgia, serif;
  }
  .seat { text-align: center; margin: 14px 0; }
  .seat-name {
    display: inline-block; padding: 4px 18px;
    background: rgba(245,241,232,0.08);
    border: 1px solid var(--gold-soft); border-radius: 22px;
    font-size: 14px; color: var(--gold-soft); letter-spacing: 0.5px;
  }
  .seat-name.active { background: var(--gold); color: var(--charcoal); font-weight: 600; box-shadow: 0 0 18px rgba(201,168,87,0.55); }
  .cards-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; min-height: 92px; }
  .card-face {
    width: 64px; height: 92px;
    background: var(--white); color: var(--charcoal);
    border-radius: 7px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-weight: bold; font-family: Georgia, serif;
    box-shadow: 0 4px 8px rgba(0,0,0,0.35);
  }
  .card-face.red { color: #B33030; }
  .card-face .rank { font-size: 18px; line-height: 1; }
  .card-face .suit { font-size: 26px; align-self: flex-end; line-height: 1; }
  .card-face.placeholder {
    background: rgba(245,241,232,0.06);
    border: 2px dashed rgba(245,241,232,0.2);
    box-shadow: none;
  }
  .hidden-cards {
    display: inline-block; padding: 12px 30px;
    background: rgba(0,0,0,0.45); border-radius: 8px;
    border: 1px dashed var(--gold-soft);
    color: var(--gold-soft); font-family: -apple-system, sans-serif;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .pot-info {
    display: inline-flex; gap: 20px;
    padding: 8px 16px; background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold-soft); border-radius: 20px;
    margin: 12px 0; font-size: 12px; color: var(--gold-soft);
    font-family: -apple-system, sans-serif; letter-spacing: 0.5px;
  }
  .pot-info b { color: var(--cream); font-size: 14px; font-family: monospace; }
  .actions-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; min-height: 44px; }
  .btn.fold { background: #9B2B2B; color: var(--cream); }
  .btn.fold:hover { background: #B53939; }
  .result-banner {
    padding: 14px 18px; background: rgba(0,0,0,0.45);
    border: 1px solid var(--gold-soft); border-radius: 8px;
    color: var(--gold-soft); font-family: -apple-system, sans-serif;
    font-size: 13px; max-width: 600px; margin: 10px auto; text-align: center;
  }

  .chart-box { background: var(--white); border: var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-soft); margin-bottom: 16px; }

  #cmd-palette {
    position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
    width: 560px; max-width: 90vw;
    background: var(--white); border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    z-index: 5500; display: none; padding: 14px;
  }
  #cmd-palette.show { display: block; }
  #cmd-palette input {
    width: 100%; padding: 12px 14px;
    font-size: 15px; border: none; outline: none;
    border-bottom: var(--line);
  }
  .cmd-results { max-height: 340px; overflow-y: auto; padding-top: 6px; }
  .cmd-result {
    padding: 9px 12px; cursor: pointer; border-radius: 5px;
    font-family: -apple-system, sans-serif; font-size: 13px;
  }
  .cmd-result:hover, .cmd-result.active { background: var(--cream); }
  .cmd-result .cmd-cat {
    font-size: 10px; color: var(--fairway);
    text-transform: uppercase; letter-spacing: 1px; margin-right: 8px;
  }

  .buzz-chat { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .buzz-chat .buzz-avatar { width: 54px; height: 54px; flex-shrink: 0; }
  .faq-item { border-bottom: 1px solid rgba(11, 85, 68, 0.10); padding: 12px 0; cursor: pointer; }
  .faq-item:last-child { border-bottom: none; }
  .faq-q {
    font-family: Georgia, serif; font-size: 14px; color: var(--green);
    font-weight: 500; display: flex; justify-content: space-between; align-items: center;
  }
  .faq-a {
    font-family: -apple-system, sans-serif; font-size: 13px;
    color: var(--charcoal); margin-top: 8px; padding-left: 12px;
    border-left: 2px solid var(--gold); display: none;
  }
  .faq-item.open .faq-a { display: block; }
  .faq-item.open .faq-q .caret { transform: rotate(90deg); }
  .faq-q .caret { transition: transform 180ms; color: var(--gold); font-size: 12px; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tag-cloud button {
    padding: 3px 9px; font-size: 11px;
    background: var(--bg-tint-gold); color: var(--text-accent-gold);
    border: 1px solid transparent; border-radius: 12px; cursor: pointer;
    font-family: -apple-system, sans-serif; letter-spacing: 0.3px;
  }
  .tag-cloud button.active { background: var(--gold); color: var(--text-on-gold); }
  .tag-cloud button:hover { border-color: var(--gold); }

  .event-card {
    background: var(--white); border: var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    display: grid; grid-template-columns: 60px 1fr auto;
    gap: 14px; align-items: center;
  }
  .event-card .ev-badge {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--green); color: var(--cream);
    font-family: Georgia, serif; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .event-card .ev-badge.major { background: var(--gold); color: var(--charcoal); }
  .event-card .ev-badge.main { background: var(--azalea-mid); color: var(--charcoal); }

  .progress-wrap { width: 100%; height: 8px; background: rgba(11, 85, 68, 0.10); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .progress-bar { height: 100%; background: linear-gradient(to right, var(--green), var(--gold)); width: 0%; transition: width 200ms; }

  details { cursor: pointer; }
  summary { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--green); padding: 6px 0; user-select: none; }
  details[open] summary { color: var(--gold); }

  .share-input {
    width: 100%; font-family: monospace; font-size: 10px;
    padding: 8px; background: var(--cream-soft);
    border: 1px solid var(--gold-soft); border-radius: 4px;
    word-break: break-all; resize: vertical;
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    aside.sidebar { position: relative; height: auto; border-right: none; border-bottom: 2px solid var(--gold); }
    nav.nav { flex-direction: row; flex-wrap: wrap; }

  /* --- Phase 2 UI patterns --- */

  /* Filter toolbar */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; padding: 12px 14px; background: var(--cream-soft); border-radius: var(--radius); border: var(--line); }
  .filter-bar label { font-family: -apple-system, sans-serif; font-size: 10px; color: var(--fairway); letter-spacing: 1.5px; text-transform: uppercase; margin-right: 6px; }
  .filter-bar select, .filter-bar input[type="search"], .filter-bar input[type="number"] { padding: 5px 9px; font-size: 12px; }
  .filter-bar .result-count { margin-left: auto; font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); letter-spacing: 1px; text-transform: uppercase; }

  /* Sortable table */
  th.sortable { cursor: pointer; user-select: none; }

  /* Player directory grid */
  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }

  .player-card .p-skill { font-family: monospace; font-size: 10px; color: var(--fairway); letter-spacing: 0.5px; margin-bottom: 6px; }
  .player-card .p-record { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--charcoal); }
  .player-card .p-record .pr-gold { color: var(--gold); font-weight: 600; }
  .player-card.top-tier { border-top: 3px solid var(--gold); }
  .virt-scroller { max-height: 680px; overflow-y: auto; padding: 4px; background: var(--cream-soft); border-radius: var(--radius); border: var(--line); }

  /* Skill tier chips */
  .tier-elite { background: var(--gold); color: var(--text-on-gold); }
  .tier-contender { background: var(--bg-tint-green); color: var(--text-heading); }
  .tier-regular { background: rgba(255,193,7,0.22); color: var(--text-accent-honey); }
  .tier-fringe { background: rgba(11,85,68,0.10); color: var(--text-secondary); }

  /* Badges */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 14px;
    background: var(--bg-elevated); border: 1px solid var(--gold-soft);
    font-family: -apple-system, sans-serif; font-size: 10px;
    color: var(--text-heading); letter-spacing: 0.3px;
  }
  .badge.gold { background: var(--bg-tint-gold); border-color: var(--gold); color: var(--text-accent-gold); font-weight: 600; }
  .badge.azalea { background: var(--bg-tint-pink); border-color: var(--azalea-mid); color: var(--text-accent-pink); }
  .badge.green { background: var(--bg-tint-green); border-color: var(--green-mid); color: var(--text-heading); }
  .badge .b-icon { font-size: 11px; }

  /* Scorecard (finals hole-by-hole) */
  .scorecard { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 12px; margin-top: 12px; }
  .scorecard th, .scorecard td { padding: 5px 4px; text-align: center; border: 1px solid rgba(11,85,68,0.1); }
  .scorecard th { background: var(--green-deep); color: var(--cream); font-family: -apple-system, sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .scorecard td.label { background: var(--cream-soft); text-align: left; font-family: -apple-system, sans-serif; font-weight: 500; letter-spacing: 0.3px; }
  .scorecard td.total { background: var(--gold-soft); font-weight: bold; }
  .scorecard td.reveal { opacity: 0; animation: card-reveal 400ms ease-out forwards; }
  @keyframes card-reveal { to { opacity: 1; } }
  .scorecard td.neg { color: var(--chart-neg); font-weight: 600; }
  .scorecard td.pos { color: var(--chart-pos); }

  /* Radar chart container */
  .radar-box { display: flex; align-items: center; justify-content: center; padding: 12px; }

  /* Canvas charts */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
  .chart-box canvas { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .chart-box .chart-title { font-family: Georgia, serif; font-size: 16px; color: var(--green); margin-bottom: 4px; }
  .chart-box .chart-sub { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); text-transform: uppercase; letter-spacing: 1.3px; margin-bottom: 10px; }
  .chart-box .chart-note { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); margin-top: 8px; font-style: italic; }

  /* Moment card */
  .moment-card {
    background: linear-gradient(135deg, var(--cream-soft) 0%, var(--white) 100%);
    border: var(--line); border-left: 4px solid var(--gold);

  .moment-card .m-year { font-family: Georgia, serif; font-size: 24px; color: var(--green); text-align: center; }
  .moment-card .m-narr { font-family: Georgia, serif; font-size: 14px; font-style: italic; color: var(--green-deep); }

  /* Record row */

  /* --- Sim Lab --- */

  .simulator-layout { --sim-panel-w: 320px; grid-template-columns: minmax(320px, var(--sim-panel-w)) 12px minmax(0, 1fr); gap: 0 10px; }
  .simulator-splitter { width: 12px; min-height: 100%; cursor: col-resize; position: relative; }
  .simulator-splitter::before { content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--border); border-radius: 2px; }
  .simulator-splitter:hover::before, .simulator-splitter.dragging::before { background: var(--gold); }
  @media (max-width: 1100px) { .lab-layout, .simulator-layout { grid-template-columns: 1fr; } .simulator-splitter { display: none; } }

function el(tag, attrs, ...children) {

// Baseline equity of hero's category — the AI's perceived win probability used to

// ~0.18). It is the *adverse-selection-aware* equity: HC vs an opponent who has
// NOT folded by the current decision point. A villain who calls a bet on flop or
// turn already has at least a pair-or-better range, so hero's HC is essentially
// drawing dead. The 0.05 reflects that conditional reality, and is what produces
// the calibrated 41% preflop fold rate, 5% post-flop fold rate, and Masters-
// authentic champion-finals mean of −10.5 strokes.
//
// A bump to 0.18 was tried in mid-session under "match raw equity" reasoning and
// was reverted because it dropped preflop fold rate to 32%, halved Spearman ρ
// (0.72 → 0.31), and collapsed Elite ROI from +30% to ~0%. Looser play =
// more variance per hand = weaker skill signal across the population. Don't
// re-bump without re-running the regression test.

// Pair = 0.38 (vs called-down ranges), TwoPair = 0.72, etc. All reflect

const WIN_PROB = [0.05, 0.38, 0.72, 0.87, 0.92, 0.96, 0.985, 0.999, 1.0, 1.0];

// -------------------------------------------------------------------------
// PERFORMANCE INSTRUMENTATION (SimPerf)
// Tiny, zero-alloc perf profiler. Enabled when SimPerf.enabled = true.
// Buckets: dealHole, bettingRound, evaluate7, showdown, fieldSelect, metrics.
// runLabSession clears+reads this each run; the dashboard renders a perf card.
// -------------------------------------------------------------------------
const SimPerf = {
  enabled: false,
  buckets: Object.create(null),
  eventTimes: null,          // ms per event, in event order (for first10/last10 comparison)
  eventTimeCursor: 0,
  t0: 0,                     // wall-clock start for the run
  reset(expectedEvents) {
    this.buckets = Object.create(null);
    const n = Math.max(4, expectedEvents | 0);
    this.eventTimes = new Float32Array(n);
    this.eventTimeCursor = 0;
    this.t0 = performance.now();
  },
  mark() { return this.enabled ? performance.now() : 0; },
  add(bucket, from) {
    if (!this.enabled || !from) return;
    const dt = performance.now() - from;
    this.buckets[bucket] = (this.buckets[bucket] || 0) + dt;
  },
  logEvent(dtMs) {
    if (!this.enabled || !this.eventTimes) return;
    if (this.eventTimeCursor < this.eventTimes.length) {
      this.eventTimes[this.eventTimeCursor++] = dtMs;
    }
  },
  summary() {
    const totalMs = performance.now() - this.t0;
    const n = this.eventTimeCursor;
    let firstAvg = 0, lastAvg = 0;
    if (n > 0) {
      const head = Math.max(1, Math.min(n, Math.floor(n * 0.1)));
      const tailFrom = Math.max(0, n - head);
      let hs = 0, ls = 0;
      for (let i = 0; i < head; i++) hs += this.eventTimes[i];
      for (let i = tailFrom; i < n; i++) ls += this.eventTimes[i];
      firstAvg = hs / head;
      lastAvg = ls / (n - tailFrom);
    }
    const overall = n > 0 ? totalMs / n : 0;
    return {
      totalMs,
      eventCount: n,
      msPerEvent: overall,
      firstChunkMsPerEvent: firstAvg,
      lastChunkMsPerEvent: lastAvg,
      slowdownPct: firstAvg > 0 ? ((lastAvg - firstAvg) / firstAvg) * 100 : 0,
      eventsPerSec: overall > 0 ? 1000 / overall : 0,
      buckets: Object.assign({}, this.buckets),
    };
  },
};

// -------------------------------------------------------------------------
// REUSABLE DECK (zero-alloc per hole)
// Prior code allocated 52 card objects in makeDeck() for every hole. Over a
// 100y × 2000-player run that's ≈ 21 million short-lived allocations — the
// dominant cause of the "slows down as it goes" GC pressure. We now allocate
// the deck once and shuffle it in place. `makeDeck()` is retained for the
// cold interactive-game path which creates an independent deck per match.
// -------------------------------------------------------------------------
const DECK = (function() {
  const d = new Array(52);
  let idx = 0;
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d[idx++] = { rank: r, suit: s };
  return d;
})();
function shuffleDeck() {
  for (let i = 51; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = DECK[i]; DECK[i] = DECK[j]; DECK[j] = t;
  }
}
// Retained for cold paths (interactive game creates its own deck so the sim lab
// can run concurrently without stomping DECK).
function makeDeck() { const d=new Array(52); let i=0; for (const s of SUITS) for (let r=2; r<=14; r++) d[i++] = {rank:r, suit:s}; return d; }
function shuffle(a) { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// -------------------------------------------------------------------------
// EVALUATE7 — zero-alloc 7-card hand evaluator.
//
// Returns a PACKED INT `handValue`:
//   (cat << 24) | (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4)
// cat = 0..9 (High Card .. Royal Flush). k1..k5 are primary/kicker ranks (2..14).
// Consumers read `cat = hv >>> 24` and `kN = (hv >>> (24 - N*4)) & 0xF`.
// Comparison is plain integer subtraction: `a - b`.
//
// API: evaluate7(hole, community) OR evaluate7(combinedArray) — second form
// retained for interactive cold path.
//
// Scratch buffers are module-level; values are reset at function entry.
// -------------------------------------------------------------------------
const EVAL_RC = new Int8Array(15);             // rank counts [2..14]
const EVAL_SC = new Int8Array(4);              // suit counts S/H/D/C
const EVAL_SR0 = new Int8Array(7);             // ranks in suit 0
const EVAL_SR1 = new Int8Array(7);
const EVAL_SR2 = new Int8Array(7);
const EVAL_SR3 = new Int8Array(7);
const EVAL_SL = new Int8Array(4);              // lengths per suit scratch
const SUIT_IDX = { S: 0, H: 1, D: 2, C: 3 };

function evaluate7(a, b) {
  const t0 = SimPerf.enabled ? performance.now() : 0;
  const rc = EVAL_RC;
  for (let i = 2; i < 15; i++) rc[i] = 0;
  rc[0] = 0; rc[1] = 0;
  EVAL_SC[0] = 0; EVAL_SC[1] = 0; EVAL_SC[2] = 0; EVAL_SC[3] = 0;
  EVAL_SL[0] = 0; EVAL_SL[1] = 0; EVAL_SL[2] = 0; EVAL_SL[3] = 0;
  // Ingest cards from a and (optionally) b.
  const aLen = a.length;
  for (let i = 0; i < aLen; i++) {
    const c = a[i];
    const r = c.rank;
    rc[r]++;
    const s = SUIT_IDX[c.suit];
    EVAL_SC[s]++;
    const sl = EVAL_SL[s]++;
    if (s === 0) EVAL_SR0[sl] = r;
    else if (s === 1) EVAL_SR1[sl] = r;
    else if (s === 2) EVAL_SR2[sl] = r;
    else EVAL_SR3[sl] = r;
  }
  if (b) {
    const bLen = b.length;
    for (let i = 0; i < bLen; i++) {
      const c = b[i];
      const r = c.rank;
      rc[r]++;
      const s = SUIT_IDX[c.suit];
      EVAL_SC[s]++;
      const sl = EVAL_SL[s]++;
      if (s === 0) EVAL_SR0[sl] = r;
      else if (s === 1) EVAL_SR1[sl] = r;
      else if (s === 2) EVAL_SR2[sl] = r;
      else EVAL_SR3[sl] = r;
    }
  }
  // Rank-presence bitmask for straight detection.
  let rankMask = 0;
  for (let r = 2; r <= 14; r++) if (rc[r]) rankMask |= (1 << r);
  if (rc[14]) rankMask |= 2; // ace can complete the wheel (2-3-4-5-A); bit 1 represents ace-low
  // Highest straight hi = highest set bit in (mask & mask>>1 & mask>>2 & mask>>3 & mask>>4).
  // Derivation: bit H of mask<<k = 1 iff rank (H-k) is present. AND across k=0..4 yields
  // bit H set iff ranks H, H-1, ..., H-4 are all present (straight ending at H).
  function straightHi(mask) {
    const m = mask & (mask << 1) & (mask << 2) & (mask << 3) & (mask << 4);
    if (!m) return 0;
    // Highest set bit. Math.clz32 is ~1-3ns on V8.
    return 31 - Math.clz32(m);
  }
  // Flush suit (if any).
  let flushSuit = -1;
  if (EVAL_SC[0] >= 5) flushSuit = 0;
  else if (EVAL_SC[1] >= 5) flushSuit = 1;
  else if (EVAL_SC[2] >= 5) flushSuit = 2;
  else if (EVAL_SC[3] >= 5) flushSuit = 3;

  // Straight flush / royal flush — check the suited rank subset only.
  if (flushSuit >= 0) {
    let fMask = 0;
    const fArr = flushSuit === 0 ? EVAL_SR0 : flushSuit === 1 ? EVAL_SR1 : flushSuit === 2 ? EVAL_SR2 : EVAL_SR3;
    const fLen = EVAL_SL[flushSuit];
    for (let i = 0; i < fLen; i++) {
      const r = fArr[i];
      fMask |= (1 << r);
      if (r === 14) fMask |= 2;
    }
    const sfh = straightHi(fMask);
    if (sfh === 14) { SimPerf.add('evaluate7', t0); return (9 << 24) | (14 << 20); } // royal flush
    if (sfh >= 5) { SimPerf.add('evaluate7', t0); return (8 << 24) | (sfh << 20); }  // straight flush
  }

  // Scan for four/three/pairs counts in a single top-down pass.
  let quadRank = 0, tripsRank = 0, pairHi = 0, pairLo = 0;
  for (let r = 14; r >= 2; r--) {
    const c = rc[r];
    if (c === 4 && !quadRank) quadRank = r;
    else if (c === 3) {
      if (!tripsRank) tripsRank = r;
      else if (!pairHi) pairHi = r; // 2nd trips serves as pair for full house
    }
    else if (c === 2) {
      if (!pairHi) pairHi = r;
      else if (!pairLo) pairLo = r;
    }
  }

  // Four of a kind
  if (quadRank) {
    let kick = 0;
    for (let r = 14; r >= 2; r--) if (r !== quadRank && rc[r]) { kick = r; break; }
    SimPerf.add('evaluate7', t0);
    return (7 << 24) | (quadRank << 20) | (kick << 16);
  }
  // Full house
  if (tripsRank && pairHi) {
    SimPerf.add('evaluate7', t0);
    return (6 << 24) | (tripsRank << 20) | (pairHi << 16);
  }
  // Flush (non-straight)
  if (flushSuit >= 0) {
    const fArr = flushSuit === 0 ? EVAL_SR0 : flushSuit === 1 ? EVAL_SR1 : flushSuit === 2 ? EVAL_SR2 : EVAL_SR3;
    const fLen = EVAL_SL[flushSuit];
    let k1=0,k2=0,k3=0,k4=0,k5=0;
    for (let i = 0; i < fLen; i++) {
      const r = fArr[i];
      if (r > k1) { k5=k4; k4=k3; k3=k2; k2=k1; k1=r; }
      else if (r > k2) { k5=k4; k4=k3; k3=k2; k2=r; }
      else if (r > k3) { k5=k4; k4=k3; k3=r; }
      else if (r > k4) { k5=k4; k4=r; }
      else if (r > k5) k5=r;
    }
    SimPerf.add('evaluate7', t0);
    return (5 << 24) | (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4);
  }
  // Straight (non-flush)
  const sh = straightHi(rankMask);
  if (sh >= 5) { SimPerf.add('evaluate7', t0); return (4 << 24) | (sh << 20); }
  // Three of a kind
  if (tripsRank) {
    let k1=0, k2=0;
    for (let r = 14; r >= 2; r--) {
      if (r === tripsRank) continue;
      if (rc[r]) { if (!k1) k1 = r; else { k2 = r; break; } }
    }
    SimPerf.add('evaluate7', t0);
    return (3 << 24) | (tripsRank << 20) | (k1 << 16) | (k2 << 12);
  }
  // Two pair
  if (pairHi && pairLo) {
    let kick = 0;
    for (let r = 14; r >= 2; r--) if (r !== pairHi && r !== pairLo && rc[r]) { kick = r; break; }
    SimPerf.add('evaluate7', t0);
    return (2 << 24) | (pairHi << 20) | (pairLo << 16) | (kick << 12);
  }
  // One pair
  if (pairHi) {
    let k1=0, k2=0, k3=0;
    for (let r = 14; r >= 2; r--) {
      if (r === pairHi) continue;
      if (rc[r]) {
        if (!k1) k1 = r;
        else if (!k2) k2 = r;
        else { k3 = r; break; }
      }
    }
    SimPerf.add('evaluate7', t0);
    return (1 << 24) | (pairHi << 20) | (k1 << 16) | (k2 << 12) | (k3 << 8);
  }
  // High card
  let k1=0,k2=0,k3=0,k4=0,k5=0;
  for (let r = 14; r >= 2; r--) {
    if (rc[r]) {
      if (!k1) k1=r;
      else if (!k2) k2=r;
      else if (!k3) k3=r;
      else if (!k4) k4=r;
      else { k5=r; break; }
    }
  }
  SimPerf.add('evaluate7', t0);
  return (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4);
}
// Consumers of evaluate7: the returned packed int can be compared directly via
// subtraction (higher category / higher kickers produce a larger int).
function compareHand(a, b) { return a - b; }
function handCat(hv) { return hv >>> 24; }
function handK1(hv) { return (hv >>> 20) & 0xF; }
// Legacy helpers `loserHandCredit` and `computeShowdownScore` were removed when the
// codebase consolidated on Stroke-Honey as the sole scoring law. Showdown resolution
// now lives in playHole's stroke-honey path (see below).

// =====================================================================================
// STROKE-HONEY scoring: hand-category → bounded golf-style hole score.
// =====================================================================================
//
// Maps a packed handValue (from evaluate7) to a per-hole golf score in the range
// [-5, +2]. Designed to keep individual holes bounded to realistic golf outcomes
// (eagle through double-bogey-ish) while letting category strength still drive
// who wins the hole. Premium variants of mid-strength categories (e.g. JJ+ pairs,
// AA-high two pair, queen-high straights) get a one-step better score so kickers
// matter at decision boundaries — tested vs naive "category alone" mapping below.
//
// Range justification (per-hole):
//   -5  : Royal / Straight Flush — essentially the nut "hole-in-one"-equivalent
//   -4  : Quads — eagle territory
//   -3  : Premium Full House (paired ten or higher) — strong eagle
//   -2  : Standard FH / strong Flush / Straight (high) — eagle-ish
//   -1  : ordinary Flush / Straight / Trips / strong TwoPair — birdie
//    0  : ordinary TwoPair / strong Pair (JJ+) — par
//   +1  : weak Pair / strong High Card (Q+) — bogey
//   +2  : weak High Card — double bogey
//
// Calibrated against expected hand-category frequencies for 7-card hold'em:
// approximately 17% HC, 44% Pair, 23% TwoPair, 5% Trips, 4.5% Straight, 3% Flush,
// 2.5% FullHouse, ~0.2% Quads+. The premium kicker buckets shift the mode of the
// scorecard distribution to "near par" rather than uniformly below par, while still
// rewarding genuine strength with eagle/albatross territory.
function golfScoreFromHandValue(hv) {
  const cat = hv >>> 24;            // hand category 0..9
  const k1 = (hv >>> 20) & 0xF;     // primary kicker rank (2..14), used for fine buckets

  // 2026-04 loosening: bumped birdie thresholds down by 1 rank for Flush, Straight,
  // Two Pair, Pair, and High Card so the population's modal hole drifts toward birdie
  // territory and below-par rate climbs into the 60%+ band (was 49% under prior thresholds).
  if (cat >= 8) return -5;                    // Royal/Straight Flush
  if (cat === 7) return -4;                   // Quads
  if (cat === 6) return (k1 >= 11 ? -3 : -2); // Full House: J+ trips → premium boat
  if (cat === 5) return (k1 >= 10 ? -2 : -1); // Flush: T-high or better → strong flush (loosened)
  if (cat === 4) return (k1 >= 9  ? -2 : -1); // Straight: 9-high or better → strong (loosened)
  if (cat === 3) return -1;                   // Three of a Kind — flat birdie
  if (cat === 2) return (k1 >= 11 ? -1 : 0);  // Two Pair: top pair J+ → birdie, else par (loosened)
  if (cat === 1) return (k1 >= 10 ? 0 : 1);   // Pair: TT+ holds par; under-tens bogey (loosened)
  // High Card
  return (k1 >= 11 ? 1 : 2);                  // J-high or better → +1 bogey; rest → +2 double (loosened)
}

function preflopKey(holeCards) {
  // Retained for any UI code that needs the human-readable label (e.g. "AKs").
  // The hot-loop strength path uses preflopIdx() + PREFLOP_EQUITY_TABLE below.
  const a = holeCards[0], b = holeCards[1];

  const lo = a.rank >= b.rank ? b : a;
  const RC = {14:'A',13:'K',12:'Q',11:'J',10:'T',9:'9',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2'};
  const hc = RC[hi.rank], lc = RC[lo.rank];

// Index: (hi_rank - 2) * 26 + (lo_rank - 2) * 2 + (suited ? 1 : 0). Size 338 = 13 × 26.
// Pairs write the same equity to both suited/offsuit slots (suit is moot for pairs).

function preflopIdx(holeCards) {
  const a = holeCards[0], b = holeCards[1];

    let s = WIN_PROB[cat];
    const k1 = (hv >>> 20) & 0xF;
    if (k1) s += (k1 - 8) * 0.003;
    if (s < 0.01) s = 0.01; if (s > 1.0) s = 1.0;

// ---------------------------------------------------------------------------
// BOARD-TEXTURE-AWARE STRENGTH ASSESSMENT
//
// The prior AI used category-only strength (WIN_PROB[cat] with a tiny kicker
// nudge). That compresses skill differences because real poker skill at the
// postflop is dominated by (a) reading board threats, (b) valuing made draws,
// (c) respecting opponent's bet sizing as a range signal. This block implements
// all three with O(community.length) work and no Monte Carlo.
//
// Performance budget: hot loop. boardTexture + heroDrawEquity + threatForHero
// are all ≤ 20 comparison/arithmetic ops per call; evaluate7 (≈ 50μs) is cached
// by playBettingRound so it runs once per player per street, not per decision.
// ---------------------------------------------------------------------------

// Analyze community cards into a compact flags object describing danger levels.
//   flushCount  = max same-suit cards on the board (0..5)
//   pairedCount = max same-rank count on the board (1..4)
//   straightRisk = max # of unique board ranks fitting inside any 5-rank window
//                 (3 = gutshot possible, 4 = open-ended, 5 = straight ON the board)
//   topBoardRank = highest rank on the board (for overcard comparisons)
function boardTexture(community) {
  const n = community ? community.length : 0;
  if (n < 3) return { flushCount: 0, pairedCount: 1, straightRisk: 1, topBoardRank: 0 };
  let sS = 0, sH = 0, sD = 0, sC = 0;
  const rankSet = {};
  let topRank = 0;
  let pairedCount = 1;
  for (let i = 0; i < n; i++) {
    const c = community[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
    const r = c.rank;
    if (r > topRank) topRank = r;
    rankSet[r] = (rankSet[r] || 0) + 1;
    if (rankSet[r] > pairedCount) pairedCount = rankSet[r];
  }
  const flushCount = Math.max(sS, sH, sD, sC);
  // Straight-risk: scan windows [lo, lo+4] for how many unique ranks fit.
  // Ace can play as 1 (for wheel) so we include rank 1 if there's a 14 on the board.
  const ranks = Object.keys(rankSet).map(r => +r);
  if (rankSet[14]) ranks.push(1);
  ranks.sort((a, b) => a - b);
  let straightRisk = 1;
  for (let i = 0; i < ranks.length; i++) {
    for (let j = i; j < ranks.length; j++) {
      if (ranks[j] - ranks[i] <= 4) {
        const span = j - i + 1;
        if (span > straightRisk) straightRisk = span;
      } else break;
    }
  }
  return { flushCount, pairedCount, straightRisk, topBoardRank: topRank };
}

// Hero's draw equity: fraction of EV gain expected from unfilled flush/straight draws.
// Returns 0 if no draw. Combines flush draw (up to ~0.35 by river from flop),
// open-ended straight draw (~0.31), and gutshot (~0.17). River = 0 (no more cards).
function heroDrawEquity(holeCards, community) {
  const n = community ? community.length : 0;
  if (n < 3 || n >= 5) return 0; // only flop/turn can have unrealized draws
  let sS = 0, sH = 0, sD = 0, sC = 0;
  for (let i = 0; i < 2; i++) {
    const c = holeCards[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
  }
  for (let i = 0; i < n; i++) {
    const c = community[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
  }
  let draw = 0;
  const maxSuit = Math.max(sS, sH, sD, sC);
  if (maxSuit === 4) {

    // Raw flop→river is ~35% and turn→river ~19%, but a flush draw doesn't
    // always WIN when it hits: opponent may have a higher-suit flush, the
    // board may pair giving opp a boat, or the river may complete a straight
    // for opp. The conservative 0.20/0.12 reflects expected-value-of-completion
    // weighted by P(my flush actually wins | I hit it).
    //
    // A bump to 0.30/0.17 was tried mid-session ("match raw equity") and
    // reverted because it dropped Spearman ρ 0.72→0.31 and broke tier ROI.
    // See WIN_PROB comment for the same adverse-selection principle.
    draw += n === 3 ? 0.20 : 0.12;

  // Straight draw detection: look at unique ranks in hero+board.
  const rankSet = {};
  for (let i = 0; i < 2; i++) rankSet[holeCards[i].rank] = 1;
  for (let i = 0; i < n; i++) rankSet[community[i].rank] = 1;
  if (rankSet[14]) rankSet[1] = 1;
  const uniq = Object.keys(rankSet).map(r => +r).sort((a, b) => a - b);
  let maxConsec = 1, cur = 1;
  for (let i = 1; i < uniq.length; i++) {

    else cur = 1;

    // discount as flush. Some hits give opp a higher straight or complete a
    // wheel for them. 0.17/0.09 is the calibrated conservative estimate.
    draw += n === 3 ? 0.17 : 0.09;

    // often beaten when they hit (opp had higher pair/draws to better straight).
    draw += n === 3 ? 0.08 : 0.04;

// Threat = probability weight that opponent holds a hand that beats hero's current
// made-hand category, given board texture. Capped at 0.55.
// Numbers are distilled from realistic preflop ranges + combinatorics on the remaining
// 48 cards after hero sees their own 2 + board. They are priors, not hard truths —
// but they move the decision-surface far enough to express skill.
function threatForHero(heroHandValue, boardTex, oppCommitFrac) {

  else if (boardTex.flushCount === 4 && cat < 5) threat += 0.32;
  else if (boardTex.flushCount >= 5 && cat < 5) threat += 0.50;
  // Paired-board threat: if hero isn't trips/boat/better and board has a pair.
  if (boardTex.pairedCount === 2 && cat < 3) threat += 0.07;
  else if (boardTex.pairedCount >= 3 && cat < 6) threat += 0.22;
  else if (boardTex.pairedCount >= 4) threat += 0.10; // hero has quads on board, but split pots possible
  // Straight threat.
  if (boardTex.straightRisk >= 5 && cat < 4) threat += 0.35;
  else if (boardTex.straightRisk === 4 && cat < 4) threat += 0.14;
  else if (boardTex.straightRisk === 3 && cat < 4) threat += 0.05;
  // Overcard pressure: hero has one-pair (cat=1) and board shows a card higher than
  // hero's pair rank. Common spot where unsophisticated AI overvalues middle pair.
  if (cat === 1) {

    if (heroPairRank && boardTex.topBoardRank > heroPairRank) {

  // shift the range toward strong hands. Capped to 2x amplification for a full-cap bet.
  const actionMultiplier = 1 + oppCommitFrac * 1.0;
  threat *= actionMultiplier;

  if (threat > 0.55) threat = 0.55;

// Board-aware strength: raw category strength minus threat plus hero's own draw value.
// skillFactor ∈ [0,1] gates how much of the board-aware adjustment applies; noisy
// players (bottom tier) ignore it and call down like the prior AI.
function estimateStrengthAware(holeCards, community, street, streetCap, skillFactor, oppCommitFrac, preHand, preTex) {

    // (big preflop stake from opp ⇒ their range is tight ⇒ hero's relative equity drops).
    const baseEq = estimateStrength(holeCards, community);
    // Discount the blind — opponent's forced 1-stroke blind isn't a range signal.
    const voluntary = Math.max(0, oppCommitFrac - (1 / Math.max(1, streetCap || 1)));
    const rangeAdj = voluntary * skillFactor * 0.10;
    return Math.max(0, Math.min(1, baseEq - rangeAdj));
  }
  const hv = preHand || evaluate7(holeCards, community);
  const cat = hv >>> 24;
  let base = WIN_PROB[cat];
  const k1 = (hv >>> 20) & 0xF;
  if (k1) base += (k1 - 8) * 0.003;
  if (base < 0.01) base = 0.01; if (base > 1.0) base = 1.0;

  const threat = threatForHero(hv, tex, oppCommitFrac);

// Progressive street cap: preflop 25%, flop 50%, turn 75%, river 100% of the global cap.
// Small caps (≤3) use the global cap flat since there's no meaningful headroom to split.
function streetCapFor(street, totalCap) {
  if (!totalCap || totalCap <= 3) return totalCap || 3;
  const frac = { preflop: 0.25, flop: 0.50, turn: 0.75, river: 1.0 };
  return Math.max(1, Math.ceil(totalCap * (frac[street] != null ? frac[street] : 1)));

// decideFor: decision kernel called at every actionable moment in a hand.
//   - `preComputedHand` / `preComputedTex` are optional caches passed from playBettingRound
//     so we don't re-run evaluate7 + boardTexture per decision (big hot-loop win).
//   - `oppMatched` is the opponent's current street investment, used for range-aware
//     threat assessment on postflop streets.
function decideFor(cards, community, currentBet, matched, strokes, profile, oppMatched, preComputedHand, preComputedTex) {
  const street = community.length === 0 ? 'preflop' : community.length === 3 ? 'flop' : community.length === 4 ? 'turn' : 'river';
  const streetCap = streetCapFor(street, CurrentStrokeCap);
  const remaining = Math.max(0, streetCap - strokes - currentBet);
  const toCall = currentBet - matched;

  const pot = strokes + currentBet + matched;

  // Board-texture-aware strength. `estimateStrengthAware` returns hero's category-based
  // raw strength on the shown board, then adjusts for:
  //   (a) threat from draws/pairs/flushes the board makes available to opp,
  //   (b) hero's own draw equity (semi-bluff value),

  // ignore them, preserving the behavioral distinction between disciplined and reckless play.
  const skillFactor = Math.max(0, Math.min(1, 1 - (profile.noise || 0) / 0.30));

  // post-equity estimate (skilled players' lower noise still gives them sharper EV).
  adj = Math.max(0.01, Math.min(1.0, adj + (Math.random() - 0.5) * profile.noise));

  // Couple expectedHoneyEV directly to the CORE decision thresholds (bet / fold / raise)
  // rather than mutating adj downstream. The previous adj-only patches failed because
  // by the time adj was being adjusted, the threshold checks below had already been
  // structurally fixed to profile.* values — the player's authored skill never reached
  // through into actual aggression / folding behaviour. This block lifts honey value
  // into the primary decision engine: high-skill players have their bet/raise
  // thresholds dropped (and fold threshold relaxed toward pure pot-odds) when they
  // have positive equity in a meaningful pot, and the opposite when they're behind.
  // Authored skill (via skillFactor) gates the application — noisy bottom-tier
  // players see no threshold movement.
  const carry = 0; // carryPot not threaded through to decideFor; defaults to 0 (minor under-count when ties have stacked)
  const potValue = strokes + currentBet + matched + (carry || 0);
  // honeyEVMultiplier: 4.2 — final production tuning. Polarizes skilled-player
  // aggression so they push harder when ahead and fold faster when behind, letting
  // the bounded golf scorecard compound a stronger skill signal across rounds.
  // This is the upper end of the safe range; values >4.5 risk over-saturation
  // (AI thrashes between extremes); values <3.0 produce limp aggression and
  // weaker per-match skill expression. Locked at 4.2 for shipping.
  const expectedHoneyEV = potValue * (adj - 0.5) * skillFactor * 4.2;

  // Local copies of the three decision thresholds — modifying these instead of
  // profile.* keeps the player object immutable across decisions in the same hand.
  // Floors prevent runaway saturation (betThreshold → 0.05 means even mid-equity
  // hands bet, but never literally 0; foldThreshold → 0.01 means fold only when
  // way behind pot odds; raiseThreshold → 0.10 keeps raising rare on weak holdings).
  let betThreshold   = Math.max(0.05, profile.betThreshold   - expectedHoneyEV * 0.8);
  let foldThreshold  = Math.max(0.01, profile.foldThreshold  - expectedHoneyEV * 1.2);
  let raiseThreshold = Math.max(0.10, profile.raiseThreshold - expectedHoneyEV * 0.6);

  function potSizedAmount(sizeFactor) {

    return Math.min(raw, remaining);
  }

      const sizeFactor = adj > 0.85 ? 1.0 : adj > 0.70 ? 0.67 : 0.33;
      return { action: 'bet', amount: potSizedAmount(sizeFactor) };
    }
    return { action: 'check' };

    // Fix #2: pot-odds-aware folding. Calibrated from season-sim A/B: `slack` of
    // 0.30 − foldThreshold (clamped ≥0) produced 41% preflop fold rate, 5% post-flop
    // fold rate, and champion-finals mean of −10.5 (Masters territory). Tighter
    // variants pushed preflop fold rate above 60% and scored champions above par.
    const reqEquity = toCall / (pot + toCall);
    const slack = Math.max(0, 0.30 - foldThreshold); // loose players get more overlay
    if (adj < reqEquity - slack) return { action: 'fold' };
    // Fix #5: pot-relative raise sizing when hand is premium.
    // Uses the local raiseThreshold (modified by honeyEV above) — skilled players raise
    // more readily when sitting on a fat pot with positive equity.
    if (adj > raiseThreshold && remaining > 0) {
      const sizeFactor = adj > 0.90 ? 1.5 : adj > 0.80 ? 1.0 : 0.5;
      return { action: 'raise', amount: potSizedAmount(sizeFactor) };
    }
    return { action: 'call' };

}
function makeRandomProfile() {

  // which gives a realistic skill distribution (tall Elite, long Bottom tail) instead
  // of the uniform-random-then-derive approach that produced narrow, bell-shaped skill.
  return makeProfileForSkill(sampleTargetSkill());
}

// Sample a target skill from a truncated Normal(0.5, 0.18) in [0.02, 0.98].
// Shape rationale: ~68% of players in [0.32, 0.68] = mediocre mass, 95% in [0.14, 0.86],
// and tails reach ~0.05 (terrible) and ~0.95 (elite). This mirrors real poker/golf
// populations where most competitors cluster around mediocre with distinct tails.
// cfg.skillSpread (optional, default 0.18) scales the distribution's σ so the user
// can test narrow-elite (σ=0.10) vs wide-open (σ=0.28) populations.
function sampleTargetSkill(cfg) {
  const sigma = (cfg && Number.isFinite(cfg.skillSpread) && cfg.skillSpread > 0) ? cfg.skillSpread : 0.18;
  const u1 = Math.max(1e-9, Math.random()), u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return Math.max(0.02, Math.min(0.98, 0.50 + z * sigma));
}

// Generate a profile that will read as `targetSkill` under estimateSkillRating.
//
// CRITICAL DESIGN FIX (Nov 2026): the TRUE OPTIMA are always 0.63 / 0.25 / 0.82 / 0 noise
// because that is where estimateSkillRating peaks AND where current mechanic math
// (pot-odds-aware folding with cap-gated betting) actually plays best. cfg.betCenter,
// cfg.foldCenter, cfg.raiseCenter, cfg.noiseCenter are population-CENTER sliders that
// only apply in the legacy random-profile path (cfg.legacyRandomProfiles = true).
// In the skill-coupled path they DO NOT move the optimum — moving the optimum would
// mean "Elite players are locked into a user-specified suboptimal strategy", which is
// exactly the inversion bug that produced Elite ROI = -18%, Bottom ROI = +16% in the
// CI×5 run of 2026-04.
//
// cfg.*Spread sliders now control within-tier jitter. At spread = 0.6 (the prior UI

function makeProfileForSkill(targetSkill, cfg) {
  const t = Math.max(0, Math.min(1, targetSkill));
  const jitterScaleN = (cfg && Number.isFinite(cfg.noiseSpread)) ? cfg.noiseSpread * 0.050 : 0.025;
  const jitterScaleB = (cfg && Number.isFinite(cfg.betSpread))   ? cfg.betSpread   * 0.030 : 0.015;
  const jitterScaleF = (cfg && Number.isFinite(cfg.foldSpread))  ? cfg.foldSpread  * 0.030 : 0.015;
  const jitterScaleR = (cfg && Number.isFinite(cfg.raiseSpread)) ? cfg.raiseSpread * 0.025 : 0.012;
  const jitter = (scale) => (Math.random() - 0.5) * scale;
  const dir = () => Math.random() < 0.5 ? -1 : 1;
  // TRUE OPTIMA — always hardcoded, never overridden by cfg in the skill-coupled path.
  const noiseOpt = 0;
  const betOpt = 0.63;
  const foldOpt = 0.25;
  const raiseOpt = 0.82;
  return {
    noise: Math.max(0.005, noiseOpt + (1 - t) * 0.30 + jitter(jitterScaleN)),
    betThreshold: betOpt + dir() * (1 - t) * 0.15 + jitter(jitterScaleB),
    foldThreshold: foldOpt + dir() * (1 - t) * 0.15 + jitter(jitterScaleF),
    raiseThreshold: raiseOpt + dir() * (1 - t) * 0.10 + jitter(jitterScaleR),
    authoredSkill: t, // remember the target so downstream code can reference it
  };
}

function estimateSkillRating(profile) {
  const nT = 1 - profile.noise / 0.30;
  const bT = 1 - Math.abs(profile.betThreshold - 0.63) / 0.15;
  const fT = 1 - Math.abs(profile.foldThreshold - 0.25) / 0.15;
  const rT = 1 - Math.abs(profile.raiseThreshold - 0.82) / 0.10;
  return (nT + bT + fT + rT) / 4;
}

function makeFreshStats() {
  return { holesPlayed: 0, holesWon: 0, holesLost: 0, holesTied: 0, holesFolded: 0, handCounts: {}, totalScore: 0, matchesWon: 0, matchesLost: 0, strokesBetTotal: 0 };
}
function playBettingRound(aCards, bCards, community, dealer, strokes, profileA, profileB, initialBet, firstToAct) {

  // On the preflop street the caller passes a blind (currentBet=1) + matches the non-acting player.
  if (initialBet) {
    const blindPoster = firstToAct === 'a' ? 'b' : 'a';
    matched[blindPoster] = initialBet;
  }
  let toAct = firstToAct || (dealer === 'a' ? 'b' : 'a');
  let folded = null;
  const street = community.length === 0 ? 'preflop' : community.length === 3 ? 'flop' : community.length === 4 ? 'turn' : 'river';
  const streetCap = streetCapFor(street, CurrentStrokeCap);
  // Hot-loop optimization: evaluate hand + texture once per actor per street instead of
  // inside every decideFor call. evaluate7 is the single most expensive function in the
  // simulator (~50μs each); with up to 3 decisions per actor per street, this cuts
  // hand evaluation work by 60–70% over the course of a full tour.
  const tex = community.length >= 3 ? boardTexture(community) : null;
  const aHand = community.length >= 3 ? evaluate7(aCards, community) : 0;
  const bHand = community.length >= 3 ? evaluate7(bCards, community) : 0;
  for (let iter = 0; iter < 8; iter++) {
    const actor = toAct;
    const other = actor === 'a' ? 'b' : 'a';
    const cards = actor === 'a' ? aCards : bCards;
    const profile = actor === 'a' ? profileA : profileB;
    const actorHand = actor === 'a' ? aHand : bHand;
    const d = decideFor(cards, community, currentBet, matched[actor], strokes, profile, matched[other], actorHand, tex);
    if (typeof LabState !== 'undefined' && LabState.instrumentation && LabState.instrumentation.collector) {
      LabState.instrumentation.collector(street, d.action);
    }
    if (d.action === 'fold') { folded = actor; break; }
    if (d.action === 'check') {
      acted[actor] = true;
      if (acted[other] && currentBet === 0) break;
      toAct = other;
    } else if (d.action === 'call') {
      matched[actor] = currentBet; acted[actor] = true; break;
    } else {
      currentBet += d.amount;
      matched[actor] = currentBet;
      acted[actor] = true; acted[other] = false;
      toAct = other;
      if (strokes + currentBet >= streetCap) {
        const otherHand = other === 'a' ? aHand : bHand;
        const resp = decideFor(other === 'a' ? aCards : bCards, community, currentBet, matched[other], strokes, other === 'a' ? profileA : profileB, matched[actor], otherHand, tex);
        if (resp.action === 'fold') { folded = other; break; }

}
function playHole(pA, pB, startDealer) {
  const t0 = SimPerf.enabled ? performance.now() : 0;

  const aCards = [DECK[off++], DECK[off++]];

  let community = [];
  let strokes = 0;
  let folded = null;
  const streets = ['preflop','flop','turn','river'];
  for (let si = 0; si < streets.length; si++) {
    const s = streets[si];
    const initialBet = (s === 'preflop') ? 1 : 0;
    const firstToAct = startDealer === 'a' ? 'b' : 'a';
    const brT = SimPerf.enabled ? performance.now() : 0;
    const br = playBettingRound(aCards, bCards, community, startDealer, strokes, pA.profile, pB.profile, initialBet, firstToAct);
    SimPerf.add('bettingRound', brT);
    strokes = br.strokes;
    if (br.folded) { folded = br.folded; break; }
    if (s === 'preflop') { community.push(DECK[off++], DECK[off++], DECK[off++]); }
    else if (s === 'flop') { community.push(DECK[off++]); }
    else if (s === 'turn') { community.push(DECK[off++]); }
    if (strokes >= CurrentStrokeCap && s !== 'river') { while (community.length < 5) community.push(DECK[off++]); break; }
  }
  if (folded) {
    // Stroke-Honey fold path: street-based concession scorecard. The wagered-strokes
    // pot becomes a honey credit for the non-folder; the folder takes a small positive
    // scorecard penalty scaled to how late the fold came:
    //   Preflop:  bettor  0,  folder +2  (least pressure → smallest reward)
    //   Flop:     bettor −1,  folder +1
    //   Turn:     bettor −1,  folder +1
    //   River:    bettor −2,  folder  0  (folder came close to par before laying it down)
    const streetIdx = (community.length < 3) ? 0 : (community.length === 3) ? 1 : (community.length === 4) ? 2 : 3;
    const folderScoreTable = [2, 1, 1, 0];
    const bettorScoreTable = [0, -1, -1, -2];
    const folderScore = folderScoreTable[streetIdx];
    const bettorScore = bettorScoreTable[streetIdx];
    const aScore = folded === 'a' ? folderScore : bettorScore;
    const bScore = folded === 'b' ? folderScore : bettorScore;
    const aHoneyCredit = folded === 'a' ? 0 : strokes;
    const bHoneyCredit = folded === 'b' ? 0 : strokes;

  while (community.length < 5) community.push(DECK[off++]);

  const aH = evaluate7(aCards, community);
  const bH = evaluate7(bCards, community);
  const cmp = aH - bH;
  // Stroke-Honey showdown path: each player gets their OWN hand's bounded golf score
  // (so a loser with a strong hand still posts a reasonable number). Hole's pot of
  // `strokes` becomes a honey credit for the winner; on a tie the pot carries forward
  // (always — carryOverEnabled is a permanent invariant).
  if (cmp === 0) {
    SimPerf.add('showdown', sdT);
    SimPerf.add('dealHole', t0);
    return {
      folded: null, aScore: 0, bScore: 0,
      aHand: aH, bHand: bH,
      tie: true, strokes,
      aHoneyCredit: 0, bHoneyCredit: 0,
      carryPot: strokes,
    };
  }
  const aScore = golfScoreFromHandValue(aH);
  const bScore = golfScoreFromHandValue(bH);
  const aHoneyCredit = cmp > 0 ? strokes : 0;
  const bHoneyCredit = cmp > 0 ? 0 : strokes;
  SimPerf.add('showdown', sdT);
  SimPerf.add('dealHole', t0);
  return { folded: null, aScore, bScore, aHand: aH, bHand: bH, strokes, aHoneyCredit, bHoneyCredit, carryPot: 0 };
}
function updatePlayerHoleStats(player, r, side) {
  const stats = player.stats;
  stats.holesPlayed++;
  stats.strokesBetTotal += (r.strokes || 0);
  const you = side === 'a' ? r.aScore : r.bScore;
  const opp = side === 'a' ? r.bScore : r.aScore;
  if (you < opp) stats.holesWon++;
  else if (you > opp) stats.holesLost++;
  else stats.holesTied++;
  if (r.folded === side) stats.holesFolded++;
  if (r.aHand && !r.folded) {
    const yh = side === 'a' ? r.aHand : r.bHand;
    const name = CATEGORY_NAMES[yh >>> 24];
    stats.handCounts[name] = (stats.handCounts[name] || 0) + 1;
  }
}
function playMatch(pA, pB, numHoles) {
  // Stroke-Honey per-round accounting:
  //   - bounded golf score per hole (−5..+2)
  //   - wagered-strokes pot per hole forms a honey credit for the winner
  //   - tied holes accumulate the pot into carryPot; next decisive hole's winner sweeps it
  //   - net honey credit = totalHoneyA − totalHoneyB (zero-sum: only imbalance moves the score)
  //
  // Round total: roundA = totalGolfA − netHoneyA − carryLeftover
  //              roundB = totalGolfB − netHoneyB − carryLeftover
  // Winning more pots IMPROVES (reduces) your round score. Leftover end-of-round carry
  // applies equally to both players, shifting the floor but preserving order.
  let totalGolfA = 0, totalGolfB = 0;
  let totalHoneyA = 0, totalHoneyB = 0;
  let carryPot = 0;
  let dealer = Math.random() < 0.5 ? 'a' : 'b';
  const applyHole = (r) => {
    totalGolfA += r.aScore; totalGolfB += r.bScore;
    if (r.tie) {
      carryPot += (r.strokes || 0);
    } else {
      const aSk = r.aHoneyCredit || 0;
      const bSk = r.bHoneyCredit || 0;
      totalHoneyA += aSk;
      totalHoneyB += bSk;
      if (aSk > 0)      totalHoneyA += carryPot;
      else if (bSk > 0) totalHoneyB += carryPot;
      if (aSk > 0 || bSk > 0) carryPot = 0;
    }
    updatePlayerHoleStats(pA, r, 'a'); updatePlayerHoleStats(pB, r, 'b');
  };
  for (let h = 0; h < numHoles; h++) {
    const r = playHole(pA, pB, dealer);
    applyHole(r);
    dealer = dealer === 'a' ? 'b' : 'a';
  }
  const computeTotals = () => {
    const netHoneyA = totalHoneyA - totalHoneyB;
    const netHoneyB = totalHoneyB - totalHoneyA;
    return {
      a: totalGolfA - netHoneyA - carryPot,
      b: totalGolfB - netHoneyB - carryPot,
    };
  };
  let totals = computeTotals();
  let aTotal = totals.a, bTotal = totals.b;
  let playoffCount = 0;
  while (aTotal === bTotal && playoffCount < 30) {
    const r = playHole(pA, pB, dealer);
    applyHole(r);
    dealer = dealer === 'a' ? 'b' : 'a';
    playoffCount++;
    totals = computeTotals();
    aTotal = totals.a; bTotal = totals.b;
  }
  const winner = resolveTieWinner(pA, pB, aTotal, bTotal);
  const loser = winner === pA ? pB : pA;
  pA.stats.totalScore += aTotal; pB.stats.totalScore += bTotal;
  if (winner === pA) { pA.stats.matchesWon++; pB.stats.matchesLost++; }
  else { pB.stats.matchesWon++; pA.stats.matchesLost++; }

}
// Fair tiebreaker when 30 playoff holes still haven't resolved a match.
