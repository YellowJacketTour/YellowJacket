<style>
  :root {
    /* --- raw palette (never changes between themes) --- */
    --cream: #F5F1E8;
    --cream-soft: #FBF8F1;
    --white: #FFFFFF;
    --green: #006747;
    --green-deep: #0B5544;
    --green-mid: #14724E;
    --pine-bg: #0C3D2A;
    --gold: #C9A857;
    --gold-soft: #E0C68C;
    --honey: #FFC107;
    --honey-soft: #FFE082;
    --azalea: #FCE4EC;
    --azalea-mid: #F8BBD0;
    --charcoal: #1B1B1B;
    --fairway: #6D7066;

    /* --- semantic tokens: day theme defaults (WCAG AA ≥ 4.5:1 on bg-app/surface) --- */
    --bg-app: #F5F1E8;
    --bg-surface: #FFFFFF;
    --bg-elevated: #FBF8F1;
    --bg-dark: #0B5544;              /* always-dark elements (sidebar, toast, table header stripe) */
    --bg-tint-gold: rgba(201, 168, 87, 0.10);
    --bg-tint-green: rgba(0, 103, 71, 0.08);
    --bg-tint-pink: rgba(252, 228, 236, 0.55);

    --text-primary: #1B1B1B;         /* body text on bg-app/bg-surface */
    --text-secondary: #5C6159;       /* captions, labels (contrast-bumped from #6D7066) */
    --text-heading: #006747;         /* h1/h2/h3 and accent greens */
    --text-heading-deep: #004F37;    /* darker on buzz-bubble / moment-narr */

    --text-accent-gold: #8A6F2B;     /* dark-gold chip text on light gold bg */
    --text-accent-pink: #8E3A5F;     /* dark-pink chip text on azalea bg */
    --text-accent-honey: #8B6914;    /* dark honey on light honey bg */

    --text-on-dark: #F5F1E8;         /* always cream — for sidebar, toast, game-table */
    --text-on-dark-soft: #E0C68C;    /* brand-name style on sidebar */
    --text-on-gold: #1B1B1B;         /* gold buttons always have dark text */

    --border: rgba(11, 85, 68, 0.18);
    --border-strong: rgba(11, 85, 68, 0.35);

    --chart-text: #1B1B1B;
    --chart-grid: rgba(11, 85, 68, 0.12);
    --chart-axis: rgba(11, 85, 68, 0.25);
    --chart-series-primary: #006747;
    --chart-series-accent: #C9A857;
    --chart-series-tertiary: #8E3A5F;
    --chart-pos: #B85A3A;
    --chart-neg: #1E7A4E;

    --shadow-soft: 0 1px 3px rgba(27, 27, 27, 0.06), 0 4px 10px rgba(11, 85, 68, 0.06);
    --shadow-med: 0 4px 16px rgba(11, 85, 68, 0.10);
    --line: 1px solid var(--border);
    --radius: 10px;
    --nav-w: 232px;
  }

  [data-theme="sunday"] {
    /* Flip semantic tokens only — raw palette stays constant (Tailwind / Radix pattern). */
    --bg-app: #0A2A1B;
    --bg-surface: #143E2B;
    --bg-elevated: #103826;
    --bg-dark: #072218;              /* push sidebar even darker than app-bg */
    --bg-tint-gold: rgba(224, 198, 140, 0.14);
    --bg-tint-green: rgba(143, 220, 165, 0.10);
    --bg-tint-pink: rgba(248, 187, 208, 0.14);

    --text-primary: #F1ECDF;         /* 12.8:1 on bg-surface */
    --text-secondary: #C6D0BE;       /* 7.4:1 on bg-surface */
    --text-heading: #E8CF92;         /* gold-soft warmer tint · 9.2:1 on bg-surface */
    --text-heading-deep: #F3D99B;

    --text-accent-gold: #F0D89C;
    --text-accent-pink: #F8BBD0;
    --text-accent-honey: #FFE082;

    --text-on-dark: #F5F1E8;
    --text-on-dark-soft: #E0C68C;
    --text-on-gold: #1B1B1B;

    --border: rgba(224, 198, 140, 0.22);
    --border-strong: rgba(224, 198, 140, 0.48);

    --chart-text: #EFE8D5;
    --chart-grid: rgba(224, 198, 140, 0.14);
    --chart-axis: rgba(224, 198, 140, 0.35);
    --chart-series-primary: #7ED6A0;
    --chart-series-accent: #E8CF92;
    --chart-series-tertiary: #F8BBD0;
    --chart-pos: #F3A889;
    --chart-neg: #7ED6A0;

    --shadow-soft: 0 1px 3px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.35);
    --shadow-med: 0 4px 16px rgba(0,0,0,0.45);

    /* keep these raw-palette aliases flipped for legacy selectors using them as surface/text */
    --cream: #0A2A1B;
    --cream-soft: #103826;
    --white: #143E2B;
    --charcoal: #F1ECDF;
    --fairway: #C6D0BE;
    --green: #E8CF92;                /* legacy uses of var(--green) become readable gold-tint */
    --green-deep: #F3D99B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--charcoal);
    line-height: 1.5;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .ui-sans { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; }
  .mono { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; }

  /* Layout */

  aside.sidebar {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    padding: 22px 14px;
    border-right: 2px solid var(--gold);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding: 0 4px; }
  .brand-mark { width: 46px; height: 46px; flex-shrink: 0; }
  .brand-name { font-family: Georgia, serif; font-size: 17px; letter-spacing: 1px; color: var(--text-on-dark-soft); line-height: 1.1; }
  .brand-sub { font-size: 10px; letter-spacing: 2.5px; color: var(--honey-soft); opacity: 0.85; }

  nav.nav { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
  nav.nav a {

  nav.nav a:hover { background: rgba(201, 168, 87, 0.14); }
  nav.nav a.active { background: var(--gold); color: var(--text-on-gold); font-weight: 600; }
  nav.nav a .ico { width: 20px; text-align: center; font-size: 15px; }

  .sidebar-foot {
    margin-top: auto; padding-top: 14px;
    border-top: 1px solid rgba(201, 168, 87, 0.28);

    font-family: -apple-system, sans-serif;
    letter-spacing: 0.4px;

  .sidebar-foot .kbd {

  main#content { padding: 28px 40px 80px; max-width: 1280px; width: 100%; }

  .page-header {
    border-bottom: var(--line);

  .stat .value.gold { color: var(--gold); }

  .btn {
    font-family: -apple-system, sans-serif; font-size: 13px;
    padding: 9px 18px; border: none; border-radius: 6px;
    cursor: pointer; background: var(--green); color: var(--white);
    transition: all 150ms; letter-spacing: 0.3px; font-weight: 500;
  }
  .btn:hover { background: var(--green-mid); transform: translateY(-1px); box-shadow: var(--shadow-med); }
  .btn:active { transform: translateY(0); }
  .btn.gold { background: var(--gold); color: var(--charcoal); }
  .btn.gold:hover { background: var(--gold-soft); }
  .btn.outline { background: transparent; color: var(--green); border: 1px solid var(--green); }
  .btn.outline:hover { background: var(--green); color: var(--white); }
  .btn.ghost { background: transparent; color: var(--fairway); padding: 6px 12px; font-size: 12px; }
  .btn.ghost:hover { background: rgba(0,0,0,0.04); color: var(--charcoal); }
  .btn.small { font-size: 11px; padding: 5px 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  table {
    width: 100%; border-collapse: collapse;
    font-family: -apple-system, sans-serif; font-size: 13px;
  }
  thead th {
    font-family: -apple-system, sans-serif; font-size: 10px;

    border-bottom: var(--line); font-weight: 500;
  }
  tbody td {
    padding: 9px 8px; border-bottom: 1px solid rgba(11, 85, 68, 0.08);
    color: var(--charcoal);
  }
  tbody tr:hover td { background: rgba(201, 168, 87, 0.06); }
  td.num, th.num { font-family: monospace; text-align: right; }
  td.gold { color: var(--gold); font-weight: 600; }
  td.green { color: var(--green); font-weight: 600; }
  tr.gold-row td { background: rgba(201, 168, 87, 0.10); font-weight: 600; }

  input[type="text"], input[type="search"], select, textarea {
    font-family: -apple-system, sans-serif; font-size: 13px;
    padding: 8px 11px; border: 1px solid rgba(11, 85, 68, 0.25);
    border-radius: 5px; background: var(--white); color: var(--charcoal);
    outline: none; transition: border 120ms;
  }
  input[type="text"]:focus, input[type="search"]:focus, select:focus { border-color: var(--gold); }

  .chip {
    display: inline-block; padding: 2px 8px;
    border-radius: 10px; font-family: -apple-system, sans-serif;
    font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase;
    background: var(--bg-tint-green); color: var(--text-heading);
  }
  .chip.gold { background: var(--bg-tint-gold); color: var(--text-accent-gold); }
  .chip.azalea { background: var(--bg-tint-pink); color: var(--text-accent-pink); }
  .chip.honey { background: rgba(255, 193, 7, 0.18); color: var(--text-accent-honey); }

  .buzz-bubble {
    position: relative; padding: 14px 16px;
    background: var(--cream-soft); border-left: 4px solid var(--gold);
    border-radius: 6px; font-family: Georgia, serif; font-style: italic;
    font-size: 14px; color: var(--green-deep); margin-top: 12px;
  }

  /* Version banner — fixed-top non-modal alert. Auto-hides via .hidden until
     the boot logic detects a version mismatch, then fades in on top of all
     other content with both an "Update & Reload" CTA and a dismiss button. */
  #version-banner {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 6000;
    background: var(--bg-dark, #0e1f1c);
    color: var(--text-on-dark, #f7e9c2);
    border-bottom: 2px solid var(--gold, #d4a93a);
    padding: 12px 22px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    flex-wrap: wrap;
    font-family: -apple-system, sans-serif; font-size: 13px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    animation: banner-in 320ms ease-out;
  }
  #version-banner.hidden { display: none; }
  #version-banner .banner-msg { font-weight: 500; }
  #version-banner .banner-msg b { color: var(--gold, #d4a93a); }
  #version-banner .banner-sub { font-size: 11px; opacity: 0.78; font-style: italic; }
  #version-banner .banner-actions { display: flex; gap: 8px; }
  #version-banner button {
    font-family: -apple-system, sans-serif; font-size: 12px;
    padding: 6px 14px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--gold, #d4a93a);
    background: transparent; color: var(--gold, #d4a93a);
    transition: background 120ms ease;
  }
  #version-banner button.primary {
    background: var(--gold, #d4a93a); color: var(--bg-dark, #0e1f1c);
    font-weight: 600;
  }
  #version-banner button:hover { filter: brightness(1.1); }
  @keyframes banner-in {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  #toast-container {
    position: fixed; top: 22px; right: 22px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 5000; pointer-events: none;
  }
  .toast {
    background: var(--bg-dark); color: var(--text-on-dark);
    padding: 10px 16px; border-radius: 6px;
    font-family: -apple-system, sans-serif; font-size: 13px;
    border-left: 3px solid var(--gold);
    box-shadow: var(--shadow-med);
    animation: slide-in 220ms ease-out; max-width: 340px;
  }
  @keyframes slide-in { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .background-sim-banner {
    position: fixed; right: 22px; bottom: 22px; z-index: 5200;
    width: min(390px, calc(100vw - 32px));
    background: var(--bg-dark); color: var(--text-on-dark);
    border: 1px solid var(--gold); border-left: 4px solid var(--gold);
    border-radius: 8px; box-shadow: var(--shadow-med);
    padding: 13px 14px; font-family: -apple-system, sans-serif;
  }
  .background-sim-banner.hidden { display: none; }
  .background-sim-top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 8px;
  }
  .background-sim-title {
    font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 0.7px;
    text-transform: uppercase;
  }
  .background-sim-sub { font-size: 11px; opacity: 0.86; line-height: 1.4; }
  .background-sim-bar {
    height: 7px; border-radius: 999px; overflow: hidden;
    background: rgba(255, 255, 255, 0.16); margin: 9px 0 10px;
  }
  .background-sim-fill {
    height: 100%; width: 0%; background: var(--gold);
    transition: width 160ms ease-out;
  }
  .background-sim-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .background-sim-actions button {
    font-family: -apple-system, sans-serif; font-size: 11px; cursor: pointer;
    border: 1px solid var(--gold); border-radius: 5px;
    background: transparent; color: var(--gold); padding: 5px 9px;
  }
  .background-sim-actions button.primary {
    background: var(--gold); color: var(--bg-dark); font-weight: 700;
  }

  #modal-root {
    position: fixed; inset: 0; z-index: 4000;
    display: none; background: rgba(11, 85, 68, 0.75);
    backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 28px;
  }
  #modal-root.show { display: flex; }
  .modal-box {
    background: var(--white); border-radius: var(--radius);
    max-width: 720px; width: 100%; max-height: 88vh; overflow-y: auto;
    padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-box.large { max-width: 1000px; }

  .hr-gold { height: 1px; background: var(--gold); opacity: 0.3; margin: 20px 0; }

  .view { display: none; animation: fade-in 200ms ease-out; }
  .view.active { display: block; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 960px) { .grid-2 { grid-template-columns: 1fr; } }

  .game-wrap { max-width: 900px; margin: 0 auto; }
  .game-table {
    background: linear-gradient(to bottom, #0F5B3E 0%, #0A3F2A 100%);
    border-radius: 180px / 80px; padding: 30px;
    border: 4px solid #6D4F21;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    color: var(--cream); font-family: Georgia, serif;
  }
  .seat { text-align: center; margin: 14px 0; }
  .seat-name {
    display: inline-block; padding: 4px 18px;
    background: rgba(245,241,232,0.08);
    border: 1px solid var(--gold-soft); border-radius: 22px;
    font-size: 14px; color: var(--gold-soft); letter-spacing: 0.5px;
  }
  .seat-name.active { background: var(--gold); color: var(--charcoal); font-weight: 600; box-shadow: 0 0 18px rgba(201,168,87,0.55); }
  .cards-row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; min-height: 92px; }
  .card-face {
    width: 64px; height: 92px;
    background: var(--white); color: var(--charcoal);
    border-radius: 7px; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: space-between;

    box-shadow: 0 4px 8px rgba(0,0,0,0.35);
  }
  .card-face.red { color: #B33030; }
  .card-face .rank { font-size: 18px; line-height: 1; }
  .card-face .suit { font-size: 26px; align-self: flex-end; line-height: 1; }
  .card-face.placeholder {
    background: rgba(245,241,232,0.06);
    border: 2px dashed rgba(245,241,232,0.2);
    box-shadow: none;
  }
  .hidden-cards {
    display: inline-block; padding: 12px 30px;
    background: rgba(0,0,0,0.45); border-radius: 8px;
    border: 1px dashed var(--gold-soft);
    color: var(--gold-soft); font-family: -apple-system, sans-serif;
    font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .pot-info {
    display: inline-flex; gap: 20px;
    padding: 8px 16px; background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold-soft); border-radius: 20px;
    margin: 12px 0; font-size: 12px; color: var(--gold-soft);
    font-family: -apple-system, sans-serif; letter-spacing: 0.5px;
  }
  .pot-info b { color: var(--cream); font-size: 14px; font-family: monospace; }
  .actions-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; min-height: 44px; }
  .btn.fold { background: #9B2B2B; color: var(--cream); }
  .btn.fold:hover { background: #B53939; }
  .result-banner {
    padding: 14px 18px; background: rgba(0,0,0,0.45);
    border: 1px solid var(--gold-soft); border-radius: 8px;
    color: var(--gold-soft); font-family: -apple-system, sans-serif;
    font-size: 13px; max-width: 600px; margin: 10px auto; text-align: center;
  }

  .chart-box { background: var(--white); border: var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-soft); margin-bottom: 16px; }

  #cmd-palette {
    position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
    width: 560px; max-width: 90vw;
    background: var(--white); border-radius: 10px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    z-index: 5500; display: none; padding: 14px;
  }
  #cmd-palette.show { display: block; }
  #cmd-palette input {
    width: 100%; padding: 12px 14px;
    font-size: 15px; border: none; outline: none;
    border-bottom: var(--line);
  }
  .cmd-results { max-height: 340px; overflow-y: auto; padding-top: 6px; }
  .cmd-result {
    padding: 9px 12px; cursor: pointer; border-radius: 5px;

  .cmd-result:hover, .cmd-result.active { background: var(--cream); }
  .cmd-result .cmd-cat {

  .buzz-chat { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .buzz-chat .buzz-avatar { width: 54px; height: 54px; flex-shrink: 0; }
  .faq-item { border-bottom: 1px solid rgba(11, 85, 68, 0.10); padding: 12px 0; cursor: pointer; }

  .faq-q {

  }
  .faq-a {
    font-family: -apple-system, sans-serif; font-size: 13px;
    color: var(--charcoal); margin-top: 8px; padding-left: 12px;
    border-left: 2px solid var(--gold); display: none;
  }
  .faq-item.open .faq-a { display: block; }
  .faq-item.open .faq-q .caret { transform: rotate(90deg); }
  .faq-q .caret { transition: transform 180ms; color: var(--gold); font-size: 12px; }

  .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .tag-cloud button {
    padding: 3px 9px; font-size: 11px;
    background: var(--bg-tint-gold); color: var(--text-accent-gold);
    border: 1px solid transparent; border-radius: 12px; cursor: pointer;
    font-family: -apple-system, sans-serif; letter-spacing: 0.3px;
  }
  .tag-cloud button.active { background: var(--gold); color: var(--text-on-gold); }
  .tag-cloud button:hover { border-color: var(--gold); }

  .event-card {
    background: var(--white); border: var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 10px;
    display: grid; grid-template-columns: 60px 1fr auto;
    gap: 14px; align-items: center;
  }
  .event-card .ev-badge {
    width: 54px; height: 54px; border-radius: 50%;

  .event-card .ev-badge.main { background: var(--azalea-mid); color: var(--charcoal); }

  .progress-wrap { width: 100%; height: 8px; background: rgba(11, 85, 68, 0.10); border-radius: 4px; overflow: hidden; margin: 8px 0; }

  details { cursor: pointer; }

  .share-input {
    width: 100%; font-family: monospace; font-size: 10px;
    padding: 8px; background: var(--cream-soft);
    border: 1px solid var(--gold-soft); border-radius: 4px;
    word-break: break-all; resize: vertical;
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }

    nav.nav { flex-direction: row; flex-wrap: wrap; }
    nav.nav a { flex: 1 1 100px; justify-content: center; }
    main#content { padding: 16px; }

  /* --- Phase 2 UI patterns --- */

  /* Filter toolbar */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; padding: 12px 14px; background: var(--cream-soft); border-radius: var(--radius); border: var(--line); }
  .filter-bar label { font-family: -apple-system, sans-serif; font-size: 10px; color: var(--fairway); letter-spacing: 1.5px; text-transform: uppercase; margin-right: 6px; }
  .filter-bar select, .filter-bar input[type="search"], .filter-bar input[type="number"] { padding: 5px 9px; font-size: 12px; }
  .filter-bar .result-count { margin-left: auto; font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); letter-spacing: 1px; text-transform: uppercase; }

  /* Sortable table */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--gold); }
  th.sortable.sorted::after { content: ' ▾'; color: var(--gold); font-size: 9px; }
  th.sortable.sorted.asc::after { content: ' ▴'; color: var(--gold); font-size: 9px; }

  /* Player directory grid */
  .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .player-card {
    background: var(--white); border: var(--line); border-radius: var(--radius);
    padding: 14px 12px; cursor: pointer; transition: all 150ms;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .player-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-med); border-color: var(--gold); }
  .player-card .p-avatar { width: 64px; height: 64px; margin-bottom: 8px; }
  .player-card .p-name { font-family: Georgia, serif; font-size: 14px; color: var(--green); margin-bottom: 3px; }
  .player-card .p-skill { font-family: monospace; font-size: 10px; color: var(--fairway); letter-spacing: 0.5px; margin-bottom: 6px; }
  .player-card .p-record { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--charcoal); }
  .player-card .p-record .pr-gold { color: var(--gold); font-weight: 600; }
  .player-card.top-tier { border-top: 3px solid var(--gold); }
  .virt-scroller { max-height: 680px; overflow-y: auto; padding: 4px; background: var(--cream-soft); border-radius: var(--radius); border: var(--line); }

  /* Skill tier chips */
  .tier-elite { background: var(--gold); color: var(--text-on-gold); }
  .tier-contender { background: var(--bg-tint-green); color: var(--text-heading); }
  .tier-regular { background: rgba(255,193,7,0.22); color: var(--text-accent-honey); }
  .tier-fringe { background: rgba(11,85,68,0.10); color: var(--text-secondary); }

  /* Badges */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 14px;
    background: var(--bg-elevated); border: 1px solid var(--gold-soft);
    font-family: -apple-system, sans-serif; font-size: 10px;
    color: var(--text-heading); letter-spacing: 0.3px;
  }
  .badge.gold { background: var(--bg-tint-gold); border-color: var(--gold); color: var(--text-accent-gold); font-weight: 600; }
  .badge.azalea { background: var(--bg-tint-pink); border-color: var(--azalea-mid); color: var(--text-accent-pink); }
  .badge.green { background: var(--bg-tint-green); border-color: var(--green-mid); color: var(--text-heading); }
  .badge .b-icon { font-size: 11px; }

  /* Scorecard (finals hole-by-hole) */
  .scorecard { width: 100%; border-collapse: collapse; font-family: monospace; font-size: 12px; margin-top: 12px; }
  .scorecard th, .scorecard td { padding: 5px 4px; text-align: center; border: 1px solid rgba(11,85,68,0.1); }
  .scorecard th { background: var(--green-deep); color: var(--cream); font-family: -apple-system, sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .scorecard td.label { background: var(--cream-soft); text-align: left; font-family: -apple-system, sans-serif; font-weight: 500; letter-spacing: 0.3px; }
  .scorecard td.total { background: var(--gold-soft); font-weight: bold; }
  .scorecard td.reveal { opacity: 0; animation: card-reveal 400ms ease-out forwards; }
  @keyframes card-reveal { to { opacity: 1; } }
  .scorecard td.neg { color: var(--chart-neg); font-weight: 600; }
  .scorecard td.pos { color: var(--chart-pos); }

  /* Radar chart container */
  .radar-box { display: flex; align-items: center; justify-content: center; padding: 12px; }

  /* Canvas charts */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
  .chart-box canvas { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
  .chart-box .chart-title { font-family: Georgia, serif; font-size: 16px; color: var(--green); margin-bottom: 4px; }
  .chart-box .chart-sub { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); text-transform: uppercase; letter-spacing: 1.3px; margin-bottom: 10px; }
  .chart-box .chart-note { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); margin-top: 8px; font-style: italic; }

  /* Moment card */
  .moment-card {
    background: linear-gradient(135deg, var(--cream-soft) 0%, var(--white) 100%);
    border: var(--line); border-left: 4px solid var(--gold);
    border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px;
    display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center;
  }
  .moment-card .m-year { font-family: Georgia, serif; font-size: 24px; color: var(--green); text-align: center; }
  .moment-card .m-narr { font-family: Georgia, serif; font-size: 14px; font-style: italic; color: var(--green-deep); }
  .moment-card .m-stats { font-family: monospace; font-size: 11px; color: var(--fairway); margin-top: 4px; letter-spacing: 0.5px; }
  .moment-card .m-score { font-family: monospace; font-size: 20px; color: var(--gold); font-weight: bold; }

  /* Record row */
  .record-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid rgba(11,85,68,0.08);
    align-items: center;
  }
  .record-row:last-child { border-bottom: none; }
  .record-row .r-label { font-family: -apple-system, sans-serif; font-size: 12px; color: var(--fairway); text-transform: uppercase; letter-spacing: 1.2px; }
  .record-row .r-holder { font-family: Georgia, serif; font-size: 14px; color: var(--green); }
  .record-row .r-value { font-family: monospace; font-size: 15px; color: var(--gold); font-weight: bold; }

  /* Compare layout */
  .compare-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 880px) { .compare-layout { grid-template-columns: 1fr; } }
  .vs-center { text-align: center; font-family: Georgia, serif; font-size: 20px; color: var(--gold); margin: 8px 0; letter-spacing: 2px; }

  /* View transitions fallback */
  .view.transitioning { opacity: 0.6; transition: opacity 200ms; }

  /* Event drilldown */
  .bracket-note { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); font-style: italic; padding: 10px 12px; background: var(--cream-soft); border-radius: 6px; margin-top: 10px; }

  /* Player profile header */
  .profile-head { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
  .profile-head .p-big-avatar { width: 110px; height: 110px; flex-shrink: 0; }
  .profile-head .p-meta h1 { font-family: Georgia, serif; font-size: 32px; color: var(--green); margin-bottom: 4px; }
  .profile-head .p-meta .p-tag { font-family: -apple-system, sans-serif; font-size: 11px; color: var(--fairway); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }

  /* Histogram hover */
  .chart-hint { font-family: monospace; font-size: 11px; color: var(--green); background: var(--cream-soft); padding: 2px 8px; border-radius: 4px; display: inline-block; min-height: 18px; margin-top: 6px; }

  /* --- Sim Lab --- */
  .lab-layout, .simulator-layout { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
  .simulator-layout { --sim-panel-w: 320px; grid-template-columns: minmax(320px, var(--sim-panel-w)) 12px minmax(0, 1fr); gap: 0 10px; }
  .simulator-splitter { width: 12px; min-height: 100%; cursor: col-resize; position: relative; }
  .simulator-splitter::before { content: ''; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--border); border-radius: 2px; }
  .simulator-splitter:hover::before, .simulator-splitter.dragging::before { background: var(--gold); }
  @media (max-width: 1100px) { .lab-layout, .simulator-layout { grid-template-columns: 1fr; } .simulator-splitter { display: none; } }

  .mode-tabs { display: inline-flex; background: var(--bg-elevated); border-radius: 8px; padding: 3px; gap: 2px; margin-bottom: 14px; }
  .mode-tabs button {
    padding: 7px 16px; font-family: -apple-system, sans-serif; font-size: 12px;
    letter-spacing: 0.5px; background: transparent; color: var(--text-secondary);
    border: none; border-radius: 6px; cursor: pointer; transition: all 150ms;
  }
  .mode-tabs button:hover { color: var(--text-heading); }
  .mode-tabs button.active { background: var(--gold); color: var(--text-on-gold); font-weight: 600; }

  .run-registry { display: flex; flex-direction: column; gap: 8px; }
  @media (min-width: 1200px) {
    .simulator-layout .run-registry { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
  @media (min-width: 1600px) {
    .simulator-layout .run-registry { grid-template-columns: repeat(3, 1fr); }
    .simulator-layout .kpi-strip { grid-template-columns: repeat(6, 1fr); }

  .rebuild-warn {
    padding: 10px 12px; background: var(--bg-elevated);
    border-left: 3px solid var(--chart-pos); border-radius: 4px;
    font-family: -apple-system, sans-serif; font-size: 11px;
    color: var(--text-primary); margin: 10px 0;

  .career-feed { max-height: 360px; overflow-y: auto; margin-top: 6px; }

  .lab-config { position: sticky; top: 18px; max-height: calc(100vh - 40px); overflow-y: auto; min-width: 0; }
  .lab-section { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .lab-section:last-child { border-bottom: none; }
  .lab-section h4 { font-family: -apple-system, sans-serif; font-size: 10px; letter-spacing: 1.8px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; }
  .slider-row { display: grid; grid-template-columns: 90px 1fr 76px; gap: 8px; align-items: center; margin-bottom: 6px; font-family: -apple-system, sans-serif; font-size: 11px; }

  .slider-row input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; border: 2px solid var(--bg-surface); box-shadow: var(--shadow-soft); }
  .slider-row .slider-val { font-family: monospace; font-size: 11px; color: var(--text-heading); text-align: right; }
  .slider-row input.slider-val { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-heading); border-radius: 4px; padding: 4px 6px; }

  .preset-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .preset-row button { padding: 3px 9px; font-size: 10px; letter-spacing: 0.4px; background: var(--bg-tint-gold); color: var(--text-accent-gold); border: 1px solid transparent; border-radius: 10px; cursor: pointer; font-family: -apple-system, sans-serif; }
  .preset-row button:hover { border-color: var(--gold); }
  .preset-row button.active { background: var(--gold); color: var(--text-on-gold); font-weight: 600; }

  .dist-preview { height: 34px; background: var(--bg-elevated); border-radius: 4px; margin-top: 6px; position: relative; overflow: hidden; }
  .dist-preview canvas { display: block; width: 100%; height: 100%; }

  .runtime-estimate { padding: 8px 10px; background: var(--bg-elevated); border-left: 3px solid var(--gold); border-radius: 4px; font-family: monospace; font-size: 11px; color: var(--text-primary); margin-top: 10px; }
  .runtime-estimate.warn { background: var(--bg-elevated); border-color: var(--chart-pos); color: var(--text-primary); }

  .run-card { background: var(--bg-surface); border: var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; transition: all 120ms; position: relative; }
  .run-card:hover { border-color: var(--gold); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
  .run-card.active { border-color: var(--gold); box-shadow: 0 0 0 2px var(--bg-tint-gold); }
  .run-card .run-name { font-family: Georgia, serif; font-size: 14px; color: var(--text-heading); margin-bottom: 4px; }
  .run-card .run-meta { font-family: -apple-system, sans-serif; font-size: 10px; color: var(--text-secondary); letter-spacing: 0.3px; }
  .run-card .run-kpis { display: flex; gap: 14px; margin-top: 8px; font-family: monospace; font-size: 11px; color: var(--text-primary); }
  .run-card .run-kpi b { color: var(--text-heading); }
  .run-card .run-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
  .run-card:hover .run-actions { display: flex; }
  .run-card .run-actions button { padding: 2px 6px; font-size: 10px; background: transparent; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; }
  .run-card .run-actions button:hover { color: var(--text-heading); border-color: var(--gold); }

  .compare-runs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding: 12px; background: var(--bg-elevated); border-radius: 6px; }
  .kpi-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .kpi-box { padding: 10px 12px; background: var(--bg-surface); border: var(--line); border-radius: 6px; }
  .kpi-box .kpi-label { font-family: -apple-system, sans-serif; font-size: 9px; color: var(--text-secondary); letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 4px; }
  .kpi-box .kpi-value { font-family: Georgia, serif; font-size: 22px; color: var(--text-heading); }
  .kpi-box .kpi-delta { font-family: monospace; font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
  .kpi-box .kpi-delta.up { color: var(--chart-neg); }
  .kpi-box .kpi-delta.down { color: var(--chart-pos); }


  .heatmap-cell { transition: opacity 120ms; }
  .heatmap-label { font-family: -apple-system, sans-serif; font-size: 10px; fill: var(--chart-text); }

  .log-stream { background: var(--bg-elevated); padding: 10px; border-radius: 4px; max-height: 180px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.5; color: var(--text-secondary); }
  .log-stream .log-time { color: var(--text-heading); margin-right: 8px; }
  .log-stream .log-warn { color: var(--chart-pos); }

  /* Buzz live tip in multiplayer */
  .buzz-live-tip {
    background: rgba(255,193,7,0.10); border-left: 3px solid var(--honey);
    padding: 10px 12px 10px 14px; margin: 10px auto; max-width: 620px;
    border-radius: 5px; font-family: Georgia, serif; font-style: italic;
    font-size: 13px; color: var(--green-deep);
    display: flex; gap: 10px; align-items: center;
  }
  .buzz-live-tip .tip-mark { font-size: 14px; }
</style>

<script>
'use strict';

// Yellow Jacket Tour — secure, offline, self-contained
//
// === APP_VERSION ===
// Bumped on every public build. Compared against the saved lastVersion at boot;
// a mismatch fires the smart-refresh banner so users with an older cached copy
// of the page see a clear "new version available" prompt and can update without
// losing progress (saves are version-independent and restore cleanly).
const APP_VERSION = "2026.04.27-v54";
const UNIFIED_SAVE_KEY = "yellowJacketSave";

// LARGE SIM MODE (state-of-the-art persistence)
// When enabled, disables all mid-run autosaves and does one final save only.
// Prevents localStorage quota errors on 30k+ pool simulations while preserving
// full data for the active run. The guard variable LARGE_SIM_RUN_IN_PROGRESS
// is set to true at the start of a run (via simulatorRunClicked) and cleared
// before the post-run snapshot save, so save calls inside the simulation loop
// are no-ops while the final canonical save still writes through normally.
let LARGE_SIM_RUN_IN_PROGRESS = false;
// SUPPRESS_ALL_SAVES_DURING_RUN — stronger sibling of LARGE_SIM_RUN_IN_PROGRESS
// that gates EVERY storage-write entry point in the file. Set alongside
// LARGE_SIM_RUN_IN_PROGRESS at run start; cleared in the simulatorRunClicked
// finally block. When true (and largeSimMode cfg is on), all save-related
// functions silently return — including the inner StorageAPI.save() and the
// "Save failed" toast it would otherwise emit. The post-run final save runs
// after both flags are cleared, so canonical state is still persisted.
let SUPPRESS_ALL_SAVES_DURING_RUN = false;
let currentRunData = null;

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') n.appendChild(document.createTextNode(String(c)));
    else n.appendChild(c);
  }
  return n;
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

let MemoryStorageFallback = {};

function getStorage() {
  try {
    const s = window.localStorage;
    const probe = '__yj_probe__';
    s.setItem(probe, '1');
    s.removeItem(probe);
    return s;
  } catch (e) {
    return {
      getItem(key) { return Object.prototype.hasOwnProperty.call(MemoryStorageFallback, key) ? MemoryStorageFallback[key] : null; },
      setItem(key, value) { MemoryStorageFallback[key] = String(value); },
      removeItem(key) { delete MemoryStorageFallback[key]; },
    };
  }
}

function showFatalError(message, detail) {
  const root = $('#content') || document.body;
  if (!root) return;
  const existing = $('#fatal-boot-error');
  if (existing) existing.remove();
  const card = el('div', { id: 'fatal-boot-error', class: 'card', style: 'margin: 18px; border-top: 4px solid var(--chart-pos);' });
  card.appendChild(el('h2', { text: 'Startup Error' }));
  card.appendChild(el('p', {
    class: 'ui-sans',
    style: 'color: var(--text-secondary); font-size: 13px; margin-top: 6px;',
    text: message || 'Yellow Jacket failed during startup.'
  }));
  if (detail) {
    card.appendChild(el('pre', {
      class: 'mono',
      style: 'margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; background: var(--bg-elevated); padding: 10px; border: var(--line); border-radius: 8px;',
      text: detail
    }));
  }
  root.prepend(card);
}

function toast(msg, duration) {
  const container = $('#toast-container');
  if (!container) { console.warn('Toast dropped:', msg); return; }
  const t = el('div', { class: 'toast', text: msg });
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 200ms'; setTimeout(() => t.remove(), 240); }, duration || 2600);
}

// Banner is built ONCE and updated in place on subsequent renders. Earlier
// versions rebuilt the entire banner DOM (clear() + appendChild) every
// chunk, which dropped pause/cancel clicks that landed in the ~50ms window
// where buttons were being replaced. Now the buttons persist for the life
// of the simulation, so clicks always reach the live handlers.
function renderBackgroundSimBanner() {
  let banner = $('#background-sim-banner');
  if (!BackgroundSim.isRunning) {
    if (banner) banner.classList.add('hidden');
    return;
  }
  if (!banner) {
    banner = el('div', { id: 'background-sim-banner', class: 'background-sim-banner' });
    document.body.appendChild(banner);
    // Build the structural skeleton once. All subsequent renders only mutate
    // text content / widths / disabled states — the button elements themselves
    // are stable references with persistent click handlers.
    const top = el('div', { class: 'background-sim-top' });
    const titleBlock = el('div', null,
      el('div', { id: 'bgsim-title', class: 'background-sim-title' }),
      el('div', { id: 'bgsim-progress', class: 'background-sim-sub' })
    );
    const eventTag = el('div', { id: 'bgsim-eventtag', class: 'mono', style: 'font-size: 12px; color: var(--gold);' });
    top.appendChild(titleBlock);
    top.appendChild(eventTag);
    banner.appendChild(top);
    const bar = el('div', { class: 'background-sim-bar' });
    bar.appendChild(el('div', { id: 'bgsim-fill', class: 'background-sim-fill', style: 'width: 0%;' }));
    banner.appendChild(bar);
    banner.appendChild(el('div', { class: 'background-sim-sub', text: 'You can keep playing, browsing results, or reading the Rulebook. Progress auto-saves every few seconds.' }));
    const actions = el('div', { class: 'background-sim-actions' });
    const pauseBtn = el('button', { id: 'bgsim-pause-btn' });
    // Pause/Resume click — sets a "transitioning" flag so the banner shows
    // "Pausing... (finishing current event)" between the click and the
    // actual pause taking effect. Without this, clicks during a long event
    // appeared to do nothing for several seconds.
    pauseBtn.onclick = () => {
      if (!BackgroundSim.isRunning) return;
      if (BackgroundSim.isPaused) {
        BackgroundSim.resume();
      } else {
        // Optimistic UI: show "Pausing..." immediately. The actual pause
        // takes effect when the current event finishes.
        BackgroundSim._pendingPause = true;
        renderBackgroundSimBanner();
        BackgroundSim.pause();
      }
    };
    actions.appendChild(pauseBtn);
    const cancelBtn = el('button', { id: 'bgsim-cancel-btn', text: 'Cancel' });
    cancelBtn.onclick = () => {
      if (!BackgroundSim.isRunning) return;
      if (!confirm('Cancel the background simulation? Completed events stay saved.')) return;
      // Optimistic UI: show "Canceling..." immediately so the user knows
      // their click registered. cancel() itself runs to completion fast
      // (no further events will fire) but the persist + cleanup take a
      // moment to settle.
      BackgroundSim._pendingCancel = true;
      renderBackgroundSimBanner();
      BackgroundSim.cancel();
    };
    actions.appendChild(cancelBtn);
    banner.appendChild(actions);
  }
  banner.classList.remove('hidden');
  // Update dynamic content only — buttons are stable, never re-created.
  const p = BackgroundSim.progress();
  const titleEl   = banner.querySelector('#bgsim-title');
  const progressEl = banner.querySelector('#bgsim-progress');
  const eventTagEl = banner.querySelector('#bgsim-eventtag');
  const fillEl    = banner.querySelector('#bgsim-fill');
  const pauseBtn  = banner.querySelector('#bgsim-pause-btn');
  const cancelBtn = banner.querySelector('#bgsim-cancel-btn');
  // Title reflects the four states: pending-cancel > pending-pause > paused > running.
  let title = 'Simulation Running';
  if (BackgroundSim._pendingCancel)      title = 'Canceling… (finishing current event)';
  else if (BackgroundSim._pendingPause)  title = 'Pausing… (finishing current event)';
  else if (BackgroundSim.isPaused)       title = 'Simulation Paused';
  if (titleEl)    titleEl.textContent = title;
  if (progressEl) progressEl.textContent = 'Year ' + p.year + ' / ' + p.endYear + ' · ' + p.completed + ' of ' + p.total + ' events · ' + p.percent.toFixed(1) + '%';
  if (eventTagEl) eventTagEl.textContent = p.type ? p.type.toUpperCase() : 'RUN';
  if (fillEl)     fillEl.style.width = p.percent + '%';
  if (pauseBtn) {
    pauseBtn.textContent = BackgroundSim.isPaused ? 'Resume' : 'Pause';
    pauseBtn.className = (BackgroundSim.isPaused ? 'primary' : '');
    pauseBtn.disabled = !!(BackgroundSim._pendingCancel || BackgroundSim._pendingPause);
  }
  if (cancelBtn) {
    cancelBtn.disabled = !!BackgroundSim._pendingCancel;
  }
}

function openModal(contentBuilder, opts) {
  opts = opts || {};
  const root = $('#modal-root');
  const body = $('#modal-body');
  clear(body);
  body.className = 'modal-box' + (opts.large ? ' large' : '');
  contentBuilder(body);
  root.classList.add('show');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
}
function closeModal() { $('#modal-root').classList.remove('show'); }

const STORAGE_KEY = 'yellow-jacket-tour-b-v1';
const LAB_STORAGE_KEY = 'yj-tour-b-v1-lab';
const StorageAPI = {
  load() {
    try {
      const raw = getStorage().getItem(STORAGE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (obj && obj.version === 1) return obj.data;
    } catch (e) { console.warn('Storage load failed:', e); }
    return null;
  },
  save(data) {
    // SUPPRESS_ALL_SAVES_DURING_RUN — silently no-op when a large-sim run is
    // in flight. Prevents the "Save failed — localStorage may be full" toast
    // from spamming the user during 30k+ pool runs.
    if (SUPPRESS_ALL_SAVES_DURING_RUN && LabState?.config?.largeSimMode) {
      return false;
    }
    try {
      getStorage().setItem(STORAGE_KEY, JSON.stringify({ version: 1, data, savedAt: Date.now() }));
      return true;
    } catch (e) {
      // Surface the toast only when largeSimMode is OFF — under largeSimMode
      // a transient quota error during a normal-mode save is ignorable.
      if (!LabState?.config?.largeSimMode) toast('Save failed — localStorage may be full');
      return false;
    }
  },
  clear() { try { getStorage().removeItem(STORAGE_KEY); } catch (e) {} }
};

function clearAllStoredData() {
  try {
    const s = getStorage();
    s.removeItem(STORAGE_KEY);
    s.removeItem(LAB_STORAGE_KEY);
    s.removeItem(UNIFIED_SAVE_KEY);
  } catch (e) {}
  MemoryStorageFallback = {};
}

// === UNIFIED SAVE / RESTORE ===
// Single-source-of-truth save under UNIFIED_SAVE_KEY that bundles every piece of
// user progress: TourState (pool, seasons, currentSeason, preferences),
// LabState (config, runs, activeRunId, panelWidth), BuzzKnowledge.moments,
// plus the build's APP_VERSION and a savedAt timestamp.
//
// The legacy split keys (STORAGE_KEY, LAB_STORAGE_KEY) are kept in sync for
// backward compatibility with older builds that read those keys directly. The
// unified key is the canonical source on boot.
function unifiedSave() {
  // LARGE SIM MODE guard — bulletproof suppression. When SUPPRESS_ALL_SAVES_
  // DURING_RUN is set (alongside cfg.largeSimMode), every save-write entry
  // point in the file silently no-ops. The post-run finalizer clears the flag
  // before the canonical save so state still persists at the end.
  if (SUPPRESS_ALL_SAVES_DURING_RUN && LabState?.config?.largeSimMode) {
    return false; // silently suppress
  }
  try {
    const payload = {
      version: APP_VERSION,
      savedAt: Date.now(),
      tour: {
        pool: TourState.pool,
        seasons: TourState.seasons,
        currentSeason: TourState.currentSeason,
        preferences: TourState.preferences,
      },
      lab: {
        config: LabState.config,
        runs: LabState.runs,
        activeRunId: LabState.activeRunId,
        panelWidth: LabState.panelWidth,
      },
      moments: (BuzzKnowledge && Array.isArray(BuzzKnowledge.moments)) ? BuzzKnowledge.moments.slice(0, 50) : [],
    };
    getStorage().setItem(UNIFIED_SAVE_KEY, JSON.stringify(payload));
    return true;
  } catch (e) {
    // Quota or serialization failures are silent — the legacy split-key save
    // path runs alongside this and will succeed even if the unified bundle
    // is too big for one slot.
    return false;
  }
}

// Returns the parsed unified save object, or null if absent / corrupt.
function unifiedRead() {
  try {
    const raw = getStorage().getItem(UNIFIED_SAVE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== 'object') return null;
    return obj;
  } catch (e) {
    return null;
  }
}

// Hydrate runtime state from a unified save payload. Tolerant of missing
// sub-keys so partial saves still restore as much as possible. Returns the
// payload's saved version string (or null if absent) so the caller can compare
// against APP_VERSION and decide whether to show the smart-refresh banner.
function unifiedRestore(payload) {
  if (!payload || typeof payload !== 'object') return null;
  if (payload.tour && typeof payload.tour === 'object') {
    if (Array.isArray(payload.tour.pool)) TourState.pool = payload.tour.pool;
    if (Array.isArray(payload.tour.seasons)) TourState.seasons = payload.tour.seasons;
    if (typeof payload.tour.currentSeason === 'number') TourState.currentSeason = payload.tour.currentSeason;
    if (payload.tour.preferences && typeof payload.tour.preferences === 'object') {
      TourState.preferences = Object.assign({}, TourState.preferences, payload.tour.preferences);
    }
    if (TourState.preferences && TourState.preferences.theme === 'sunday') {
      document.documentElement.dataset.theme = 'sunday';
    }
  }
  if (payload.lab && typeof payload.lab === 'object') {
    if (payload.lab.config && typeof payload.lab.config === 'object') {
      Object.assign(LabState.config, payload.lab.config);
      if (!LabState.config.scoringStyle) LabState.config.scoringStyle = DEFAULT_SIM_CONFIG.scoringStyle;
    }
    if (Array.isArray(payload.lab.runs)) LabState.runs = payload.lab.runs;
    if (payload.lab.activeRunId) LabState.activeRunId = payload.lab.activeRunId;
    if (payload.lab.panelWidth) LabState.panelWidth = Math.max(320, Math.min(720, +payload.lab.panelWidth || 320));
  }
  if (Array.isArray(payload.moments) && BuzzKnowledge) {
    BuzzKnowledge.moments = payload.moments;
  }
  return payload.version || null;
}

// Render the smart-refresh banner. Called when boot detects the saved version
// differs from APP_VERSION. The banner offers two CTAs:
//   1. Update & Reload — saves current progress, then forces a hard reload
//      (bypassing the disk cache via location.reload(true) where supported,
//      with a cache-busting query parameter as a portable fallback).
//   2. Keep Current Version — dismisses the banner; user keeps playing on
//      whatever version they have. The banner won't reappear until the saved
//      version diverges again from APP_VERSION (e.g., next reload after the
//      page is refreshed and lastVersion is bumped).
function showVersionBanner(savedVersion, currentVersion) {
  const root = $('#version-banner');
  if (!root) return;
  clear(root);
  const msg = el('div', { class: 'banner-msg' });
  msg.appendChild(document.createTextNode('New version available — '));
  msg.appendChild(el('b', { text: 'your current runs and progress are safe.' }));
  const sub = el('div', { class: 'banner-sub', text: 'Saved on ' + (savedVersion || 'older build') + ' · current build ' + currentVersion });
  msg.appendChild(el('br'));
  msg.appendChild(sub);
  root.appendChild(msg);

  const actions = el('div', { class: 'banner-actions' });
  const updateBtn = el('button', { class: 'primary', text: 'Update & Reload' });
  updateBtn.onclick = () => {
    try { unifiedSave(); } catch (_) {}
    // Cache-bust the URL so the browser re-fetches index.html instead of
    // serving a stale cached copy. location.reload(true) is deprecated /
    // ignored on modern browsers; the query-param trick is the portable
    // alternative that works everywhere.
    const url = new URL(location.href);
    url.searchParams.set('_v', String(Date.now()));
    location.href = url.toString();
  };
  const keepBtn = el('button', { text: 'Keep Current Version' });
  keepBtn.onclick = () => {
    root.classList.add('hidden');
  };
  actions.appendChild(updateBtn);
  actions.appendChild(keepBtn);
  root.appendChild(actions);
  root.classList.remove('hidden');
}

// Download the current unified save as a JSON file. Used by the "Export Backup"
// button next to "Reset All Progress" so users can keep an off-device copy
// before doing anything destructive.
function exportUnifiedSave() {
  try {
    const raw = getStorage().getItem(UNIFIED_SAVE_KEY) || JSON.stringify({
      version: APP_VERSION,
      savedAt: Date.now(),
      tour: { pool: TourState.pool, seasons: TourState.seasons, currentSeason: TourState.currentSeason, preferences: TourState.preferences },
      lab: { config: LabState.config, runs: LabState.runs, activeRunId: LabState.activeRunId, panelWidth: LabState.panelWidth },
      moments: BuzzKnowledge.moments.slice(0, 50),
    });
    const blob = new Blob([raw], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'yellow-jacket-backup-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (_) {} }, 30000);
    toast('Backup downloaded — keep this file safe, you can restore from it later.');
  } catch (e) {
    toast('Backup failed: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

// ============================================================
// Sim engine (ported from Node)
// ============================================================
const SUITS = ['S','H','D','C'];
const SUIT_GLYPH = { S: '♠', H: '♥', D: '♦', C: '♣' };
const RANK_NAMES = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };
const CATEGORY_NAMES = ['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush','Royal Flush'];
// golfNameForScore maps a STROKE SCORE to its golf term — it is NOT indexed by hand category,
// because the same hand can post different scores depending on kicker rank (e.g. a Pair with
// JJ posts 0/par but with 33 posts +1/bogey under the Honey-Stroke scorecard mapping). The
// golf label always derives from the resolved per-hole score.
//   0 = Par · -1 = Birdie · -2 = Eagle · -3 = Albatross · -4 = Condor · -5 = Ostrich
//   -6 = Phoenix · -7 = Dragon · -8 = Paragon · -9 = Zenith · -10 or deeper = Hole-in-One
//   +1 = Bogey · +2 = Double Bogey · +3 = Triple Bogey · +4+ = Snowman
const GOLF_NAMES_BY_SCORE = {
  '0':'Par','-1':'Birdie','-2':'Eagle','-3':'Albatross','-4':'Condor','-5':'Ostrich',
  '-6':'Phoenix','-7':'Dragon','-8':'Paragon','-9':'Zenith',
  '1':'Bogey','2':'Double Bogey','3':'Triple Bogey'
};
function golfNameForScore(n) {
  if (n == null || !Number.isFinite(n)) return '—';
  if (n <= -10) return 'Hole-in-One';
  if (n >= 4) return 'Snowman';
  return GOLF_NAMES_BY_SCORE[String(n)] || '—';
}
// Legacy name-by-hand array is deprecated; kept only so old references don't throw.
// Callers should migrate to golfNameForScore(score).
const GOLF_NAMES = ['Birdie','Eagle','Eagle','Albatross','Albatross','Condor','Condor','Ostrich','Phoenix','Hole-in-One'];
let CurrentStrokeCap = 3;
function setStrokeCap(n) { CurrentStrokeCap = Math.max(1, Math.min(10, (+n) || 3)); }
// SCORING TOGGLE (v31): when CurrentLoserBogey === true, decisive-showdown
// losers post a fixed +1 bogey instead of their own hand's golf score.
// Mirrors the cfg.loserBogey flag (see DEFAULT_SIM_CONFIG). Default false
// preserves the v23 "Honored Loss" rule (each player scores own hand even
// when losing). The simulator and the SP/MP engine both honor this flag —
// playHole reads it directly; resolveMPHole reads from g.loserBogey, which
// is snapshotted from this global at game-creation time so mid-config
// changes don't alter an in-progress game.
let CurrentLoserBogey = false;
function setLoserBogey(b) { CurrentLoserBogey = !!b; }
// DECISION DIVISOR (v39 Path 1): per-decision EV math uses a separate, smaller
// divisor than end-of-round honey normalization. Decouples in-kernel fold cost
// from the round-length stroke conversion. The original v23 math used the
// round-length divisor (72 for aggregate events) inside decideFor, which made
// folding cost ~72 honey-equivalent vs ~10 honey at risk for a call. Break-even
// fold equity collapsed to ~13%, well below any realistic Hold'em hand, and the
// fold rate vanished. With CurrentDecisionDivisor=9 (default), break-even fold
// equity rises to ~18-25% across cap regimes — folds become meaningful tactical
// decisions without changing the production round-scoring formula.
let CurrentDecisionDivisor = 9;
function setDecisionDivisor(n) {
  const v = +n;
  CurrentDecisionDivisor = (Number.isFinite(v) && v >= 1) ? v : 9;
}
// POT-ELASTIC CAP (v43) — streetCap dynamically scales with pot size, capped
// by a global ceiling. Restores no-limit-style overbet pressure on hot pots
// without re-importing chip-counting friction. The progressive 25/50/75/100%
// schedule remains as a floor (small pots stay small); pot-elastic kicks in
// when k×agreedTotal exceeds the progressive floor. Setting k=0 reverts to
// pure legacy progressive caps. Default 3 — produces meaningful preflop play
// (Tea Box cap = 6 vs opener=2 → 4 honey room) and dramatic late-street
// pressure on carry-pot inflated holes (cap can reach 3× the global cap).
let CurrentPotElasticK = 3;
function setPotElasticK(n) {
  const v = +n;
  CurrentPotElasticK = (Number.isFinite(v) && v >= 0) ? v : 3;
}
// =============================================================================
// SCORING — Honey-Stroke is the sole, permanent scoring law for Yellow Jacket Tour.
// Two-layer design:
//   1) Scorecard layer:  hand category → bounded golf-style hole score via
//      golfScoreFromHandValue() (range −5..+2). Keeps individual holes realistic.
//   2) Honey-pot layer:   wagered strokes form a pot. Hole winner takes the entire
//      pot as a honey credit. Ties carry the pot to the next decisive hole.
//
// Permanent invariants (no longer user-tunable):
//   honeyDivisor = 1     — net honey imbalance feeds round total at full strength
//   carryOverEnabled  = true  — tied holes always carry their pot forward
//
// All historical ladder variants (Model B, HC=Par, HC=Bogey, Shifted-Up) and their
// supporting knobs (loserBase, strokeTransfer, hole-score clamp) have been retired.
// =============================================================================
const SCORING_STYLES = {
  'honey-stroke': {
    key: 'honey-stroke',
    name: 'Honey-Stroke',
    shortName: 'Honey-Stroke',
    desc: 'Hand category sets a bounded golf score per hole (−5..+2). Wagered strokes form a honey pot taken by the hole winner; tied holes carry the pot to the next decisive hole. Total net honey credits earned across the event are divided by 18 before being subtracted from the golf scorecard.',
    useHoneyStroke: true,
    carryOverEnabled: true,
    honeyDivisor: 1,
  },
};
let CurrentScoringStyleKey = 'honey-stroke';
let CurrentScoringModel = SCORING_STYLES[CurrentScoringStyleKey];
function resolveScoringModel(key) { return SCORING_STYLES['honey-stroke']; }
function setScoringStyle(_key) {
  CurrentScoringStyleKey = 'honey-stroke';
  CurrentScoringModel = SCORING_STYLES['honey-stroke'];
  return CurrentScoringModel;
}
function activeScoringModel() { return SCORING_STYLES['honey-stroke']; }
// Baseline equity of hero's category — the AI's perceived win probability used to
// drive bet/call/fold decisions. CRITICAL CALIBRATION NOTE:
//
// HC[0] = 0.05 is NOT raw 7-card HC vs uniform-random opponent (which would be
// ~0.18). It is the *adverse-selection-aware* equity: HC vs an opponent who has
// NOT folded by the current decision point. A villain who calls a bet on flop or
// turn already has at least a pair-or-better range, so hero's HC is essentially
// drawing dead. The 0.05 reflects that conditional reality, and is what produces
// the calibrated 41% preflop fold rate, 5% post-flop fold rate, and Masters-
// authentic champion-finals mean of −10.5 strokes.
//
// A bump to 0.18 was tried in mid-session under "match raw equity" reasoning and
// was reverted because it dropped preflop fold rate to 32%, halved Spearman ρ
// (0.72 → 0.31), and collapsed Elite ROI from +30% to ~0%. Looser play =
// more variance per hand = weaker skill signal across the population. Don't
// re-bump without re-running the regression test.
//
// Other categories' values are calibrated for their conditional ranges too:
// Pair = 0.38 (vs called-down ranges), TwoPair = 0.72, etc. All reflect
// "equity given opponent reached this street voluntarily."
const WIN_PROB = [0.05, 0.38, 0.72, 0.87, 0.92, 0.96, 0.985, 0.999, 1.0, 1.0];

// Yellow Jacket honey-divisor — DYNAMIC by round length (v23):
//   72-hole finals  → divisor 72
//   18-hole rounds  → divisor 18
//   9-hole matches  → divisor  9
//   1-hole matches  → divisor  1 (full-value drizzle for quick sims)
// Threaded through gameContext.honeyDivisor by playMatch / runFinals so
// decideFor's EV math sees the correct normalization for the round being
// played. The static `honeyNormalizationDivisor` const below is kept as a
// fallback for any code path that doesn't carry context. The actual
// round-score formula in playMatch / runFinals always reads the dynamic
// divisor via honeyDivisorFor(numHoles).
// HONEY MAGNITUDE (v40 Path 2) — scales honey-to-stroke conversion at end of
// round. Default 1.0 = original behavior (1 stroke = roundLength honey). At
// 2.0, honey is twice as impactful (1 stroke = roundLength/2 honey), making
// the honey layer meaningful enough to compete with the scorecard for skill
// expression. The brief originally claimed honey was the "skilled adjustment
// layer" but at magnitude=1 a 72-hole event caps skilled honey advantage at
// ~5 strokes — washed out by a single bad showdown swing of -5..+2.
let CurrentHoneyMagnitude = 1;
function setHoneyMagnitude(n) {
  const v = +n;
  CurrentHoneyMagnitude = (Number.isFinite(v) && v > 0) ? v : 1;
}
// v54 TRUE FOLD COST BIN — maps a stroke-equivalent fold cost to a histogram
// bucket. Higher resolution at the low end (most folds) and coarser bins at
// the high end (rare big-pot folds). Returns 0..9.
//   Bin 0: [1.00, 1.25)  — cheap small-pot folds (correct YJ fold)
//   Bin 1: [1.25, 1.50)
//   Bin 2: [1.50, 1.75)
//   Bin 3: [1.75, 2.00)
//   Bin 4: [2.00, 2.50)
//   Bin 5: [2.50, 3.00)
//   Bin 6: [3.00, 4.00)
//   Bin 7: [4.00, 5.00)
//   Bin 8: [5.00, 7.00)
//   Bin 9: [7.00, ∞)    — extreme; only seen in short events at high mag
const TRUE_FOLD_COST_LABELS = ['1.00-1.25','1.25-1.50','1.50-1.75','1.75-2.00','2.00-2.50','2.50-3.00','3.00-4.00','4.00-5.00','5.00-7.00','7.00+'];
function trueFoldCostBin(cost) {
  if (!Number.isFinite(cost) || cost < 0) return 0;
  if (cost < 1.25) return 0;
  if (cost < 1.50) return 1;
  if (cost < 1.75) return 2;
  if (cost < 2.00) return 3;
  if (cost < 2.50) return 4;
  if (cost < 3.00) return 5;
  if (cost < 4.00) return 6;
  if (cost < 5.00) return 7;
  if (cost < 7.00) return 8;
  return 9;
}

function honeyDivisorFor(numHoles) {
  const n = +numHoles || 0;
  let base;
  if (n >= 72) base = 72;
  else if (n >= 18) base = 18;
  else if (n >= 9) base = 9;
  else base = 1;
  // Apply honey-magnitude scaling. Higher magnitude → smaller divisor → honey
  // is worth more strokes per unit. Both end-of-round scoring and decideFor's
  // EV math read the divisor through this function (or its mirrored fallback),
  // so player perception and actual scoring stay aligned.
  const mult = (CurrentHoneyMagnitude > 0) ? CurrentHoneyMagnitude : 1;
  // v52 DIVISOR FLOOR: clamp the returned divisor to a minimum of 4 so short
  // events at high magnitude don't collapse into honey-dominated scoring.
  // Without this, mag=9 + 9-hole bracket = divisor 1, meaning 1 honey = 1
  // stroke and a 30-honey pot is worth 30 strokes — completely breaking
  // bracket play. With the floor, bracket/sudden-death events cap at
  // 4 honey = 1 stroke regardless of magnitude. 72-hole championships still
  // see the full magnitude effect (mag=9 → divisor=8).
  return Math.max(4, base / mult);
}
// honeyNormalizationDivisor = 72 (4×18, like 4 rounds of golf / majors).
// Golf dominates; honey is the light smoothing drizzle.
const honeyNormalizationDivisor = 72;

function rankName(r) { return RANK_NAMES[r] || String(r); }

// -------------------------------------------------------------------------
// PERFORMANCE INSTRUMENTATION (SimPerf)
// Tiny, zero-alloc perf profiler. Enabled when SimPerf.enabled = true.
// Buckets: dealHole, bettingRound, evaluate7, showdown, fieldSelect, metrics.
// runLabSession clears+reads this each run; the dashboard renders a perf card.
// -------------------------------------------------------------------------
const SimPerf = {
  enabled: false,
  buckets: Object.create(null),
  eventTimes: null,          // ms per event, in event order (for first10/last10 comparison)
  eventTimeCursor: 0,
  t0: 0,                     // wall-clock start for the run
  reset(expectedEvents) {
    this.buckets = Object.create(null);
    const n = Math.max(4, expectedEvents | 0);
    this.eventTimes = new Float32Array(n);
    this.eventTimeCursor = 0;
    this.t0 = performance.now();
  },
  mark() { return this.enabled ? performance.now() : 0; },
  add(bucket, from) {
    if (!this.enabled || !from) return;
    const dt = performance.now() - from;
    this.buckets[bucket] = (this.buckets[bucket] || 0) + dt;
  },
  logEvent(dtMs) {
    if (!this.enabled || !this.eventTimes) return;
    if (this.eventTimeCursor < this.eventTimes.length) {
      this.eventTimes[this.eventTimeCursor++] = dtMs;
    }
  },
  summary() {
    const totalMs = performance.now() - this.t0;
    const n = this.eventTimeCursor;
    let firstAvg = 0, lastAvg = 0;
    if (n > 0) {
      const head = Math.max(1, Math.min(n, Math.floor(n * 0.1)));
      const tailFrom = Math.max(0, n - head);
      let hs = 0, ls = 0;
      for (let i = 0; i < head; i++) hs += this.eventTimes[i];
      for (let i = tailFrom; i < n; i++) ls += this.eventTimes[i];
      firstAvg = hs / head;
      lastAvg = ls / (n - tailFrom);
    }
    const overall = n > 0 ? totalMs / n : 0;
    return {
      totalMs,
      eventCount: n,
      msPerEvent: overall,
      firstChunkMsPerEvent: firstAvg,
      lastChunkMsPerEvent: lastAvg,
      slowdownPct: firstAvg > 0 ? ((lastAvg - firstAvg) / firstAvg) * 100 : 0,
      eventsPerSec: overall > 0 ? 1000 / overall : 0,
      buckets: Object.assign({}, this.buckets),
    };
  },
};

// -------------------------------------------------------------------------
// REUSABLE DECK (zero-alloc per hole)
// Prior code allocated 52 card objects in makeDeck() for every hole. Over a
// 100y × 2000-player run that's ≈ 21 million short-lived allocations — the
// dominant cause of the "slows down as it goes" GC pressure. We now allocate
// the deck once and shuffle it in place. `makeDeck()` is retained for the
// cold interactive-game path which creates an independent deck per match.
// -------------------------------------------------------------------------
const DECK = (function() {
  const d = new Array(52);
  let idx = 0;
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d[idx++] = { rank: r, suit: s };
  return d;
})();
function shuffleDeck() {
  for (let i = 51; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = DECK[i]; DECK[i] = DECK[j]; DECK[j] = t;
  }
}
// Retained for cold paths (interactive game creates its own deck so the sim lab
// can run concurrently without stomping DECK).
function makeDeck() { const d=new Array(52); let i=0; for (const s of SUITS) for (let r=2; r<=14; r++) d[i++] = {rank:r, suit:s}; return d; }
function shuffle(a) { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// -------------------------------------------------------------------------
// EVALUATE7 — zero-alloc 7-card hand evaluator.
//
// Returns a PACKED INT `handValue`:
//   (cat << 24) | (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4)
// cat = 0..9 (High Card .. Royal Flush). k1..k5 are primary/kicker ranks (2..14).
// Consumers read `cat = hv >>> 24` and `kN = (hv >>> (24 - N*4)) & 0xF`.
// Comparison is plain integer subtraction: `a - b`.
//
// API: evaluate7(hole, community) OR evaluate7(combinedArray) — second form
// retained for interactive cold path.
//
// Scratch buffers are module-level; values are reset at function entry.
// -------------------------------------------------------------------------
const EVAL_RC = new Int8Array(15);             // rank counts [2..14]
const EVAL_SC = new Int8Array(4);              // suit counts S/H/D/C
const EVAL_SR0 = new Int8Array(7);             // ranks in suit 0
const EVAL_SR1 = new Int8Array(7);
const EVAL_SR2 = new Int8Array(7);
const EVAL_SR3 = new Int8Array(7);
const EVAL_SL = new Int8Array(4);              // lengths per suit scratch
const SUIT_IDX = { S: 0, H: 1, D: 2, C: 3 };

function evaluate7(a, b) {
  const t0 = SimPerf.enabled ? performance.now() : 0;
  const rc = EVAL_RC;
  for (let i = 2; i < 15; i++) rc[i] = 0;
  rc[0] = 0; rc[1] = 0;
  EVAL_SC[0] = 0; EVAL_SC[1] = 0; EVAL_SC[2] = 0; EVAL_SC[3] = 0;
  EVAL_SL[0] = 0; EVAL_SL[1] = 0; EVAL_SL[2] = 0; EVAL_SL[3] = 0;
  // Ingest cards from a and (optionally) b.
  const aLen = a.length;
  for (let i = 0; i < aLen; i++) {
    const c = a[i];
    const r = c.rank;
    rc[r]++;
    const s = SUIT_IDX[c.suit];
    EVAL_SC[s]++;
    const sl = EVAL_SL[s]++;
    if (s === 0) EVAL_SR0[sl] = r;
    else if (s === 1) EVAL_SR1[sl] = r;
    else if (s === 2) EVAL_SR2[sl] = r;
    else EVAL_SR3[sl] = r;
  }
  if (b) {
    const bLen = b.length;
    for (let i = 0; i < bLen; i++) {
      const c = b[i];
      const r = c.rank;
      rc[r]++;
      const s = SUIT_IDX[c.suit];
      EVAL_SC[s]++;
      const sl = EVAL_SL[s]++;
      if (s === 0) EVAL_SR0[sl] = r;
      else if (s === 1) EVAL_SR1[sl] = r;
      else if (s === 2) EVAL_SR2[sl] = r;
      else EVAL_SR3[sl] = r;
    }
  }
  // Rank-presence bitmask for straight detection.
  let rankMask = 0;
  for (let r = 2; r <= 14; r++) if (rc[r]) rankMask |= (1 << r);
  if (rc[14]) rankMask |= 2; // ace can complete the wheel (2-3-4-5-A); bit 1 represents ace-low
  // Highest straight hi = highest set bit in (mask & mask>>1 & mask>>2 & mask>>3 & mask>>4).
  // Derivation: bit H of mask<<k = 1 iff rank (H-k) is present. AND across k=0..4 yields
  // bit H set iff ranks H, H-1, ..., H-4 are all present (straight ending at H).
  function straightHi(mask) {
    const m = mask & (mask << 1) & (mask << 2) & (mask << 3) & (mask << 4);
    if (!m) return 0;
    // Highest set bit. Math.clz32 is ~1-3ns on V8.
    return 31 - Math.clz32(m);
  }
  // Flush suit (if any).
  let flushSuit = -1;
  if (EVAL_SC[0] >= 5) flushSuit = 0;
  else if (EVAL_SC[1] >= 5) flushSuit = 1;
  else if (EVAL_SC[2] >= 5) flushSuit = 2;
  else if (EVAL_SC[3] >= 5) flushSuit = 3;

  // Straight flush / royal flush — check the suited rank subset only.
  if (flushSuit >= 0) {
    let fMask = 0;
    const fArr = flushSuit === 0 ? EVAL_SR0 : flushSuit === 1 ? EVAL_SR1 : flushSuit === 2 ? EVAL_SR2 : EVAL_SR3;
    const fLen = EVAL_SL[flushSuit];
    for (let i = 0; i < fLen; i++) {
      const r = fArr[i];
      fMask |= (1 << r);
      if (r === 14) fMask |= 2;
    }
    const sfh = straightHi(fMask);
    if (sfh === 14) { SimPerf.add('evaluate7', t0); return (9 << 24) | (14 << 20); } // royal flush
    if (sfh >= 5) { SimPerf.add('evaluate7', t0); return (8 << 24) | (sfh << 20); }  // straight flush
  }

  // Scan for four/three/pairs counts in a single top-down pass.
  let quadRank = 0, tripsRank = 0, pairHi = 0, pairLo = 0;
  for (let r = 14; r >= 2; r--) {
    const c = rc[r];
    if (c === 4 && !quadRank) quadRank = r;
    else if (c === 3) {
      if (!tripsRank) tripsRank = r;
      else if (!pairHi) pairHi = r; // 2nd trips serves as pair for full house
    }
    else if (c === 2) {
      if (!pairHi) pairHi = r;
      else if (!pairLo) pairLo = r;
    }
  }

  // Four of a kind
  if (quadRank) {
    let kick = 0;
    for (let r = 14; r >= 2; r--) if (r !== quadRank && rc[r]) { kick = r; break; }
    SimPerf.add('evaluate7', t0);
    return (7 << 24) | (quadRank << 20) | (kick << 16);
  }
  // Full house
  if (tripsRank && pairHi) {
    SimPerf.add('evaluate7', t0);
    return (6 << 24) | (tripsRank << 20) | (pairHi << 16);
  }
  // Flush (non-straight)
  if (flushSuit >= 0) {
    const fArr = flushSuit === 0 ? EVAL_SR0 : flushSuit === 1 ? EVAL_SR1 : flushSuit === 2 ? EVAL_SR2 : EVAL_SR3;
    const fLen = EVAL_SL[flushSuit];
    let k1=0,k2=0,k3=0,k4=0,k5=0;
    for (let i = 0; i < fLen; i++) {
      const r = fArr[i];
      if (r > k1) { k5=k4; k4=k3; k3=k2; k2=k1; k1=r; }
      else if (r > k2) { k5=k4; k4=k3; k3=k2; k2=r; }
      else if (r > k3) { k5=k4; k4=k3; k3=r; }
      else if (r > k4) { k5=k4; k4=r; }
      else if (r > k5) k5=r;
    }
    SimPerf.add('evaluate7', t0);
    return (5 << 24) | (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4);
  }
  // Straight (non-flush)
  const sh = straightHi(rankMask);
  if (sh >= 5) { SimPerf.add('evaluate7', t0); return (4 << 24) | (sh << 20); }
  // Three of a kind
  if (tripsRank) {
    let k1=0, k2=0;
    for (let r = 14; r >= 2; r--) {
      if (r === tripsRank) continue;
      if (rc[r]) { if (!k1) k1 = r; else { k2 = r; break; } }
    }
    SimPerf.add('evaluate7', t0);
    return (3 << 24) | (tripsRank << 20) | (k1 << 16) | (k2 << 12);
  }
  // Two pair
  if (pairHi && pairLo) {
    let kick = 0;
    for (let r = 14; r >= 2; r--) if (r !== pairHi && r !== pairLo && rc[r]) { kick = r; break; }
    SimPerf.add('evaluate7', t0);
    return (2 << 24) | (pairHi << 20) | (pairLo << 16) | (kick << 12);
  }
  // One pair
  if (pairHi) {
    let k1=0, k2=0, k3=0;
    for (let r = 14; r >= 2; r--) {
      if (r === pairHi) continue;
      if (rc[r]) {
        if (!k1) k1 = r;
        else if (!k2) k2 = r;
        else { k3 = r; break; }
      }
    }
    SimPerf.add('evaluate7', t0);
    return (1 << 24) | (pairHi << 20) | (k1 << 16) | (k2 << 12) | (k3 << 8);
  }
  // High card
  let k1=0,k2=0,k3=0,k4=0,k5=0;
  for (let r = 14; r >= 2; r--) {
    if (rc[r]) {
      if (!k1) k1=r;
      else if (!k2) k2=r;
      else if (!k3) k3=r;
      else if (!k4) k4=r;
      else { k5=r; break; }
    }
  }
  SimPerf.add('evaluate7', t0);
  return (k1 << 20) | (k2 << 16) | (k3 << 12) | (k4 << 8) | (k5 << 4);
}
// Consumers of evaluate7: the returned packed int can be compared directly via
// subtraction (higher category / higher kickers produce a larger int).
function compareHand(a, b) { return a - b; }
function handCat(hv) { return hv >>> 24; }
function handK1(hv) { return (hv >>> 20) & 0xF; }
// Legacy helpers `loserHandCredit` and `computeShowdownScore` were removed when the
// codebase consolidated on Honey-Stroke as the sole scoring law. Showdown resolution
// now lives in playHole's honey-stroke path (see below).

// =====================================================================================
// HONEY-STROKE scoring: hand-category → bounded golf-style hole score.
// =====================================================================================
//
// Maps a packed handValue (from evaluate7) to a per-hole golf score in the range
// [-5, +2]. Designed to keep individual holes bounded to realistic golf outcomes
// (eagle through double-bogey-ish) while letting category strength still drive
// who wins the hole. Premium variants of mid-strength categories (e.g. JJ+ pairs,
// AA-high two pair, queen-high straights) get a one-step better score so kickers
// matter at decision boundaries — tested vs naive "category alone" mapping below.
//
// Range justification (per-hole):
//   -5  : Royal / Straight Flush — essentially the nut "hole-in-one"-equivalent
//   -4  : Quads — eagle territory
//   -3  : Premium Full House (paired ten or higher) — strong eagle
//   -2  : Standard FH / strong Flush / Straight (high) — eagle-ish
//   -1  : ordinary Flush / Straight / Trips / strong TwoPair — birdie
//    0  : ordinary TwoPair / strong Pair (JJ+) — par
//   +1  : weak Pair / strong High Card (Q+) — bogey
//   +2  : weak High Card — double bogey
//
// Calibrated against expected hand-category frequencies for 7-card hold'em:
// approximately 17% HC, 44% Pair, 23% TwoPair, 5% Trips, 4.5% Straight, 3% Flush,
// 2.5% FullHouse, ~0.2% Quads+. The premium kicker buckets shift the mode of the
// scorecard distribution to "near par" rather than uniformly below par, while still
// rewarding genuine strength with eagle/albatross territory.
function golfScoreFromHandValue(hv) {
  const cat = hv >>> 24;            // hand category 0..9
  const k1 = (hv >>> 20) & 0xF;     // primary kicker rank (2..14), used for fine buckets

  // OFFICIAL HONEY-STROKE SYSTEM TABLE (Rules tab — single source of truth):
  //   Royal / Straight Flush → -5
  //   Four of a Kind         → -4
  //   Full House             → -2 standard, -3 if J+ trips (premium kicker)
  //   Flush                  → -1 standard, -2 if T-high+ (premium kicker)
  //   Straight               → -1 standard, -2 if 9-high+ (premium kicker)
  //   Three of a Kind        → -1
  //   Two Pair               →  0 standard, -1 if J+ top pair (premium kicker)
  //   Pair                   → +1 standard,  0 if TT+ (premium kicker)
  //   High Card              → +2 standard, +1 if J-high+ (premium kicker)
  // Honey is calculated separately as net wagered pot value, divided by the
  // current honeyNormalizationDivisor at round end. This function is the golf
  // scorecard layer ONLY — no honey accounting here.
  if (cat >= 8) return -5;                    // Royal / Straight Flush
  if (cat === 7) return -4;                   // Four of a Kind
  if (cat === 6) return (k1 >= 11 ? -3 : -2); // Full House: J+ trips premium
  if (cat === 5) return (k1 >= 10 ? -2 : -1); // Flush: T-high+ premium
  if (cat === 4) return (k1 >= 9  ? -2 : -1); // Straight: 9-high+ premium
  if (cat === 3) return -1;                   // Three of a Kind
  if (cat === 2) return (k1 >= 11 ? -1 : 0);  // Two Pair: J+ top pair premium
  if (cat === 1) return (k1 >= 10 ? 0 : 1);   // Pair: TT+ premium
  // High Card
  return (k1 >= 11 ? 1 : 2);                  // High Card: J-high+ premium
}

function preflopKey(holeCards) {
  // Retained for any UI code that needs the human-readable label (e.g. "AKs").
  // The hot-loop strength path uses preflopIdx() + PREFLOP_EQUITY_TABLE below.
  const a = holeCards[0], b = holeCards[1];
  const hi = a.rank >= b.rank ? a : b;
  const lo = a.rank >= b.rank ? b : a;
  const RC = {14:'A',13:'K',12:'Q',11:'J',10:'T',9:'9',8:'8',7:'7',6:'6',5:'5',4:'4',3:'3',2:'2'};
  const hc = RC[hi.rank], lc = RC[lo.rank];
  if (hi.rank === lo.rank) return hc + hc;
  return hc + lc + (hi.suit === lo.suit ? 's' : 'o');
}

// Numeric preflop equity lookup — replaces per-decision string keying.
// Index: (hi_rank - 2) * 26 + (lo_rank - 2) * 2 + (suited ? 1 : 0). Size 338 = 13 × 26.
// Pairs write the same equity to both suited/offsuit slots (suit is moot for pairs).
// Populated from PREFLOP_EQUITY at module init; any missing combinations fall back to 0.5.
const PREFLOP_EQUITY_TABLE = new Float32Array(338);
(function initPreflopTable() {
  for (let i = 0; i < 338; i++) PREFLOP_EQUITY_TABLE[i] = 0.5;
  const CHAR_RANK = { A:14, K:13, Q:12, J:11, T:10, '9':9, '8':8, '7':7, '6':6, '5':5, '4':4, '3':3, '2':2 };
  for (const key in PREFLOP_EQUITY) {
    const v = PREFLOP_EQUITY[key];
    const hi = CHAR_RANK[key[0]];
    const lo = CHAR_RANK[key[1]];
    if (!hi || !lo) continue;
    if (hi === lo) {
      const base = (hi - 2) * 26 + (lo - 2) * 2;
      PREFLOP_EQUITY_TABLE[base] = v;
      PREFLOP_EQUITY_TABLE[base + 1] = v;
    } else {
      const suited = key[2] === 's' ? 1 : 0;
      const idx = (hi - 2) * 26 + (lo - 2) * 2 + suited;
      PREFLOP_EQUITY_TABLE[idx] = v;
    }
