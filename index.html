      const row = el('tr');
      r.forEach(c => row.appendChild(el('td', { text: c })));
      tb.appendChild(row);
    });
    t.appendChild(tb);
    return t;
  }

  // ---- Welcome ----
  const intro = el('div', { class: 'card accent' });
  intro.appendChild(el('h2', { text: 'Welcome to the Codex' }));
  intro.appendChild(p('The Yellow Jacket Tour is a hybrid card-and-golf game. Hands of heads-up Texas Hold\'em are scored on a golf scorecard. Wagered strokes form honey pots that adjust your final score. Survive 72 holes against the world\'s best, and you wear the Yellow Jacket itself.'));
  intro.appendChild(p('This Codex is the master manual. It explains the Honey-Stroke law, the two tournament formats supported by the engine, the strategy that separates elite players from the field, and the lore that gives the Tour its character.'));
  intro.appendChild(p('The game ships in TWO variants. The competitive Yellow Jacket Tour uses the Bogey-Loss rule (decisive-showdown loser posts +1 bogey, sharper skill expression). The casual Bumblebee League uses the Honored-Loss rule (decisive-showdown loser scores own hand, gentler scoring with golf-realistic below-par totals). Variants share every other rule. See section 1 below for the full law of both, and the simulator\'s Variant dropdown to switch between them.'));
  view.appendChild(intro);

  // ---- The Honey-Stroke Scoring Law ----
  const law = section('1 · The Honey-Stroke Scoring Law',
    p('Every hole of the Yellow Jacket Tour is a single hand of heads-up Texas Hold\'em with two layers of consequences:'),
    h3('Layer 1: The Scorecard'),
    p('Your hand category at showdown sets a bounded golf score for the hole. The mapping is fixed and well-known:'),
    tbl(
      ['Hand category', 'Golf name', 'Score'],
      [
        ['Royal / Straight Flush', 'Hole-in-One', '−5'],
        ['Four of a Kind', 'Albatross', '−4'],
        ['Full House (J+ trips)', 'Premium Eagle', '−3'],
        ['Full House (standard)', 'Eagle', '−2'],
        ['Flush (T-high+) / Straight (9-high+)', 'Premium Birdie', '−2'],
        ['Flush / Straight (standard)', 'Birdie', '−1'],
        ['Three of a Kind', 'Birdie', '−1'],
        ['Two Pair (J+ top)', 'Birdie', '−1'],
        ['Two Pair (standard)', 'Par', '0'],
        ['Pair (TT+)', 'Par', '0'],
        ['Pair (under tens)', 'Bogey', '+1'],
        ['High Card (J-high+)', 'Bogey', '+1'],
        ['High Card (weak)', 'Double Bogey', '+2'],
      ]
    ),
    h3('Layer 2: The Honey Pot — Agreed-Total Wagering'),
    p('Every hole begins with a mandatory starting pot of 2 honey. There are no blinds. From there, betting is by AGREED TOTAL, not by matched chips: a "bet" or "raise" is a proposal to set a NEW agreed pot size for the hole. A "call" is acceptance of the current proposal — the pot now stands at that level. There is no summing, no doubling, no matched contributions. The pot is always the LAST AGREED TOTAL.'),
    p('Example: hole opens at 2. You raise to 5. Opponent calls — pot is now 5 (not 7, not 10). On the flop you raise to 9. Opponent calls — pot is now 9. River check-check — pot stays at 9. Showdown winner takes 9 honey.'),
    h3('Layer 3: Folds — Lose The Previous Agreement, Take One Bogey'),
    p('When you fold to a proposal, you lose ONLY the PREVIOUSLY AGREED total in honey (the level both players had agreed to before the new proposal). You also take a +1 bogey on the golf scorecard. The non-folder takes 0 (par) on the golf scorecard AND receives the previously agreed total in honey.'),
    p('Example: pot is agreed at 5. Opponent raises to 8. You fold. You lose 5 honey to opponent and add +1 bogey to your scorecard. Opponent gains 5 honey and takes par (0). The proposal of 8 is moot — only the prior agreed total of 5 transfers. This is the same fold rule on every street; there is no street-based penalty table.'),
    h3('Per-Round Score (dynamic by round length)'),
    p('finalRoundScore = totalGolfScorecard − (netHoney / divisor). The divisor matches the round length:'),
    ul([
      '72-hole finals → divisor 72',
      '18-hole rounds → divisor 18',
      '9-hole bracket matches → divisor 9',
      '1-hole quick matches → divisor 1 (full-value honey)',
    ]),
    p('Honey is always the light drizzle on top of the dominant golf scorecard. Lower total wins.'),
    h3('Permanent Invariants'),
    ul([
      'Mandatory starting pot = 2 honey per hole. Every hole opens with the pot already at 2 honey before any betting decision is made. There are no blinds or antes.',
      'Honey divisor scales by round length: 72-hole rounds use divisor 72, 18-hole rounds use 18, 9-hole rounds use 9, 1-hole quick matches use 1 (full-value honey). The divisor is set by the round\'s total hole count, not by the event tier.',
      'Last-agreed-total wagering: a bet or raise sets a NEW agreed total pot size; a call accepts that total. The pot is always exactly the most recently agreed total — never a sum of contributions, never doubled, never matched.',
      'Tied-hole carry: when a hole ends in a tied showdown (both players make the same hand value), both players score 0 (par) for the hole and the entire pot rolls forward as the starting honey for the NEXT hole in the same match. Carry compounds across consecutive ties until one player wins a decisive hole. Carries stay within a single match.',
      'Uniform fold rule on every street: the folder loses the previously agreed pot in honey and posts +1 bogey on the scorecard. The non-folder takes 0 (par) on the scorecard and gains the previously agreed pot in honey. There is no street-based fold-penalty table.',
    ]),
    h3('Variant: Yellow Jacket vs Bumblebee'),
    p('The decisive-showdown loser is scored differently between the two variants. This is the ONLY rule that differs.'),
    ul([
      'YELLOW JACKET (competitive tour): the decisive-showdown loser posts a fixed +1 bogey regardless of hand strength. Mirrors the fold rule. Sharper skill expression; champion scores typically +12 to +28.',
      'BUMBLEBEE (casual league): the decisive-showdown loser scores their own hand\'s golf value (-5..+2) — flush-loser still posts -1 birdie. Preserves "your hand always counts" texture; champion scores typically -10 to -18.',
      'Both variants share: per-hole engine, mandatory pot, agreed-total wagering, stroke caps, fold rule, tie carry, divisor, tournament formats, field selection, payout structure, economics. Only the loser-score differs.',
      'The variant choice is not a calibration knob; it\'s a design dial between "competitive sharpness" and "casual texture." Pick the one that matches your audience.',
    ])
  );
  view.appendChild(law);

  // ---- Tournament Formats ----
  const fmt = section('2 · Tournament Formats',
    p('The Yellow Jacket engine supports two tournament structures, switchable per simulation run. Both formats use the same per-hole engine — only the macro structure differs.'),
    h3('Bracket Knockout (WSOP feel)'),
    p('Single-elimination bracket. Heads-up matches throughout. Match length scales with bracket depth: 9-hole matches while the field is larger than 16 players, 18-hole matches once the field is 16 or fewer, and a 72-hole heads-up final between the last two players standing. The 72-hole final is played as four 18-hole rounds, and its honey divisor is 72 (not 18); the 9- and 18-hole earlier rounds use divisors 9 and 18 respectively. Champion = last player standing. Each match has elimination pressure; one cooler ends your event.'),
    h3('Aggregate Stroke Play (PGA Masters feel)'),
    p('Every player in the field plays 4 rounds × 18 holes = 72 total holes. Each round you are paired with a fresh opponent (rotating-partner stroke play). Per-hole zero-sum honey credits accumulate within each pairing; at the end of 72 holes, total net honey across all four rounds is divided by 72 (the round length, not 18) and subtracted from your total scorecard. The player with the lowest net total wins. Optional cuts at the 36-hole and 54-hole marks trim the field. Lower per-event variance, stronger long-run skill signal than bracket play.'),
    h3('The Main Event'),
    p('Single championship per season. The default Main field is ' + fmtNum(cfg.mainField || 128) + ' players (Players-Championship-style invitational rather than mass-WSOP). Field composition is 70% via the satellite ladder and 30% direct entry (champion exemptions plus top season-points players); see Section 8 for the ladder mechanics. In bracket-knockout format, the Main runs as a standard bracket ending in a 72-hole heads-up final. In aggregate format, the Main runs as 72-hole aggregate stroke play across the entire field. Either way, the Main always settles on 72 holes.'),
    h3('Playoffs'),
    p('Sudden-death only when needed. If two or more players are tied for first after the event\'s scheduled holes, a short 2–4 hole aggregate playoff resolves the tie. No mandatory 1v1 final is forced when the natural result is unambiguous.')
  );
  view.appendChild(fmt);

  // ---- Strategy ----
  const strat = section('3 · Strategy for the Elite',
    h3('Pot-control wins seasons'),
    p('The hand-strength distribution puts most showdowns at One Pair or worse — the modal showdown posts a slight bogey. Net scorecard improvement comes almost entirely from winning honey pots, not from holding strong hands. Build pots when you have an equity edge; concede them cheaply when you do not. The honey divisor (72 for full-event scoring) means you need many small pots — or a few large ones — to move the round score by a single stroke.'),
    h3('The fold rule rewards ALL fold pressure equally'),
    p('Every fold returns the same outcome to the bettor: 0 (par) on the scorecard plus the previously agreed pot in honey. There is NO street-based bonus — a Putt-street fold is no more valuable than a Tea Box fold in scorecard terms. What changes by street is the SIZE of the previously agreed pot: pots grow as betting progresses, so late-street folds tend to deliver more honey simply because the agreed total has had more rounds to climb.'),
    h3('Folds do NOT reveal cards — strategic implications'),
    p('When a player folds, the non-folder ALWAYS scores 0 par regardless of the actual hand they were holding. Cards are never revealed on a fold. This is a deliberate design choice — it preserves the "concession" semantic of golf match play, where a conceded hole is scored par without playing it out. But it has two strategic implications most poker players miss:'),
    ul([
      'PREMIUM HANDS DO NOT EXTRACT MAXIMUM VALUE FROM FOLDS. If you hold a hand that would have posted -3 (full house, J+ trips) but your bet folds the opponent out, you score 0 par — you leave 3 strokes of golf value on the table. With strong hands, prefer bet sizes that get CALLED, not sizes that get folded. Build the pot, reach showdown, and realize the full -3 then. Forcing a fold with a premium hand is small-win territory: par + previously-agreed honey, no more.',
      'WEAK HANDS HAVE ASYMMETRIC DOWNSIDE PROTECTION. Folding a weak high card costs you +1 bogey. Reaching showdown with the same hand and losing also costs you +1 (Yellow Jacket) or up to +2 (Bumblebee, your own weak hand value). Folding can be the cheaper escape route — especially in Yellow Jacket, where the showdown loss already caps at +1. Skilled weak-hand play looks like: fold to large bets when the previously-agreed pot is small, call to large bets when the previously-agreed pot is already large (the saving from folding shrinks as the agreed total grows).',
      'IMPLICATION FOR AGGRESSION. Classic-poker intuition says "premium hand → bet big → opponent folds → you win the pot." In Yellow Jacket, that pattern caps your reward at the previously-agreed honey + 0 par. The richer reward path is "premium hand → bet to a level the opponent CALLS → showdown → realize -3 to -5 plus the agreed honey." Skilled players bet for value (extraction), not for fold equity (denial).',
    ]),
    h3('Per-event stroke caps and progressive street caps'),
    p('Each event sets a maximum agreed pot size for the hole — the stroke cap. Default per-event caps: Regular ' + (cfg.regularStrokeCap != null ? cfg.regularStrokeCap : 6) + ' honey, Major ' + (cfg.majorStrokeCap != null ? cfg.majorStrokeCap : 10) + ' honey, Main early rounds ' + (cfg.mainStrokeCap != null ? cfg.mainStrokeCap : 6) + ' honey, Main 72-hole finals ' + (cfg.mainFinalsStrokeCap != null ? cfg.mainFinalsStrokeCap : 10) + ' honey. Within each hole, the cap unlocks progressively by street: Tea Box 25%, Drive 50%, Hazard 75%, Putt 100%. So in a Major (cap 10), a Tea Box bet cannot propose more than 3 honey total; by the Putt the full 10 is available. This forces escalation to feel like real no-limit poker rather than a single-cap free-for-all.'),
    h3('Tied-hole carry arithmetic'),
    p('When a hole ties at showdown, the entire pot rolls into the NEXT hole as starting honey. The next hole opens at (2 mandatory + carry) instead of just 2. Multiple consecutive ties stack: tie-of-tie produces a starting pot equal to the prior tied pot. Whoever wins the next decisive hole sweeps the entire stack at once. If you suspect a tied river is coming, a small bet that builds a small pot may be worth more than a large bet that you fold to — because the small carry survives into the next hole, while a fold loses the agreed total outright.'),
    h3('Major qualifier path'),
    p('Top finishers in each major earn a free Main Event seat (the satellite mechanic). Current defaults: top ' + (cfg.mainQualifiersPerMajor != null ? cfg.mainQualifiersPerMajor : 512) + ' qualifiers per major × ' + (cfg.majors || 4) + ' majors = up to ' + ((cfg.majors || 4) * (cfg.mainQualifiersPerMajor != null ? cfg.mainQualifiersPerMajor : 512)) + ' free seats per Main. Each seat is worth ' + fmtMoney(cfg.buyInMain || 10000) + ' (the direct buy-in price). Deep major performance compounds — a single major run can pay for a Main seat.'),
    h3('Long-run skill signal'),

// Themed AI opponent names by skill tier — gives each match a personality.
const SOLO_AI_NAMES = {
  beginner: ['Pollen', 'Larva', 'Bumble Jr', 'Honey Cub', 'Drone Recruit'],
  casual:   ['Worker Bee', 'Honey Picker', 'Wasp Cadet', 'Hive Scout', 'Nectar Drifter'],
  pro:      ['Forager', 'Stinger', 'Hive Tactician', 'Comb Master', 'Apex Drone'],
  elite:    ['Queen Bee', 'Hive Champion', 'The Swarm', 'Royal Stinger', 'Nectar King'],
};
function pickAINameForTier(tier) {
  const list = SOLO_AI_NAMES[tier] || SOLO_AI_NAMES.casual;
  return list[Math.floor(Math.random() * list.length)];
}

function startSolo(playerName, skill, tier, holes, cap) {
  const aiName = pickAINameForTier(tier);
  const aiProfile = makeProfileForSkill(Math.max(0.05, Math.min(0.95, +skill || 0.40)));
  // Sync the global stroke cap and loser-bogey toggle so AI's decideFor and
  // resolveMPHole's showdown path read the same scoring rules the user just
  // configured in the simulator panel.
  setStrokeCap(cap);
  setLoserBogey(!!(LabState && LabState.config && LabState.config.loserBogey));
  setDecisionDivisor(LabState && LabState.config && LabState.config.decisionDivisor);
  setHoneyMagnitude(LabState && LabState.config && LabState.config.honeyMagnitude);
  setPotElasticK(LabState && LabState.config && LabState.config.potElasticK);
  const g = createLocalGame(playerName, aiName, 'solo');
  g.totalHoles = Math.max(1, Math.min(144, +holes || 18));
  g.strokeCap = cap;
  g.aiSkill = skill;
  g.aiTier = tier;
  g.aiProfile = aiProfile;
  // Human is p1; AI is p2. turnFor stays 'p1' so the action UI is always shown
  // for the human's perspective (no pass-the-device prompt).
  g.turnFor = 'p1';
  TourState.activeGame = g;
  renderActiveMP();
  toast('Solo match started · ' + holes + ' holes vs ' + aiName + ' (skill ' + (+skill).toFixed(2) + ')');
  // If the deal landed with AI to act first (heads-up dealer convention puts the
  // non-dealer on the action), kick off their turn after the render settles.
  scheduleAITurnIfNeeded(g);
}

// In solo mode, after every state change check whether it's the AI's turn and,
// if so, queue their decision asynchronously. The brief delay (350ms) gives the
// human time to read the action that just happened — the AI doesn't feel robotic.
function scheduleAITurnIfNeeded(g) {
  if (!g || g.mode !== 'solo' || g.ended) return;
  const c = g.current;
  if (!c || c.result || c.toAct == null) return;
  if (c.toAct !== 'p2') return; // p2 is always the AI in solo mode
  setTimeout(() => aiTakeTurn(g), 350);
}

function aiTakeTurn(g) {
  if (!g || g.mode !== 'solo' || g.ended) return;
  const c = g.current;
  if (!c || c.result || c.toAct !== 'p2') return;
  // Re-sync the global stroke cap and loser-bogey toggle in case the user
  // opened the simulator and changed cfg mid-match — the AI must respect
  // the rules this match was CREATED with, not whatever the simulator
  // panel currently shows. g.strokeCap and g.loserBogey were snapshotted
  // at createLocalGame time.
  if (g.strokeCap) setStrokeCap(g.strokeCap);
  setLoserBogey(!!g.loserBogey);
  if (Number.isFinite(g.decisionDivisor)) setDecisionDivisor(g.decisionDivisor);
  if (Number.isFinite(g.honeyMagnitude)) setHoneyMagnitude(g.honeyMagnitude);
  if (Number.isFinite(g.potElasticK)) setPotElasticK(g.potElasticK);
  const profile = g.aiProfile || makeProfileForSkill(0.40);
  // v23 decideFor signature:
  //   (cards, community, currentProposal, agreedTotal, isPending,
  //    profile, preComputedHand, preComputedTex, gameContext)
  // Action protocol:
  //   isPending=false → { check | bet }   (bet.amount = NEW agreed total)
  //   isPending=true  → { fold | call | raise }   (raise.amount = NEW agreed total)
  const isPending = c.currentProposal != null;
  const currentProposal = isPending ? c.currentProposal : c.agreedTotal;
  const gameContext = { mode: 'solo', holeNumber: g.holeNum, totalHoles: g.totalHoles };
  const decision = decideFor(
    c.p2Cards,        // AI hole cards
    c.community,      // visible community
    currentProposal,  // pending proposal level (or current agreed total when none pending)
    c.agreedTotal,    // already-accepted pot level
    isPending,        // whether AI is responding to a live proposal
    profile,
    undefined,        // preComputedHand cache (unused in solo mode)
    undefined,        // preComputedTex cache (unused in solo mode)
    gameContext
  );
  switch (decision.action) {
    case 'fold':  mpAct(g, 'fold'); break;
    case 'check': mpAct(g, 'check'); break;
    case 'call':  mpAct(g, 'call'); break;
    case 'bet':
    case 'raise': {
      // amount from decideFor IS the new agreed total. Clamp into the legal
      // open-bet / raise range so a stale or buggy proposal can't wedge the UI.
      const cap = mpStreetCap(g, c.street);
      const floor = isPending ? c.currentProposal : c.agreedTotal;
      const newTotal = Math.max(floor + 1, Math.min(cap, decision.amount | 0));
      if (newTotal > floor && newTotal <= cap) mpAct(g, isPending ? 'raise' : 'bet', newTotal);
      else if (isPending) mpAct(g, 'call');     // can't propose anything legal → call
      else                mpAct(g, 'check');    // can't propose, no pending → check
      break;
    }
    default: mpAct(g, isPending ? 'call' : 'check'); break;
  }
}

function createLocalGame(p1name, p2name, mode) {
  // Per-game running totals split into golf (scorecard) and honey (raw credit).
  // Final displayed score = golfTotal − (honeyTotal / divisor), where divisor is
  // honeyDivisorFor(g.totalHoles). This matches the simulator's playMatch and
  // the rulebook: net honey is divided by round length once at the end, not
  // per-hole. p1.total / p2.total are computed-derived for display convenience.
  return {
    mode,
    p1: { name: p1name, golfTotal: 0, honeyTotal: 0, total: 0 },
    p2: { name: p2name, golfTotal: 0, honeyTotal: 0, total: 0 },
    holeNum: 1, totalHoles: 18, scores: [],
    current: newHoleState('p1', 0),
    turnFor: 'p1',
    carryPot: 0,
    started: Date.now(), ended: false,
    // Snapshot active scoring/cap toggles so mid-game config changes don't
    // alter this match. strokeCap controls progressive street caps;
    // loserBogey controls decisive-showdown loser scoring (own-hand vs +1).
    strokeCap: CurrentStrokeCap,
    loserBogey: CurrentLoserBogey,
    decisionDivisor: CurrentDecisionDivisor,
    honeyMagnitude: CurrentHoneyMagnitude,
    potElasticK: CurrentPotElasticK,
  };
}

function newHoleState(dealer, carryPot) {
  // YJ agreed-total semantics — replaces the classic-poker matched/currentBet model:
  //   agreedTotal     = the pot level both players have ALREADY accepted. Opens at
  //                     2 (mandatory pot) plus any tied-hole carry.
  //   currentProposal = a pending proposal to RAISE the agreed total. null when
  //                     no proposal is on the table (both players have either
  //                     checked or accepted the current agreedTotal).
  //   pendingFor      = which side must respond to currentProposal (null when
  //                     no proposal is pending).
  // The non-dealer acts first preflop (heads-up convention).
  const deck = shuffle(makeDeck());
  const opener = (carryPot || 0) + 2;
  return {
    deck, street: 'preflop',
    agreedTotal: opener,
    currentProposal: null,
    pendingFor: null,
    hasActed: { p1: false, p2: false },
    toAct: dealer === 'p1' ? 'p2' : 'p1',
    dealer, folded: null, result: null,
    p1Cards: [deck.pop(), deck.pop()],
    p2Cards: [deck.pop(), deck.pop()],
    community: [],
  };
}

// Compute the maximum agreed-total a player may propose this street, applying
// the progressive 25/50/75/100% street unlock to the per-event stroke cap. For
// caps ≤ 3, the full cap is available from preflop (no headroom to split).
function mpStreetCap(g, street) {
  const totalCap = g.strokeCap || CurrentStrokeCap || 3;
  return streetCapFor(street, totalCap);
}

// Display total = golfTotal − honeyTotal / divisor. The divisor matches the
// simulator's playMatch / the rulebook: 72 for 72-hole rounds, 18 for 18-hole,
// 9 for 9-hole, 1 for 1-hole quick matches.
function mpRecomputeTotals(g) {
  const div = honeyDivisorFor(g.totalHoles) || 1;
  g.p1.total = g.p1.golfTotal - g.p1.honeyTotal / div;
  g.p2.total = g.p2.golfTotal - g.p2.honeyTotal / div;
}

function renderActiveMP() {
  // Two possible mount points now (the views are split into Single Player and
  // Multiplayer pages). Pick the mount that matches the active game's mode so
  // a solo match renders on the Single Player page and a hot-seat / share-link
  // match renders on the Multiplayer page. Whichever mount isn't relevant gets
  // cleared so a stale game doesn't leak across pages.
  const g = TourState.activeGame;
  const soloRoot = $('#activeMpSolo');
  const hqRoot = $('#activeMpHQ');
  const targetIsSolo = g && g.mode === 'solo';
  const root = targetIsSolo ? soloRoot : hqRoot;

  if (otherRoot) clear(otherRoot);
  if (!root) return;
  clear(root);

  const wrap = el('div', { class: 'game-wrap' });
  const header = el('div', { class: 'card', style: 'background: var(--cream-soft);' });
  const headerInner = el('div', { style: 'display: flex; justify-content: space-between; align-items: center;' });
  headerInner.appendChild(el('div', null,
    el('h2', { text: g.mode === 'hotseat' ? 'Hot-Seat Match' : g.mode === 'solo' ? 'Solo Match · vs ' + g.p2.name : 'Share-Link Match' }),
    el('div', { class: 'ui-sans', style: 'font-size: 12px; color: var(--fairway);', text: g.p1.name + ' (' + formatScore(g.p1.total) + ')  vs  ' + g.p2.name + ' (' + formatScore(g.p2.total) + ')  ·  Hole ' + g.holeNum + '/' + g.totalHoles })
  ));
  headerInner.appendChild(el('button', { class: 'btn ghost small', onclick: () => { if (confirm('End game?')) { TourState.activeGame = null; renderActiveMP(); } } }, 'End game'));
  header.appendChild(headerInner);
  wrap.appendChild(header);

  if (g.ended) {
    const winner = g.p1.total < g.p2.total ? g.p1 : g.p2.total < g.p1.total ? g.p2 : null;
    wrap.appendChild(el('div', { class: 'card', style: 'margin-top: 14px; text-align: center;' },
      el('h2', { text: winner ? winner.name + ' wins!' : 'Tie' }),
      el('p', { class: 'ui-sans' }, g.p1.name + ' ' + formatScore(g.p1.total) + ' · ' + g.p2.name + ' ' + formatScore(g.p2.total))
    ));
    root.appendChild(wrap);
    return;
  }

  wrap.appendChild(renderGameTable(g));

  if (g.mode === 'sharelink') {
    const linkCard = el('div', { class: 'card', style: 'margin-top: 14px;' });
    linkCard.appendChild(el('h3', { text: 'Share-Link for Opponent' }));
    const ta = el('textarea', { class: 'share-input', rows: 3, readonly: 'readonly' });
    ta.value = g.shareLink || encodeGameToURL(g);
    linkCard.appendChild(ta);
    linkCard.appendChild(el('div', { style: 'margin-top: 8px; display: flex; gap: 8px;' },
      el('button', { class: 'btn outline small', onclick: () => { ta.select(); document.execCommand('copy'); toast('Copied!'); } }, 'Copy Link'),
      el('button', { class: 'btn outline small', onclick: () => {
        const v = prompt('Paste opponent share-link here:');
        if (v) {
          const ng = decodeGameFromURL(v);
          if (ng) { TourState.activeGame = ng; renderActiveMP(); toast('Game state loaded.'); }
          else toast('Invalid or tampered link');
        }
      } }, 'Load Opponent Link')
    ));
    wrap.appendChild(linkCard);
  }

  root.appendChild(wrap);
  maybeEmitBuzzTip(g);
}

function maybeEmitBuzzTip(g) {
  if (!g || g.ended) return;
  const c = g.current; if (!c || c.result) return;
  // In hot-seat, only show tip after "Ready" has been pressed (turnFor === toAct)
  if (g.mode === 'hotseat' && g.turnFor !== c.toAct) return;
  // Only emit once per street
  if (c.lastTipStreet === c.street) return;
  c.lastTipStreet = c.street;
  const actor = c.toAct;
  const hand = actor === 'p1' ? c.p1Cards : c.p2Cards;
  const board = c.community || [];
  const strength = estimateStrength(hand, board);
  let tip = null;
  const street = c.street;
  if (street === 'preflop') {
    if (strength > 0.65) tip = 'Premium starting hand. Sweeten the pot off the Tea Box.';
    else if (strength < 0.35) tip = 'Weak starting cards. Check or fold to any raise.';
    else tip = 'Middling Tea Box read. See a cheap Drive if you can.';
  } else if (street === 'flop') {
    if (strength > 0.72) tip = 'Strong connection to this board. Pour honey in the pot.';
    else if (strength < 0.35) tip = "This Drive didn't help. Pot-control or fold.";
    else tip = 'Marginal Drive. Keep the pot manageable.';
  } else if (street === 'turn') {
    if (strength > 0.75) tip = 'You likely lead. Charge the draws — make them pay.';
    else if (strength < 0.4) tip = "The Hazard didn't improve you. Consider giving up — or sting them.";
    else tip = 'Check-decide territory. Avoid bloating the pot.';
  } else if (street === 'river') {
    if (strength > 0.80) tip = 'Putt for value — size for a call you can beat.';
    else if (strength < 0.4) tip = 'Sting or check — weigh whether the bluff sells.';
    else tip = 'Showdown-value hand. Keep it small.';
  }
  if (tip) {
    $$('.buzz-live-tip').forEach(t => t.remove());
    const tips = el('div', { class: 'buzz-live-tip' });
    const av = buzzAvatarSVG(30);
    tips.appendChild(av);
    tips.appendChild(el('span', { class: 'tip-mark', text: '💭' }));
    const actorName = actor === 'p1' ? g.p1.name : g.p2.name;
    tips.appendChild(el('span', { text: 'Coach to ' + actorName + ': ' + tip }));
    const gameTable = $('.game-table');
    if (gameTable && gameTable.parentNode) gameTable.parentNode.insertBefore(tips, gameTable.nextSibling);
  }
}

    'Regulars (default field ' + fmtNum(cfg.regularField || 2048) + '): 65% prior-season merit + 20% career ranking + 15% open qualifier. Majors (default field ' + fmtNum(cfg.majorField || 1024) + '): ' + (((cfg.majorChampShare != null ? cfg.majorChampShare : 0.14) * 100).toFixed(0)) + '% champion exemptions + ' + (((cfg.majorRankingShare != null ? cfg.majorRankingShare : 0.24) * 100).toFixed(0)) + '% career ranking + ' + (((cfg.majorSeasonShare != null ? cfg.majorSeasonShare : 0.26) * 100).toFixed(0)) + '% prior-season + ' + (((cfg.majorCareerShare != null ? cfg.majorCareerShare : 0.14) * 100).toFixed(0)) + '% career performance + ' + (((cfg.majorOpenShare != null ? cfg.majorOpenShare : 0.22) * 100).toFixed(0)) + '% open qualifier. Main Event (default field ' + fmtNum(cfg.mainField || 128) + '): ' + ((1 - (cfg.mainDirectEntryShare != null ? cfg.mainDirectEntryShare : 0.30)) * 100).toFixed(0) + '% via the satellite ladder (qualifiers + active cashers in priority order), ' + ((cfg.mainDirectEntryShare != null ? cfg.mainDirectEntryShare : 0.30) * 100).toFixed(0) + '% direct entry (champion exemptions first, then top season-points players). Past major champions enter all subsequent majors free within ' + (cfg.exemptionYears != null ? cfg.exemptionYears : 3) + ' years of their most recent major win; the exemption window renews on each new major win.'
  ));
  core.appendChild(rule('Satellites — majors as qualifiers for the Main',
    'Every major doubles as a Main Event satellite. The top ' + fmtNum(cfg.mainQualifiersPerMajor != null ? cfg.mainQualifiersPerMajor : 512) + ' finishers in each major earn a free seat in this year\'s Main Event (no Main buy-in required). With ' + (cfg.majors != null ? cfg.majors : 12) + ' majors per season, that\'s up to ' + fmtNum((cfg.majors != null ? cfg.majors : 12) * (cfg.mainQualifiersPerMajor != null ? cfg.mainQualifiersPerMajor : 512)) + ' qualifier seats per Main — though only ' + ((1 - (cfg.mainDirectEntryShare != null ? cfg.mainDirectEntryShare : 0.30)) * 100).toFixed(0) + '% of the Main field (' + fmtNum(Math.round((cfg.mainField || 128) * (1 - (cfg.mainDirectEntryShare != null ? cfg.mainDirectEntryShare : 0.30)))) + ' of ' + fmtNum(cfg.mainField || 128) + ' seats) is allocated to satellite winners, so when qualifiers exceed available seats they are seated by major-finish priority. Each satellite-won seat is worth ' + fmtMoney(cfg.buyInMain || 10000) + ' in saved buy-in.'
  ));
  // === Event Pricing & Qualification subsection ===
  // Documents the full satellite-ladder economy plus the 70/30 Main field split.
  // Wording is locked per design spec — describes ladder mechanics, progressive
  // requirement, and how the system makes multi-accounting unprofitable for an
  // online deployment context (offline sim retains the model documentation).

  ));
  core.appendChild(rule('Yellow Jacket Inc. economics',
    'grossPool = Σ direct buy-ins. revenue = grossPool × rakePercent (default ' + (((cfg.rakePercent != null ? cfg.rakePercent : 0.03) * 100).toFixed(1)) + '%) — this is the Tour\'s take. prizePool = grossPool − revenue + sponsorPurse. Sponsor purses (when configured per event) ride on top of player money — modeled after PGA Tour broadcast/sponsor money — and are NOT raked. Payouts go to the top 15% of the field (with a floor of 2 paid places and a cap of 64), decaying geometrically across positions with default decay factor ' + (cfg.payoutDecay != null ? cfg.payoutDecay : 0.74) + ' (each successive ITM position pays the prior position × the decay factor). Satellite winners do not contribute to the gross pool of the higher-tier event — their seats are already paid for by the lower-tier satellite\'s player pool.'

  // 3) Rules FAQ list (pulled from BuzzKnowledge)

    faqs.forEach(f => {
      const item = el('div', { class: 'faq-item' });
      const q = el('div', { class: 'faq-q', onclick: () => item.classList.toggle('open') });
      q.appendChild(el('span', { text: f.q }));

    ' · For the live simulator and its config sliders, visit ',

  view.appendChild(links);
};

function renderGameTable(g) {
  const tbl = el('div', { class: 'game-table' });
  const c = g.current;
  // Solo mode: AI's hole cards (p2) hidden until showdown — same fog-of-war as a
  // real opponent. Hotseat: cards visible only to whoever has the device. Sharelink:
  // both visible (each player only sees their own URL state, this is the merged view).
  const showP2 = g.mode === 'hotseat' ? g.turnFor === 'p2'
              : g.mode === 'solo'    ? false
              : true;
  const showP1 = g.mode === 'hotseat' ? g.turnFor === 'p1'
              : true; // human (solo) and sharelink both see p1
  const resolvedOrShowdown = c.result || c.street === 'showdown';

  const p2Seat = el('div', { class: 'seat' });
  p2Seat.appendChild(el('span', { class: 'seat-name' + (c.toAct === 'p2' && !c.result ? ' active' : '') }, g.p2.name + ' · ' + formatScore(g.p2.total)));
  const p2Cards = el('div', { class: 'cards-row' });
  if (showP2 || resolvedOrShowdown) c.p2Cards.forEach(card => p2Cards.appendChild(cardFaceDom(card)));
  else p2Cards.appendChild(el('div', { class: 'hidden-cards' }, 'Hidden — ' + g.p2.name + ' cards'));
  p2Seat.appendChild(p2Cards);
  tbl.appendChild(p2Seat);

  const commRow = el('div', { class: 'cards-row', style: 'margin: 14px 0;' });
  for (let i=0; i<5; i++) {
    if (i < c.community.length) commRow.appendChild(cardFaceDom(c.community[i]));
    else commRow.appendChild(el('div', { class: 'card-face placeholder' }));
  }
  tbl.appendChild(commRow);

  // Pot HUD — shows the YJ agreed-total state plainly:
  //   Pot: the level both players have already accepted.
  //   Proposed: the level a pending bet/raise is asking the other player to
  //             accept (only shown when there's a live proposal).
  //   Cap: the per-street stroke cap currently in effect (after progressive unlock).
  const streetCap = mpStreetCap(g, c.street);
  const potWrap = el('div', { style: 'text-align: center;' });
  const potRow = el('div', { class: 'pot-info' },
    el('span', null, 'Phase: ', el('b', { text: streetLabel(c.street) })),
    el('span', null, 'Pot: ', el('b', { text: c.agreedTotal + ' honey' }))
  );
  if (c.currentProposal != null) {
    potRow.appendChild(el('span', null, 'Proposed: ', el('b', { text: c.currentProposal + ' honey' })));
  }
  potRow.appendChild(el('span', null, 'Cap: ', el('b', { text: streetCap + ' honey' })));
  potWrap.appendChild(potRow);
  tbl.appendChild(potWrap);

  const p1Seat = el('div', { class: 'seat' });
  p1Seat.appendChild(el('span', { class: 'seat-name' + (c.toAct === 'p1' && !c.result ? ' active' : '') }, g.p1.name + ' · ' + formatScore(g.p1.total)));
  const p1Cards = el('div', { class: 'cards-row' });
  if (showP1 || resolvedOrShowdown) c.p1Cards.forEach(card => p1Cards.appendChild(cardFaceDom(card)));
  else p1Cards.appendChild(el('div', { class: 'hidden-cards' }, 'Hidden — ' + g.p1.name + ' cards'));
  p1Seat.appendChild(p1Cards);
  tbl.appendChild(p1Seat);

  const actions = el('div', { class: 'actions-row' });
  if (c.result) {
    actions.appendChild(el('div', { class: 'result-banner' }, c.result.desc));
    if (!g.ended) actions.appendChild(el('button', { class: 'btn gold', onclick: () => mpNextHole(g) }, 'Next Hole →'));
  } else if (g.mode === 'solo' && c.toAct !== 'p1') {
    // AI is thinking — show a passive banner instead of action buttons. The
    // scheduleAITurnIfNeeded timer will fire and apply the AI's move shortly.
    actions.appendChild(el('div', { class: 'result-banner' }, '🐝 ', el('b', { text: g.p2.name }), ' is sizing up the pot…'));
  } else if (g.mode === 'hotseat' && g.turnFor !== c.toAct && g.turnFor != null) {
    actions.appendChild(el('div', { class: 'result-banner' }, 'Pass the device to ', el('b', { text: (c.toAct === 'p1' ? g.p1.name : g.p2.name) })));
    actions.appendChild(el('button', { class: 'btn outline small', onclick: () => { g.turnFor = c.toAct; renderActiveMP(); } }, 'Ready'));
  } else {
    // YJ action UI: bet/raise buttons offer NEW agreed-total options (not increments).
    //   - When no proposal is pending: Check or open-bet to a new total > agreedTotal.
    //   - When a proposal is pending: Call (accept it), Raise to a higher total, or Fold.
    // Bet/raise option set is bounded by (floor + 1 .. streetCap), with the floor
    // = currentProposal when pending, else agreedTotal. We render up to ~5 evenly-
    // spaced options so the button row stays readable even at large stroke caps.
    const pending = c.currentProposal != null;
    const floor = pending ? c.currentProposal : c.agreedTotal;
    const cap = mpStreetCap(g, c.street);
    if (!pending) {
      actions.appendChild(el('button', { class: 'btn', onclick: () => mpAct(g, 'check') }, 'Check'));
    } else {
      actions.appendChild(el('button', { class: 'btn', onclick: () => mpAct(g, 'call') }, 'Call to ' + c.currentProposal));
    }
    const room = Math.max(0, cap - floor);
    if (room > 0) {
      // Suggest up to 5 new-total options spread between (floor + 1) and cap.
      const options = [];
      const stops = Math.min(5, room);
      for (let i = 1; i <= stops; i++) {
        const t = stops === 1 ? cap : Math.round(floor + (room * i) / stops);
        const clamped = Math.max(floor + 1, Math.min(cap, t));
        if (!options.includes(clamped)) options.push(clamped);
      }
      const verb = pending ? 'Raise to ' : 'Bet to ';
      const action = pending ? 'raise' : 'bet';
      options.forEach(newTotal => {
        actions.appendChild(el('button', { class: 'btn outline', onclick: () => mpAct(g, action, newTotal) }, verb + newTotal));
      });
    }
    if (pending) {
      actions.appendChild(el('button', { class: 'btn fold', onclick: () => mpAct(g, 'fold') }, 'Fold'));
    }
  }
  tbl.appendChild(actions);
  return tbl;
}

function cardFaceDom(card) {
  const isRed = card.suit === 'H' || card.suit === 'D';
  return el('div', { class: 'card-face' + (isRed ? ' red' : '') },
    el('div', { class: 'rank', text: rankName(card.rank) }),
    el('div', { class: 'suit', text: SUIT_GLYPH[card.suit] })
  );
}

// Yellow Jacket street jargon — every phase of the hole gets a golf-themed name.
//   preflop  → Tea Box  (hole cards + blinds, the player addresses the ball)
//   flop     → Drive    (first three community cards — the big opening swing)
//   turn     → Hazard   (fourth card — the trouble street)
//   river    → Putt     (fifth and final card — closing stroke)
//   showdown → The Cup  (cards revealed; the ball is in the cup, hole complete)
// Internal enum values stay as 'preflop'/'flop'/'turn'/'river'/'showdown' so all
// existing game logic, betting rounds, and equity tables keep working. Only the
// display label is themed.
function streetLabel(s) { return { preflop: 'Tea Box', flop: 'Drive', turn: 'Hazard', river: 'Putt', showdown: 'The Cup' }[s] || s; }

function mpAct(g, action, amount) {
  const c = g.current;
  if (c.result || c.toAct == null) return;
  const actor = c.toAct;
  const other = actor === 'p1' ? 'p2' : 'p1';
  const pending = c.currentProposal != null;
  if (action === 'fold') {
    // Fold is only a legal response to a pending proposal. (Folding without a
    // proposal would be silly — there's nothing to escape from. Guard so misclicks
    // mid-uncontested-street don't end the hole.)
    if (!pending) return;
    c.folded = actor;
    resolveMPHole(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return;
  }
  if (action === 'check') {
    // Check is only legal when no proposal is pending. Both players must check
    // to close the street; the dealer's check after the non-dealer's check ends
    // the round at the current agreedTotal.
    if (pending) return;
    c.hasActed[actor] = true;
    if (c.hasActed[other]) {
      advanceMPRound(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return;
    }
    c.toAct = other;
  } else if (action === 'call') {
    // Call accepts the pending proposal — agreedTotal jumps to currentProposal,
    // proposal clears, and the street ends (heads-up: a call always closes
    // the round once the prior actor has committed to a proposal).
    if (!pending) return;
    c.agreedTotal = c.currentProposal;
    c.currentProposal = null;
    c.pendingFor = null;
    c.hasActed[actor] = true;
    advanceMPRound(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return;
  } else if (action === 'bet' || action === 'raise') {
    // Bet (no pending) or raise (pending): propose a NEW agreed total.
    //   - amount IS the proposed new agreed total (NOT an additive increment).
    //   - Must strictly exceed the current floor: agreedTotal for a bet,
    //     currentProposal for a raise.
    //   - Capped by the per-street stroke cap (progressive 25/50/75/100%).
    const cap = mpStreetCap(g, c.street);
    const floor = pending ? c.currentProposal : c.agreedTotal;
    const proposed = +amount | 0;
    if (proposed <= floor || proposed > cap) return;
    if (action === 'bet' && pending) return;       // can't open-bet with a pending proposal
    if (action === 'raise' && !pending) return;    // can't raise without a proposal to raise
    c.currentProposal = proposed;
    c.pendingFor = other;
    c.hasActed[actor] = true;
    c.hasActed[other] = false;
    c.toAct = other;
  } else {
    return;
  }
  if (g.mode === 'hotseat' && c.toAct) g.turnFor = null;
  renderActiveMP();
  // Any action that transfers the turn within the same betting round (an opening
  // check, an open bet, or a raise) lands here. Hook the AI scheduler so the
  // bot picks up its turn in solo mode — otherwise Hive Scout sits idle.
  scheduleAITurnIfNeeded(g);
}

function advanceMPRound(g) {
  // YJ has no per-street stroke accumulation. The agreed total carries from
  // street to street unchanged unless a new proposal is made and accepted on
  // the next street. We just deal the next community card(s) and reset the
  // hasActed flags so both players get a fresh action window on the new street.
  const c = g.current;
  c.currentProposal = null;
  c.pendingFor = null;
  c.hasActed = { p1: false, p2: false };
  if (c.street === 'preflop') { c.community.push(c.deck.pop(), c.deck.pop(), c.deck.pop()); c.street = 'flop'; }
  else if (c.street === 'flop') { c.community.push(c.deck.pop()); c.street = 'turn'; }
  else if (c.street === 'turn') { c.community.push(c.deck.pop()); c.street = 'river'; }
  else if (c.street === 'river') { c.street = 'showdown'; resolveMPHole(g); return; }
  // If the agreed total has already reached the per-event stroke cap, no more
  // proposals are possible — fast-forward to showdown with the remaining board.
  const totalCap = g.strokeCap || CurrentStrokeCap;
  if (c.agreedTotal >= totalCap) {
    while (c.community.length < 5) c.community.push(c.deck.pop());
    c.street = 'showdown';
    resolveMPHole(g); return;
  }
  c.toAct = c.dealer === 'p1' ? 'p2' : 'p1';
  if (g.mode === 'hotseat') g.turnFor = null;
}

function resolveMPHole(g) {
  const c = g.current;
  // The agreed total at the time of resolution IS the entire pot — it already
  // includes the mandatory 2 honey opener and any tied-hole carry that fed in
  // when the hole was created. carryPot tracking remains on g.carryPot purely
  // so we can roll a NEW carry forward if THIS hole ties.
  let p1Golf = 0, p2Golf = 0, p1Honey = 0, p2Honey = 0, desc = '';
  if (c.folded) {
    // v46 fold rule (matches simulator playHole): flat +1 base, no escalation.
    // The v43 escalation rarely fired empirically and added complexity
    // without behavioral change; reverting to a clean uniform rule.
    const folderSide = c.folded;
    const bettorSide = folderSide === 'p1' ? 'p2' : 'p1';
    const previouslyAgreed = c.agreedTotal;
    if (folderSide === 'p1') { p1Golf = 1; p2Golf = 0; p2Honey = previouslyAgreed; }
    else                     { p2Golf = 1; p1Golf = 0; p1Honey = previouslyAgreed; }
    const folderName = folderSide === 'p1' ? g.p1.name : g.p2.name;
    const bettorName = bettorSide === 'p1' ? g.p1.name : g.p2.name;
    desc = folderName + ' folded. ' + bettorName + ' takes the ' + previouslyAgreed + '-honey pot (the previously agreed total). ' + folderName + ' +1 bogey, ' + bettorName + ' 0 par.';
    g.carryPot = 0;
  } else {
    while (c.community.length < 5) c.community.push(c.deck.pop());
    const p1H = evaluate7(c.p1Cards, c.community);
    const p2H = evaluate7(c.p2Cards, c.community);
    const cmp = p1H - p2H;
    if (cmp === 0) {
      // Tied showdown: both 0 par, ENTIRE agreed total rolls forward as the
      // starting honey for the next hole (compounding across consecutive ties).
      p1Golf = 0; p2Golf = 0;
      g.carryPot = c.agreedTotal;
      desc = 'Tie at ' + CATEGORY_NAMES[p1H >>> 24] + '. Both score 0 par. The ' + c.agreedTotal + '-honey pot rolls forward to the next hole.';
    } else {
      // Decisive showdown. Two scoring modes — see playHole comments and the
      // cfg.loserBogey flag for full rationale:
      //   g.loserBogey === false ("Honored Loss"): each player scores own
      //          hand. Loser with strong hand still posts a respectable golf
      //          value (e.g. flush -1).
      //   g.loserBogey === true  ("Bogey Loss"): winner scores own hand,
      //          loser posts a fixed +1 bogey regardless of hand strength.
      // The flag is snapshotted onto g at game creation time so mid-config
      // changes don't perturb an in-progress match.
      const p1Wins = cmp > 0;
      const winnerHand = p1Wins ? p1H : p2H;
      const winnerGolf = golfScoreFromHandValue(winnerHand);
      const loserHand  = p1Wins ? p2H : p1H;
      const loserGolf  = g.loserBogey ? 1 : golfScoreFromHandValue(loserHand);
      const winName  = p1Wins ? g.p1.name : g.p2.name;
      const loseName = p1Wins ? g.p2.name : g.p1.name;
      const pot = c.agreedTotal;
      if (p1Wins) { p1Golf = winnerGolf; p1Honey = pot; p2Golf = loserGolf; }
      else        { p2Golf = winnerGolf; p2Honey = pot; p1Golf = loserGolf; }
      const loserDescGolf = g.loserBogey
        ? '+1 bogey (Bogey Loss rule)'
        : formatScore(loserGolf) + ' golf';
      desc = winName + ' wins with ' + CATEGORY_NAMES[winnerHand >>> 24]
           + ' and takes the ' + pot + '-honey pot. '
           + winName + ' ' + formatScore(winnerGolf) + ' golf · '
           + loseName + ' ' + loserDescGolf
           + ' (' + loseName + ' had ' + CATEGORY_NAMES[loserHand >>> 24] + ').';
      g.carryPot = 0;
    }
  }
  // Accumulate raw per-hole golf and honey separately. The match's displayed
  // score = golfTotal − honeyTotal / divisor, where divisor matches the round
  // length (honeyDivisorFor(g.totalHoles)). Per-hole scores logged into
  // g.scores capture both layers so the score history can be replayed faithfully.
  g.p1.golfTotal  += p1Golf;
  g.p1.honeyTotal += p1Honey;
  g.p2.golfTotal  += p2Golf;
  g.p2.honeyTotal += p2Honey;
  mpRecomputeTotals(g);
  g.scores.push({ p1Golf, p2Golf, p1Honey, p2Honey });
  c.result = { desc };
  if (g.mode === 'hotseat') g.turnFor = 'p1';
}

function mpNextHole(g) {
  if (g.holeNum >= g.totalHoles) {
    // End-of-match: tie-breaker is the displayed total (golfTotal − honeyTotal/divisor),
    // which is already computed onto g.p1.total / g.p2.total via mpRecomputeTotals.
    if (Math.abs(g.p1.total - g.p2.total) < 1e-9) {
      // Sudden-death extension: add one more hole and re-enter the loop. The
      // carry from the just-tied final hole (if any) flows through naturally.
      toast('Tied — sudden-death hole');
      g.totalHoles++;
    } else {
      g.ended = true; renderActiveMP(); return;
    }
  }
  g.holeNum++;
  const dealer = g.current.dealer === 'p1' ? 'p2' : 'p1';
  // Pass the accumulated carry into the new hole's opening pot so tied-hole
  // honey rolls forward correctly. newHoleState seeds agreedTotal = 2 + carry.
  g.current = newHoleState(dealer, g.carryPot || 0);
  // The carry has been consumed by the new hole's opener; clear it so it
  // doesn't double-add on the next resolve.
  g.carryPot = 0;
  g.turnFor = g.mode === 'hotseat' ? null : 'p1';
  if (g.mode === 'sharelink') g.shareLink = encodeGameToURL(g);
  renderActiveMP();
  // If the new hole's first action falls on the AI (because dealer alternated
  // and they're now the non-dealer / first to act preflop), kick their turn.
  scheduleAITurnIfNeeded(g);
}

function simpleHash(s) {
  let h = 2166136261 >>> 0;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

function encodeGameToURL(g) {
  // Schema v2: YJ agreed-total state. Replaces the v1 classic-poker fields
  // (strokes / currentBet / matched) with agreedTotal / currentProposal /
  // pendingFor. Schema version is stamped so old links are rejected by
  // decodeGameFromURL rather than silently mis-restored.
  const data = {
    schemaVersion: 2,
    p1: g.p1, p2: g.p2, holeNum: g.holeNum, totalHoles: g.totalHoles,
    scores: g.scores, carryPot: g.carryPot || 0,
    strokeCap: g.strokeCap, loserBogey: !!g.loserBogey,
    current: {
      deck: g.current.deck, street: g.current.street,
      agreedTotal: g.current.agreedTotal,
      currentProposal: g.current.currentProposal,
      pendingFor: g.current.pendingFor,
      hasActed: g.current.hasActed,
      toAct: g.current.toAct, dealer: g.current.dealer, folded: g.current.folded,
      result: g.current.result, p1Cards: g.current.p1Cards, p2Cards: g.current.p2Cards, community: g.current.community
    },
    started: g.started, ended: g.ended, mode: 'sharelink',
  };
  const payload = JSON.stringify(data);
  const checksum = simpleHash(payload);
  const encoded = btoa(unescape(encodeURIComponent(payload)));
  return location.origin + location.pathname + '#play/' + checksum + '/' + encoded;
}

function decodeGameFromURL(url) {
  try {
    const h = url.split('#')[1];
    if (!h || !h.startsWith('play/')) return null;
    const parts = h.split('/');
    if (parts.length < 3) return null;
    const checksum = parts[1];
    const encoded = parts.slice(2).join('/');
    const payload = decodeURIComponent(escape(atob(encoded)));
    if (simpleHash(payload) !== checksum) return null;
    const data = JSON.parse(payload);
    // Reject pre-v23 sharelinks rather than mis-restoring them — the field set
    // is incompatible with the YJ agreed-total engine. A friendlier path could
    // try to upgrade in place, but the safe default is to ask the players to
    // restart so the active game state is unambiguous.
    if (!data || data.schemaVersion !== 2) return null;
    return data;
  } catch (e) { return null; }
}

function playerById(id) { return TourState.pool ? TourState.pool.find(p => p.id === id) : null; }

function skillTier(p) {
  if (!TourState.pool) return { key: 'regular', label: 'Regular' };
  const sorted = TourState.pool.slice().sort((a,b) => b.skill - a.skill);
  const rank = sorted.findIndex(x => x.id === p.id);
  const pct = rank / sorted.length;
  if (pct < 0.10) return { key: 'elite', label: 'Elite' };
  if (pct < 0.25) return { key: 'contender', label: 'Contender' };
  if (pct < 0.60) return { key: 'regular', label: 'Regular' };
  return { key: 'fringe', label: 'Fringe' };
}

function avatarSVG(playerId, size) {
  size = size || 64;
  const seed = playerId * 2654435761 >>> 0;
  const hue = (seed % 360);
  // Lift body saturation/lightness in Sunday mode so the avatar pops on the dark card bg.
  const isDark = document.documentElement.getAttribute('data-theme') === 'sunday';
  const body = isDark ? 'hsl(' + hue + ',65%,74%)' : 'hsl(' + hue + ',62%,68%)';
  const shade = isDark ? 'hsl(' + hue + ',55%,56%)' : 'hsl(' + hue + ',52%,45%)';
  // Features stay dark always — body fill is warm/pastel regardless of theme, so dark features contrast.
  const features = '#1B1B1B';
  const highlight = '#FFF';
  const stripeCount = 2 + (seed % 3);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', '0 0 80 80'); svg.setAttribute('width', size); svg.setAttribute('height', size);
  function e(n, attrs) { const x = document.createElementNS('http://www.w3.org/2000/svg', n); for (const k in attrs) x.setAttribute(k, attrs[k]); return x; }
  svg.appendChild(e('circle', { cx: 40, cy: 40, r: 38, fill: body, stroke: shade, 'stroke-width': 2 }));
  for (let i = 0; i < stripeCount; i++) {
    const y = 26 + i * 12;
    svg.appendChild(e('path', { d: 'M 12 ' + y + ' Q 40 ' + (y+6) + ' 68 ' + y, stroke: features, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', opacity: 0.72 }));
  }
  const cheekX = (seed % 2) ? 56 : 52;
  svg.appendChild(e('circle', { cx: 26, cy: 36, r: 4, fill: features }));
  svg.appendChild(e('circle', { cx: cheekX, cy: 36, r: 4, fill: features }));
  svg.appendChild(e('circle', { cx: 25, cy: 34, r: 1.3, fill: highlight }));
  svg.appendChild(e('circle', { cx: cheekX - 1, cy: 34, r: 1.3, fill: highlight }));
  const smile = (seed >> 3) % 3;
  if (smile === 0) svg.appendChild(e('path', { d: 'M 30 50 Q 40 56 50 50', stroke: features, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }));
  else if (smile === 1) svg.appendChild(e('path', { d: 'M 32 50 L 48 50', stroke: features, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }));
  else svg.appendChild(e('path', { d: 'M 30 48 Q 40 54 50 48 Q 50 52 40 56 Q 30 52 30 48 Z', fill: features }));

  svg.appendChild(e('circle', { cx: 58, cy: 44, r: 2.5, fill: '#FCE4EC', opacity: 0.8 }));
  return svg;
}

// Skill-profile → 6-axis radar values (0..1). Each axis is derived from an orthogonal
// slice of the profile so they don't mathematically mirror each other.
//   aggression  — how often the player raises (inverse of raise threshold)
//   patience    — how willing they are to fold marginal hands (fold threshold)
//   reads       — how calibrated their hand-strength estimate is (inverse of noise)
//   pressure    — how often they bet (inverse of bet threshold)
//   consistency — how narrow their decision band is (fold↔bet gap) — orthogonal to reads
//   stamina     — overall skill index (post-noise composite)
function playerRadar(p) {
  const pr = p.profile;
  const clamp = x => Math.min(1, Math.max(0, x));
  const noise = pr.noise != null ? pr.noise : 0.5;
  const foldT = pr.foldThreshold != null ? pr.foldThreshold : 0.3;
  const betT = pr.betThreshold != null ? pr.betThreshold : 0.55;
  const raiseT = pr.raiseThreshold != null ? pr.raiseThreshold : 0.75;
  const aggression = clamp(1 - raiseT);
  const patience = clamp(foldT / 0.6);                // fold thresholds are typically 0.1-0.5
  const reads = clamp(1 - noise * 2);                  // noise 0.0 → 1.0 reads, noise 0.5 → 0
  const pressure = clamp(1 - betT);
  const consistency = clamp(1 - Math.abs(betT - foldT) * 1.2); // tight decision window = steady
  const stamina = clamp(p.skill);
  return {
    aggression, patience, reads, pressure, consistency, stamina,
    axes: ['Aggression','Patience','Reads','Pressure','Consistency','Stamina']
  };
}

function computeLegendaryMoments() {
  const moments = [];
  const events = getAllEvents();
  // Below -15 finals
  for (const e of events) {
    if (e.champScore <= -15) {
      moments.push({
        year: e.year, type: 'historic-score', playerId: e.champId, score: e.champScore,
        title: 'Historic Round',
        narr: playerName(e.champId) + ' carved up the ' + e.name + ' at ' + formatScore(e.champScore) + ' — one of the lowest championship totals ever recorded.',
        stats: 'Year ' + e.year + ' · ' + e.name + ' · margin ' + (e.ruScore - e.champScore)
      });
    }
  }
  // Playoffs
  for (const e of events) {
    if (e.playoffs > 0) {
      moments.push({
        year: e.year, type: 'playoff', playerId: e.champId, score: e.playoffs,
        title: 'Sudden-Death Classic',
        narr: playerName(e.champId) + ' outlasted ' + playerName(e.ruId) + ' in a ' + e.playoffs + '-hole sudden-death playoff at the ' + e.name + '.',
        stats: 'Year ' + e.year + ' · ' + e.name + ' · ' + formatScore(e.champScore) + '-' + formatScore(e.ruScore)
      });
    }
  }
  // Back-to-back majors (same player, consecutive years, same major name or any major)
  const majorsByPlayer = {};
  for (const e of events) {
    if (e.type !== 'major') continue;
    if (!majorsByPlayer[e.champId]) majorsByPlayer[e.champId] = [];
    majorsByPlayer[e.champId].push(e);
  }
  for (const pid in majorsByPlayer) {
    const wins = majorsByPlayer[pid].slice().sort((a,b) => a.year - b.year);
    for (let i = 1; i < wins.length; i++) {
      if (wins[i].year === wins[i-1].year + 1) {
        moments.push({
          year: wins[i].year, type: 'back-to-back', playerId: +pid, score: wins[i].champScore,
          title: 'Back-to-Back',
          narr: playerName(+pid) + ' defended glory, winning a major in year ' + wins[i-1].year + ' and again in year ' + wins[i].year + '.',
          stats: wins[i-1].name + ' → ' + wins[i].name
        });
        break;
      }
    }
  }
  // Slam (all 4 unique major names in career)
  for (const pid in majorsByPlayer) {
    const names = new Set(majorsByPlayer[pid].map(e => e.name));
    if (names.size >= 4) {
      const last = majorsByPlayer[pid].slice().sort((a,b) => b.year - a.year)[0];
      moments.push({
        year: last.year, type: 'slam', playerId: +pid, score: majorsByPlayer[pid].length,
        title: 'Career Grand Slam',
        narr: playerName(+pid) + ' completed the career Grand Slam — victories at all four majors.',
        stats: majorsByPlayer[pid].length + ' total majors'
      });
    }
  }
  return moments.sort((a,b) => b.year - a.year || (b.score < a.score ? 1 : -1));
}

function computeH2H(aId, bId) {
  if (aId === bId) return null;
  const events = getAllEvents();
  let aWin = 0, bWin = 0, meetings = [];
  for (const e of events) {
    if ((e.champId === aId && e.ruId === bId) || (e.champId === bId && e.ruId === aId)) {
      if (e.champId === aId) aWin++; else bWin++;
      meetings.push(e);
    }
  }
  return { aWin, bWin, meetings };
}

function computeRecords() {
  const pool = TourState.pool || [];
  const events = getAllEvents();
  function topBy(arr, fn) { let best = null; for (const x of arr) if (fn(x) > 0 && (!best || fn(x) > fn(best))) best = x; return best; }
  const mostMajors = topBy(pool, p => p.majorWins);
  const mostMains = topBy(pool, p => p.mainWins);
  const mostRegulars = topBy(pool, p => p.regularWins);
  const mostWins = topBy(pool, p => p.totalWins);
  const mostRunnerUps = topBy(pool, p => p.runnerUps);
  let biggestBlowout = null, lowestScore = null;
  for (const e of events) {
    if (!biggestBlowout || marginOf(e) > marginOf(biggestBlowout)) biggestBlowout = e;
    if (!lowestScore || e.champScore < lowestScore.champScore) lowestScore = e;
  }
  // Longest win streak (consecutive years with at least one major)
  let longestStreak = { player: null, years: 0 };
  for (const p of pool) {
    const years = new Set();
    for (const s of TourState.seasons) for (const e of s.events) {
      if (e.type === 'major' && e.champId === p.id) years.add(s.year);
    }
    const ys = Array.from(years).sort((a,b) => a - b);
    let best = 0, cur = 0, last = null;
    for (const y of ys) { if (last == null || y === last + 1) cur++; else cur = 1; last = y; if (cur > best) best = cur; }
    if (best > longestStreak.years) longestStreak = { player: p, years: best };
  }
  return { mostMajors, mostMains, mostRegulars, mostWins, mostRunnerUps, biggestBlowout, lowestScore, longestStreak };
}

function computeAnalyticsSnapshot() {
  const events = getAllEvents();
  const pool = TourState.pool || [];
  const champScores = events.map(e => e.champScore);
  const scatter = pool.map(p => ({ skill: p.skill, majors: p.majorWins, total: p.totalWins }));
  // Single-pass indexing. Previously this function re-filtered `events` for every
  // (year, major) pair to count prior majors — O(Y × M × E) in a 100y × 400-major
  // run = ~16M comparisons. Now it's O(E), roughly 400.
  const majorsByYear = new Map();
  const priorMajorsByChamp = new Map();
  const yearSet = new Set();
  for (const e of events) {
    yearSet.add(e.year);
    if (e.type !== 'major') continue;
    let yrMajors = majorsByYear.get(e.year);
    if (!yrMajors) { yrMajors = []; majorsByYear.set(e.year, yrMajors); }
    yrMajors.push(e);
  }
  const years = Array.from(yearSet).sort((a, b) => a - b);
  const repeatByYear = years.map(y => {
    const yrMajors = majorsByYear.get(y) || [];
    let first = 0, repeat = 0;
    for (const e of yrMajors) {
      const seenCount = priorMajorsByChamp.get(e.champId) || 0;
      if (seenCount === 0) first++; else repeat++;
      priorMajorsByChamp.set(e.champId, seenCount + 1);
    }
    return { year: y, first, repeat };
  });
  const topTen = pool.slice().sort((a,b) => composite(b) - composite(a)).slice(0, 10);
  const bottomTen = pool.slice().sort((a,b) => composite(a) - composite(b)).slice(0, 10);
  function avgRadar(group) {
    if (group.length === 0) return { aggression:0,patience:0,reads:0,pressure:0,consistency:0,stamina:0 };
    const acc = { aggression:0,patience:0,reads:0,pressure:0,consistency:0,stamina:0 };
    for (const p of group) { const r = playerRadar(p); for (const k in acc) acc[k] += r[k]; }
    for (const k in acc) acc[k] /= group.length;
    return acc;
  }
  const radarTop = avgRadar(topTen);
  const radarBottom = avgRadar(bottomTen);
  // Wins by skill tier
  const sorted = pool.slice().sort((a,b) => b.skill - a.skill);
  const tier10 = Math.floor(sorted.length * 0.10);
  const tier25 = Math.floor(sorted.length * 0.25);
  const tier50 = Math.floor(sorted.length * 0.50);
  function tierStats(start, end) {
    const g = sorted.slice(start, end);
    return {
      majors: g.reduce((a,b) => a + b.majorWins, 0),
      regulars: g.reduce((a,b) => a + b.regularWins, 0),
      mains: g.reduce((a,b) => a + b.mainWins, 0),
    };
  }
  const tiers = [
    { label: 'Top 10%', ...tierStats(0, tier10) },
    { label: '10-25%', ...tierStats(tier10, tier25) },
    { label: '25-50%', ...tierStats(tier25, tier50) },
    { label: 'Bottom 50%', ...tierStats(tier50, sorted.length) },
  ];
  const finalsByType = { major: [], regular: [], main: [] };
  for (const e of events) finalsByType[e.type].push(e.champScore);
  return { champScores, scatter, repeatByYear, radarTop, radarBottom, tiers, finalsByType, eventCount: events.length, poolSize: pool.length };
}

function renderEventsTable() {
  const wrap = $('#evTableWrap'); if (!wrap) return;
  clear(wrap);
  const all = getAllEvents();
  const f = EventsState.filters;
  let rows = all.filter(e => {
    if (f.type !== 'all' && e.type !== f.type) return false;
    if (f.year !== 'all' && String(e.year) !== String(f.year)) return false;
    if (f.margin && marginOf(e) < f.margin) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!e.name.toLowerCase().includes(q) && !playerName(e.champId).toLowerCase().includes(q) && !playerName(e.ruId).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const s = EventsState.sort;
  rows.sort((a,b) => {
    let va, vb;
    if (s.col === 'year') { va = a.year * 20 + a.season_slot; vb = b.year * 20 + b.season_slot; }
    else if (s.col === 'type') { va = a.type; vb = b.type; }
    else if (s.col === 'event') { va = a.name; vb = b.name; }
    else if (s.col === 'field') { va = a.fieldSize; vb = b.fieldSize; }
    else if (s.col === 'champ') { va = a.champScore; vb = b.champScore; }
    else if (s.col === 'margin') { va = marginOf(a); vb = marginOf(b); }
    else if (s.col === 'ru') { va = a.ruScore; vb = b.ruScore; }
    else { va = a.year; vb = b.year; }
    if (va < vb) return s.dir === 'asc' ? -1 : 1;
    if (va > vb) return s.dir === 'asc' ? 1 : -1;
    return 0;
  });

  $('#evResultCount').textContent = rows.length + ' event' + (rows.length === 1 ? '' : 's');

  const table = el('table');
  const thead = el('thead');
  const trh = el('tr');
  const cols = [
    ['year', 'Year', false],
    ['type', 'Type', false],
    ['event', 'Event', false],
    ['field', 'Field', true],
    ['champ', 'Champion', true],
    ['ru', 'Runner-up', true],
    ['margin', 'Margin', true],
  ];
  cols.forEach(([key, label, isNum]) => {
    const th = el('th', { class: 'sortable' + (isNum ? ' num' : '') + (s.col === key ? ' sorted' + (s.dir === 'asc' ? ' asc' : '') : ''), text: label });
    th.onclick = () => {
      if (s.col === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.col = key; s.dir = 'desc'; }
      renderEventsTable();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el('tbody');
  const MAX_SHOW = 500;
  const shown = rows.slice(0, MAX_SHOW);
  for (const e of shown) {
    const tr = el('tr', { style: 'cursor: pointer;' });
    tr.onclick = () => openEventModal(e);
    tr.appendChild(el('td', { text: String(e.year) }));
    const chip = el('span', { class: 'chip' + (e.type === 'major' ? ' gold' : e.type === 'main' ? ' azalea' : ''), text: e.type.toUpperCase() });
    tr.appendChild(el('td', null, chip));
    tr.appendChild(el('td', { text: e.name }));
    tr.appendChild(el('td', { class: 'num', text: String(e.fieldSize) }));
    const champTd = el('td');
    const champ = playerById(e.champId);
    champTd.appendChild(el('b', null, el('span', { text: champ ? champ.name : '#' + e.champId })));
    champTd.appendChild(el('span', { class: 'mono', style: 'color: var(--green); margin-left: 8px;', text: formatScore(e.champScore) }));
    tr.appendChild(champTd);
    const ruTd = el('td');
    const ru = playerById(e.ruId);
    ruTd.appendChild(el('span', { text: ru ? ru.name : '#' + e.ruId }));
    ruTd.appendChild(el('span', { class: 'mono', style: 'color: var(--fairway); margin-left: 8px;', text: formatScore(e.ruScore) }));
    tr.appendChild(ruTd);
    tr.appendChild(el('td', { class: 'num gold', text: '+' + marginOf(e) }));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  if (rows.length > MAX_SHOW) wrap.appendChild(el('p', { class: 'ui-sans', style: 'text-align: center; color: var(--fairway); font-size: 11px; margin-top: 8px;', text: 'Showing first ' + MAX_SHOW + ' of ' + rows.length + ' · narrow filter for more' }));
}

function openEventModal(e) {
  openModal(body => {
    body.appendChild(el('div', { class: 'crumb', text: 'Year ' + e.year + ' · ' + e.type.toUpperCase() }));
    body.appendChild(el('h2', { text: e.name }));
    const champ = playerById(e.champId);
    const ru = playerById(e.ruId);
    body.appendChild(el('div', { class: 'stat-grid', style: 'margin: 12px 0;' },
      statCard('Field', e.fieldSize, 'players'),
      statCard('Champion', champ ? champ.name : '#' + e.champId, formatScore(e.champScore), 'gold'),
      statCard('Runner-up', ru ? ru.name : '#' + e.ruId, formatScore(e.ruScore)),
      statCard('Margin', '+' + marginOf(e), 'strokes')
    ));

    // Finals scorecard (animated reveal)
    body.appendChild(el('h3', { style: 'margin-top: 18px;', text: 'Finals Scorecard (72 holes condensed to 18-hole rounds)' }));
    const days = e.finalsDays || [];
    const sc = el('table', { class: 'scorecard' });
    const shead = el('thead');
    const htr = el('tr');
    htr.appendChild(el('th', { text: 'Round' }));
    days.forEach((_, i) => htr.appendChild(el('th', { text: 'R' + (i+1) })));
    htr.appendChild(el('th', { text: 'Total' }));
    shead.appendChild(htr); sc.appendChild(shead);
    const stb = el('tbody');
    const players = [[champ ? champ.name : '#' + e.champId, 0], [ru ? ru.name : '#' + e.ruId, 1]];
    players.forEach(([nm, idx], pidx) => {
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'label', text: nm }));
      let total = 0;
      days.forEach((d, i) => {
        const v = d[idx];
        total += v;
        const td = el('td', { class: 'reveal ' + (v < 0 ? 'neg' : v > 0 ? 'pos' : ''), text: formatScore(v) });
        td.style.animationDelay = (pidx * 80 + i * 120) + 'ms';
        tr.appendChild(td);
      });
      tr.appendChild(el('td', { class: 'total ' + (total < 0 ? 'neg' : total > 0 ? 'pos' : ''), text: formatScore(total) }));
      stb.appendChild(tr);
    });
    sc.appendChild(stb);
    body.appendChild(sc);

    if (e.playoffs > 0) body.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--azalea-mid); margin-top: 10px; font-style: italic; font-size: 12px;', text: '+ ' + e.playoffs + ' sudden-death playoff hole' + (e.playoffs > 1 ? 's' : '') }));

    body.appendChild(el('div', { class: 'bracket-note', text: 'Single-elimination bracket: ' + e.fieldSize + ' → 16 (9-hole rounds) → 2 (18-hole rounds) → 72-hole final. Intermediate rounds are not individually stored; finals data is definitive.' }));

    body.appendChild(el('div', { style: 'margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap;' },
      el('button', { class: 'btn outline small', onclick: () => { closeModal(); if (champ) openProfile(champ.id); }, text: 'View Champion →' }),
      el('button', { class: 'btn outline small', onclick: () => { closeModal(); if (ru) openProfile(ru.id); }, text: 'View Runner-up →' }),
      el('button', { class: 'btn ghost small', style: 'margin-left: auto;', onclick: closeModal, text: 'Close' })
    ));
  }, { large: true });
}

function renderPlayerGrid() {
  const scroller = $('#plScroller'); const inner = $('#plInner');
  if (!scroller || !inner) return;
  const pool = TourState.pool || [];
  const f = PlayersState;
  let rows = pool.filter(p => {
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !String(p.id).includes(q)) return false;
    }
    if (f.tier !== 'all') {
      const t = skillTier(p);
      if (t.key !== f.tier) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    if (f.sort === 'skill') return b.skill - a.skill;
    if (f.sort === 'composite') return composite(b) - composite(a);
    if (f.sort === 'majors') return b.majorWins - a.majorWins;
    if (f.sort === 'total') return b.totalWins - a.totalWins;
    return a.id - b.id;
  });

  const count = $('#plResultCount');
  if (count) count.textContent = rows.length + ' player' + (rows.length === 1 ? '' : 's');

  // Simple virtualization: only render visible + buffer
  const CARD_W = 200, CARD_H = 170, GAP = 12;
  const cols = Math.max(1, Math.floor((scroller.clientWidth - 8) / (CARD_W + GAP)));
  const rowCount = Math.ceil(rows.length / cols);
  const totalH = rowCount * (CARD_H + GAP);
  inner.style.height = totalH + 'px';
  clear(inner);

  function renderVisible() {
    const scrollTop = scroller.scrollTop;
    const start = Math.max(0, Math.floor(scrollTop / (CARD_H + GAP)) - 1);
    const end = Math.min(rowCount, Math.ceil((scrollTop + scroller.clientHeight) / (CARD_H + GAP)) + 1);
    clear(inner);
    for (let r = start; r < end; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        if (idx >= rows.length) break;
        const p = rows[idx];
        const top = r * (CARD_H + GAP);
        const left = c * (CARD_W + GAP);
        const card = el('div', { class: 'player-card' + (skillTier(p).key === 'elite' ? ' top-tier' : ''), style: 'position: absolute; top: ' + top + 'px; left: ' + left + 'px; width: ' + CARD_W + 'px; height: ' + CARD_H + 'px;' });
        card.onclick = () => openProfile(p.id);
        card.appendChild(avatarSVG(p.id, 64));
        card.appendChild(el('div', { class: 'p-name', text: p.name }));
        const tier = skillTier(p);
        card.appendChild(el('span', { class: 'chip tier-' + tier.key, text: tier.label }));
        card.appendChild(el('div', { class: 'p-record', style: 'margin-top: 6px;' },
          el('span', { class: 'pr-gold', text: p.majorWins + 'M' }), ' · ',
          el('span', { text: p.regularWins + 'R' }), ' · ',
          el('span', { text: p.mainWins + 'E' }), ' · ',
          el('span', { style: 'color: var(--green); font-weight: 600;', text: p.totalWins + 'W' })
        ));
        inner.appendChild(card);
      }
    }
  }
  renderVisible();
  scroller.onscroll = renderVisible;
}

function openProfile(id) {
  PlayersState.profileId = id;
  location.hash = '#players?profileId=' + id;
}

function renderPlayerProfile(id, view) {

    el('div', { class: 'value gold', style: 'font-family: Georgia, serif; font-size: 42px; color: var(--gold);', text: '#' + rank })
  ));
  view.appendChild(head);

  view.appendChild(el('div', { class: 'stat-grid' },

  // Badges

  const badgeCard = el('div', { class: 'card', style: 'margin-bottom: 16px;' });
  badgeCard.appendChild(el('h3', { text: 'Achievements · ' + badges.length + ' / ' + BADGES.length }));
  if (badges.length === 0) badgeCard.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--fairway); font-size: 12px;', text: 'No badges yet — every journey begins somewhere.' }));
  else {
    const bd = el('div', { class: 'badges' });
    for (const b of badges) bd.appendChild(el('span', { class: 'badge ' + (b.tier || '') },
      el('span', { class: 'b-icon', text: b.icon }),
      el('span', { text: b.label })
    ));
    badgeCard.appendChild(bd);
  }
  view.appendChild(badgeCard);

  const g2 = el('div', { class: 'grid-2' });

  // Radar
  const radarCard = el('div', { class: 'card' });
  radarCard.appendChild(el('h3', { text: 'Player Profile · 6-axis radar' }));
  const radarBox = el('div', { class: 'radar-box' });
  const radarCanvas = el('canvas', { width: '280', height: '280' });
  radarBox.appendChild(radarCanvas);
  radarCard.appendChild(radarBox);
  g2.appendChild(radarCard);

  // Career timeline
  const timelineCard = el('div', { class: 'card' });
  timelineCard.appendChild(el('h3', { text: 'Career timeline · wins per year' }));
  const tlCanvas = el('canvas', { width: '520', height: '240' });
  timelineCard.appendChild(tlCanvas);
  g2.appendChild(timelineCard);

  view.appendChild(g2);

  // H2H lookup
  const h2hCard = el('div', { class: 'card', style: 'margin-top: 16px;' });
  h2hCard.appendChild(el('h3', { text: 'Head-to-head lookup' }));
  const h2hRow = el('div', { style: 'display: flex; gap: 10px; flex-wrap: wrap; align-items: center;' });
  const oppInput = el('input', { type: 'search', placeholder: 'Opponent name or #', style: 'flex: 1; min-width: 180px;' });
  const h2hResult = el('div', { style: 'font-family: monospace; font-size: 12px; margin-top: 10px;' });
  oppInput.oninput = () => {
    const q = oppInput.value.trim().toLowerCase(); if (!q) { clear(h2hResult); return; }
    const match = TourState.pool.find(pp => pp.id !== p.id && (pp.name.toLowerCase().includes(q) || String(pp.id).includes(q)));
    clear(h2hResult);
    if (!match) { h2hResult.appendChild(el('span', { style: 'color: var(--fairway);', text: 'No match' })); return; }
    const h = computeH2H(p.id, match.id);
    h2hResult.appendChild(el('b', { text: p.name + ' ' + h.aWin + '–' + h.bWin + ' ' + match.name }));
    if (h.meetings.length > 0) {

    }
  };
  h2hRow.appendChild(oppInput);
  h2hCard.appendChild(h2hRow);
  h2hCard.appendChild(h2hResult);
  view.appendChild(h2hCard);

  // Draw charts after DOM attached
  setTimeout(() => {
    drawRadar(radarCanvas, [{ label: p.name, values: playerRadar(p) }]);
    drawCareerTimeline(tlCanvas, p);
  }, 10);
}

Views.hof = function() {

  ));

    view.appendChild(el('div', { class: 'card' },
      el('p', { class: 'ui-sans', style: 'color: var(--fairway);', text: 'The Hall is waiting for its first class. Run a season to begin populating records.' })
    ));
    return;
  }

  const r = computeRecords();
  const recCard = el('div', { class: 'card accent' });
  recCard.appendChild(el('h2', { text: 'All-Time Records' }));
  function recordRow(label, player, value) {
    const row = el('div', { class: 'record-row' });
    row.appendChild(el('div', { class: 'r-label', text: label }));
    if (player) {
      const holder = el('a', { href: '#', style: 'text-decoration: none;', class: 'r-holder' });
      holder.onclick = (e) => { e.preventDefault(); openProfile(player.id); };
      holder.textContent = player.name;
      row.appendChild(holder);
    } else row.appendChild(el('div', { text: '-' }));
    row.appendChild(el('div', { class: 'r-value', text: value }));
    return row;
  }
  if (r.mostMajors) recCard.appendChild(recordRow('Most Majors', r.mostMajors, r.mostMajors.majorWins));
  if (r.mostMains) recCard.appendChild(recordRow('Most Main Events', r.mostMains, r.mostMains.mainWins));
  if (r.mostRegulars) recCard.appendChild(recordRow('Most Regulars', r.mostRegulars, r.mostRegulars.regularWins));
  if (r.mostWins) recCard.appendChild(recordRow('Most Total Wins', r.mostWins, r.mostWins.totalWins));
  if (r.mostRunnerUps) recCard.appendChild(recordRow('Most Runner-ups', r.mostRunnerUps, r.mostRunnerUps.runnerUps));
  if (r.longestStreak.player) recCard.appendChild(recordRow('Longest Major Streak', r.longestStreak.player, r.longestStreak.years + ' yr'));
  if (r.biggestBlowout) {
    const bp = playerById(r.biggestBlowout.champId);
    recCard.appendChild(recordRow('Biggest Blowout', bp, '+' + marginOf(r.biggestBlowout) + ' strokes'));
  }
  if (r.lowestScore) {
    const bp = playerById(r.lowestScore.champId);
    recCard.appendChild(recordRow('Lowest Finals Score', bp, formatScore(r.lowestScore.champScore)));
  }
