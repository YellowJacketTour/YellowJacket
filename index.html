// --- Unified Simulator view: replaces Season Runner + Sim Lab ---
const SimulatorState = { mode: 'simple' };

Views.simulator = function() {
  const view = $('[data-view="simulator"]'); clear(view);
  const parsed = parseHashRoute();
  SimulatorState.mode = parsed.params.mode === 'advanced' ? 'advanced' : 'simple';

  view.appendChild(el('div', { class: 'crumb' }, el('a', { href: '#dashboard', text: 'Tour Home' }), ' · Simulator'));
  view.appendChild(el('div', { class: 'page-header' },
    el('div', null,
      el('h1', { text: 'Simulator' }),
      el('div', { class: 'sub', text: 'Configure · simulate · measure · document' })
    )
  ));

  const tabs = el('div', { class: 'mode-tabs' });
  const tSimple = el('button', { text: 'Simple · Tour' });
  const tAdv = el('button', { text: 'Advanced · Research' });
  if (SimulatorState.mode === 'advanced') tAdv.className = 'active'; else tSimple.className = 'active';
  tSimple.onclick = () => { location.hash = '#simulator?mode=simple'; };
  tAdv.onclick = () => { location.hash = '#simulator?mode=advanced'; };
  tabs.appendChild(tSimple); tabs.appendChild(tAdv);
  view.appendChild(tabs);

  const layout = el('div', { class: 'simulator-layout' });
  layout.style.setProperty('--sim-panel-w', Math.max(320, Math.min(720, LabState.panelWidth || 320)) + 'px');
  const cfgPanel = el('div', { class: 'card lab-config' });
  const splitter = el('div', { class: 'simulator-splitter', title: 'Drag to resize config panel' });
  const results = el('div', { id: 'labResults' });
  // Always append the layout structure first, even if an inner render throws on stale
  // localStorage data. Prevents "completely blank page" failures.
  layout.appendChild(cfgPanel);
  layout.appendChild(splitter);
  layout.appendChild(results);
  view.appendChild(layout);

  splitter.onmousedown = (e) => {
    if (window.innerWidth <= 1100) return;
    e.preventDefault();
    splitter.classList.add('dragging');
    const rect = layout.getBoundingClientRect();
    const onMove = (ev) => {
      const next = Math.max(320, Math.min(720, ev.clientX - rect.left));
      LabState.panelWidth = next;
      layout.style.setProperty('--sim-panel-w', next + 'px');
    };
    const onUp = () => {
      splitter.classList.remove('dragging');
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
      saveLabState();
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  try { renderConfigPanel(cfgPanel, SimulatorState.mode); }
  catch (e) {
    console.error('renderConfigPanel failed:', e);
    cfgPanel.appendChild(el('div', { class: 'rebuild-warn', text: 'Config panel error: ' + e.message }));
  }
  try { renderLabResults(results); }
  catch (e) {
    console.error('renderLabResults failed:', e);
    results.appendChild(el('div', { class: 'card' },
      el('h2', { text: 'Render error' }),
      el('p', { class: 'ui-sans', style: 'color: var(--text-secondary); font-size: 13px;', text: e.message + ' — saved run history may be from an older build. Try resetting the run registry below.' }),
      el('button', { class: 'btn outline small', style: 'margin-top: 10px;', onclick: () => {
        if (confirm('Clear all saved Lab runs? (Career data is preserved.)')) {
          LabState.runs = []; LabState.activeRunId = null;
          saveLabState(); Views.simulator();
        }
      }, text: 'Clear run registry' })
    ));
  }
};

function renderConfigPanel(panel, mode) {
  mode = mode || 'simple';
  clear(panel);
  panel.appendChild(el('h2', { text: 'Configuration' }));
  panel.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); margin-bottom: 12px; letter-spacing: 0.3px;',
    text: mode === 'simple' ? 'Simple · runs append to your Tour.' : 'Advanced · every slider exposed. Profile changes need a pool rebuild.' }));

  function appendSliderControl(parent, opts) {
    const key = opts.key;
    const min = +opts.min, max = +opts.max, step = +opts.step;
    const row = el('div', { class: 'slider-row' });
    row.appendChild(el('label', { text: opts.label }));
    const range = el('input', { type: 'range', min: String(min), max: String(max), step: String(step), value: String(LabState.config[key]) });
    const val = el('input', { type: 'number', class: 'slider-val', min: String(min), max: String(max), step: String(step), value: String(LabState.config[key]) });
    const sync = (raw) => {
      let v = Number(raw);
      if (!Number.isFinite(v)) return;
      if (step > 0) v = Math.round(v / step) * step;
      v = Math.max(min, Math.min(max, v));
      if (Math.abs(step - Math.round(step)) > 1e-9) v = +v.toFixed(4);
      LabState.config[key] = v;
      range.value = String(v);
      val.value = String(v);
      saveLabState();
      if (opts.onChange) opts.onChange(v);
    };
    range.oninput = () => sync(range.value);
    val.onchange = () => sync(val.value);
    row.appendChild(range);
    row.appendChild(val);
    parent.appendChild(row);
  }

  // Log-scale slider for very wide-range monetary inputs ($0 – $100B per event).
  // The range slider position is internal (0..1000) and maps logarithmically to value.
  // The number input still accepts direct typed amounts for precision.
  function appendLogMoneySlider(parent, opts) {
    const key = opts.key;
    const maxVal = +opts.max; // e.g. 1e11
    const STEPS = 1000;
    const row = el('div', { class: 'slider-row' });
    row.appendChild(el('label', { text: opts.label }));
    const init = +LabState.config[key] || 0;
    const valueToPos = (v) => {
      if (v <= 0) return 0;
      if (v >= maxVal) return STEPS;
      return Math.round(1 + (Math.log10(Math.max(1, v)) / Math.log10(maxVal)) * (STEPS - 1));
    };
    const posToValue = (pos) => {
      if (pos <= 0) return 0;
      pos = Math.max(1, Math.min(STEPS, pos));
      const v = Math.pow(10, ((pos - 1) / (STEPS - 1)) * Math.log10(maxVal));
      if (v < 1) return 0;
      const mag = Math.pow(10, Math.floor(Math.log10(v)));
      return Math.round(v / mag) * mag;
    };
    const fmt = (v) => {
      if (v >= 1e9) return '$' + (v / 1e9).toFixed(v >= 10e9 ? 1 : 2) + 'B';
      if (v >= 1e6) return '$' + (v / 1e6).toFixed(v >= 10e6 ? 1 : 2) + 'M';
      if (v >= 1e3) return '$' + (v / 1e3).toFixed(0) + 'k';
      return '$' + v.toLocaleString();
    };
    const range = el('input', { type: 'range', min: '0', max: String(STEPS), step: '1', value: String(valueToPos(init)) });
    const val = el('input', { type: 'number', class: 'slider-val', min: '0', max: String(maxVal), step: '1', value: String(init) });
    val.title = 'Type any amount $0 – $100,000,000,000';
    const hint = el('span', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-left: 6px; min-width: 64px; text-align: right;', text: fmt(init) });
    const sync = (raw) => {
      let v = Number(raw);
      if (!Number.isFinite(v)) return;
      v = Math.max(0, Math.min(maxVal, v));
      LabState.config[key] = v;
      range.value = String(valueToPos(v));
      val.value = String(v);
      hint.textContent = fmt(v);
      saveLabState();
    };
    range.oninput = () => sync(posToValue(+range.value));
    val.onchange = () => sync(+val.value);
    row.appendChild(range);
    row.appendChild(val);
    row.appendChild(hint);
    parent.appendChild(row);
  }

  // Presets (always)
  const presetSec = el('div', { class: 'lab-section' });
  presetSec.appendChild(el('h4', { text: 'Presets' }));
  const presetRow = el('div', { class: 'preset-row' });
  for (const key in LAB_PRESETS) {
    const pr = LAB_PRESETS[key];
    const btn = el('button', { text: pr.name, title: pr.desc });
    btn.onclick = () => {
      const preserveExisting = key.indexOf('score') === 0 || pr.preserveExisting;
      const nextCfg = preserveExisting
        ? Object.assign({}, LabState.config, pr.patch)
        : Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_SIM_CONFIG)), pr.patch);
      LabState.config = nextCfg;
      if (nextCfg.scoringStyle) setScoringStyle(nextCfg.scoringStyle);
      saveLabState();
      renderConfigPanel(panel, mode);
    };
    presetRow.appendChild(btn);
  }
  presetSec.appendChild(presetRow);
  panel.appendChild(presetSec);

  // Profile distribution sliders (advanced only)
  if (mode === 'advanced') {
    const profSec = el('div', { class: 'lab-section' });
    profSec.appendChild(el('h4', { text: 'Profile distribution' }));
    profSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-bottom: 8px; font-style: italic;', text: 'Changes need a pool rebuild to take effect.' }));
    const axes = [
      { key: 'noise', label: 'Noise' },
      { key: 'bet', label: 'Bet' },
      { key: 'fold', label: 'Fold' },
      { key: 'raise', label: 'Raise' },
    ];
    for (const ax of axes) {
      const centerKey = ax.key + 'Center', spreadKey = ax.key + 'Spread';
      appendSliderControl(profSec, { key: centerKey, label: ax.label + ' ctr', min: 0, max: 1, step: 0.01, onChange: () => updateDistPreviews() });
      appendSliderControl(profSec, { key: spreadKey, label: ax.label + ' spr', min: 0, max: 0.8, step: 0.01, onChange: () => updateDistPreviews() });
      const preview = el('div', { class: 'dist-preview' });
      const pc = el('canvas', { 'data-ax': ax.key });
      preview.appendChild(pc);
      profSec.appendChild(preview);
    }
    const rebuildBtn = el('button', { class: 'btn outline small', style: 'width: 100%; margin-top: 10px;', text: 'Rebuild pool with new distribution' });
    rebuildBtn.onclick = () => rebuildPoolWithConfirm(panel, mode);
    profSec.appendChild(rebuildBtn);
    panel.appendChild(profSec);
  }

  // Economics (Advanced only)
  if (mode === 'advanced') {
    const ecoSec = el('div', { class: 'lab-section' });
    ecoSec.appendChild(el('h4', { text: 'Economics · Yellow Jacket Inc' }));
    ecoSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-bottom: 8px; font-style: italic;', text: 'Rake = % of every buy-in diverted to YJ Inc. Remainder becomes the prize pool.' }));
    const moneyCfg = [
      ['buyInMajor', 'Major $', 0, 50000, 100],
      ['buyInRegular', 'Regular $', 0, 10000, 50],
      ['buyInMain', 'Main $', 0, 100000, 100],
    ];
    for (const [key, label, min, max, step] of moneyCfg) {
      appendSliderControl(ecoSec, { key, label, min, max, step });
    }
    // Rake %
    appendSliderControl(ecoSec, { key: 'rakePercent', label: 'Rake %', min: 0, max: 0.25, step: 0.005 });
    // Payout curve decay
    appendSliderControl(ecoSec, { key: 'payoutDecay', label: 'Payout curve', min: 0.50, max: 0.90, step: 0.01 });
    ecoSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-top: 6px; font-style: italic;', text: 'Flat (0.50) pays bottom more. Top-heavy (0.90) concentrates on champion.' }));
    // Sponsor purse (PGA/Masters analog): fixed prize-pool contribution on top of entry fees.
    // Log-scale slider supports the full $0 — $100B per-event range (broadcast / mega-sponsor
    // territory). Type any value directly in the number box for precision.
    ecoSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-top: 10px; font-style: italic;', text: 'Sponsor purse rides on top of entry fees and is not raked (PGA/TV-rights model). Range $0 – $100B per event; slider is logarithmic — type any exact amount in the box.' }));
    const sponsorKeys = [
      ['sponsorPurseMajor', 'Major sponsor $'],
      ['sponsorPurseRegular', 'Regular sponsor $'],
      ['sponsorPurseMain', 'Main sponsor $'],
    ];
    for (const [key, label] of sponsorKeys) {
      appendLogMoneySlider(ecoSec, { key, label, max: 1e11 });
    }
    ecoSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-top: 6px; font-style: italic;', text: 'Past major champions enter majors free within the exemption window (matches real PGA Masters lifetime exemption).' }));
    panel.appendChild(ecoSec);
  }

  // Event structure
  const evSec = el('div', { class: 'lab-section' });
  evSec.appendChild(el('h4', { text: 'Event structure' }));
  const simpleCfg = [
    ['seasons', 'Seasons to run', 1, 100, 1],
  ];
  const advancedCfg = [
    ['poolSize', 'Pool size', 200, 100000, 100],
    ['seasons', 'Seasons', 1, 100, 1],
    ['majors', 'Majors/yr', 0, 24, 1],
    ['regulars', 'Regulars/yr', 0, 365, 1],
    ['mains', 'Main/yr', 0, 24, 1],
    ['majorField', 'Major field', 32, 2048, 32],
    ['regularField', 'Reg field', 16, 2048, 16],
    ['mainField', 'Main field', 128, 100000, 128],
    ['mainQualifiersPerMajor', 'Main satellites/major', 0, 256, 4],
    ['exemptionYears', 'Exempt yrs', 0, 20, 1],
    ['regularStrokeCap', 'Reg cap', 1, 10, 1],
    ['majorStrokeCap', 'Major cap', 1, 10, 1],
    ['mainStrokeCap', 'Main cap', 1, 10, 1],
    ['mainFinalsStrokeCap', 'Main finals cap', 1, 10, 1],
    ['repeatRuns', 'CI repeats', 1, 20, 1],
  ];
  const intCfg = mode === 'advanced' ? advancedCfg : simpleCfg;
  // Pool-status indicator inserted directly below the poolSize slider so users see
  // when their config doesn't match the existing pool. Updated each time the slider
  // moves via the onChange callback below.
  let poolStatus = null;
  const updatePoolStatus = () => {
    if (!poolStatus) return;
    const cfgPool = (LabState.config.poolSize || 0);
    const livePool = (TourState.pool && TourState.pool.length) || 0;
    if (cfgPool === livePool) {
      poolStatus.style.color = 'var(--text-secondary)';
      poolStatus.textContent = '✓ Current pool: ' + livePool.toLocaleString() + ' players (matches config)';
    } else {
      poolStatus.style.color = 'var(--gold)';
      poolStatus.textContent = '⚠ Pool will rebuild on next Run · current: ' + livePool.toLocaleString() + ' → cfg: ' + cfgPool.toLocaleString() + ' · WIPES career history';
    }
  };
  for (const [key, label, min, max, step] of intCfg) {
    appendSliderControl(evSec, {
      key, label, min, max, step,
      onChange: (v) => {
        updateRuntimeEstimate();
        if (key === 'regularStrokeCap') setStrokeCap(v);
        if (key === 'poolSize') updatePoolStatus();
      }
    });
    if (key === 'poolSize' && mode === 'advanced') {
      poolStatus = el('div', { class: 'ui-sans', style: 'font-size: 10px; margin: -4px 0 8px 90px; font-style: italic;' });
      evSec.appendChild(poolStatus);
      updatePoolStatus();

  if (mode === 'advanced') {
    evSec.appendChild(el('div', {
      class: 'ui-sans',
      style: 'font-size: 10px; color: var(--text-secondary); margin-top: 6px; font-style: italic;',
      text: 'Recommended poker-first setup: Regulars 6, Majors 10, Main 6, Main finals 10. Higher caps mean tougher scoring and more no-limit style escalation.'
    }));
    evSec.appendChild(el('div', {
      class: 'ui-sans',
      style: 'font-size: 10px; color: var(--text-secondary); margin-top: 4px; font-style: italic;',
      text: 'Majors now qualify through earned buckets with a more democratic mix: fewer fixed ranking/exemption seats, more season-merit and open-qualifier access.'
    }));
    evSec.appendChild(el('div', {
      class: 'ui-sans',
      style: 'font-size: 10px; color: var(--text-secondary); margin-top: 4px; font-style: italic;',
      text: 'CI repeats > 1 runs the whole sim N times with incrementing seeds and aggregates mean ± SD on every metric. CI mode does NOT touch your Tour career — it is pure research.'
    }));
  }
  panel.appendChild(evSec);

  const scoreSec = el('div', { class: 'lab-section' });
  scoreSec.appendChild(el('h4', { text: 'Scoring system' }));
  scoreSec.appendChild(el('div', {
    class: 'cfg-static',
    style: 'padding: 8px 10px; background: var(--card-bg, rgba(0,0,0,0.04)); border-left: 3px solid var(--gold); margin-bottom: 8px; font-size: 11px;',
    text: 'Stroke-Honey (Tour Standard) — permanent.'
  }));
  scoreSec.appendChild(el('div', {
    class: 'ui-sans',
    style: 'font-size: 10px; color: var(--text-secondary); line-height: 1.5;',
    text: 'Hand category sets a bounded per-hole golf score (−5..+2). Wagered strokes form a honey pot; the hole winner takes the pot, ties carry it forward. Net honey credit subtracts from round total — winning pots improves your score. Honey divisor and carry-over are permanent invariants.'
  }));

  // Quick-load audit configuration: Yellow Jacket Tour Standard at clean-research
  // settings (sponsor=0 so ROI is interpretable, n=10 CI repeats, fixed seed).
  const auditRow = el('div', { style: 'margin-top: 10px;' });
  const auditBtn = el('button', {
    class: 'btn gold',
    text: '▸ Load Tour Standard audit config',
    style: 'width: 100%; font-size: 11px; padding: 8px 10px; font-weight: 600;'
  });
  auditBtn.onclick = () => {
    Object.assign(LabState.config, {
      poolSize: 2000, seasons: 10,
      majors: 4, regulars: 12, mains: 1,
      majorField: 96, regularField: 128, mainField: 256,
      exemptionYears: 3,
      regularStrokeCap: 6, majorStrokeCap: 10, mainStrokeCap: 6, mainFinalsStrokeCap: 10,
      buyInMajor: 2500, buyInRegular: 333, buyInMain: 1000,
      sponsorPurseMajor: 0, sponsorPurseRegular: 0, sponsorPurseMain: 0,
      rakePercent: 0.03, payoutDecay: 0.70,
      noiseSpread: 0.20, betSpread: 0.20, foldSpread: 0.18, raiseSpread: 0.15,
      skillSpread: 0.18,
      repeatRuns: 10,
      seed: 20260424,
      label: '',
      scoringStyle: 'stroke-honey',
    });
    saveLabState();
    renderConfigPanel(panel, mode);
    toast('Loaded Tour Standard audit config — click Run Simulation');
  };
  auditRow.appendChild(auditBtn);
  scoreSec.appendChild(auditRow);
  scoreSec.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 10px; color: var(--text-secondary); margin-top: 6px; font-style: italic;',
    text: 'Pool 2,000 · 10 seasons · n=10 CI repeats · sponsor purses $0 (so ROI is interpretable) · seeded.' }));

  panel.appendChild(scoreSec);

  // Run controls
  const runSec = el('div', { class: 'lab-section' });
  runSec.appendChild(el('h4', { text: 'Run' }));

// Run the simulator: use the live TourState.pool, append to TourState.seasons,
// AND snapshot the run into LabState.runs. Single pipeline for Simple + Advanced modes.
async function runSimulator(cfg, onProgress) {
  setStrokeCap(cfg.regularStrokeCap || cfg.strokeCap);
  const progressCtl = createProgressThrottler(onProgress);
  const actionStats = {
    preflop: { check:0, bet:0, call:0, raise:0, fold:0 },
    flop:    { check:0, bet:0, call:0, raise:0, fold:0 },
    turn:    { check:0, bet:0, call:0, raise:0, fold:0 },
    river:   { check:0, bet:0, call:0, raise:0, fold:0 },
  };
  LabState.instrumentation.collector = (street, action) => {
    if (actionStats[street] && actionStats[street][action] != null) actionStats[street][action]++;
  };
  const t0 = performance.now();
  const startYear = TourState.currentSeason + 1;
  const endYear = startYear + cfg.seasons - 1;
  const newEvents = [];
  try {
    await withSeed(cfg.seed, async () => {
      for (let year = startYear; year <= endYear; year++) {
        const seasonEvents = [];
        for (let m = 0; m < cfg.majors; m++) {
          const ev = runTourEventLab('major', year, MAJOR_NAMES[m % MAJOR_NAMES.length], TourState.pool, cfg);
          ev.season_slot = m + 1; ev.year = year; seasonEvents.push(ev); newEvents.push(ev);
          await progressCtl.tick({ year, startYear, endYear, eventCount: newEvents.length, type: 'major', i: m + 1, total: cfg.majors });
        }
        for (let r = 0; r < cfg.regulars; r++) {
          const ev = runTourEventLab('regular', year, REGULAR_PREFIX[r % REGULAR_PREFIX.length] + ' Open', TourState.pool, cfg);
          ev.season_slot = r + 1; ev.year = year; seasonEvents.push(ev); newEvents.push(ev);
          await progressCtl.tick({ year, startYear, endYear, eventCount: newEvents.length, type: 'regular', i: r + 1, total: cfg.regulars });
        }
        for (let m = 0; m < cfg.mains; m++) {
          const ev = runTourEventLab('main', year, MAIN_NAME, TourState.pool, cfg);
          ev.season_slot = m + 1; ev.year = year; seasonEvents.push(ev); newEvents.push(ev);
          await progressCtl.tick({ year, startYear, endYear, eventCount: newEvents.length, type: 'main', i: m + 1, total: cfg.mains });
        }
        // Append to persistent career
        TourState.seasons.push({ year, events: seasonEvents });
        TourState.currentSeason = year;
        // Buzz moments for historic champion scores
        for (const ev of seasonEvents) {
          if (ev.champScore <= -15 && ev.type === 'major') {
            BuzzKnowledge.moments.unshift({
              year, type: 'major', eventName: ev.name, playerId: ev.champId, score: ev.champScore,
              text: 'Season ' + year + ': ' + playerName(ev.champId) + ' won the ' + ev.name + ' at ' + formatScore(ev.champScore) + ' - one of the lowest championship scores in Tour history.'
            });
          }
        }
      }
      await progressCtl.tick({ year: endYear, startYear, endYear, eventCount: newEvents.length, type: 'done', force: true });
    });
  } finally {
    LabState.instrumentation.collector = null;
  }
  saveState();
  const elapsedMs = performance.now() - t0;
  const metrics = computeLabMetrics(TourState.pool, newEvents, actionStats, cfg);
  metrics.yearRange = [startYear, endYear];
  return { pool: TourState.pool, events: newEvents, actionStats, metrics, elapsedMs };
}

// Aggregate a set of metric objects into mean + SD for each numeric leaf. Preserves the
// first run's non-numeric fields (arrays, nested objects like scoreTrajectory) as
// representative. Returns { mean: ..., ciData: { metricPath: {mean, sd, n} } }.
function aggregateMetricsWithCI(metricsList) {
  if (!metricsList || metricsList.length === 0) return null;
  if (metricsList.length === 1) return { aggregated: metricsList[0], ciData: null };
  const first = metricsList[0];
  const ci = {};
  function collectPaths(obj, prefix) {
    for (const k in obj) {
      const v = obj[k];
      const path = prefix ? prefix + '.' + k : k;
      if (typeof v === 'number' && Number.isFinite(v)) {
        const vals = metricsList.map(m => {
          const parts = path.split('.');
          let cur = m;
          for (const p of parts) { if (cur == null) return null; cur = cur[p]; }
          return typeof cur === 'number' && Number.isFinite(cur) ? cur : null;
        }).filter(x => x != null);
        if (vals.length === 0) continue;
        const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
        const sd = vals.length > 1 ? Math.sqrt(vals.reduce((a, b) => a + (b - mean) * (b - mean), 0) / (vals.length - 1)) : 0;
        ci[path] = { mean, sd, n: vals.length };
      } else if (v && typeof v === 'object' && !Array.isArray(v)) {
        // Recurse into nested objects but avoid the cfg snapshot (too deep / irrelevant).
        if (path !== 'cfg' && path.indexOf('cfg.') !== 0) collectPaths(v, path);
      }
    }
  }
  collectPaths(first, '');
  // Use the first run as the representative body; mean-ify the top-level numeric keys in place.
  const aggregated = Object.assign({}, first);
  // Deep-path patcher — preserves nested object structure. Previously used
  // `const [root, leaf] = path.split('.')` which silently dropped path components
  // for depths > 2, then clobbered sub-objects with numbers. That broke
  // `finalsSkillEdge.all` (which has shape {mean, upsetRate, n}) because
  // path 'finalsSkillEdge.all.mean' would collapse to setting
  // `aggregated.finalsSkillEdge.all = <number>`, destroying the sub-object
  // and causing `f.all.mean` reads downstream to throw "undefined.toFixed".
  function setDeep(obj, path, value) {
    const parts = path.split('.');
    let cur = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      const key = parts[i];
      const next = cur[key];
      // Replace any non-object (or null) with a fresh object; shallow-clone
      // objects we descend into so we don't mutate the source snapshot.
      if (!next || typeof next !== 'object' || Array.isArray(next)) {
        cur[key] = {};
      } else {
        cur[key] = Object.assign({}, next);
      }
      cur = cur[key];
    }
    cur[parts[parts.length - 1]] = value;
  }
  for (const path in ci) {
    if (path.indexOf('.') === -1) {
      aggregated[path] = ci[path].mean;
    } else {
      setDeep(aggregated, path, ci[path].mean);
    }
  }
  aggregated.ciData = ci;
  return { aggregated, ciData: ci };
}

async function simulatorRunClicked() {
  if (LabState.busy) return;
  LabState.busy = true;
  const runBtn = $('#labRunBtn');
  if (runBtn) { runBtn.disabled = true; runBtn.textContent = 'Running...'; }
  try {
    const cfg = JSON.parse(JSON.stringify(LabState.config));
    const repeats = Math.max(1, Math.min(20, cfg.repeatRuns || 1));

    // Pool / cfg mismatch guard. The single-run path uses TourState.pool which is
    // built once at startup (or via "Rebuild pool"). If the user adjusted the
    // poolSize slider since then, the pool is still the OLD size and the sim
    // would silently run on a smaller field than the cfg claims. Detect and
    // confirm before silently dropping the user's intent. CI mode (repeats > 1)
    // is exempt because runLabSession builds its own fresh pool per repeat.
    if (repeats === 1 && TourState.pool && TourState.pool.length !== cfg.poolSize) {
      const have = TourState.pool.length.toLocaleString();
      const want = (cfg.poolSize || 0).toLocaleString();
      const msg = 'Pool size mismatch.\n\n'
        + 'Your config wants ' + want + ' players, but the existing pool has ' + have + '.\n\n'
        + 'Rebuild the pool to ' + want + ' players now? This wipes ALL career history '
        + '(seasons, events, player stats, legendary moments, saved runs) and starts fresh.\n\n'
        + 'Click Cancel to abort the run instead so you can keep your career.';
      if (!confirm(msg)) {
        toast('Run cancelled — pool size unchanged at ' + have);
        return;
      }
      TourState.pool = buildPoolFromConfig(cfg);
      TourState.seasons = [];
      TourState.currentSeason = 0;
      BuzzKnowledge.moments = [];
      LabState.runs = [];
      LabState.activeRunId = null;
      saveState(); saveLabState();
      toast('Pool rebuilt · ' + TourState.pool.length.toLocaleString() + ' players ready');
    }

    if (repeats === 1) {
      // Normal single-run path: appends to TourState, builds career.
      const progress = (info) => {
        if (runBtn) runBtn.textContent = 'Y' + info.year + '/' + info.endYear + ' · ' + info.type + ' ' + info.i + '/' + info.total;
      };
      const session = await runSimulator(cfg, progress);
      const defaultLabel = 'Run ' + (LabState.runs.length + 1) + ' · Y' + session.metrics.yearRange[0] + '-Y' + session.metrics.yearRange[1];
      const snap = saveRunSnapshot(session, cfg.label || defaultLabel);
      toast('Run saved · ' + snap.label);
    } else {
      // CI mode: runs N isolated sims via runLabSession, aggregates metrics with mean±SD.
      // Does NOT touch TourState — career stays clean for the normal single-run flow.
      const sessions = [];
      const baseSeed = cfg.seed || Math.floor(Math.random() * 1e9);
      // Prime-space the CI seeds so consecutive runs don't share correlated initial
      // PRNG states. mulberry32 initializes state via `state += 0x6D2B79F5`, so
      // seeds that differ by 1 produce states that differ by only a small constant
      // before the first random draw — biasing the first few holes identically
      // across repeats. Stepping by a large prime (100003) fully randomizes.
      for (let i = 0; i < repeats; i++) {
        const runCfg = Object.assign({}, cfg, { seed: (baseSeed + i * 100003) >>> 0 });
        const progress = (info) => {
          if (runBtn) runBtn.textContent = 'CI ' + (i + 1) + '/' + repeats + ' · Y' + info.year + '/' + info.total;
        };
        const session = await runLabSession(runCfg, progress);
        sessions.push(session);
      }
      const metricsList = sessions.map(s => s.metrics);
      const agg = aggregateMetricsWithCI(metricsList);
      const elapsedMs = sessions.reduce((a, s) => a + (s.elapsedMs || 0), 0);
      const aggSession = {
        pool: sessions[0].pool,
        events: sessions[0].events,
        actionStats: sessions[0].actionStats,
        metrics: agg.aggregated,
        elapsedMs,
      };
      const defaultLabel = 'CI×' + repeats + ' · ' + cfg.seasons + 'y · ' + new Date().toLocaleTimeString();
      const snap = saveRunSnapshot(aggSession, cfg.label || defaultLabel);
      toast('CI run saved (' + repeats + ' repeats) · ' + snap.label);
    }
    renderLabResults($('#labResults'));
  } catch (e) {
    toast('Run failed: ' + e.message);
    console.error(e);
  } finally {
    LabState.busy = false;
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = 'Run Simulation →'; }
  }
}

// All sweep UI (legacy Scoring A/B/C and parameter sensitivity) has been removed.
// Yellow Jacket Tour ships as a single optimized configuration; compare individual
// runs in the Run Registry instead.

function renderLabResults(root) {
  clear(root);

  // Tour summary card (always present)
  const summaryCard = el('div', { class: 'card' });
  const hasCareer = TourState.seasons && TourState.seasons.length > 0;
  summaryCard.appendChild(el('h2', { text: 'Tour Career' }));
  if (!hasCareer) {
    summaryCard.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--text-secondary); font-size: 13px; line-height: 1.55;',
      text: 'Welcome to the Yellow Jacket Tour. Configure the season on the left panel and click Run Simulation. Every run is snapshotted with its full config and metrics — career history accumulates here, and individual runs land in the Registry below for side-by-side comparison.'
    }));
  } else {
    const totalEvents = TourState.seasons.reduce((n, s) => n + s.events.length, 0);
    const totalMajors = TourState.seasons.reduce((n, s) => n + s.events.filter(e => e.type === 'major').length, 0);
    summaryCard.appendChild(el('div', { class: 'kpi-strip' },
      kpiBox('Years played', TourState.currentSeason),
      kpiBox('Total events', totalEvents),
      kpiBox('Majors held', totalMajors),
      kpiBox('Pool size', TourState.pool ? TourState.pool.length.toLocaleString() : '-'),
      kpiBox('Legendary moments', BuzzKnowledge.moments.length)
    ));
  }
  root.appendChild(summaryCard);

  // Yellow Jacket Inc Foundation card — cumulative across the career
  if (hasCareer) {
    const foundation = computeFoundationCareer();
    if (foundation.totalRevenue > 0) {
      const foundCard = el('div', { class: 'card', style: 'margin-top: 14px; border-top: 3px solid var(--gold);' });
      foundCard.appendChild(el('h2', { text: 'Yellow Jacket Inc · Foundation Ledger' }));
      foundCard.appendChild(el('p', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; letter-spacing: 0.3px;', text: 'Career-cumulative: rake collected across every event ever run, plus player ROI by tier.' }));
      foundCard.appendChild(el('div', { class: 'kpi-strip' },
        kpiBox('Career revenue', fmtMoney(foundation.totalRevenue)),
        kpiBox('Prize pool paid', fmtMoney(foundation.totalPrizePool)),
        kpiBox('Total entries', foundation.totalEntries.toLocaleString()),
        kpiBox('ITM rate', (foundation.itmRate * 100).toFixed(1) + '%'),
        kpiBox('Avg rake/event', fmtMoney(foundation.totalRevenue / Math.max(1, foundation.eventCount)))
      ));
    }
  }

  // Registry
  if (LabState.runs.length > 0) {
    const regCard = el('div', { class: 'card', style: 'margin-top: 18px;' });
    regCard.appendChild(el('h2', { text: 'Run Registry · ' + LabState.runs.length }));
    regCard.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--text-secondary); font-size: 12px; margin-bottom: 10px;', text: 'Each run is a full simulation snapshot with its config + metrics. Click a card to view · hover to export or delete.' }));
    const reg = el('div', { class: 'run-registry' });
    for (const r of LabState.runs) reg.appendChild(renderRunCard(r));
    regCard.appendChild(reg);
    root.appendChild(regCard);

    const active = LabState.runs.find(r => r.id === LabState.activeRunId) || LabState.runs[0];
    if (active) renderActiveRun(root, active);
  }

  // Event feed (pulls from TourState)
  if (hasCareer) {
    const feedCard = el('div', { class: 'card', style: 'margin-top: 18px;' });
    feedCard.appendChild(el('h2', { text: 'Event Feed (Recent)' }));
    const feedList = el('div', { id: 'feedList', class: 'career-feed' });
    feedCard.appendChild(feedList);
    root.appendChild(feedCard);
    renderFeed();
  }
}

function kpiBox(label, value, delta) {
  const b = el('div', { class: 'kpi-box' });
  b.appendChild(el('div', { class: 'kpi-label', text: label }));
  b.appendChild(el('div', { class: 'kpi-value', text: String(value) }));
  if (delta) b.appendChild(el('div', { class: 'kpi-delta', text: delta }));
  return b;
}

// Career-cumulative foundation ledger: sums across every TourState.seasons event.
function computeFoundationCareer() {
  let totalRevenue = 0, totalPrizePool = 0, totalEntries = 0, totalITM = 0, eventCount = 0;
  for (const s of TourState.seasons || []) {
    for (const e of s.events) {
      totalRevenue += (e.revenue || 0);
      totalPrizePool += (e.prizePool || 0);
      totalEntries += (e.fieldSize || 0);
      totalITM += (e.itmCount || 0);
      eventCount++;
    }
  }
  const itmRate = totalEntries > 0 ? totalITM / totalEntries : 0;
  return { totalRevenue, totalPrizePool, totalEntries, totalITM, itmRate, eventCount };
}

function renderRunCard(r) {
  const card = el('div', { class: 'run-card' + (r.id === LabState.activeRunId ? ' active' : '') });
  const runCfg = r.config || r.cfg || {};
  const style = resolveScoringModel(runCfg.scoringStyle);
  card.onclick = (e) => {
    if (e.target.tagName === 'BUTTON') return;
    LabState.activeRunId = r.id;
    saveLabState();
    renderLabResults($('#labResults'));
  };
  card.appendChild(el('div', { class: 'run-name', text: r.label }));
  card.appendChild(el('div', { class: 'run-meta', text: 'Scoring style: ' + style.name }));
  card.appendChild(el('div', { class: 'run-meta', text: new Date(r.timestamp).toLocaleString() + ' · ' + r.metrics.eventCount + ' events · ' + (r.elapsedMs / 1000).toFixed(1) + 's' }));
  const kpis = el('div', { class: 'run-kpis' });
  const m = r.metrics;
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'R²: ', el('b', { text: m.varianceDecomp.skillR2.toFixed(2) })));
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Gini: ', el('b', { text: m.gini.toFixed(2) })));
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Below par: ', el('b', { text: (m.belowParRate * 100).toFixed(0) + '%' })));
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Repeat maj: ', el('b', { text: (m.repeatMajorRate * 100).toFixed(0) + '%' })));
  if (m.economics && m.economics.totalRevenue > 0) {
    kpis.appendChild(el('span', { class: 'run-kpi' }, 'Rev: ', el('b', { text: fmtMoney(m.economics.totalRevenue) })));
  }
  card.appendChild(kpis);
  const actions = el('div', { class: 'run-actions' });
  const expJ = el('button', { text: 'JSON' });
  expJ.onclick = (e) => { e.stopPropagation(); exportRunToJSON(r); };
  const expC = el('button', { text: 'CSV' });
  expC.onclick = (e) => { e.stopPropagation(); exportRunToCSV(r); };
  const delB = el('button', { text: '✕', title: 'Delete' });
  delB.onclick = (e) => {
    e.stopPropagation();
    if (confirm('Delete run: ' + r.label + '?')) {
      LabState.runs = LabState.runs.filter(x => x.id !== r.id);
      if (LabState.activeRunId === r.id) LabState.activeRunId = LabState.runs[0] ? LabState.runs[0].id : null;
      saveLabState(); renderLabResults($('#labResults'));
    }
  };
  actions.appendChild(expJ); actions.appendChild(expC); actions.appendChild(delB);
  card.appendChild(actions);
  return card;
}

function renderActiveRun(root, r) {
  const m = r.metrics;
  const runCfg = r.config || r.cfg || {};
  const style = resolveScoringModel(runCfg.scoringStyle);
  const wrap = el('div', { class: 'card', style: 'margin-top: 18px;' });
  wrap.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); margin-bottom: 12px;', text: 'Scoring style: ' + style.name + '. ' + style.desc }));
  wrap.appendChild(el('h2', { text: 'Active run · ' + r.label }));
  // KPI strip
  const kpis = el('div', { class: 'kpi-strip' });
  function kpi(label, value, delta) {
    const b = el('div', { class: 'kpi-box' });
    b.appendChild(el('div', { class: 'kpi-label', text: label }));
    b.appendChild(el('div', { class: 'kpi-value', text: value }));
    if (delta) b.appendChild(el('div', { class: 'kpi-delta' + (delta.startsWith('+') ? ' up' : delta.startsWith('-') ? ' down' : ''), text: delta }));
    return b;
  }
  kpis.appendChild(kpi('Skill R² (linear · wins)', m.varianceDecomp.skillR2.toFixed(3), 'lower bound — linear assumption'));
  kpis.appendChild(kpi('Luck share', (m.varianceDecomp.luckR2 * 100).toFixed(0) + '%', 'incl. model noise + nonlinearity'));
  // Spearman rank correlation: non-linear-friendly version of skill signal. If skill really
  // matters but wins are lumpy/threshold-based, Spearman will be much higher than R².
  if (typeof m.skillSpearman === 'number') {
    const rho = m.skillSpearman;
    const tag = rho > 0.7 ? 'strong' : rho > 0.4 ? 'moderate' : rho > 0.2 ? 'weak' : 'near noise';
    kpis.appendChild(kpi('Skill ρ (Spearman rank)', rho.toFixed(3), tag + ' rank alignment'));
  }
  // Authored vs measured skill: sanity check on the simulator's internal skill metric.
  // > 0.7 = authored rating tracks empirical; < 0.3 = authored rating is decoupled (suspect).
  if (typeof m.authoredVsMeasured === 'number') {
    const r = m.authoredVsMeasured;
    const tag = r > 0.7 ? 'tracking' : r > 0.4 ? 'partial' : r > 0.2 ? 'weak' : 'decoupled';

  // Perf card: surfaces throughput + progressive-slowdown diagnostic. Rendered only if

  (function () {
    const perf = m.perf;
    if (!perf || !perf.eventCount) return;
    const card = el('div', { class: 'card', style: 'margin-top: 10px; padding: 12px 14px;' });
    card.appendChild(el('h3', { text: 'Simulation performance', style: 'font-size: 12px; margin-bottom: 6px;' }));
    const strip = el('div', { class: 'kpi-strip', style: 'margin-bottom: 8px;' });
    function chip(label, value, delta) {
      const b = el('div', { class: 'kpi-box' });
      b.appendChild(el('div', { class: 'kpi-label', text: label }));
      b.appendChild(el('div', { class: 'kpi-value', text: value }));
      if (delta) b.appendChild(el('div', { class: 'kpi-delta', text: delta }));
      return b;
    }
    const mins = perf.totalMs / 60000;
    const timeLabel = perf.totalMs < 1000 ? perf.totalMs.toFixed(0) + ' ms'
      : perf.totalMs < 60000 ? (perf.totalMs / 1000).toFixed(2) + ' s'
      : mins.toFixed(2) + ' min';
    strip.appendChild(chip('Total time', timeLabel, perf.eventCount + ' events'));
    strip.appendChild(chip('Events / sec', perf.eventsPerSec.toFixed(1), 'mean throughput'));
    strip.appendChild(chip('Ms / event', perf.msPerEvent.toFixed(1), ''));
    // Progressive-slowdown diagnostic: compare first 10% of events against last 10%.
    // Positive Δ means the sim got SLOWER over time (bad). Near zero means flat (good).
    const slow = perf.slowdownPct;
    const slowTag = slow > 15 ? 'progressive slowdown' : slow > 5 ? 'mild drift' : Math.abs(slow) <= 5 ? 'flat — no leak' : 'sped up';
    const slowStr = (slow >= 0 ? '+' : '') + slow.toFixed(1) + '%';
    strip.appendChild(chip('Slowdown (first 10% → last 10%)', slowStr, slowTag));
    card.appendChild(strip);
    // Bucket breakdown. Only render buckets we saw time in.
    const buckets = perf.buckets || {};
    const totalBucketMs = Object.values(buckets).reduce((a, b) => a + b, 0);
    if (totalBucketMs > 0) {
      const breakdown = el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); line-height: 1.5;' });
      breakdown.appendChild(el('div', { style: 'margin-bottom: 4px; color: var(--text);', text: 'Time by phase:' }));
      const rows = Object.keys(buckets).sort((a, b) => buckets[b] - buckets[a]);
      for (const k of rows) {
        const pct = (buckets[k] / totalBucketMs) * 100;
        const msLabel = buckets[k] < 1000 ? buckets[k].toFixed(0) + ' ms' : (buckets[k] / 1000).toFixed(2) + ' s';
        breakdown.appendChild(el('div', { text: '  ' + k + ' · ' + msLabel + ' · ' + pct.toFixed(1) + '%' }));
      }
      card.appendChild(breakdown);
    }
    wrap.appendChild(card);
  })();

  setTimeout(() => {

    drawStackedArea(cv4, ['preflop','flop','turn','river'].map(s => ({ label: streetLabel(s), check: m.actionRate[s].check || 0, bet: m.actionRate[s].bet || 0, call: m.actionRate[s].call || 0, raise: m.actionRate[s].raise || 0, fold: m.actionRate[s].fold || 0 })), ['check','bet','call','raise','fold'], ['check','bet','call','raise','fold']);
    drawHeatmap(cv5, m.h2hMatrix.rate, ['Q1','Q2','Q3','Q4'], ['Q1','Q2','Q3','Q4'], { xTitle: 'Runner-up quartile', yTitle: 'Champion quartile' });
    const scoreVals = m.champScores || [];
    if (scoreVals.length > 0) {

      const maxScore = Math.max.apply(null, scoreVals);
      const span = Math.max(1, maxScore - minScore + 1);
      const bins = Math.max(5, Math.min(31, span));
      drawHistogram(cv6, scoreVals, minScore - 0.5, maxScore + 0.5, bins, {
        labelFormat: v => Math.round(v),
        xLabel: 'Champion score',
        yLabel: 'Events',
      });
    }
    const winVals = m.winTotals || [];
    if (winVals.length > 0) {
      const maxWins = Math.max.apply(null, winVals);
      drawHistogram(cv11, winVals, 0, Math.max(1, maxWins + 1), Math.max(8, Math.min(20, maxWins + 1)), {
        labelFormat: v => Math.round(v),
        xLabel: 'Career wins',
        yLabel: 'Players',
        // Auto-log when the top bin is 10× the second-top. With large pools most
        // players sit at 0–1 wins while dynasties reach 20+; linear scale hides the tail.
        logScale: 'auto',
      });
    }
    // Career Total Score Distribution
    const careerScores = m.careerScores || [];
    if (careerScores.length > 0) {
      // Trim p1/p99 outliers for a readable axis, then round bin edges to integers.
      const sorted = careerScores.slice().sort((a, b) => a - b);
      const p01 = sorted[Math.floor(sorted.length * 0.01)] || sorted[0];
      const p99 = sorted[Math.floor(sorted.length * 0.99)] || sorted[sorted.length - 1];
      const span = Math.max(10, p99 - p01);
      const pad = Math.max(2, Math.round(span * 0.05));
      const lo = Math.floor(p01 - pad);
      const hi = Math.ceil(p99 + pad);
      const bins = 18;
      drawHistogram(cv12, careerScores, lo, hi, bins, {

      if (buckets.length > 0) {
        // Asymmetric range — losses are bounded (you can't lose more than you paid in
        // buy-ins, capped at ~$1.5M/player), but wins are unbounded (champion can clear
        // $16M+ over a long career). Forcing the histogram to be symmetric around $0
        // creates empty padding bins on whichever side has the smaller magnitude.
        // Instead: clip outliers via p1/p99, snap bin edges so $0 lands on a boundary,
        // and use ~20 bins for smooth resolution.
        const sorted = buckets.slice().sort((a, b) => a - b);
        const p1 = sorted[Math.floor(sorted.length * 0.01)];
        const p99 = sorted[Math.floor(sorted.length * 0.99)];
        const targetBins = 20;
        const rawBinW = Math.max(1, (p99 - p1) / targetBins);
        // "Nice" bin width: round up to the next 1/2/5 × power-of-10 so labels read clean.
        const mag = Math.pow(10, Math.floor(Math.log10(rawBinW)));
        const ratio = rawBinW / mag;
        const niceBinW = (ratio <= 1 ? 1 : ratio <= 2 ? 2 : ratio <= 5 ? 5 : 10) * mag;
        // Snap lo/hi to integer multiples of niceBinW so $0 falls on a bin edge —
        // that way the negative/positive bin coloring (red vs green) is exact at zero.
        const lo = Math.floor(p1 / niceBinW) * niceBinW;
        const hi = Math.ceil(p99 / niceBinW) * niceBinW;
        const bins = Math.max(8, Math.round((hi - lo) / niceBinW));
        drawHistogram(cv10, buckets, lo, hi, bins, {
          labelFormat: v => fmtMoney(v),
          xLabel: 'Career P&L',
          yLabel: 'Players',
        });
      }
    }
  }, 10);
}

function fmtMoney(n) {
  if (n == null || !isFinite(n)) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
  return '$' + n.toFixed(0);
}

function drawROITiers(canvas, tiers) {
  const w = canvas.width, h = canvas.height, pad = 48;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const rois = tiers.map(t => t.roi);
  const yMax = Math.max(0.1, Math.max.apply(null, rois.map(v => Math.max(v, 0))) * 1.15);
  const yMin = Math.min(0, Math.min.apply(null, rois) * 1.15);
  chartAxes(ctx, w, h, pad, yMin, yMax, tiers.map(t => t.label.split(' ')[0]), v => (v * 100).toFixed(0) + '%');
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / tiers.length;
  const barW = Math.min(76, colW * 0.55);
  const yZero = h - pad - ((0 - yMin) / (yMax - yMin)) * plotH;
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, yZero); ctx.lineTo(w - pad, yZero); ctx.stroke();
  tiers.forEach((t, i) => {
    const cx = pad + colW * (i + 0.5);
    const y = h - pad - ((t.roi - yMin) / (yMax - yMin)) * plotH;
    const top = Math.min(y, yZero), bot = Math.max(y, yZero);
    ctx.fillStyle = t.roi >= 0 ? C.neg : C.pos;
    ctx.fillRect(cx - barW / 2, top, barW, bot - top);
    ctx.fillStyle = C.text; ctx.font = '11px monospace';
    const lbl = (t.roi >= 0 ? '+' : '') + (t.roi * 100).toFixed(0) + '%';
    ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, t.roi >= 0 ? top - 4 : bot + 12);
  });
  // Axis titles
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const xt = 'Skill tier'; ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
  ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
  const yt = 'Return on buy-ins'; ctx.fillText(yt, -ctx.measureText(yt).width / 2, 0); ctx.restore();
}

function drawFoundationRevenue(canvas, series) {
  const w = canvas.width, h = canvas.height;
  const padL = 66, padR = 66, padT = 32, padB = 32;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  if (series.length === 0) return;

  const yearRevMax = Math.max(1, Math.max.apply(null, series.map(s => s.revenue)) * 1.15);
  const cumMax = Math.max(1, Math.max.apply(null, series.map(s => s.cumulative)) * 1.05);
  const plotW = w - padL - padR, plotH = h - padT - padB;

  // axes frames
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
  // right axis line
  ctx.beginPath(); ctx.moveTo(w - padR, padT); ctx.lineTo(w - padR, h - padB); ctx.stroke();

  // left-axis ticks (per-year revenue scale)
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const v = (yearRevMax * i) / steps;
    const y = h - padB - (i / steps) * plotH;
    const lbl = fmtMoney(v);
    ctx.fillText(lbl, padL - ctx.measureText(lbl).width - 6, y + 3);
    if (i > 0) {
      ctx.strokeStyle = C.grid;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    }
  }
  // right-axis ticks (cumulative scale)
  for (let i = 0; i <= steps; i++) {
    const v = (cumMax * i) / steps;
    const y = h - padB - (i / steps) * plotH;
    const lbl = fmtMoney(v);
    ctx.fillText(lbl, w - padR + 6, y + 3);
  }

  // x-axis labels (years)
  const step = plotW / Math.max(1, series.length);
  const maxXLabels = Math.max(2, Math.floor(plotW / 40));
  const stride = Math.max(1, Math.ceil(series.length / maxXLabels));
  series.forEach((s, i) => {
    if (i % stride !== 0 && i !== series.length - 1) return;
    const x = padL + step * (i + 0.5);
    const lbl = 'Y' + s.year;
    ctx.fillText(lbl, x - ctx.measureText(lbl).width / 2, h - padB + 14);
  });

  // per-year bars (scaled to left axis)
  const barW = Math.min(32, step - 6);
  series.forEach((s, i) => {
    const x = padL + step * i + (step - barW) / 2;
    const bh = (s.revenue / yearRevMax) * plotH;
    ctx.fillStyle = C.accent;
    ctx.fillRect(x, h - padB - bh, barW, bh);
  });

  // cumulative line (scaled to right axis)
  ctx.strokeStyle = C.primary; ctx.lineWidth = 2.5;
  ctx.beginPath();
  series.forEach((s, i) => {
    const x = padL + step * (i + 0.5);
    const y = h - padB - (s.cumulative / cumMax) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = C.primary;
  series.forEach((s, i) => {
    const x = padL + step * (i + 0.5);
    const y = h - padB - (s.cumulative / cumMax) * plotH;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();
  });

  // Axis titles
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  ctx.save(); ctx.translate(14, (padT + h - padB) / 2); ctx.rotate(-Math.PI / 2);
  const lbl1 = 'Per-year rake ($)';
  ctx.fillText(lbl1, -ctx.measureText(lbl1).width / 2, 0); ctx.restore();
  ctx.save(); ctx.translate(w - 14, (padT + h - padB) / 2); ctx.rotate(Math.PI / 2);
  const lbl2 = 'Cumulative ($)';
  ctx.fillText(lbl2, -ctx.measureText(lbl2).width / 2, 0); ctx.restore();

  // Legend
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillStyle = C.accent; ctx.fillRect(padL + 8, 10, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText('Per-year rake', padL + 24, 18);
  ctx.fillStyle = C.primary; ctx.fillRect(padL + 144, 10, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText('Cumulative foundation', padL + 160, 18);
}

function drawRevenueByType(canvas, revByType) {
  const w = canvas.width, h = canvas.height, pad = 48;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const types = ['major', 'regular', 'main'];
  const colors = [C.accent, C.primary, C.tertiary];
  const vals = types.map(t => revByType[t] || 0);
  const yMax = Math.max(1, Math.max.apply(null, vals) * 1.15);
  chartAxes(ctx, w, h, pad, 0, yMax, types, v => fmtMoney(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / types.length;
  const barW = Math.min(100, colW * 0.6);
  types.forEach((t, i) => {
    const cx = pad + colW * (i + 0.5);
    const bh = (vals[i] / yMax) * plotH;
    ctx.fillStyle = colors[i];
    ctx.fillRect(cx - barW / 2, h - pad - bh, barW, bh);
    ctx.fillStyle = C.text; ctx.font = '11px monospace';
    const lbl = fmtMoney(vals[i]);
    ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, h - pad - bh - 6);
  });
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const xt = 'Event type'; ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
  ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
  const yt = 'YJ Inc revenue'; ctx.fillText(yt, -ctx.measureText(yt).width / 2, 0); ctx.restore();
}

// Parameter sensitivity sweep UI removed — Yellow Jacket Tour ships as a single optimized
// configuration. Use individual runs and compare them in the Run Registry.

function init() {
  if (!loadState()) {
    TourState.pool = buildPool(POOL_SIZE);
    saveState();
    toast('Pool initialized — ' + POOL_SIZE + ' players ready. Run your first season!', 3500);
  } else {
    toast('Tour history restored from last session', 2000);
  }
  loadLabState();
  setScoringStyle(LabState.config.scoringStyle || DEFAULT_SIM_CONFIG.scoringStyle);
  setStrokeCap(LabState.config.regularStrokeCap || LabState.config.strokeCap);

  window.addEventListener('hashchange', onHashChange);
  onHashChange();

  $$('nav.nav a').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); location.hash = '#' + a.dataset.route; };
  });

  const themeToggle = $('#themeToggle');
  if (themeToggle) themeToggle.onclick = toggleTheme;

  document.addEventListener('keydown', (e) => {
    const inInput = ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) !== -1;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
    else if (!inInput && e.key === '/') { e.preventDefault(); openCmd(); }
    else if (e.key === 'Escape') { closeCmd(); closeModal(); }
    else if (!inInput && e.key === '?') { showKeyboardHelp(); }
  });
  const cmdInput = $('#cmdInput');
  if (cmdInput) cmdInput.oninput = (e) => renderCmdResults(e.target.value);
  const cmdPalette = $('#cmd-palette');
  if (cmdPalette) cmdPalette.onclick = (e) => { if (e.target.id === 'cmd-palette') closeCmd(); };

  if (location.hash.startsWith('#play/')) {
    const game = decodeGameFromURL(location.href);
    if (game) {
      TourState.activeGame = game;
      location.hash = '#multiplayer';
      toast('Share-link game loaded. Your turn!');
    } else {
      toast('Invalid or tampered share-link');
    }
  }
}

try {
  init();
} catch (e) {
  console.error('Yellow Jacket boot failed:', e);
  showFatalError('Yellow Jacket failed to boot. If you opened this via file://, your browser may be blocking storage or startup APIs.', e && (e.stack || e.message) ? (e.stack || e.message) : String(e));
}
