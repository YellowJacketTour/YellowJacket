// on every true tie, giving first-seeded players a ~0.1% win-rate boost in
// high-variance configs. Random tiebreaker removes that seat bias.
function resolveTieWinner(pA, pB, aTotal, bTotal) {
  if (aTotal < bTotal) return pA;
  if (bTotal < aTotal) return pB;
  return Math.random() < 0.5 ? pA : pB;
}
function runKnockoutRound(players, numHoles) {
  const arr = players.slice();
  for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  const bracketSize = players.length;
  const winners = [];
  const losers = [];
  if (arr.length % 2 === 1) winners.push(arr.pop()); // bye
  const pairs = [];
  for (let i=0; i<arr.length; i+=2) pairs.push([arr[i], arr[i+1]]);
  for (const pair of pairs) {
    const m = playMatch(pair[0], pair[1], numHoles);
    winners.push(m.winner);
    losers.push(m.loser);
    m.loser.eliminatedAtBracket = bracketSize;
  }
  return { winners, losers, bracketSize };
}
function runFinals(p1, p2) {
  // 4 days × 18 holes = 72-hole finals. Identical Stroke-Honey accounting to playMatch.
  // stats.totalScore is intentionally NOT reset here — leaving bracket-round strokes
  // intact lets careerScore represent the true per-event stroke load (bracket + finals).
  const days = [];
  let p1Scorecard = 0, p2Scorecard = 0;
  let p1HoneyTotal = 0, p2HoneyTotal = 0;
  let carryPot = 0;
  const applyHole = (r) => {
    p1Scorecard += r.aScore; p2Scorecard += r.bScore;
    if (r.tie) {
      carryPot += (r.strokes || 0);
    } else {
      const aSk = r.aHoneyCredit || 0;
      const bSk = r.bHoneyCredit || 0;
      p1HoneyTotal += aSk;
      p2HoneyTotal += bSk;
      if (aSk > 0)      p1HoneyTotal += carryPot;
      else if (bSk > 0) p2HoneyTotal += carryPot;
      if (aSk > 0 || bSk > 0) carryPot = 0;
    }
    updatePlayerHoleStats(p1, r, 'a'); updatePlayerHoleStats(p2, r, 'b');
  };
  for (let day=1; day<=4; day++) {
    let dayA = 0, dayB = 0;
    let dealer = (day % 2 === 1) ? 'a' : 'b';
    for (let h=0; h<18; h++) {
      const r = playHole(p1, p2, dealer);
      dayA += r.aScore; dayB += r.bScore;
      applyHole(r);
      dealer = dealer === 'a' ? 'b' : 'a';
    }
    days.push({ day, p1Score: dayA, p2Score: dayB });
  }
  const computeFinalsTotals = () => {
    const netA = p1HoneyTotal - p2HoneyTotal;
    const netB = p2HoneyTotal - p1HoneyTotal;
    return {
      a: p1Scorecard - netA - carryPot,
      b: p2Scorecard - netB - carryPot,
    };
  };
  let totals = computeFinalsTotals();
  let p1Total = totals.a, p2Total = totals.b;
  const playoffs = [];
  let dealer = 'a';
  while (p1Total === p2Total && playoffs.length < 30) {
    const r = playHole(p1, p2, dealer);
    playoffs.push({ p1Score: r.aScore, p2Score: r.bScore });
    applyHole(r);
    dealer = dealer === 'a' ? 'b' : 'a';
    totals = computeFinalsTotals();
    p1Total = totals.a; p2Total = totals.b;
  }
  p1.stats.totalScore += p1Total; p2.stats.totalScore += p2Total;
  const winner = resolveTieWinner(p1, p2, p1Total, p2Total);
  const loser = winner === p1 ? p2 : p1;
  winner.stats.matchesWon++; loser.stats.matchesLost++;
  loser.eliminatedAtBracket = 2; winner.eliminatedAtBracket = 1;
  return { winner, loser, p1, p2, p1Total, p2Total, days, playoffs };
}

// Tour state
const POOL_SIZE = 2000;
const EVENTS_PER_SEASON = { majors: 4, regulars: 8, main: 1 };
const MAJOR_FIELD = 256;
const REGULAR_FIELD = 128;
const MAIN_FIELD = 1024;
const MAJOR_EXEMPTION = 5;
const MAJOR_NAMES = ['The Hive Invitational', 'The Nectar Open', 'The Clubhouse Classic', 'The Pollen Championship'];
const REGULAR_PREFIX = ['Spring', 'Meadow', 'Honeydew', 'Clover', 'Thistle', 'Wildflower', 'Fairway', 'Azalea'];
const MAIN_NAME = 'The Moneymaker Main Event';

const TourState = {
  pool: null, seasons: [], currentSeason: 0,
  achievements: {}, activeGame: null,
  preferences: { theme: 'day', speed: 'fast' },
};

function buildPool(size) {
  const pool = [];
  for (let i = 1; i <= size; i++) {
    const target = sampleTargetSkill();
    const profile = makeProfileForSkill(target, null);
    pool.push({
      id: i, name: 'Player #' + i, profile,
      skill: target,
      authoredSkill: target,
      majorWins: 0, regularWins: 0, mainWins: 0, totalWins: 0, runnerUps: 0,
      eventsEntered: 0, majorsEntered: 0, regularsEntered: 0, mainsEntered: 0,
      lastMajorWin: null, firstMajorWin: null,
      careerSpanStart: null, careerSpanEnd: null,
      bestFinalsScore: 999, recentForm: [],
      currentSeasonPoints: 0, lastSeasonPoints: 0, qualSeasonYear: 0,
      reaches: { r1: 0, r4: 0, r2: 0, finals: 0, champ: 0 },
      buyInsPaid: 0, prizeEarned: 0, itmCount: 0, finalTableCount: 0, careerScore: 0,
    });
  }
  return pool;
}

function ensureQualifierState(p) {
  if (p.currentSeasonPoints == null) p.currentSeasonPoints = 0;
  if (p.lastSeasonPoints == null) p.lastSeasonPoints = 0;
  if (p.qualSeasonYear == null) p.qualSeasonYear = 0;
  if (!Array.isArray(p.recentForm)) p.recentForm = [];
  if (p.finalTableCount == null) p.finalTableCount = 0;
}

function syncQualificationSeason(pool, year) {
  for (const p of pool) {
    ensureQualifierState(p);
    if (!p.qualSeasonYear) {
      p.qualSeasonYear = year;
      continue;
    }
    if (p.qualSeasonYear < year) {
      p.lastSeasonPoints = (p.qualSeasonYear === year - 1) ? (p.currentSeasonPoints || 0) : 0;
      p.currentSeasonPoints = 0;
      p.qualSeasonYear = year;
    }
  }
}

function recentFormScore(p) {
  ensureQualifierState(p);
  const weights = { W: 8, RU: 5, FT: 2 };
  let score = 0;
  for (let i = 0; i < p.recentForm.length; i++) score += (weights[p.recentForm[i]] || 0) * Math.max(1, 5 - i);
  return score;
}

function seasonMeritScore(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) * 1.0 + (p.lastSeasonPoints || 0) * 0.65 + recentFormScore(p) + (p.runnerUps || 0) * 2;
}

function careerMeritScore(p) {
  ensureQualifierState(p);
  return (p.majorWins || 0) * 60 + (p.mainWins || 0) * 24 + (p.regularWins || 0) * 10 + (p.runnerUps || 0) * 6 + (p.finalTableCount || 0) * 1.5;
}

function openQualifierScore(p) {
  ensureQualifierState(p);
  return seasonMeritScore(p) * 1.15 + careerMeritScore(p) * 0.18 + recentFormScore(p) * 0.8 + (p.skill || 0) * 2.5;
}

function regularEntryScore(p) {
  ensureQualifierState(p);
  return seasonMeritScore(p) * 1.0 + careerMeritScore(p) * 0.14 + recentFormScore(p) * 0.6 + (p.skill || 0) * 3.0;
}

function regularQualifierEligible(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) >= 1 || (p.lastSeasonPoints || 0) >= 2 || (p.totalWins || 0) > 0 || (p.runnerUps || 0) > 0 || (p.finalTableCount || 0) > 0;
}

function majorQualifierEligible(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) >= 4 || (p.lastSeasonPoints || 0) >= 8 || (p.totalWins || 0) > 0 || (p.runnerUps || 0) > 0 || (p.finalTableCount || 0) > 0 || (p.majorWins || 0) > 0;
}

function allocateMajorBucketCounts(fieldSize, cfg) {
  const raw = [
    Math.max(0, +(cfg.majorChampShare != null ? cfg.majorChampShare : 0.18)),
    Math.max(0, +(cfg.majorRankingShare != null ? cfg.majorRankingShare : 0.32)),
    Math.max(0, +(cfg.majorSeasonShare != null ? cfg.majorSeasonShare : 0.22)),
    Math.max(0, +(cfg.majorCareerShare != null ? cfg.majorCareerShare : 0.13)),
    Math.max(0, +(cfg.majorOpenShare != null ? cfg.majorOpenShare : 0.15)),
  ];
  const total = raw.reduce((a, b) => a + b, 0) || 1;
  const normalized = raw.map(v => v / total);
  const exact = normalized.map(v => v * fieldSize);
  const counts = exact.map(v => Math.floor(v));
  let remaining = fieldSize - counts.reduce((a, b) => a + b, 0);
  const order = exact.map((v, i) => ({ i, frac: v - counts[i] })).sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < order.length && remaining > 0; k++, remaining--) counts[order[k].i]++;
  return { champs: counts[0], ranking: counts[1], season: counts[2], career: counts[3], open: counts[4] };
}

function takeQualified(list, count, selected, out, source, sourceCounts) {
  for (const p of list) {
    if (out.length >= count) break;
    if (selected.has(p.id)) continue;
    selected.add(p.id);
    p.majorQualPathCurrent = source || 'unknown';
    if (sourceCounts && source) sourceCounts[source] = (sourceCounts[source] || 0) + 1;
    out.push(p);
  }
}

function selectMajorField(pool, fieldSize, year, cfg) {
  syncQualificationSeason(pool, year);
  const counts = allocateMajorBucketCounts(fieldSize, cfg);
  const selected = new Set();
  const out = [];
  const sourceCounts = { champ: 0, ranking: 0, season: 0, career: 0, open: 0, fallback: 0 };
  const exemptYears = cfg.exemptionYears != null ? cfg.exemptionYears : MAJOR_EXEMPTION;

  const champs = pool
    .filter(p => p.lastMajorWin != null && (year - p.lastMajorWin) < exemptYears)
    .sort((a, b) => (b.majorWins - a.majorWins) || (seasonMeritScore(b) - seasonMeritScore(a)) || (b.skill - a.skill));
  takeQualified(champs, counts.champs, selected, out, 'champ', sourceCounts);

  const ranking = pool.slice().sort((a, b) => b.skill - a.skill);
  takeQualified(ranking, out.length + counts.ranking, selected, out, 'ranking', sourceCounts);

  const season = pool.slice().sort((a, b) => seasonMeritScore(b) - seasonMeritScore(a) || recentFormScore(b) - recentFormScore(a) || b.skill - a.skill);
  takeQualified(season, out.length + counts.season, selected, out, 'season', sourceCounts);

  const career = pool.slice().sort((a, b) => careerMeritScore(b) - careerMeritScore(a) || seasonMeritScore(b) - seasonMeritScore(a) || recentFormScore(b) - recentFormScore(a) || b.skill - a.skill);
  takeQualified(career, out.length + counts.career, selected, out, 'career', sourceCounts);

  const open = pool
    .filter(p => majorQualifierEligible(p))
    .sort((a, b) => (openQualifierScore(b) + Math.random() * 3) - (openQualifierScore(a) + Math.random() * 3));
  takeQualified(open, out.length + counts.open, selected, out, 'open', sourceCounts);

  if (out.length < fieldSize) {
    const fallback = pool.slice().sort((a, b) =>
      (seasonMeritScore(b) + careerMeritScore(b) * 0.30 + recentFormScore(b) * 0.5 + b.skill * 2.5) -
      (seasonMeritScore(a) + careerMeritScore(a) * 0.30 + recentFormScore(a) * 0.5 + a.skill * 2.5)
    );
    takeQualified(fallback, fieldSize, selected, out, 'fallback', sourceCounts);
  }
  const field = out.slice(0, fieldSize);
  field.majorQualifierSourceCounts = sourceCounts;
  return field;
}

function selectRegularField(pool, fieldSize, year) {
  syncQualificationSeason(pool, year);
  const selected = new Set();
  const out = [];
  const meritCount = Math.max(1, Math.round(fieldSize * 0.65));
  const rankingCount = Math.max(0, Math.round(fieldSize * 0.20));
  const openCount = Math.max(0, fieldSize - meritCount - rankingCount);
  const merit = pool.slice().sort((a, b) => regularEntryScore(b) - regularEntryScore(a) || b.skill - a.skill);
  takeQualified(merit, meritCount, selected, out);
  const ranking = pool.slice().sort((a, b) => b.skill - a.skill);
  takeQualified(ranking, meritCount + rankingCount, selected, out);
  const open = pool
    .filter(p => regularQualifierEligible(p))
    .sort((a, b) => (regularEntryScore(b) + Math.random() * 2.5) - (regularEntryScore(a) + Math.random() * 2.5));
  takeQualified(open, meritCount + rankingCount + openCount, selected, out);
  if (out.length < fieldSize) {
    const fallback = pool.slice().sort((a, b) => (regularEntryScore(b) + b.skill * 1.5) - (regularEntryScore(a) + a.skill * 1.5));
    takeQualified(fallback, fieldSize, selected, out);
  }
  return out.slice(0, fieldSize);
}

function selectField(eventType, year) {
  const pool = TourState.pool;
  if (eventType === 'main') {
    const shuffled = pool.slice();
    for (let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=t; }
    return shuffled.slice(0, MAIN_FIELD);
  }
  if (eventType === 'regular') return selectRegularField(pool, REGULAR_FIELD, year);
  if (eventType === 'major') {
    return selectMajorField(pool, MAJOR_FIELD, year, {
      exemptionYears: MAJOR_EXEMPTION,
      majorChampShare: 0.18,
      majorRankingShare: 0.32,
      majorSeasonShare: 0.22,
      majorCareerShare: 0.13,
      majorOpenShare: 0.15,
    });
  }
  return pool.slice(0, 32);
}

function runTourEvent(eventType, year, eventName) {
  const field = selectField(eventType, year);
  const players = field.map(p => ({
    id: p.id, name: p.name, profile: p.profile, poolRef: p,
    stats: makeFreshStats(), eliminatedAtBracket: null, path: [],
  }));
  let remaining = players.slice();
  while (remaining.length > 16) { const r = runKnockoutRound(remaining, 9); remaining = r.winners; }
  while (remaining.length > 2) { const r = runKnockoutRound(remaining, 18); remaining = r.winners; }
  const finals = runFinals(remaining[0], remaining[1]);
  const champ = finals.winner.poolRef;
  const ru = finals.loser.poolRef;
  // Read finals-only stroke total from runFinals's return, not from wrapper.stats.
  // The wrapper stats now include bracket-round strokes (we removed the reset that
  // used to erase them), so we must use p1Total/p2Total for champScore/ruScore.
  const champScore = finals.winner === finals.p1 ? finals.p1Total : finals.p2Total;
  const ruScore    = finals.loser  === finals.p1 ? finals.p1Total : finals.p2Total;
  const champQualifierPath = eventType === 'major' ? (champ.majorQualPathCurrent || 'unknown') : null;
  if (eventType === 'major') {
    champ.majorWins++; champ.lastMajorWin = year;
    if (champ.firstMajorWin == null) champ.firstMajorWin = year;
  } else if (eventType === 'regular') champ.regularWins++;
  else if (eventType === 'main') champ.mainWins++;
  champ.totalWins++;
  champ.recentForm.unshift('W'); if (champ.recentForm.length > 5) champ.recentForm.pop();
  ru.runnerUps++;
  ru.recentForm.unshift('RU'); if (ru.recentForm.length > 5) ru.recentForm.pop();
  if (champScore < champ.bestFinalsScore) champ.bestFinalsScore = champScore;
  for (const p of field) {
    p.eventsEntered++;
    if (eventType === 'major') p.majorsEntered++;
    else if (eventType === 'regular') p.regularsEntered++;
    else p.mainsEntered++;
    if (p.careerSpanStart == null) p.careerSpanStart = year;
    p.careerSpanEnd = year;
  }
  return { type: eventType, name: eventName, fieldSize: field.length, champId: champ.id, ruId: ru.id, champScore, ruScore, finalsDays: finals.days.map(d => [d.p1Score, d.p2Score]), playoffs: finals.playoffs.length };
}

function yieldToUI() { return new Promise(r => setTimeout(r, 0)); }
function createProgressThrottler(onProgress, opts) {
  opts = opts || {};
  const progressMs = opts.progressMs || 120;
  const yieldMs = opts.yieldMs || 160;
  let lastProgressAt = 0;
  let lastYieldAt = 0;
  return {
    async tick(info) {
      const now = performance.now();
      if (onProgress && (now - lastProgressAt >= progressMs || info.force)) {
        lastProgressAt = now;
        onProgress(info);
      }
      if (now - lastYieldAt >= yieldMs || info.force) {
        lastYieldAt = now;
        await yieldToUI();
      }
    }
  };
}

async function runSeason(year, onProgress) {
  const events = [];
  for (let m=0; m<EVENTS_PER_SEASON.majors; m++) {
    const ev = runTourEvent('major', year, MAJOR_NAMES[m]);
    ev.year = year; ev.season_slot = m+1;
    events.push(ev);
    if (onProgress) { onProgress('major', m+1, 4, events.length, events); await yieldToUI(); }
  }
  for (let r=0; r<EVENTS_PER_SEASON.regulars; r++) {
    const ev = runTourEvent('regular', year, REGULAR_PREFIX[r % REGULAR_PREFIX.length] + ' Open');
    ev.year = year; ev.season_slot = r+1;
    events.push(ev);
    if (onProgress) { onProgress('regular', r+1, 8, events.length, events); await yieldToUI(); }
  }
  const ev = runTourEvent('main', year, MAIN_NAME);
  ev.year = year; ev.season_slot = 1;
  events.push(ev);
  if (onProgress) { onProgress('main', 1, 1, events.length, events); await yieldToUI(); }
  return { year, events };
}

// Career composite weighting: majors are the prestige event (invite-gated, skill-concentrated,
// analogous to the Masters/US Open); the Main Event is the luck-dominated mega-field (WSOP
// analog); regulars are the meritocratic weekly grind. So majors > main event > regular.
function composite(p) { return p.majorWins * 10 + p.mainWins * 5 + p.regularWins * 2; }

// DOM helpers for safe SVG cloning
function buzzAvatarSVG(size) {
  const src = $('.brand-mark');
  if (!src) return el('span');
  const clone = src.cloneNode(true);
  clone.setAttribute('width', size || 54);
  clone.setAttribute('height', size || 54);
  clone.removeAttribute('class');
  return clone;
}

function formatScore(n) {
  if (n == null) return '-';
  if (n > 0) return '+' + n;
  return String(n);
}

function statCard(label, value, delta, valueClass) {
  return el('div', { class: 'stat' },
    el('div', { class: 'label', text: label }),
    el('div', { class: 'value' + (valueClass ? ' ' + valueClass : ''), text: String(value) }),
    delta ? el('div', { class: 'delta', text: delta }) : null
  );
}

function playerName(id) {
  if (!TourState.pool) return '#' + id;
  const p = TourState.pool.find(pp => pp.id === id);

const Views = {};

const WIDE_VIEWS = new Set(['simulator']);

function showView(name) {
  $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === name));
  $$('nav.nav a').forEach(a => a.classList.toggle('active', a.dataset.route === name));
  const content = $('#content');
  if (content) content.classList.toggle('view-wide', WIDE_VIEWS.has(name));
  if (Views[name]) Views[name]();
  window.scrollTo(0, 0);
}

function onHashChange() {
  const parsed = parseHashRoute();
  // Back-compat: redirect legacy #season and #lab to the unified #simulator route.
  if (parsed.view === 'season' || parsed.view === 'lab') {
    const mode = parsed.view === 'lab' ? 'advanced' : 'simple';
    const extra = Object.keys(parsed.params).filter(k => k !== 'mode').map(k => '&' + encodeURIComponent(k) + '=' + encodeURIComponent(parsed.params[k])).join('');
    location.replace(location.pathname + location.search + '#simulator?mode=' + mode + extra);
    return;
  }
  const valid = ['dashboard','simulator','events','players','hof','analytics','compare','rules','buzz','multiplayer'];
  const name = valid.indexOf(parsed.view) !== -1 ? parsed.view : 'dashboard';
  if (name === 'players' && !parsed.params.profileId) PlayersState.profileId = null;
  if (document.startViewTransition) {
    document.startViewTransition(() => showView(name));
  } else {
    const content = $('#content');
    if (content) content.classList.add('transitioning');
    setTimeout(() => { showView(name); if (content) content.classList.remove('transitioning'); }, 20);
  }
}

// Themed AI opponent names by skill tier — gives each match a personality.
const SOLO_AI_NAMES = {
  beginner: ['Pollen', 'Larva', 'Bumble Jr', 'Honey Cub', 'Drone Recruit'],
  casual:   ['Worker Bee', 'Honey Picker', 'Wasp Cadet', 'Hive Scout', 'Nectar Drifter'],
  pro:      ['Forager', 'Stinger', 'Hive Tactician', 'Comb Master', 'Apex Drone'],
  elite:    ['Queen Bee', 'Hive Champion', 'The Swarm', 'Royal Stinger', 'Nectar King'],
};
function pickAINameForTier(tier) {
  const list = SOLO_AI_NAMES[tier] || SOLO_AI_NAMES.casual;
  return list[Math.floor(Math.random() * list.length)];
}

function startSolo(playerName, skill, tier, holes, cap) {
  const aiName = pickAINameForTier(tier);
  const aiProfile = makeProfileForSkill(Math.max(0.05, Math.min(0.95, +skill || 0.40)));
  // Sync the global stroke cap so AI's decideFor uses the same cap as the human's UI.
  setStrokeCap(cap);
  const g = createLocalGame(playerName, aiName, 'solo');
  g.totalHoles = Math.max(1, Math.min(144, +holes || 18));
  g.strokeCap = cap;
  g.aiSkill = skill;
  g.aiTier = tier;
  g.aiProfile = aiProfile;
  // Human is p1; AI is p2. turnFor stays 'p1' so the action UI is always shown
  // for the human's perspective (no pass-the-device prompt).
  g.turnFor = 'p1';
  TourState.activeGame = g;
  renderActiveMP();
  toast('Solo match started · ' + holes + ' holes vs ' + aiName + ' (skill ' + (+skill).toFixed(2) + ')');
  // If the deal landed with AI to act first (heads-up dealer convention puts the
  // non-dealer on the action), kick off their turn after the render settles.
  scheduleAITurnIfNeeded(g);
}

// In solo mode, after every state change check whether it's the AI's turn and,
// if so, queue their decision asynchronously. The brief delay (350ms) gives the
// human time to read the action that just happened — the AI doesn't feel robotic.
function scheduleAITurnIfNeeded(g) {
  if (!g || g.mode !== 'solo' || g.ended) return;
  const c = g.current;
  if (!c || c.result || c.toAct == null) return;
  if (c.toAct !== 'p2') return; // p2 is always the AI in solo mode
  setTimeout(() => aiTakeTurn(g), 350);
}

function aiTakeTurn(g) {
  if (!g || g.mode !== 'solo' || g.ended) return;
  const c = g.current;
  if (!c || c.result || c.toAct !== 'p2') return;
  // Re-sync the global stroke cap in case the user opened the simulator and
  // changed it mid-match — the AI must respect the cap that this match was
  // created with, not whatever the simulator slider currently says.
  if (g.strokeCap) setStrokeCap(g.strokeCap);
  const profile = g.aiProfile || makeProfileForSkill(0.40);
  const decision = decideFor(
    c.p2Cards,           // AI's hole cards
    c.community,         // visible community
    c.currentBet,        // street's current bet
    c.matched.p2,        // AI's matched amount this street
    c.strokes,           // accumulated strokes from prior streets
    profile,             // AI's profile (skill-derived thresholds)
    c.matched.p1         // human's matched amount this street (range read)
  );
  switch (decision.action) {
    case 'fold':  mpAct(g, 'fold'); break;
    case 'check': mpAct(g, 'check'); break;
    case 'call':  mpAct(g, 'call'); break;
    case 'bet':   mpAct(g, 'bet', Math.max(1, decision.amount | 0)); break;
    case 'raise': mpAct(g, 'raise', Math.max(1, decision.amount | 0)); break;
    default:      mpAct(g, 'check'); break; // safety fallback
  }
}

function createLocalGame(p1name, p2name, mode) {
  return {
    mode, p1: { name: p1name, total: 0 }, p2: { name: p2name, total: 0 },
    holeNum: 1, totalHoles: 18, scores: [],
    current: newHoleState('p1'), turnFor: 'p1',
    started: Date.now(), ended: false,
    // Snapshot the active stroke cap so mid-game config changes don't alter this match.
    strokeCap: CurrentStrokeCap,
  };
}

function newHoleState(dealer) {
  const deck = shuffle(makeDeck());
  return {
    deck, street: 'preflop', strokes: 0, currentBet: 0,
    matched: { p1: 0, p2: 0 }, hasActed: { p1: false, p2: false },
    toAct: dealer === 'p1' ? 'p2' : 'p1',
    dealer, folded: null, result: null,
    p1Cards: [deck.pop(), deck.pop()],
    p2Cards: [deck.pop(), deck.pop()],
    community: [],
  };
}

function maybeEmitBuzzTip(g) {
  if (!g || g.ended) return;
  const c = g.current; if (!c || c.result) return;
  // In hot-seat, only show tip after "Ready" has been pressed (turnFor === toAct)
  if (g.mode === 'hotseat' && g.turnFor !== c.toAct) return;
  // Only emit once per street
  if (c.lastTipStreet === c.street) return;
  c.lastTipStreet = c.street;
  const actor = c.toAct;
  const hand = actor === 'p1' ? c.p1Cards : c.p2Cards;
  const board = c.community || [];
  const strength = estimateStrength(hand, board);
  let tip = null;
  const street = c.street;
  if (street === 'preflop') {
    if (strength > 0.65) tip = 'Premium starting hand. Sweeten the pot off the Tea Box.';
    else if (strength < 0.35) tip = 'Weak starting cards. Check or fold to any raise.';
    else tip = 'Middling Tea Box read. See a cheap Drive if you can.';
  } else if (street === 'flop') {
    if (strength > 0.72) tip = 'Strong connection to this board. Pour honey in the pot.';
    else if (strength < 0.35) tip = "This Drive didn't help. Pot-control or fold.";
    else tip = 'Marginal Drive. Keep the pot manageable.';
  } else if (street === 'turn') {
    if (strength > 0.75) tip = 'You likely lead. Charge the draws — make them pay.';
    else if (strength < 0.4) tip = "The Hazard didn't improve you. Consider giving up — or sting them.";
    else tip = 'Check-decide territory. Avoid bloating the pot.';
  } else if (street === 'river') {
    if (strength > 0.80) tip = 'Putt for value — size for a call you can beat.';
    else if (strength < 0.4) tip = 'Sting or check — weigh whether the bluff sells.';
    else tip = 'Showdown-value hand. Keep it small.';
  }
  if (tip) {
    $$('.buzz-live-tip').forEach(t => t.remove());
    const tips = el('div', { class: 'buzz-live-tip' });
    const av = buzzAvatarSVG(30);
    tips.appendChild(av);
    tips.appendChild(el('span', { class: 'tip-mark', text: '💭' }));
    const actorName = actor === 'p1' ? g.p1.name : g.p2.name;
    tips.appendChild(el('span', { text: 'Coach to ' + actorName + ': ' + tip }));
    const gameTable = $('.game-table');
    if (gameTable && gameTable.parentNode) gameTable.parentNode.insertBefore(tips, gameTable.nextSibling);
  }
}

function renderGameTable(g) {

  // real opponent. Hotseat: cards visible only to whoever has the device. Sharelink:
  // both visible (each player only sees their own URL state, this is the merged view).
  const showP2 = g.mode === 'hotseat' ? g.turnFor === 'p2'
              : g.mode === 'solo'    ? false
              : true;
  const showP1 = g.mode === 'hotseat' ? g.turnFor === 'p1'
              : true; // human (solo) and sharelink both see p1
  const resolvedOrShowdown = c.result || c.street === 'showdown';

  const p2Seat = el('div', { class: 'seat' });
  p2Seat.appendChild(el('span', { class: 'seat-name' + (c.toAct === 'p2' && !c.result ? ' active' : '') }, g.p2.name + ' · ' + formatScore(g.p2.total)));
  const p2Cards = el('div', { class: 'cards-row' });
  if (showP2 || resolvedOrShowdown) c.p2Cards.forEach(card => p2Cards.appendChild(cardFaceDom(card)));
  else p2Cards.appendChild(el('div', { class: 'hidden-cards' }, 'Hidden — ' + g.p2.name + ' cards'));
  p2Seat.appendChild(p2Cards);
  tbl.appendChild(p2Seat);

  const commRow = el('div', { class: 'cards-row', style: 'margin: 14px 0;' });
  for (let i=0; i<5; i++) {
    if (i < c.community.length) commRow.appendChild(cardFaceDom(c.community[i]));
    else commRow.appendChild(el('div', { class: 'card-face placeholder' }));
  }
  tbl.appendChild(commRow);

  const potWrap = el('div', { style: 'text-align: center;' });
  potWrap.appendChild(el('div', { class: 'pot-info' },
    el('span', null, 'Street: ', el('b', { text: streetLabel(c.street) })),
    el('span', null, 'Strokes: ', el('b', { text: c.strokes + '/3' })),
    el('span', null, 'Bet: ', el('b', { text: '+' + c.currentBet }))
  ));
  tbl.appendChild(potWrap);

  const p1Seat = el('div', { class: 'seat' });
  p1Seat.appendChild(el('span', { class: 'seat-name' + (c.toAct === 'p1' && !c.result ? ' active' : '') }, g.p1.name + ' · ' + formatScore(g.p1.total)));
  const p1Cards = el('div', { class: 'cards-row' });
  if (showP1 || resolvedOrShowdown) c.p1Cards.forEach(card => p1Cards.appendChild(cardFaceDom(card)));
  else p1Cards.appendChild(el('div', { class: 'hidden-cards' }, 'Hidden — ' + g.p1.name + ' cards'));
  p1Seat.appendChild(p1Cards);
  tbl.appendChild(p1Seat);

  const actions = el('div', { class: 'actions-row' });
  if (c.result) {
    actions.appendChild(el('div', { class: 'result-banner' }, c.result.desc));
    if (!g.ended) actions.appendChild(el('button', { class: 'btn gold', onclick: () => mpNextHole(g) }, 'Next Hole →'));
  } else if (g.mode === 'solo' && c.toAct !== 'p1') {
    // AI is thinking — show a passive banner instead of action buttons. The
    // scheduleAITurnIfNeeded timer will fire and apply the AI's move shortly.
    actions.appendChild(el('div', { class: 'result-banner' }, '🐝 ', el('b', { text: g.p2.name }), ' is sizing up the pot…'));
  } else if (g.mode === 'hotseat' && g.turnFor !== c.toAct && g.turnFor != null) {
    actions.appendChild(el('div', { class: 'result-banner' }, 'Pass the device to ', el('b', { text: (c.toAct === 'p1' ? g.p1.name : g.p2.name) })));
    actions.appendChild(el('button', { class: 'btn outline small', onclick: () => { g.turnFor = c.toAct; renderActiveMP(); } }, 'Ready'));
  } else {
    const canCheck = c.currentBet === c.matched[c.toAct];
    const toCall = c.currentBet - c.matched[c.toAct];
    const gameCap = g.strokeCap || CurrentStrokeCap;
    const rem = gameCap - c.strokes - c.currentBet;
    if (canCheck) actions.appendChild(el('button', { class: 'btn', onclick: () => mpAct(g, 'check') }, 'Check'));
    else actions.appendChild(el('button', { class: 'btn', onclick: () => mpAct(g, 'call') }, 'Call (+' + toCall + ')'));
    for (let i = 1; i <= Math.min(gameCap, rem); i++) {
      actions.appendChild(el('button', { class: 'btn outline', onclick: () => mpAct(g, canCheck ? 'bet' : 'raise', i) }, (canCheck ? 'Bet ' : 'Raise ') + i));
    }
    actions.appendChild(el('button', { class: 'btn fold', onclick: () => mpAct(g, 'fold') }, 'Fold'));
  }
  tbl.appendChild(actions);
  return tbl;

function cardFaceDom(card) {
  const isRed = card.suit === 'H' || card.suit === 'D';
  return el('div', { class: 'card-face' + (isRed ? ' red' : '') },
    el('div', { class: 'rank', text: rankName(card.rank) }),
    el('div', { class: 'suit', text: SUIT_GLYPH[card.suit] })
  );
}

// Yellow Jacket street jargon — every phase of the hole gets a golf-themed name.
//   preflop  → Tea Box  (hole cards + blinds, the player addresses the ball)
//   flop     → Drive    (first three community cards — the big opening swing)
//   turn     → Hazard   (fourth card — the trouble street)
//   river    → Putt     (fifth and final card — closing stroke)
//   showdown → The Cup  (cards revealed; the ball is in the cup, hole complete)
// Internal enum values stay as 'preflop'/'flop'/'turn'/'river'/'showdown' so all
// existing game logic, betting rounds, and equity tables keep working. Only the
// display label is themed.
function streetLabel(s) { return { preflop: 'Tea Box', flop: 'Drive', turn: 'Hazard', river: 'Putt', showdown: 'The Cup' }[s] || s; }

function mpAct(g, action, amount) {
  const c = g.current;
  if (c.result || c.toAct == null) return;
  const actor = c.toAct;
  const other = actor === 'p1' ? 'p2' : 'p1';
  if (action === 'fold') {
    c.folded = actor;
    resolveMPHole(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return;
  }
  if (action === 'check') {
    if (c.currentBet !== c.matched[actor]) return;
    c.hasActed[actor] = true;
    if (c.hasActed[other] && c.matched[other] === c.currentBet) { advanceMPRound(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return; }
    c.toAct = other;
  } else if (action === 'call') {
    if (c.currentBet <= c.matched[actor]) return;
    c.matched[actor] = c.currentBet;
    c.hasActed[actor] = true;
    advanceMPRound(g); renderActiveMP(); scheduleAITurnIfNeeded(g); return;
  } else if (action === 'bet' || action === 'raise') {
    const gameCap = g.strokeCap || CurrentStrokeCap;
    if (!amount || c.strokes + c.currentBet + amount > gameCap) return;
    c.currentBet += amount;
    c.matched[actor] = c.currentBet;
    c.hasActed[actor] = true;
    c.hasActed[other] = false;
    c.toAct = other;
  }
  if (g.mode === 'hotseat' && c.toAct) g.turnFor = null;
  renderActiveMP();
}

function advanceMPRound(g) {
  const c = g.current;
  c.strokes += c.currentBet;
  c.currentBet = 0;
  c.matched = { p1: 0, p2: 0 };
  c.hasActed = { p1: false, p2: false };
  if (c.street === 'preflop') { c.community.push(c.deck.pop(), c.deck.pop(), c.deck.pop()); c.street = 'flop'; }
  else if (c.street === 'flop') { c.community.push(c.deck.pop()); c.street = 'turn'; }
  else if (c.street === 'turn') { c.community.push(c.deck.pop()); c.street = 'river'; }
  else if (c.street === 'river') { c.street = 'showdown'; resolveMPHole(g); return; }
  const gameCap = g.strokeCap || CurrentStrokeCap;
  if (c.strokes >= gameCap) {
    while (c.community.length < 5) c.community.push(c.deck.pop());
    c.street = 'showdown';
    resolveMPHole(g); return;
  }
  c.toAct = c.dealer === 'p1' ? 'p2' : 'p1';
  if (g.mode === 'hotseat') g.turnFor = null;
}

function resolveMPHole(g) {
  const c = g.current;
  let p1s, p2s, desc;
  if (c.folded) {
    // Stroke-Honey fold path mirrors playHole: street-based concession scorecard,
    // bettor takes the wagered pot as a honey credit which subtracts from their score.
    const streetIdx = (c.community.length < 3) ? 0 : (c.community.length === 3) ? 1 : (c.community.length === 4) ? 2 : 3;
    const folderScore = [2, 1, 1, 0][streetIdx];
    const bettorScore = [0, -1, -1, -2][streetIdx];
    const folderSide = c.folded;
    const bettorSide = folderSide === 'p1' ? 'p2' : 'p1';
    const folderRaw = folderScore;
    const bettorRaw = bettorScore - c.strokes; // honey credit reduces score
    p1s = folderSide === 'p1' ? folderRaw : bettorRaw;
    p2s = folderSide === 'p2' ? folderRaw : bettorRaw;
    const folderName = folderSide === 'p1' ? g.p1.name : g.p2.name;
    const bettorName = bettorSide === 'p1' ? g.p1.name : g.p2.name;
    desc = folderName + ' folded. ' + bettorName + ' takes the ' + c.strokes + '-stroke honey pot. ' + folderName + ' ' + formatScore(folderRaw) + ', ' + bettorName + ' ' + formatScore(bettorRaw) + '.';
  } else {
    while (c.community.length < 5) c.community.push(c.deck.pop());
    const p1H = evaluate7(c.p1Cards, c.community);
    const p2H = evaluate7(c.p2Cards, c.community);
    const cmp = p1H - p2H;
    if (cmp === 0) {
      // Tied hole: both score par; pot carries to the next decisive hole.
      p1s = 0; p2s = 0;
      desc = 'Tie at ' + CATEGORY_NAMES[p1H >>> 24] + '. Both score par. The ' + c.strokes + '-stroke honey pot carries forward.';
    }
    else {
      const p1Wins = cmp > 0;
      const winnerHand = p1Wins ? p1H : p2H;
      const winnerGolf = golfScoreFromHandValue(winnerHand);
      const loserGolf = golfScoreFromHandValue(p1Wins ? p2H : p1H);
      // Winner's score = own golf score − honey pot (pot improves their round).
      const winnerScore = winnerGolf - c.strokes;
      const loserScore = loserGolf;
      p1s = p1Wins ? winnerScore : loserScore;
      p2s = p1Wins ? loserScore : winnerScore;
      const winName = p1Wins ? g.p1.name : g.p2.name;
      const loseName = p1Wins ? g.p2.name : g.p1.name;
      desc = winName + ' wins with ' + CATEGORY_NAMES[winnerHand >>> 24] + ' and takes the ' + c.strokes + '-stroke honey pot. ' + winName + ' ' + formatScore(winnerScore) + ', ' + loseName + ' ' + formatScore(loserScore) + '.';
    }
  }
  g.p1.total += p1s; g.p2.total += p2s;
  g.scores.push({ p1: p1s, p2: p2s });
  c.result = { desc };
  if (g.mode === 'hotseat') g.turnFor = 'p1';
}

function mpNextHole(g) {
  if (g.holeNum >= g.totalHoles) {
    if (g.p1.total === g.p2.total) { toast('Tied — entering sudden-death playoff'); }
    else { g.ended = true; renderActiveMP(); return; }
  }
  g.holeNum++;
  const dealer = g.current.dealer === 'p1' ? 'p2' : 'p1';
  g.current = newHoleState(dealer);
  g.turnFor = g.mode === 'hotseat' ? null : 'p1';
  if (g.mode === 'sharelink') g.shareLink = encodeGameToURL(g);
  renderActiveMP();
  // If the new hole's first action falls on the AI (because dealer alternated
  // and they're now the non-dealer / first to act preflop), kick their turn.
  scheduleAITurnIfNeeded(g);
}

function simpleHash(s) {
  let h = 2166136261 >>> 0;
  for (let i=0; i<s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

function encodeGameToURL(g) {
  const data = {
    p1: g.p1, p2: g.p2, holeNum: g.holeNum, totalHoles: g.totalHoles,
    scores: g.scores,
    current: {
      deck: g.current.deck, street: g.current.street, strokes: g.current.strokes,
      currentBet: g.current.currentBet, matched: g.current.matched, hasActed: g.current.hasActed,
      toAct: g.current.toAct, dealer: g.current.dealer, folded: g.current.folded,
      result: g.current.result, p1Cards: g.current.p1Cards, p2Cards: g.current.p2Cards, community: g.current.community
    },
    started: g.started, ended: g.ended, mode: 'sharelink',
  };
  const payload = JSON.stringify(data);
  const checksum = simpleHash(payload);
  const encoded = btoa(unescape(encodeURIComponent(payload)));
  return location.origin + location.pathname + '#play/' + checksum + '/' + encoded;
}

function decodeGameFromURL(url) {
  try {
    const h = url.split('#')[1];
    if (!h || !h.startsWith('play/')) return null;
    const parts = h.split('/');
    if (parts.length < 3) return null;
    const checksum = parts[1];
    const encoded = parts.slice(2).join('/');
    const payload = decodeURIComponent(escape(atob(encoded)));
    if (simpleHash(payload) !== checksum) return null;
    return JSON.parse(payload);
  } catch (e) { return null; }
}

function getAllEvents() {
  const out = [];
  for (const s of TourState.seasons) for (const e of s.events) out.push(e);
  return out;
}

function playerById(id) { return TourState.pool ? TourState.pool.find(p => p.id === id) : null; }

function skillTier(p) {
  if (!TourState.pool) return { key: 'regular', label: 'Regular' };
  const sorted = TourState.pool.slice().sort((a,b) => b.skill - a.skill);
  const rank = sorted.findIndex(x => x.id === p.id);
  const pct = rank / sorted.length;
  if (pct < 0.10) return { key: 'elite', label: 'Elite' };
  if (pct < 0.25) return { key: 'contender', label: 'Contender' };
  if (pct < 0.60) return { key: 'regular', label: 'Regular' };
  return { key: 'fringe', label: 'Fringe' };
}

function marginOf(e) { return e.ruScore - e.champScore; }

function avatarSVG(playerId, size) {
  size = size || 64;
  const seed = playerId * 2654435761 >>> 0;
  const hue = (seed % 360);
  // Lift body saturation/lightness in Sunday mode so the avatar pops on the dark card bg.
  const isDark = document.documentElement.getAttribute('data-theme') === 'sunday';
  const body = isDark ? 'hsl(' + hue + ',65%,74%)' : 'hsl(' + hue + ',62%,68%)';
  const shade = isDark ? 'hsl(' + hue + ',55%,56%)' : 'hsl(' + hue + ',52%,45%)';
  // Features stay dark always — body fill is warm/pastel regardless of theme, so dark features contrast.
  const features = '#1B1B1B';
  const highlight = '#FFF';
  const stripeCount = 2 + (seed % 3);
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', '0 0 80 80'); svg.setAttribute('width', size); svg.setAttribute('height', size);
  function e(n, attrs) { const x = document.createElementNS('http://www.w3.org/2000/svg', n); for (const k in attrs) x.setAttribute(k, attrs[k]); return x; }
  svg.appendChild(e('circle', { cx: 40, cy: 40, r: 38, fill: body, stroke: shade, 'stroke-width': 2 }));
  for (let i = 0; i < stripeCount; i++) {
    const y = 26 + i * 12;
    svg.appendChild(e('path', { d: 'M 12 ' + y + ' Q 40 ' + (y+6) + ' 68 ' + y, stroke: features, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', opacity: 0.72 }));
  }
  const cheekX = (seed % 2) ? 56 : 52;
  svg.appendChild(e('circle', { cx: 26, cy: 36, r: 4, fill: features }));
  svg.appendChild(e('circle', { cx: cheekX, cy: 36, r: 4, fill: features }));
  svg.appendChild(e('circle', { cx: 25, cy: 34, r: 1.3, fill: highlight }));
  svg.appendChild(e('circle', { cx: cheekX - 1, cy: 34, r: 1.3, fill: highlight }));
  const smile = (seed >> 3) % 3;
  if (smile === 0) svg.appendChild(e('path', { d: 'M 30 50 Q 40 56 50 50', stroke: features, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }));
  else if (smile === 1) svg.appendChild(e('path', { d: 'M 32 50 L 48 50', stroke: features, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' }));
  else svg.appendChild(e('path', { d: 'M 30 48 Q 40 54 50 48 Q 50 52 40 56 Q 30 52 30 48 Z', fill: features }));
  svg.appendChild(e('circle', { cx: 22, cy: 44, r: 2.5, fill: '#FCE4EC', opacity: 0.8 }));
  svg.appendChild(e('circle', { cx: 58, cy: 44, r: 2.5, fill: '#FCE4EC', opacity: 0.8 }));
  return svg;
}

// Skill-profile → 6-axis radar values (0..1). Each axis is derived from an orthogonal
// slice of the profile so they don't mathematically mirror each other.
//   aggression  — how often the player raises (inverse of raise threshold)
//   patience    — how willing they are to fold marginal hands (fold threshold)
//   reads       — how calibrated their hand-strength estimate is (inverse of noise)
//   pressure    — how often they bet (inverse of bet threshold)
//   consistency — how narrow their decision band is (fold↔bet gap) — orthogonal to reads
//   stamina     — overall skill index (post-noise composite)
function playerRadar(p) {
  const pr = p.profile;
  const clamp = x => Math.min(1, Math.max(0, x));
  const noise = pr.noise != null ? pr.noise : 0.5;
  const foldT = pr.foldThreshold != null ? pr.foldThreshold : 0.3;
  const betT = pr.betThreshold != null ? pr.betThreshold : 0.55;
  const raiseT = pr.raiseThreshold != null ? pr.raiseThreshold : 0.75;
  const aggression = clamp(1 - raiseT);
  const patience = clamp(foldT / 0.6);                // fold thresholds are typically 0.1-0.5
  const reads = clamp(1 - noise * 2);                  // noise 0.0 → 1.0 reads, noise 0.5 → 0
  const pressure = clamp(1 - betT);
  const consistency = clamp(1 - Math.abs(betT - foldT) * 1.2); // tight decision window = steady
  const stamina = clamp(p.skill);
  return {
    aggression, patience, reads, pressure, consistency, stamina,
    axes: ['Aggression','Patience','Reads','Pressure','Consistency','Stamina']
  };
}

function computeLegendaryMoments() {
  const moments = [];
  const events = getAllEvents();
  // Below -15 finals
  for (const e of events) {
    if (e.champScore <= -15) {
      moments.push({
        year: e.year, type: 'historic-score', playerId: e.champId, score: e.champScore,
        title: 'Historic Round',
        narr: playerName(e.champId) + ' carved up the ' + e.name + ' at ' + formatScore(e.champScore) + ' — one of the lowest championship totals ever recorded.',
        stats: 'Year ' + e.year + ' · ' + e.name + ' · margin ' + (e.ruScore - e.champScore)
      });
    }
  }
  // Playoffs
  for (const e of events) {
    if (e.playoffs > 0) {
      moments.push({
        year: e.year, type: 'playoff', playerId: e.champId, score: e.playoffs,
        title: 'Sudden-Death Classic',
        narr: playerName(e.champId) + ' outlasted ' + playerName(e.ruId) + ' in a ' + e.playoffs + '-hole sudden-death playoff at the ' + e.name + '.',
        stats: 'Year ' + e.year + ' · ' + e.name + ' · ' + formatScore(e.champScore) + '-' + formatScore(e.ruScore)
      });
    }
  }
  // Back-to-back majors (same player, consecutive years, same major name or any major)
  const majorsByPlayer = {};
  for (const e of events) {
    if (e.type !== 'major') continue;
    if (!majorsByPlayer[e.champId]) majorsByPlayer[e.champId] = [];
    majorsByPlayer[e.champId].push(e);
  }
  for (const pid in majorsByPlayer) {
    const wins = majorsByPlayer[pid].slice().sort((a,b) => a.year - b.year);
    for (let i = 1; i < wins.length; i++) {
      if (wins[i].year === wins[i-1].year + 1) {
        moments.push({
          year: wins[i].year, type: 'back-to-back', playerId: +pid, score: wins[i].champScore,
          title: 'Back-to-Back',
          narr: playerName(+pid) + ' defended glory, winning a major in year ' + wins[i-1].year + ' and again in year ' + wins[i].year + '.',
          stats: wins[i-1].name + ' → ' + wins[i].name
        });
        break;
      }
    }
  }
  // Slam (all 4 unique major names in career)
  for (const pid in majorsByPlayer) {
    const names = new Set(majorsByPlayer[pid].map(e => e.name));
    if (names.size >= 4) {
      const last = majorsByPlayer[pid].slice().sort((a,b) => b.year - a.year)[0];
      moments.push({
        year: last.year, type: 'slam', playerId: +pid, score: majorsByPlayer[pid].length,
        title: 'Career Grand Slam',
        narr: playerName(+pid) + ' completed the career Grand Slam — victories at all four majors.',
        stats: majorsByPlayer[pid].length + ' total majors'
      });
    }
  }
  return moments.sort((a,b) => b.year - a.year || (b.score < a.score ? 1 : -1));
}

function computeH2H(aId, bId) {
  if (aId === bId) return null;
  const events = getAllEvents();
  let aWin = 0, bWin = 0, meetings = [];
  for (const e of events) {
    if ((e.champId === aId && e.ruId === bId) || (e.champId === bId && e.ruId === aId)) {
      if (e.champId === aId) aWin++; else bWin++;
      meetings.push(e);
    }
  }
  return { aWin, bWin, meetings };
}

function computeRecords() {
  const pool = TourState.pool || [];
  const events = getAllEvents();
  function topBy(arr, fn) { let best = null; for (const x of arr) if (fn(x) > 0 && (!best || fn(x) > fn(best))) best = x; return best; }
  const mostMajors = topBy(pool, p => p.majorWins);
  const mostMains = topBy(pool, p => p.mainWins);
  const mostRegulars = topBy(pool, p => p.regularWins);
  const mostWins = topBy(pool, p => p.totalWins);
  const mostRunnerUps = topBy(pool, p => p.runnerUps);
  let biggestBlowout = null, lowestScore = null;
  for (const e of events) {
    if (!biggestBlowout || marginOf(e) > marginOf(biggestBlowout)) biggestBlowout = e;
    if (!lowestScore || e.champScore < lowestScore.champScore) lowestScore = e;
  }
  // Longest win streak (consecutive years with at least one major)
  let longestStreak = { player: null, years: 0 };
  for (const p of pool) {
    const years = new Set();
    for (const s of TourState.seasons) for (const e of s.events) {
      if (e.type === 'major' && e.champId === p.id) years.add(s.year);
    }
    const ys = Array.from(years).sort((a,b) => a - b);
    let best = 0, cur = 0, last = null;
    for (const y of ys) { if (last == null || y === last + 1) cur++; else cur = 1; last = y; if (cur > best) best = cur; }
    if (best > longestStreak.years) longestStreak = { player: p, years: best };
  }
  return { mostMajors, mostMains, mostRegulars, mostWins, mostRunnerUps, biggestBlowout, lowestScore, longestStreak };
}

function computeAnalyticsSnapshot() {
  const events = getAllEvents();
  const pool = TourState.pool || [];
  const champScores = events.map(e => e.champScore);
  const scatter = pool.map(p => ({ skill: p.skill, majors: p.majorWins, total: p.totalWins }));
  // Single-pass indexing. Previously this function re-filtered `events` for every
  // (year, major) pair to count prior majors — O(Y × M × E) in a 100y × 400-major
  // run = ~16M comparisons. Now it's O(E), roughly 400.
  const majorsByYear = new Map();
  const priorMajorsByChamp = new Map();
  const yearSet = new Set();
  for (const e of events) {
    yearSet.add(e.year);
    if (e.type !== 'major') continue;
    let yrMajors = majorsByYear.get(e.year);
    if (!yrMajors) { yrMajors = []; majorsByYear.set(e.year, yrMajors); }
    yrMajors.push(e);
  }
  const years = Array.from(yearSet).sort((a, b) => a - b);
  const repeatByYear = years.map(y => {
    const yrMajors = majorsByYear.get(y) || [];
    let first = 0, repeat = 0;
    for (const e of yrMajors) {
      const seenCount = priorMajorsByChamp.get(e.champId) || 0;
      if (seenCount === 0) first++; else repeat++;
      priorMajorsByChamp.set(e.champId, seenCount + 1);
    }
    return { year: y, first, repeat };
  });
  const topTen = pool.slice().sort((a,b) => composite(b) - composite(a)).slice(0, 10);
  const bottomTen = pool.slice().sort((a,b) => composite(a) - composite(b)).slice(0, 10);
  function avgRadar(group) {
    if (group.length === 0) return { aggression:0,patience:0,reads:0,pressure:0,consistency:0,stamina:0 };
    const acc = { aggression:0,patience:0,reads:0,pressure:0,consistency:0,stamina:0 };
    for (const p of group) { const r = playerRadar(p); for (const k in acc) acc[k] += r[k]; }
    for (const k in acc) acc[k] /= group.length;
    return acc;
  }
  const radarTop = avgRadar(topTen);
  const radarBottom = avgRadar(bottomTen);
  // Wins by skill tier
  const sorted = pool.slice().sort((a,b) => b.skill - a.skill);
  const tier10 = Math.floor(sorted.length * 0.10);
  const tier25 = Math.floor(sorted.length * 0.25);
  const tier50 = Math.floor(sorted.length * 0.50);
  function tierStats(start, end) {
    const g = sorted.slice(start, end);
    return {
      majors: g.reduce((a,b) => a + b.majorWins, 0),
      regulars: g.reduce((a,b) => a + b.regularWins, 0),
      mains: g.reduce((a,b) => a + b.mainWins, 0),
    };
  }
  const tiers = [
    { label: 'Top 10%', ...tierStats(0, tier10) },
    { label: '10-25%', ...tierStats(tier10, tier25) },
    { label: '25-50%', ...tierStats(tier25, tier50) },
    { label: 'Bottom 50%', ...tierStats(tier50, sorted.length) },
  ];
  const finalsByType = { major: [], regular: [], main: [] };
  for (const e of events) finalsByType[e.type].push(e.champScore);
  return { champScores, scatter, repeatByYear, radarTop, radarBottom, tiers, finalsByType, eventCount: events.length, poolSize: pool.length };
}

function renderEventsTable() {
  const wrap = $('#evTableWrap'); if (!wrap) return;
  clear(wrap);
  const all = getAllEvents();
  const f = EventsState.filters;
  let rows = all.filter(e => {
    if (f.type !== 'all' && e.type !== f.type) return false;
    if (f.year !== 'all' && String(e.year) !== String(f.year)) return false;
    if (f.margin && marginOf(e) < f.margin) return false;
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!e.name.toLowerCase().includes(q) && !playerName(e.champId).toLowerCase().includes(q) && !playerName(e.ruId).toLowerCase().includes(q)) return false;
    }
    return true;
  });
  const s = EventsState.sort;
  rows.sort((a,b) => {
    let va, vb;
    if (s.col === 'year') { va = a.year * 20 + a.season_slot; vb = b.year * 20 + b.season_slot; }
    else if (s.col === 'type') { va = a.type; vb = b.type; }
    else if (s.col === 'event') { va = a.name; vb = b.name; }
    else if (s.col === 'field') { va = a.fieldSize; vb = b.fieldSize; }
    else if (s.col === 'champ') { va = a.champScore; vb = b.champScore; }
    else if (s.col === 'margin') { va = marginOf(a); vb = marginOf(b); }
    else if (s.col === 'ru') { va = a.ruScore; vb = b.ruScore; }
    else { va = a.year; vb = b.year; }
    if (va < vb) return s.dir === 'asc' ? -1 : 1;
    if (va > vb) return s.dir === 'asc' ? 1 : -1;
    return 0;
  });

  $('#evResultCount').textContent = rows.length + ' event' + (rows.length === 1 ? '' : 's');

  const table = el('table');
  const thead = el('thead');
  const trh = el('tr');
  const cols = [
    ['year', 'Year', false],
    ['type', 'Type', false],
    ['event', 'Event', false],
    ['field', 'Field', true],
    ['champ', 'Champion', true],
    ['ru', 'Runner-up', true],
    ['margin', 'Margin', true],
  ];
  cols.forEach(([key, label, isNum]) => {
    const th = el('th', { class: 'sortable' + (isNum ? ' num' : '') + (s.col === key ? ' sorted' + (s.dir === 'asc' ? ' asc' : '') : ''), text: label });
    th.onclick = () => {
      if (s.col === key) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.col = key; s.dir = 'desc'; }
      renderEventsTable();
    };
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);

  const tbody = el('tbody');
  const MAX_SHOW = 500;
  const shown = rows.slice(0, MAX_SHOW);
  for (const e of shown) {
    const tr = el('tr', { style: 'cursor: pointer;' });
    tr.onclick = () => openEventModal(e);
    tr.appendChild(el('td', { text: String(e.year) }));
    const chip = el('span', { class: 'chip' + (e.type === 'major' ? ' gold' : e.type === 'main' ? ' azalea' : ''), text: e.type.toUpperCase() });
    tr.appendChild(el('td', null, chip));
    tr.appendChild(el('td', { text: e.name }));
    tr.appendChild(el('td', { class: 'num', text: String(e.fieldSize) }));
    const champTd = el('td');
    const champ = playerById(e.champId);
    champTd.appendChild(el('b', null, el('span', { text: champ ? champ.name : '#' + e.champId })));
    champTd.appendChild(el('span', { class: 'mono', style: 'color: var(--green); margin-left: 8px;', text: formatScore(e.champScore) }));
    tr.appendChild(champTd);
    const ruTd = el('td');
    const ru = playerById(e.ruId);
    ruTd.appendChild(el('span', { text: ru ? ru.name : '#' + e.ruId }));
    ruTd.appendChild(el('span', { class: 'mono', style: 'color: var(--fairway); margin-left: 8px;', text: formatScore(e.ruScore) }));
    tr.appendChild(ruTd);
    tr.appendChild(el('td', { class: 'num gold', text: '+' + marginOf(e) }));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  if (rows.length > MAX_SHOW) wrap.appendChild(el('p', { class: 'ui-sans', style: 'text-align: center; color: var(--fairway); font-size: 11px; margin-top: 8px;', text: 'Showing first ' + MAX_SHOW + ' of ' + rows.length + ' · narrow filter for more' }));
}

function openEventModal(e) {
  openModal(body => {
    body.appendChild(el('div', { class: 'crumb', text: 'Year ' + e.year + ' · ' + e.type.toUpperCase() }));
    body.appendChild(el('h2', { text: e.name }));
    const champ = playerById(e.champId);
    const ru = playerById(e.ruId);
    body.appendChild(el('div', { class: 'stat-grid', style: 'margin: 12px 0;' },
      statCard('Field', e.fieldSize, 'players'),
      statCard('Champion', champ ? champ.name : '#' + e.champId, formatScore(e.champScore), 'gold'),
      statCard('Runner-up', ru ? ru.name : '#' + e.ruId, formatScore(e.ruScore)),
      statCard('Margin', '+' + marginOf(e), 'strokes')
    ));

    // Finals scorecard (animated reveal)
    body.appendChild(el('h3', { style: 'margin-top: 18px;', text: 'Finals Scorecard (72 holes condensed to 18-hole rounds)' }));
    const days = e.finalsDays || [];
    const sc = el('table', { class: 'scorecard' });
    const shead = el('thead');
    const htr = el('tr');
    htr.appendChild(el('th', { text: 'Round' }));
    days.forEach((_, i) => htr.appendChild(el('th', { text: 'R' + (i+1) })));
    htr.appendChild(el('th', { text: 'Total' }));
    shead.appendChild(htr); sc.appendChild(shead);
    const stb = el('tbody');
    const players = [[champ ? champ.name : '#' + e.champId, 0], [ru ? ru.name : '#' + e.ruId, 1]];
    players.forEach(([nm, idx], pidx) => {
      const tr = el('tr');
      tr.appendChild(el('td', { class: 'label', text: nm }));
      let total = 0;
      days.forEach((d, i) => {
        const v = d[idx];
        total += v;
        const td = el('td', { class: 'reveal ' + (v < 0 ? 'neg' : v > 0 ? 'pos' : ''), text: formatScore(v) });
        td.style.animationDelay = (pidx * 80 + i * 120) + 'ms';
        tr.appendChild(td);
      });
      tr.appendChild(el('td', { class: 'total ' + (total < 0 ? 'neg' : total > 0 ? 'pos' : ''), text: formatScore(total) }));
      stb.appendChild(tr);
    });
    sc.appendChild(stb);
    body.appendChild(sc);

    if (e.playoffs > 0) body.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--azalea-mid); margin-top: 10px; font-style: italic; font-size: 12px;', text: '+ ' + e.playoffs + ' sudden-death playoff hole' + (e.playoffs > 1 ? 's' : '') }));

    body.appendChild(el('div', { class: 'bracket-note', text: 'Single-elimination bracket: ' + e.fieldSize + ' → 16 (9-hole rounds) → 2 (18-hole rounds) → 72-hole final. Intermediate rounds are not individually stored; finals data is definitive.' }));

    body.appendChild(el('div', { style: 'margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap;' },
      el('button', { class: 'btn outline small', onclick: () => { closeModal(); if (champ) openProfile(champ.id); }, text: 'View Champion →' }),
      el('button', { class: 'btn outline small', onclick: () => { closeModal(); if (ru) openProfile(ru.id); }, text: 'View Runner-up →' }),
      el('button', { class: 'btn ghost small', style: 'margin-left: auto;', onclick: closeModal, text: 'Close' })
    ));
  }, { large: true });
}

function renderPlayerGrid() {
  const scroller = $('#plScroller'); const inner = $('#plInner');
  if (!scroller || !inner) return;
  const pool = TourState.pool || [];
  const f = PlayersState;
  let rows = pool.filter(p => {
    if (f.search) {
      const q = f.search.toLowerCase();
      if (!p.name.toLowerCase().includes(q) && !String(p.id).includes(q)) return false;
    }
    if (f.tier !== 'all') {
      const t = skillTier(p);
      if (t.key !== f.tier) return false;
    }
    return true;
  });
  rows.sort((a, b) => {
    if (f.sort === 'skill') return b.skill - a.skill;
    if (f.sort === 'composite') return composite(b) - composite(a);
    if (f.sort === 'majors') return b.majorWins - a.majorWins;
    if (f.sort === 'total') return b.totalWins - a.totalWins;
    return a.id - b.id;
  });

  const count = $('#plResultCount');
  if (count) count.textContent = rows.length + ' player' + (rows.length === 1 ? '' : 's');

  // Simple virtualization: only render visible + buffer
  const CARD_W = 200, CARD_H = 170, GAP = 12;
  const cols = Math.max(1, Math.floor((scroller.clientWidth - 8) / (CARD_W + GAP)));
  const rowCount = Math.ceil(rows.length / cols);
  const totalH = rowCount * (CARD_H + GAP);
  inner.style.height = totalH + 'px';
  clear(inner);

  function renderVisible() {
    const scrollTop = scroller.scrollTop;
    const start = Math.max(0, Math.floor(scrollTop / (CARD_H + GAP)) - 1);
    const end = Math.min(rowCount, Math.ceil((scrollTop + scroller.clientHeight) / (CARD_H + GAP)) + 1);
    clear(inner);
    for (let r = start; r < end; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        if (idx >= rows.length) break;
        const p = rows[idx];
        const top = r * (CARD_H + GAP);
        const left = c * (CARD_W + GAP);
        const card = el('div', { class: 'player-card' + (skillTier(p).key === 'elite' ? ' top-tier' : ''), style: 'position: absolute; top: ' + top + 'px; left: ' + left + 'px; width: ' + CARD_W + 'px; height: ' + CARD_H + 'px;' });
        card.onclick = () => openProfile(p.id);
        card.appendChild(avatarSVG(p.id, 64));
        card.appendChild(el('div', { class: 'p-name', text: p.name }));
        const tier = skillTier(p);
        card.appendChild(el('span', { class: 'chip tier-' + tier.key, text: tier.label }));
        card.appendChild(el('div', { class: 'p-record', style: 'margin-top: 6px;' },
          el('span', { class: 'pr-gold', text: p.majorWins + 'M' }), ' · ',
          el('span', { text: p.regularWins + 'R' }), ' · ',
          el('span', { text: p.mainWins + 'E' }), ' · ',
          el('span', { style: 'color: var(--green); font-weight: 600;', text: p.totalWins + 'W' })
        ));
        inner.appendChild(card);
      }
    }
  }
  renderVisible();
  scroller.onscroll = renderVisible;
}

function openProfile(id) {
  PlayersState.profileId = id;
  location.hash = '#players?profileId=' + id;
}

function renderPlayerProfile(id, view) {

  ));

  // Badges

  if (badges.length === 0) badgeCard.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--fairway); font-size: 12px;', text: 'No badges yet — every journey begins somewhere.' }));
  else {
    const bd = el('div', { class: 'badges' });
    for (const b of badges) bd.appendChild(el('span', { class: 'badge ' + (b.tier || '') },
      el('span', { class: 'b-icon', text: b.icon }),
      el('span', { text: b.label })
    ));
    badgeCard.appendChild(bd);
  }
  view.appendChild(badgeCard);

  const g2 = el('div', { class: 'grid-2' });

  // Radar
  const radarCard = el('div', { class: 'card' });
  radarCard.appendChild(el('h3', { text: 'Player Profile · 6-axis radar' }));
  const radarBox = el('div', { class: 'radar-box' });
  const radarCanvas = el('canvas', { width: '280', height: '280' });
  radarBox.appendChild(radarCanvas);
  radarCard.appendChild(radarBox);
  g2.appendChild(radarCard);

  // Career timeline
  const timelineCard = el('div', { class: 'card' });
  timelineCard.appendChild(el('h3', { text: 'Career timeline · wins per year' }));
  const tlCanvas = el('canvas', { width: '520', height: '240' });
  timelineCard.appendChild(tlCanvas);
  g2.appendChild(timelineCard);

  view.appendChild(g2);

  // H2H lookup
  const h2hCard = el('div', { class: 'card', style: 'margin-top: 16px;' });
  h2hCard.appendChild(el('h3', { text: 'Head-to-head lookup' }));
  const h2hRow = el('div', { style: 'display: flex; gap: 10px; flex-wrap: wrap; align-items: center;' });
  const oppInput = el('input', { type: 'search', placeholder: 'Opponent name or #', style: 'flex: 1; min-width: 180px;' });
  const h2hResult = el('div', { style: 'font-family: monospace; font-size: 12px; margin-top: 10px;' });
  oppInput.oninput = () => {
    const q = oppInput.value.trim().toLowerCase(); if (!q) { clear(h2hResult); return; }
    const match = TourState.pool.find(pp => pp.id !== p.id && (pp.name.toLowerCase().includes(q) || String(pp.id).includes(q)));
    clear(h2hResult);
    if (!match) { h2hResult.appendChild(el('span', { style: 'color: var(--fairway);', text: 'No match' })); return; }
    const h = computeH2H(p.id, match.id);
    h2hResult.appendChild(el('b', { text: p.name + ' ' + h.aWin + '–' + h.bWin + ' ' + match.name }));

    }
  };
  h2hRow.appendChild(oppInput);
  h2hCard.appendChild(h2hRow);
  h2hCard.appendChild(h2hResult);
  view.appendChild(h2hCard);

  // Draw charts after DOM attached
  setTimeout(() => {
    drawRadar(radarCanvas, [{ label: p.name, values: playerRadar(p) }]);
    drawCareerTimeline(tlCanvas, p);
  }, 10);
}

  if (r.longestStreak.player) recCard.appendChild(recordRow('Longest Major Streak', r.longestStreak.player, r.longestStreak.years + ' yr'));
  if (r.biggestBlowout) {

    recCard.appendChild(recordRow('Biggest Blowout', bp, '+' + marginOf(r.biggestBlowout) + ' strokes'));

// --- Canvas chart helpers ---
function chartColors() {
  const s = getComputedStyle(document.documentElement);
  function v(n, fallback) { const x = s.getPropertyValue(n).trim(); return x || fallback; }
  return {
    text: v('--chart-text', '#1B1B1B'),
    grid: v('--chart-grid', 'rgba(11,85,68,0.12)'),
    axis: v('--chart-axis', 'rgba(11,85,68,0.25)'),
    primary: v('--chart-series-primary', '#006747'),
    accent: v('--chart-series-accent', '#C9A857'),
    tertiary: v('--chart-series-tertiary', '#8E3A5F'),
    pos: v('--chart-pos', '#B85A3A'),
    neg: v('--chart-neg', '#1E7A4E'),
  };
}

function chartAxes(ctx, w, h, pad, yMin, yMax, xLabels, yFmt) {
  const C = chartColors();
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h - pad); ctx.lineTo(w - pad, h - pad); ctx.stroke();
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const v = yMin + (yMax - yMin) * (i / steps);
    const y = h - pad - (i / steps) * (h - 2 * pad);
    ctx.fillText(yFmt(v), 4, y + 3);
    if (i > 0) { ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke(); }
  }
  if (xLabels) {
    const step = (w - 2 * pad) / (xLabels.length);
    ctx.fillStyle = C.text;
    // Cull labels if too dense: aim for ~50px per label minimum
    const maxLabels = Math.max(2, Math.floor((w - 2 * pad) / 55));
    const stride = Math.max(1, Math.ceil(xLabels.length / maxLabels));
    xLabels.forEach((lbl, i) => {
      if (i % stride !== 0 && i !== xLabels.length - 1) return;
      const x = pad + step * (i + 0.5);
      const txtW = ctx.measureText(String(lbl)).width;
      ctx.fillText(lbl, x - txtW / 2, h - pad + 14);
    });
  }
}

function drawHistogram(canvas, data, min, max, bins, opts) {
  opts = opts || {};
  const w = canvas.width, h = canvas.height, pad = 40;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const binW = (max - min) / bins;
  const counts = new Array(bins).fill(0);
  let clipped = 0;
  for (const v of data) {
    if (v < min || v > max) clipped++;
    const idx = Math.min(bins - 1, Math.max(0, Math.floor((v - min) / binW)));
    counts[idx]++;
  }
  // Auto-log or explicit-log mode: avoids the "one giant bar dwarfs the tail" problem
  // that affects Actual-Win-Distribution (most players have 1 win, a few have many).
  // We plot log(1 + count) so zero bins stay at zero and the tail becomes visible.
  let maxCount = Math.max.apply(null, counts) || 1;
  const autoLog = opts.logScale === 'auto' && maxCount >= 10 * (counts.slice().sort((a,b) => b - a)[1] || 1);
  const useLog = opts.logScale === true || autoLog;
  let plotMax;
  if (useLog) {
    plotMax = Math.log(1 + maxCount);
  } else {
    plotMax = maxCount;
  }
  const labelFmt = opts.labelFormat || (v => v.toFixed(0));
  // Axis ticks should reflect the plot space. For log mode, show the raw count at the top.
  const axisMax = useLog ? maxCount : maxCount;
  chartAxes(ctx, w, h, pad, 0, axisMax, counts.map((_, i) => labelFmt(min + i * binW + binW / 2)), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  counts.forEach((c, i) => {
    const x = pad + (i / bins) * plotW;
    const bw = plotW / bins - 2;
    const val = useLog ? Math.log(1 + c) : c;
    const bh = (val / plotMax) * plotH;
    const binStart = min + i * binW;
    ctx.fillStyle = binStart < 0 ? C.neg : binStart < binW ? C.accent : C.pos;
    ctx.fillRect(x + 1, h - pad - bh, bw, bh);
  });
  if (useLog) {
    ctx.fillStyle = C.text; ctx.font = 'italic 10px -apple-system, sans-serif';
    ctx.fillText('log-scale y · bar height = ln(1+count)', pad + 6, pad + 12);
  }
  if (clipped > 0) {
    ctx.fillStyle = C.text; ctx.font = 'italic 10px -apple-system, sans-serif';
    ctx.fillText(clipped + ' outlier' + (clipped > 1 ? 's' : '') + ' clipped to range', pad + 6, pad + (useLog ? 26 : 12));
  }
  // Axis titles
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  if (opts.xLabel) {
    const t = opts.xLabel; const tw = ctx.measureText(t).width;
    ctx.fillText(t, (w + pad) / 2 - tw / 2, h - 4);
  }
  if (opts.yLabel) {
    ctx.save(); ctx.translate(12, h / 2); ctx.rotate(-Math.PI / 2);
    const t = opts.yLabel; ctx.fillText(t, -ctx.measureText(t).width / 2, 0);
    ctx.restore();
  }
}

function drawScatter(canvas, points) {
  const w = canvas.width, h = canvas.height, pad = 34;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const xMin = 0, xMax = 1;
  const yMax = Math.max(1, Math.max.apply(null, points.map(p => p.majors)) + 1);
  chartAxes(ctx, w, h, pad, 0, yMax, null, v => Math.round(v));
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  [0, 0.25, 0.5, 0.75, 1].forEach(v => {
    const x = pad + v * (w - 2 * pad);
    ctx.fillText(v.toFixed(2), x - 8, h - pad + 14);
  });
  ctx.fillText('Skill →', w - pad - 36, h - pad + 14);
  ctx.save(); ctx.translate(10, h / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('Majors', 0, 0); ctx.restore();
  for (const p of points) {
    const x = pad + (p.skill - xMin) / (xMax - xMin) * (w - 2 * pad);
    const y = h - pad - (p.majors / yMax) * (h - 2 * pad);
    ctx.fillStyle = C.primary + '66';
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, 2 * Math.PI); ctx.fill();
  }
}

function drawRadar(canvas, series) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const cx = w / 2, cy = h / 2 + 10, radius = Math.min(w, h) / 2 - 40;
  const axes = series[0] && series[0].values && series[0].values.axes ? series[0].values.axes : ['Aggression','Patience','Reads','Pressure','Consistency','Stamina'];
  const n = axes.length;
  // Grid
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (let r = 1; r <= 4; r++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (i / n) * Math.PI * 2;
      const x = cx + Math.cos(ang) * radius * (r / 4);
      const y = cy + Math.sin(ang) * radius * (r / 4);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  // Axes
  ctx.strokeStyle = C.axis;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (i / n) * Math.PI * 2;
    const x = cx + Math.cos(ang) * radius;
    const y = cy + Math.sin(ang) * radius;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = C.text; ctx.font = '11px -apple-system, sans-serif';
    const lx = cx + Math.cos(ang) * (radius + 14) - 22;
    const ly = cy + Math.sin(ang) * (radius + 14) + 4;
    ctx.fillText(axes[i], lx, ly);
  }
  // Series
  const keys = ['aggression','patience','reads','pressure','consistency','stamina'];
  const seriesColors = [C.primary, C.accent, C.tertiary];
  for (let si = 0; si < series.length; si++) {
    const s = series[si];
    const col = s.color && s.color.startsWith('#') ? s.color : seriesColors[si % seriesColors.length];
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.fillStyle = col + '33';
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const v = s.values[keys[i]] || 0;
      const ang = -Math.PI / 2 + (i / n) * Math.PI * 2;
      const x = cx + Math.cos(ang) * radius * v;
      const y = cy + Math.sin(ang) * radius * v;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // Legend
  ctx.font = '11px -apple-system, sans-serif';
  series.forEach((s, i) => {
    const col = s.color && s.color.startsWith('#') ? s.color : seriesColors[i % seriesColors.length];
    ctx.fillStyle = col;
    ctx.fillRect(12, 10 + i * 16, 12, 8);
    ctx.fillStyle = C.text;
    ctx.fillText(s.label, 30, 18 + i * 16);
  });
}

function drawLineStack(canvas, data) {
  const w = canvas.width, h = canvas.height, pad = 34;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  if (data.length === 0) return;
  const yMax = Math.max(4, Math.max.apply(null, data.map(d => d.first + d.repeat)));
  chartAxes(ctx, w, h, pad, 0, yMax, data.map(d => 'Y' + d.year), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const step = plotW / Math.max(1, data.length - 1);
  const barW = Math.min(26, plotW / data.length - 4);
  data.forEach((d, i) => {
    const x = pad + (data.length === 1 ? plotW / 2 : i * step) - barW / 2;
    const firstH = (d.first / yMax) * plotH;
    const repeatH = (d.repeat / yMax) * plotH;
    ctx.fillStyle = C.primary;
    ctx.fillRect(x, h - pad - firstH, barW, firstH);
    ctx.fillStyle = C.accent;
    ctx.fillRect(x, h - pad - firstH - repeatH, barW, repeatH);
  });
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillStyle = C.primary; ctx.fillRect(pad + 12, 12, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText('First-time', pad + 28, 20);
  ctx.fillStyle = C.accent; ctx.fillRect(pad + 108, 12, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText('Repeat', pad + 124, 20);
}

function drawGroupedBar(canvas, tiers) {
  const w = canvas.width, h = canvas.height, pad = 40;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const yMax = Math.max.apply(null, tiers.flatMap(t => [t.majors, t.regulars, t.mains])) * 1.1 || 1;
  chartAxes(ctx, w, h, pad, 0, yMax, tiers.map(t => t.label), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const groupW = plotW / tiers.length;
  const barW = (groupW - 12) / 3;
  tiers.forEach((t, i) => {
    const x0 = pad + i * groupW + 6;
    const vals = [['majors', C.accent], ['regulars', C.primary], ['mains', C.tertiary]];
    vals.forEach(([key, col], j) => {
      const v = t[key];
      const bh = (v / yMax) * plotH;
      ctx.fillStyle = col;
      ctx.fillRect(x0 + j * barW, h - pad - bh, barW - 2, bh);
    });
  });
  ctx.font = '11px -apple-system, sans-serif';
  const items = [['Majors', C.accent], ['Regulars', C.primary], ['Mains', C.tertiary]];
  items.forEach(([l, c], i) => {
    ctx.fillStyle = c; ctx.fillRect(pad + 12 + i * 80, 10, 10, 8);
    ctx.fillStyle = C.text; ctx.fillText(l, pad + 28 + i * 80, 18);
  });
}

function drawBoxplot(canvas, groups) {
  const w = canvas.width, h = canvas.height, pad = 40;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const allVals = Object.values(groups).flat();
  if (allVals.length === 0) return;
  const yMin = Math.min.apply(null, allVals) - 2;
  const yMax = Math.max.apply(null, allVals) + 2;
  const names = Object.keys(groups);
  chartAxes(ctx, w, h, pad, yMin, yMax, names.map(n => n), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / names.length;
  names.forEach((name, i) => {
    const vals = groups[name].slice().sort((a,b) => a-b);
    if (vals.length === 0) return;
    // Linear-interpolated quantile (Tukey-compatible for N>=4; degrades gracefully for tiny N)
    function quant(p) {
      const idx = p * (vals.length - 1);
      const lo = Math.floor(idx), hi = Math.ceil(idx);
      return vals[lo] + (vals[hi] - vals[lo]) * (idx - lo);
    }
    const q1 = quant(0.25), med = quant(0.5), q3 = quant(0.75);
    const mn = vals[0], mx = vals[vals.length - 1];
    function yOf(v) { return h - pad - ((v - yMin) / (yMax - yMin)) * plotH; }
    const cx = pad + colW * (i + 0.5);
    const boxW = Math.min(60, colW * 0.5);
    ctx.strokeStyle = C.primary; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, yOf(mn)); ctx.lineTo(cx, yOf(mx)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - boxW/3, yOf(mn)); ctx.lineTo(cx + boxW/3, yOf(mn)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - boxW/3, yOf(mx)); ctx.lineTo(cx + boxW/3, yOf(mx)); ctx.stroke();
    ctx.fillStyle = name === 'major' ? C.accent + '66' : name === 'main' ? C.tertiary + '66' : C.primary + '55';
    ctx.fillRect(cx - boxW/2, yOf(q3), boxW, yOf(q1) - yOf(q3));
    ctx.strokeRect(cx - boxW/2, yOf(q3), boxW, yOf(q1) - yOf(q3));
    ctx.strokeStyle = C.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - boxW/2, yOf(med)); ctx.lineTo(cx + boxW/2, yOf(med)); ctx.stroke();
  });
}

function drawCareerTimeline(canvas, p) {
  const w = canvas.width, h = canvas.height, pad = 34;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const years = TourState.seasons.map(s => s.year);
  if (years.length === 0) return;
  const data = years.map(y => {
    let major = 0, reg = 0, main = 0;
    const season = TourState.seasons.find(s => s.year === y);
    if (season) for (const e of season.events) {
      if (e.champId === p.id) {
        if (e.type === 'major') major++;
        else if (e.type === 'regular') reg++;
        else main++;
      }
    }
    return { year: y, major, reg, main };
  });
  const yMax = Math.max(1, Math.max.apply(null, data.map(d => d.major + d.reg + d.main)));
  chartAxes(ctx, w, h, pad, 0, yMax, data.map(d => 'Y' + d.year), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const step = plotW / data.length;
  const barW = Math.min(24, step - 4);
  data.forEach((d, i) => {
    const x = pad + step * i + (step - barW) / 2;
    let yTop = h - pad;
    if (d.major) { const bh = d.major / yMax * plotH; yTop -= bh; ctx.fillStyle = C.accent; ctx.fillRect(x, yTop, barW, bh); }
    if (d.reg) { const bh = d.reg / yMax * plotH; yTop -= bh; ctx.fillStyle = C.primary; ctx.fillRect(x, yTop, barW, bh); }
    if (d.main) { const bh = d.main / yMax * plotH; yTop -= bh; ctx.fillStyle = C.tertiary; ctx.fillRect(x, yTop, barW, bh); }
  });
  ctx.font = '11px -apple-system, sans-serif';
  const items = [['Major', C.accent], ['Regular', C.primary], ['Main', C.tertiary]];
  items.forEach(([l, c], i) => {
    ctx.fillStyle = c; ctx.fillRect(pad + 12 + i * 70, 10, 10, 8);
    ctx.fillStyle = C.text; ctx.fillText(l, pad + 28 + i * 70, 18);
  });
}

function drawCompareTimeline(canvas, a, b) {
  const w = canvas.width, h = canvas.height, pad = 34;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const years = TourState.seasons.map(s => s.year);
  if (years.length === 0) return;
  function winsFor(p, y) {
    const s = TourState.seasons.find(sn => sn.year === y);
    if (!s) return 0;
    return s.events.filter(e => e.champId === p.id).length;
  }
  const yMax = Math.max(1, Math.max.apply(null, years.map(y => Math.max(winsFor(a, y), winsFor(b, y)))));
  chartAxes(ctx, w, h, pad, 0, yMax, years.map(y => 'Y' + y), v => Math.round(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const step = plotW / Math.max(1, years.length);
  function drawLine(player, color) {
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.fillStyle = color;
    ctx.beginPath();
    years.forEach((y, i) => {
      const val = winsFor(player, y);
      const x = pad + step * (i + 0.5);
      const yp = h - pad - (val / yMax) * plotH;
      if (i === 0) ctx.moveTo(x, yp); else ctx.lineTo(x, yp);
    });
    ctx.stroke();
    years.forEach((y, i) => {
      const val = winsFor(player, y);
      const x = pad + step * (i + 0.5);
      const yp = h - pad - (val / yMax) * plotH;
      ctx.beginPath(); ctx.arc(x, yp, 3, 0, 2*Math.PI); ctx.fill();
    });
  }
  drawLine(a, C.primary);
  drawLine(b, C.accent);
  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillStyle = C.primary; ctx.fillRect(pad + 12, 12, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText(a.name, pad + 28, 20);
  ctx.fillStyle = C.accent; ctx.fillRect(pad + 140, 12, 10, 8);
  ctx.fillStyle = C.text; ctx.fillText(b.name, pad + 156, 20);
}

async function runMonteCarloH2H(a, b, n) {
  let aWin = 0, bWin = 0, ties = 0, sumDiff = 0;
  for (let i = 0; i < n; i++) {
    const pa = { id: a.id, name: a.name, profile: a.profile, poolRef: a, stats: makeFreshStats(), eliminatedAtBracket: null, path: [] };
    const pb = { id: b.id, name: b.name, profile: b.profile, poolRef: b, stats: makeFreshStats(), eliminatedAtBracket: null, path: [] };
    const m = playMatch(pa, pb, 9);
    if (m.winner === pa) aWin++;
    else if (m.winner === pb) bWin++;
    else ties++;
    sumDiff += (pa.stats.totalScore - pb.stats.totalScore);
    if (i % 100 === 0) await yieldToUI();
  }
  return { aWin, bWin, ties, avgDiff: sumDiff / n };
}
