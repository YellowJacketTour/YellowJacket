function preflopIdx(holeCards) {
  const a = holeCards[0], b = holeCards[1];
  const ar = a.rank, br = b.rank;
  const hi = ar >= br ? ar : br;
  const lo = ar >= br ? br : ar;
  const suited = a.suit === b.suit ? 1 : 0;
  return (hi - 2) * 26 + (lo - 2) * 2 + suited;
}

function estimateStrength(holeCards, community) {
  if (community.length >= 3) {
    const hv = evaluate7(holeCards, community);
    const cat = hv >>> 24;
    let s = WIN_PROB[cat];
    const k1 = (hv >>> 20) & 0xF;
    if (k1) s += (k1 - 8) * 0.003;
    if (s < 0.01) s = 0.01; if (s > 1.0) s = 1.0;
    return s;
  }
  return PREFLOP_EQUITY_TABLE[preflopIdx(holeCards)];

// ---------------------------------------------------------------------------
// BOARD-TEXTURE-AWARE STRENGTH ASSESSMENT
//
// The prior AI used category-only strength (WIN_PROB[cat] with a tiny kicker
// nudge). That compresses skill differences because real poker skill at the
// postflop is dominated by (a) reading board threats, (b) valuing made draws,
// (c) respecting opponent's bet sizing as a range signal. This block implements
// all three with O(community.length) work and no Monte Carlo.
//
// Performance budget: hot loop. boardTexture + heroDrawEquity + threatForHero
// are all ≤ 20 comparison/arithmetic ops per call; evaluate7 (≈ 50μs) is cached
// by playBettingRound so it runs once per player per street, not per decision.
// ---------------------------------------------------------------------------

// Analyze community cards into a compact flags object describing danger levels.
//   flushCount  = max same-suit cards on the board (0..5)
//   pairedCount = max same-rank count on the board (1..4)
//   straightRisk = max # of unique board ranks fitting inside any 5-rank window
//                 (3 = gutshot possible, 4 = open-ended, 5 = straight ON the board)
//   topBoardRank = highest rank on the board (for overcard comparisons)
function boardTexture(community) {
  const n = community ? community.length : 0;
  if (n < 3) return { flushCount: 0, pairedCount: 1, straightRisk: 1, topBoardRank: 0 };
  let sS = 0, sH = 0, sD = 0, sC = 0;
  const rankSet = {};
  let topRank = 0;
  let pairedCount = 1;
  for (let i = 0; i < n; i++) {
    const c = community[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
    const r = c.rank;
    if (r > topRank) topRank = r;
    rankSet[r] = (rankSet[r] || 0) + 1;
    if (rankSet[r] > pairedCount) pairedCount = rankSet[r];
  }
  const flushCount = Math.max(sS, sH, sD, sC);
  // Straight-risk: scan windows [lo, lo+4] for how many unique ranks fit.
  // Ace can play as 1 (for wheel) so we include rank 1 if there's a 14 on the board.
  const ranks = Object.keys(rankSet).map(r => +r);
  if (rankSet[14]) ranks.push(1);
  ranks.sort((a, b) => a - b);
  let straightRisk = 1;
  for (let i = 0; i < ranks.length; i++) {
    for (let j = i; j < ranks.length; j++) {
      if (ranks[j] - ranks[i] <= 4) {
        const span = j - i + 1;
        if (span > straightRisk) straightRisk = span;
      } else break;
    }
  }
  return { flushCount, pairedCount, straightRisk, topBoardRank: topRank };
}

// Hero's draw equity: fraction of EV gain expected from unfilled flush/straight draws.
// Returns 0 if no draw. Combines flush draw (up to ~0.35 by river from flop),
// open-ended straight draw (~0.31), and gutshot (~0.17). River = 0 (no more cards).
function heroDrawEquity(holeCards, community) {
  const n = community ? community.length : 0;
  if (n < 3 || n >= 5) return 0; // only flop/turn can have unrealized draws
  let sS = 0, sH = 0, sD = 0, sC = 0;
  for (let i = 0; i < 2; i++) {
    const c = holeCards[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
  }
  for (let i = 0; i < n; i++) {
    const c = community[i];
    if (c.suit === 'S') sS++; else if (c.suit === 'H') sH++;
    else if (c.suit === 'D') sD++; else if (c.suit === 'C') sC++;
  }
  let draw = 0;
  const maxSuit = Math.max(sS, sH, sD, sC);
  if (maxSuit === 4) {
    // Flush draw equity — adverse-selection-discounted from raw outs math.
    // Raw flop→river is ~35% and turn→river ~19%, but a flush draw doesn't
    // always WIN when it hits: opponent may have a higher-suit flush, the
    // board may pair giving opp a boat, or the river may complete a straight
    // for opp. The conservative 0.20/0.12 reflects expected-value-of-completion
    // weighted by P(my flush actually wins | I hit it).
    //
    // A bump to 0.30/0.17 was tried mid-session ("match raw equity") and
    // reverted because it dropped Spearman ρ 0.72→0.31 and broke tier ROI.
    // See WIN_PROB comment for the same adverse-selection principle.
    draw += n === 3 ? 0.20 : 0.12;
  }
  // Straight draw detection: look at unique ranks in hero+board.
  const rankSet = {};
  for (let i = 0; i < 2; i++) rankSet[holeCards[i].rank] = 1;
  for (let i = 0; i < n; i++) rankSet[community[i].rank] = 1;
  if (rankSet[14]) rankSet[1] = 1;
  const uniq = Object.keys(rankSet).map(r => +r).sort((a, b) => a - b);
  let maxConsec = 1, cur = 1;
  for (let i = 1; i < uniq.length; i++) {
    if (uniq[i] === uniq[i-1] + 1) { cur++; if (cur > maxConsec) maxConsec = cur; }
    else cur = 1;
  }
  if (maxConsec >= 4) {
    // Open-ended straight draw — ~8 outs raw, but same adverse-selection
    // discount as flush. Some hits give opp a higher straight or complete a
    // wheel for them. 0.17/0.09 is the calibrated conservative estimate.
    draw += n === 3 ? 0.17 : 0.09;
  } else if (maxConsec === 3) {
    // Gutshot — ~4 outs. Heavy discount because gutshot completions are most
    // often beaten when they hit (opp had higher pair/draws to better straight).
    draw += n === 3 ? 0.08 : 0.04;
  }
  // Cap draw bonus so it doesn't overwhelm made-hand strength.
  return Math.min(0.30, draw);
}

// Threat = probability weight that opponent holds a hand that beats hero's current
// made-hand category, given board texture. Capped at 0.55.
// Numbers are distilled from realistic preflop ranges + combinatorics on the remaining
// 48 cards after hero sees their own 2 + board. They are priors, not hard truths —
// but they move the decision-surface far enough to express skill.
function threatForHero(heroHandValue, boardTex, oppCommitFrac) {
  const cat = heroHandValue >>> 24;
  let threat = 0;
  // Flush threat: if hero isn't flushing and board shows 3+ same-suit cards.
  if (boardTex.flushCount === 3 && cat < 5) threat += 0.08;
  else if (boardTex.flushCount === 4 && cat < 5) threat += 0.32;
  else if (boardTex.flushCount >= 5 && cat < 5) threat += 0.50;
  // Paired-board threat: if hero isn't trips/boat/better and board has a pair.
  if (boardTex.pairedCount === 2 && cat < 3) threat += 0.07;
  else if (boardTex.pairedCount >= 3 && cat < 6) threat += 0.22;
  else if (boardTex.pairedCount >= 4) threat += 0.10; // hero has quads on board, but split pots possible
  // Straight threat.
  if (boardTex.straightRisk >= 5 && cat < 4) threat += 0.35;
  else if (boardTex.straightRisk === 4 && cat < 4) threat += 0.14;
  else if (boardTex.straightRisk === 3 && cat < 4) threat += 0.05;
  // Overcard pressure: hero has one-pair (cat=1) and board shows a card higher than
  // hero's pair rank. Common spot where unsophisticated AI overvalues middle pair.
  if (cat === 1) {
    const heroPairRank = (heroHandValue >>> 20) & 0xF;
    if (heroPairRank && boardTex.topBoardRank > heroPairRank) {
      threat += 0.06;
    }
  }
  // Opponent's voluntary commit this street amplifies the threat — aggressive bets
  // shift the range toward strong hands. Capped to 2x amplification for a full-cap bet.
  const actionMultiplier = 1 + oppCommitFrac * 1.0;
  threat *= actionMultiplier;
  // Cap so we can't read hero into negative equity with nut-flush in hand
  if (threat > 0.55) threat = 0.55;
  return threat;
}

// Board-aware strength: raw category strength minus threat plus hero's own draw value.
// skillFactor ∈ [0,1] gates how much of the board-aware adjustment applies; noisy
// players (bottom tier) ignore it and call down like the prior AI.
function estimateStrengthAware(holeCards, community, street, streetCap, skillFactor, oppCommitFrac, preHand, preTex) {
  if (!community || community.length < 3) {
    // Preflop: no board yet. Use equity table + skill-gated opponent-range narrowing
    // (big preflop stake from opp ⇒ their range is tight ⇒ hero's relative equity drops).
    const baseEq = estimateStrength(holeCards, community);
    // Discount the blind — opponent's forced 1-stroke blind isn't a range signal.
    const voluntary = Math.max(0, oppCommitFrac - (1 / Math.max(1, streetCap || 1)));
    const rangeAdj = voluntary * skillFactor * 0.10;
    return Math.max(0, Math.min(1, baseEq - rangeAdj));
  }
  const hv = preHand || evaluate7(holeCards, community);
  const cat = hv >>> 24;
  let base = WIN_PROB[cat];
  const k1 = (hv >>> 20) & 0xF;
  if (k1) base += (k1 - 8) * 0.003;
  if (base < 0.01) base = 0.01; if (base > 1.0) base = 1.0;
  const tex = preTex || boardTexture(community);
  const threat = threatForHero(hv, tex, oppCommitFrac);
  const draw = (cat < 5) ? heroDrawEquity(holeCards, community) : 0;
  // Skilled: full threat + full draw. Unskilled: ignore both, revert to raw strength.
  const adj = base - threat * skillFactor + draw * skillFactor * 0.8;
  return Math.max(0.01, Math.min(1.0, adj));
}
// Progressive street cap: preflop 25%, flop 50%, turn 75%, river 100% of the global cap.
// Small caps (≤3) use the global cap flat since there's no meaningful headroom to split.
//
// v43 POT-ELASTIC EXTENSION: when CurrentPotElasticK > 0 (default 3), the cap
// can climb above the progressive floor as the pot grows. effectiveCap =
// max(progressiveFloor, min(globalCeiling, k × agreedTotal)). globalCeiling
// is 3× totalCap so single-hole risk stays bounded. Restores no-limit-style
// overbet pressure on hot/carry pots and unlocks Tea Box (preflop) play
// because k×opener of 6 exceeds the progressive floor of 1-2 honey.
function streetCapFor(street, totalCap, agreedTotal) {
  if (!totalCap || totalCap <= 3) return totalCap || 3;
  const frac = { preflop: 0.25, flop: 0.50, turn: 0.75, river: 1.0 };
  const progressive = Math.max(1, Math.ceil(totalCap * (frac[street] != null ? frac[street] : 1)));
  const k = CurrentPotElasticK;
  if (k <= 0 || !Number.isFinite(+agreedTotal)) return progressive;
  const elastic = Math.ceil(k * (+agreedTotal));
  const ceiling = totalCap * 3;
  return Math.max(progressive, Math.min(ceiling, elastic));
}

// decideFor: decision kernel called at every actionable moment in a hand.
//   - `preComputedHand` / `preComputedTex` are optional caches passed from playBettingRound
//     so we don't re-run evaluate7 + boardTexture per decision (big hot-loop win).
//   - `oppMatched` is the opponent's current street investment, used for range-aware
//     threat assessment on postflop streets.
// decideFor — YJ DECISION KERNEL (v23, full rewrite).
// New signature (call sites in playBettingRound updated to match):
//   cards, community, currentProposal, agreedTotal, isPending, profile,
//   preComputedHand, preComputedTex, gameContext
// Action protocol:
//   isPending=false → actor can { check, bet }   (bet.amount = NEW agreed total)
//   isPending=true  → actor can { fold, call, raise }
//                     (raise.amount = NEW agreed total > currentProposal)
// Returns { action, amount, evChosen, evOptimal }
function decideFor(cards, community, currentProposal, agreedTotal, isPending, profile, preComputedHand, preComputedTex, gameContext = {}) {
  const street = community.length === 0 ? 'preflop' : community.length === 3 ? 'flop' : community.length === 4 ? 'turn' : 'river';
  // v43: pot-elastic streetCap consumes agreedTotal so cap scales with pot.
  const streetCap = streetCapFor(street, CurrentStrokeCap, agreedTotal);
  const remaining = Math.max(0, streetCap - currentProposal);
  // Pot for adj-estimation purposes = the post-call hole value (= currentProposal).
  // Under YJ rules there's no "matched" / no doubling. Last agreed total IS the pot.
  const pot = currentProposal;

  // Board-texture-aware strength. `estimateStrengthAware` returns hero's category-based
  // raw strength on the shown board, then adjusts for:
  //   (a) threat from draws/pairs/flushes the board makes available to opp,
  //   (b) hero's own draw equity (semi-bluff value),
  //   (c) opponent's committed stake this street (their action narrows their range).
  // Skilled heroes (low profile.noise) apply these adjustments in full; noisy heroes
  // ignore them, preserving the behavioral distinction between disciplined and reckless play.
  const skillFactor = Math.max(0, Math.min(1, 1 - (profile.noise || 0) / 0.30));
  // Under YJ, "opponent's commitment" maps to whether a proposal is pending and
  // how aggressive it is relative to the streetCap. No matched chips exist.
  const oppCommitFrac = isPending ? Math.min(1, (currentProposal - agreedTotal) / Math.max(1, streetCap)) : 0;

  let adj = estimateStrengthAware(cards, community, street, streetCap, skillFactor, oppCommitFrac, preComputedHand, preComputedTex);
  // adjTrue = skill-invariant ground-truth equity oracle (skillFactor=1) so
  // evChosen and evOptimal are judged against the same board-aware oracle for
  // every player. Decisions use NOISY adj for skill differentiation.
  const adjTrue = (skillFactor < 1)
    ? estimateStrengthAware(cards, community, street, streetCap, 1, oppCommitFrac, preComputedHand, preComputedTex)
    : adj;
  adj = Math.max(0.01, Math.min(1.0, adj + (Math.random() - 0.5) * profile.noise));

  // === YJ EV MATH (v23 — replaces all legacy distortions) ===
  // Removed: expectedSkinEV / expectedHoneyEV / threshold-coupling, ykFoldEV,
  //          showdownGolfHoney, bettorGolfStroke table, potValue clamp.
  // Active: round-impact EV in honey-equivalent units, dynamic divisor, no -toCall,
  //         no -a, no matched. Loser pays nothing under YJ rules — only the
  //         folder pays a +1 bogey on the scorecard plus loses the previous
  //         agreed total in honey.
  //
  // Round-score impact (lower = better): roundScore = totalGolf − netHoney/divisor.
  // EV (honey-equivalent, higher = better) = − roundImpact × divisor:
  //
  //   ev_fold     = −divisor − agreedTotal
  //                  (folder takes +1 bogey golf AND loses agreedTotal honey)
  //   ev_show(L,a) = (2a − 1) × L  −  (1.5 − 4a) × divisor
  //                  (honey: zero-sum at level L, golf: linear-fit showdown
  //                   approximation; positive = good for actor)
  //   ev_check    = ev_show(agreedTotal, a)
  //   ev_call     = ev_show(currentProposal, a)
  //   ev_bet/raise(L) = foldEq × agreedTotal
  //                   + (1 − foldEq) × ev_show(L, a)

  //                   if opp calls: showdown at proposed level L)
  // Per-decision divisor (v39 Path 1) — independent of round-end honey
  // normalization. End-of-round finalRoundScore still uses honeyDivisorFor
  // (72/18/9/1 by round length); only this in-kernel EV math uses the
  // smaller decision divisor so folds stay tactical instead of being priced
  // out by the long-round stroke compression.
  const divisor = Math.max(1,
    +(gameContext && gameContext.decisionDivisor) || CurrentDecisionDivisor);
  // Variant flag (v39 Path 3a) — under loserBogey=true (Yellow Jacket variant),
  // the showdown loser scores +1 fixed regardless of hand strength. The
  // expected own-golf at showdown changes shape, so the linear-fit golf
  // term branches on variant.
  const loserBogey = (gameContext && typeof gameContext.loserBogey === 'boolean')
    ? gameContext.loserBogey : CurrentLoserBogey;
  function showEV(adjVal, level) {
    // Honey term (zero-sum at level): unchanged by variant.
    const honeyTerm = (2 * adjVal - 1) * level;
    // Golf term — expected own-golf at showdown, in honey-equivalent units:
    //   Bumblebee (loserBogey=false): both score own hand. Linear fit ≈ 1.5 − 4a
    //     across the equity range; matches v23 behavior.
    //   Yellow Jacket (loserBogey=true): winner scores own hand, loser +1 fixed.
    //     E[g_YJ] = a·w(a) + (1−a)·1 with winner-conditional fit w(a) ≈ −1−2a
    //            ≈ 1 − 2a − 2a²
    const golfTerm = loserBogey
      ? (1 - 2 * adjVal - 2 * adjVal * adjVal)
      : (1.5 - 4 * adjVal);

    // Larger relative raise → more fold equity. Capped at 0.5 so AI can't price
    // opponents out unrealistically. raiseAmount/newLevel, bounded.
    const raiseAmount = Math.max(0, newLevel - agreedTotal);
    return Math.max(0, Math.min(0.5, raiseAmount / Math.max(1, newLevel)));
  }
  function betEV(adjVal, newLevel) {
    const fe = foldEqFor(newLevel);
    return fe * agreedTotal + (1 - fe) * showEV(adjVal, newLevel);
  }
  // v46: flat +1 fold cost (escalation removed). Empirical telemetry showed
  // the v43 escalation rarely fired (91% of folds at +1) so the formula was
  // decorative complexity. Pot-committed dynamics now come from pot odds
  // (which scale with agreedTotal naturally) rather than fold-cost.
  const foldStrokeCost = 1;
  const evFoldAbs = -foldStrokeCost * divisor - agreedTotal;

  // Build candidate set with adjTrue (oracle) for the metric.
  const candidates = [];
  // Proposal sizes are NEW agreed totals (YJ semantics). v24: ADDITIVE room-
  // based sizing, not multiplicative on base. Multiplicative bet sizing was
  // saturating pots to streetCap on the first strong-hand bet, blowing up
  // honey variance and pulling champ scores 5–7× too deep. Additive scaling
  // (small/medium/large fraction of remaining headroom) keeps pot growth
  // gradual and proportional to AI conviction.
  function proposalLevels(base) {
    const levels = [];
    const room = Math.max(0, streetCap - base);
    if (room <= 0) return levels;
    // v46 POT-RELATIVE BET SIZING — bets scale with the existing pot, not
    // with remaining cap headroom. Mirrors real-poker convention where bet
    // sizes are expressed as fractions of pot ("1/3 pot, half-pot, pot, 1.5x pot").
    //   - Small pots → small bets (no overcommitting on weak boards)
    //   - Big pots → big bets (late-street pressure restored)
    //   - Overbets allowed (1.5x pot) → polarized bluff/value structures
    // The pot-elastic streetCap ceiling caps maximum aggression so single-hole
    // variance stays bounded, but within that ceiling, bet sizing matches
    // how real poker thinks about pressure.
    const pot = Math.max(1, base);
    const seen = new Set();
    [0.33, 0.50, 0.75, 1.0, 1.5].forEach(f => {
      const proposed = base + Math.max(1, Math.round(pot * f));
      const L = Math.min(streetCap, proposed);
      if (L > base && !seen.has(L)) {
        seen.add(L);
        levels.push(L);
      }

    return levels;
  }
  if (!isPending) {
    // No proposal pending — actor can check (accept agreedTotal) or bet (propose).
    candidates.push({ name: 'check', amount: agreedTotal, ev: showEV(adjTrue, agreedTotal) });
    if (remaining > 0) {
      proposalLevels(agreedTotal).forEach(L => {
        candidates.push({ name: 'bet', amount: L, ev: betEV(adjTrue, L) });
      });
    }
  } else {
    candidates.push({ name: 'fold', amount: 0, ev: evFoldAbs });
    candidates.push({ name: 'call', amount: currentProposal, ev: showEV(adjTrue, currentProposal) });
    if (remaining > 0) {
      proposalLevels(currentProposal).forEach(L => {
        candidates.push({ name: 'raise', amount: L, ev: betEV(adjTrue, L) });
      });
    }
  }
  let evOptimal = -Infinity;
  for (const c of candidates) if (c.ev > evOptimal) evOptimal = c.ev;
  if (!Number.isFinite(evOptimal)) evOptimal = 0;

  function wrap(result) {
    let evChosen = 0;
    if (result.action === 'fold') evChosen = evFoldAbs;
    else if (result.action === 'check') {
      const c = candidates.find(c => c.name === 'check');
      evChosen = c ? c.ev : showEV(adjTrue, agreedTotal);
    } else if (result.action === 'call') {
      const c = candidates.find(c => c.name === 'call');
      evChosen = c ? c.ev : showEV(adjTrue, currentProposal);
    } else if (result.action === 'bet' || result.action === 'raise') {
      let best = null, bestDelta = Infinity;
      for (const c of candidates) {
        if (c.name !== result.action) continue;
        const d = Math.abs(c.amount - (result.amount || 0));
        if (d < bestDelta) { best = c; bestDelta = d; }
      }
      evChosen = best ? best.ev : betEV(adjTrue, +result.amount || agreedTotal);
    }
    // v44: expose noisy `adj` (perceived equity at decision time) so the
    // collector can build an equity-bucket × action distribution. This is the
    // core game-theoretic signal for diagnosing whether players are folding
    // the right hands at the right equities.
    return Object.assign({ evChosen, evOptimal, decisionAdj: adj }, result);
  }

  // === DECISION LOGIC (v23 + v46 c-bet + v49 multi-dim profile) ===
  // Profile thresholds drive bet/raise; fold uses direct YJ EV comparison.
  // v46: c-bet bonus when actor was the preflop aggressor and is on flop.
  // v49: aggression trait shifts bet/raise thresholds independently of skill,
  // so high-aggression players bet/raise more even at equal skill. Reading
  // depth discounts adj when opponent has aggressed multiple times this
  // hand — the AI recognizes opponent's narrowed strong range.
  const cBetBonus = (gameContext && gameContext.cBet) ? 0.20 : 0;
  // Aggression: 0.5 = neutral, 0.9 = max aggressive (-0.08 threshold), 0.1 = passive (+0.08)
  const aggBias = ((profile.aggression || 0.5) - 0.5) * 0.20;
  const effectiveBetThreshold = Math.max(0.05, profile.betThreshold - cBetBonus - aggBias);
  const effectiveRaiseThreshold = Math.max(0.10, profile.raiseThreshold - aggBias);
  // === v50 (C) BAYESIAN BLUFF-AWARE READING ===
  // Replaces the v49 fixed discount with a two-stage model:
  //   (1) NAIVE read: "more aggression = stronger range" → naiveDiscount
  //       proportional to opponent's aggression count this hand.
  //   (2) BLUFF PRIOR: probability opponent is bluffing given (a) per-match
  //       learned bluff rate, (b) bet-size pattern, (c) street, (d) c-bet
  //       context. Skilled readers (high readingDepth) NULLIFY the naive
  //       discount when the bluff prior is high, correctly calling down.
  // Net effect: low readingDepth → over-folds vs bluffs (v49 pathology).
  //             high readingDepth → calls bluffs, folds to value (correct).
  const oppAgg = Math.max(0, +(gameContext && gameContext.oppAggressionCount) || 0);
  const naiveDiscount = Math.min(0.20, oppAgg * 0.05);
  // BLUFF PRIOR construction. Starts from the per-match learned rate, modulated
  // by current-action context. Bounded [0, 0.55] — even the most polarized
  // signal can't push P(bluff) above ~half (real polarized ranges remain
  // value-heavy at the river).
  const baseBluffRate = Math.max(0, Math.min(0.5,
    +(gameContext && gameContext.oppEstBluffRate) || 0.05));
  let bluffPrior = baseBluffRate;
  const oppLastBetSize = +(gameContext && gameContext.oppLastBetSizeRatio) || 0;
  const oppLastStreet = (gameContext && gameContext.oppLastAggStreet) || null;
  // Polarized sizing: overbets (>1.2x pot) carry elevated bluff frequency
  // (real-poker convention — value-betting at overbet sizes is rare, so
  // overbets bifurcate into nuts vs bluff). Tiny bets (<0.4x pot) are usually
  // thin value or blocker bets, suppressing bluff prior.
  if (oppLastBetSize > 1.2)      bluffPrior += 0.10;
  else if (oppLastBetSize > 0.8) bluffPrior += 0.03;
  else if (oppLastBetSize < 0.4) bluffPrior -= 0.03;
  // Multi-street aggression (3+ aggressions) is rarely bluffed — barreling
  // through three streets requires either real equity or extreme bluff style.
  if (oppAgg >= 3)      bluffPrior -= 0.10;
  else if (oppAgg >= 2) bluffPrior -= 0.04;
  // C-bet on the flop has elevated bluff rate by poker convention (the preflop
  // raiser fires regardless of flop hit), so skilled readers know not to over-fold.
  if (street === 'flop' && oppLastStreet === 'flop' && oppAgg === 1) bluffPrior += 0.05;
  // Preflop aggression is rarely a bluff (preflop ranges are tighter).
  if (street === 'preflop') bluffPrior -= 0.02;
  bluffPrior = Math.max(0, Math.min(0.55, bluffPrior));

  // BLEND: high readingDepth nullifies the naive discount when bluff prior is
  // high. Low readingDepth applies the naive discount fully (current-v49-like).
  //   adjustedDiscount = naiveDiscount × (1 − bluffPrior)   [perfect reader]
  //   blended         = readingDepth × adjustedDiscount + (1 − readingDepth) × naiveDiscount
  // Equivalent: blended = naiveDiscount × (1 − readingDepth × bluffPrior).
  const readingDepth = Math.max(0, Math.min(1, profile.readingDepth || 0.5));
  const readDiscount = naiveDiscount * (1 - readingDepth * bluffPrior);
  const adjRead = Math.max(0.01, adj - readDiscount);

  // v50 (C) telemetry: emit (heroSide, readingDepth, bluffPrior, naiveDiscount,
  // appliedDiscount) per fold-eligible decision so we can verify high-readingDepth
  // players actually catch bluffs at higher rates than low-readingDepth players.
  if (isPending && oppAgg > 0
      && typeof LabState !== 'undefined' && LabState.instrumentation
      && LabState.instrumentation.bluffReadCollector) {
    LabState.instrumentation.bluffReadCollector({
      heroSide: gameContext && gameContext.heroSide,
      readingDepth,
      bluffPrior,
      naiveDiscount,
      appliedDiscount: readDiscount,
      adj,
      adjRead,
    });
  }
  // v51 (C) SKILL-AWARE BET SIZING. Decision-to-bet still uses noisy adj
  // (skill differentiates threshold-crossing). But bet SIZE uses a blended
  // sizing perception: skilled players size based on adjTrue (the oracle),
  // noisy players size based on adj (their own perception). The blend is
  // weighted by skillFactor so it's continuous across the skill axis.
  // Net effect: skilled players big-bet only when actually ahead; noisy
  // players big-bet at perceived equity (often at 50/50 true), inflating
  // pots they're 50% to lose. Combined with mag=5 honey, noisy big bets
  // now hemorrhage real strokes via the (much larger) honey term.
  const sizingAdj = skillFactor * adjTrue + (1 - skillFactor) * adj;
  if (!isPending) {
    if (adj > effectiveBetThreshold && remaining > 0) {
      const room = Math.max(0, streetCap - agreedTotal);
      const sizeFactor = sizingAdj > 0.85 ? 1.0 : sizingAdj > 0.70 ? 0.5 : 0.25;
      const newLevel = Math.min(streetCap, agreedTotal + Math.max(1, Math.round(room * sizeFactor)));
      if (newLevel > agreedTotal) {
        return wrap({ action: 'bet', amount: newLevel });
      }
    }
    // v49 bluff: high-bluffFreq players sometimes bet weak hands as a stab
    // at fold equity. Only fires when adj is low enough that the value-bet
    // path declined (avoid double-betting strong hands), and only if the
    // street allows room. Bluff size is small (33% of room) to limit downside.
    if (profile.bluffFreq > 0 && adj < 0.40 && remaining > 0
        && Math.random() < profile.bluffFreq) {
      const room = Math.max(0, streetCap - agreedTotal);
      const newLevel = Math.min(streetCap, agreedTotal + Math.max(1, Math.round(room * 0.33)));
      if (newLevel > agreedTotal) {
        return wrap({ action: 'bet', amount: newLevel });
      }
    }
    return wrap({ action: 'check' });
  }
  // Pending proposal → fold / call / raise.
  //
  // === FOLD CHECKS (v42 deep-rewrite) ===
  // Two-stage fold logic. Either stage triggering causes a fold; both must
  // pass for a call/raise to occur.
  //
  // STAGE 1 — POT-ODDS FOLD (restored from v22; the actual fold lever).
  // The v23 rewrite eliminated this in favor of pure-EV math, which produced
  // near-zero fold rates. Pot-odds folding is the calibrated lever that
  // produces non-trivial action.
  //
  //   reqEquity = call_amount / pot_after_call  = (L - T) / (2L - T)
  //
  // profile.foldThreshold is "slack" — distance below pot odds the AI will
  // tolerate before folding:
  //   slack = 0.25 (YJ-skilled)  → fold only when adj < reqEquity − 0.25
  //                                ≈ fold when adj < 0.08 (matches YJ
  //                                break-even of (L−T)/(d+2L) ≈ 8-12%).
  //   slack = 0.05 (anti-YJ)     → fold when adj < reqEquity − 0.05
  //                                ≈ fold when adj < 0.28. Classic-poker
  //                                tight folding; under YJ rules this throws
  //                                away equity on every mid-bucket fold.
  //
  // POLARITY (v51 fix): under YJ + loserBogey, calling-and-losing costs the
  // same +1 stroke as folding, differing only by (L−T) honey. So break-even
  // fold equity sits at 5-12% depending on event divisor — far below classic
  // poker's 33% pot-odds. HIGH slack = correct YJ play. LOW slack = mistake.
  // foldOpt was 0.05 (low slack = anti-YJ) v19 through v50; now 0.25.
  //
  // STAGE 2 — EV-BASED FOLD (kept from v23, variant-aware via showEV).
  // Catches large-pot / deep-stack scenarios where the per-stroke EV
  // calculation diverges from raw pot odds. Rare relative to stage 1 but
  // important for terminal-street decisions where the +1 stroke cost
  // dominates the honey delta.
  const callAmount = Math.max(0, currentProposal - agreedTotal);
  const potAfterCall = Math.max(1, 2 * currentProposal - agreedTotal);
  const reqEquity = callAmount / potAfterCall;
  const slack = Number.isFinite(profile.foldThreshold) ? profile.foldThreshold : 0.05;
  // v49: use adjRead (reading-discounted equity) for fold decisions. Skilled
  // readers fold more vs aggressive opponents because they correctly perceive
  // narrowed strong ranges. Weak readers ignore the signal and call/get spewy.
  if (callAmount > 0 && adjRead < reqEquity - slack) {
    return wrap({ action: 'fold' });
  }
  // EV-based fold (variant-aware via showEV; reading-discounted via adjRead).
  const evCallNoisy = showEV(adjRead, currentProposal);
  const evFoldNoisy = -foldStrokeCost * divisor - agreedTotal;
  if (evCallNoisy < evFoldNoisy) return wrap({ action: 'fold' });
  if (adj > effectiveRaiseThreshold && remaining > 0) {
    // v51 (C): raise SIZE uses sizingAdj (skill-blended), not raw adj. Same
    // rationale as the bet path — skilled raisers escalate only when truly
    // ahead, noisy raisers escalate based on their misperceived equity.
    const room = Math.max(0, streetCap - currentProposal);
    const sizeFactor = sizingAdj > 0.90 ? 1.0 : sizingAdj > 0.80 ? 0.5 : 0.25;
    const newLevel = Math.min(streetCap, currentProposal + Math.max(1, Math.round(room * sizeFactor)));
    if (newLevel > currentProposal) {
      return wrap({ action: 'raise', amount: newLevel });
    }
  }
  return wrap({ action: 'call' });
}
function makeRandomProfile() {
  // Retained for backwards compatibility. New code should prefer makeProfileForSkill,
  // which gives a realistic skill distribution (tall Elite, long Bottom tail) instead
  // of the uniform-random-then-derive approach that produced narrow, bell-shaped skill.
  return makeProfileForSkill(sampleTargetSkill());
}

// Sample a target skill from a truncated Normal(0.5, 0.18) in [0.02, 0.98].
// Shape rationale: ~68% of players in [0.32, 0.68] = mediocre mass, 95% in [0.14, 0.86],
// and tails reach ~0.05 (terrible) and ~0.95 (elite). This mirrors real poker/golf
// populations where most competitors cluster around mediocre with distinct tails.
// cfg.skillSpread (optional, default 0.18) scales the distribution's σ so the user
// can test narrow-elite (σ=0.10) vs wide-open (σ=0.28) populations.
function sampleTargetSkill(cfg) {
  const sigma = (cfg && Number.isFinite(cfg.skillSpread) && cfg.skillSpread > 0) ? cfg.skillSpread : 0.18;
  const u1 = Math.max(1e-9, Math.random()), u2 = Math.random();
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return Math.max(0.02, Math.min(0.98, 0.50 + z * sigma));
}

// Generate a profile that will read as `targetSkill` under estimateSkillRating.
//
// YELLOW JACKET GAME-THEORY OPTIMA (re-derived v51 from first principles):
// Yellow Jacket is poker × golf, not classic poker. Under the loserBogey rule
// (default), the showdown loser pays a fixed +1 stroke regardless of hand
// strength. This collapses the cost differential between calling-and-losing
// vs folding to just (L − T) honey, which at typical event divisors makes
// folding essentially worthless until equity gets very low. Re-deriving:
//
//   EV_fold(T)   = 1 + T/d                 [stroke units; lower=better]
//   EV_call(a,L) = (1−a)(1 + L/d) − a(L/d)
//   Break-even   a* = (L − T) / (d + 2L)
//
// At decisionDivisor=9, T=2, L=4:  a* = 2/17 ≈ 11.8%
// At round-end div=14.4 (mag=5),  a* = 2/22.4 ≈ 8.9%
//
// So YJ-optimal is "fold only when equity < 8-12%" — far below classic poker's
// ~33% pot-odds threshold. The fold rule fires when adj < reqEquity − slack,
// with reqEquity ≈ 0.33 at typical pot shapes. To target a fold-when-adj<0.08
// behavior we need slack ≈ 0.25.
//
// HISTORICAL BUG (v18→v19, fixed in v51): the prior comment claimed
//   "foldOpt 0.25 → 0.05 — almost never fold (slack = 0.30 − 0.05 = 0.25)"
// but the code uses `slack = profile.foldThreshold = foldOpt` directly, so
// foldOpt=0.05 produced slack=0.05 and fold-when-adj<0.28 (CLASSIC POKER tight
// folding, not YJ "almost never fold"). The intent was right, the value was
// wrong by 5×, and the inversion has been the root cause of negative skill
// expression across v19-v50: "skilled" tight folders were folding 5-10× more
// than YJ-optimal, paying the equity-give-up cost on every wrong fold, while
// "unskilled" calling stations played closer to the actual YJ optimum.
//
// Pro Yellow Jacket optima (v51 corrected):
//   foldOpt   0.05 → 0.25 — slack large; fold only when adj < ≈0.08
//                            (equity below 8% AND pot-odds shortfall). Skilled
//                            YJ players fold rarely; "tight" classic-poker
//                            discipline is a vice under loserBogey.
//   betOpt    0.45         — bet at adj > 0.45 to grow pots when ahead.
//                            Pre-existing v45 calibration retained.
//   raiseOpt  0.75         — raise on strong equity (≥0.75 perceived).
//                            Pre-existing calibration retained.
//   noiseOpt  0            — precision still dominant; lower noise = better
//                            adj estimation = better all decisions.
//
// cfg.*Spread sliders still control within-tier jitter (±0.15 on bet/fold,
// ±0.10 on raise) — distinct playing styles within the same skill tier.
function makeProfileForSkill(targetSkill, cfg) {
  const t = Math.max(0, Math.min(1, targetSkill));
  const jitterScaleN = (cfg && Number.isFinite(cfg.noiseSpread)) ? cfg.noiseSpread * 0.050 : 0.025;
  const jitterScaleB = (cfg && Number.isFinite(cfg.betSpread))   ? cfg.betSpread   * 0.030 : 0.015;
  const jitterScaleF = (cfg && Number.isFinite(cfg.foldSpread))  ? cfg.foldSpread  * 0.030 : 0.015;
  const jitterScaleR = (cfg && Number.isFinite(cfg.raiseSpread)) ? cfg.raiseSpread * 0.025 : 0.012;
  const jitter = (scale) => (Math.random() - 0.5) * scale;
  const dir = () => Math.random() < 0.5 ? -1 : 1;
  // YELLOW JACKET OPTIMA — hardcoded; reflect the poker × golf hybrid rules.
  const noiseOpt = 0;
  // v45: lowered from 0.55 to 0.45 to increase action density.
  // Telemetry from v44 showed 86% checks on flop and 74% on turn — most
  // marginal hands never bet, so the action chart was concentrated on
  // preflop and river. Lowering betOpt means more marginal hands bet,
  // which (a) creates more decision points, (b) grows pots earlier so the
  // pot-elastic cap and pot-odds fold rule have more material to work
  // with, and (c) opens the bluff-catching range (0.4–0.6 equity) that
  // currently never folds because pots stay too small to threaten pot odds.
  const betOpt = 0.45;
  // v51: foldOpt 0.05 → 0.25. The pot-odds rule fires when adj < reqEquity−slack;
  // slack=foldOpt directly. Setting foldOpt=0.25 produces "fold when adj<≈0.08"
  // which matches YJ break-even fold equity. Prior 0.05 produced "fold at adj<0.28"
  // which is classic-poker tight folding, the wrong polarity for YJ rules.
  const foldOpt = 0.25;
  const raiseOpt = 0.75;
  // v49 MULTI-DIMENSIONAL PROFILES — three orthogonal traits beyond the
  // skill axis. Two skill-0.95 players now have DIFFERENT profiles in these
  // dimensions, producing genuine matchup variance and exploitable patterns.
  //
  //   aggression  ∈ [0.1, 0.9]  — Bet/raise tendency. INDEPENDENT of skill.
  //                 Tight-aggressive (TAG) ≠ tight-passive even at same skill.
  //   bluffFreq   ∈ [0,   0.18] — v50 (B): SKILL-CORRELATED. Mean ≈ 0.02 + 0.10·t,
  //                 with multiplicative jitter ∈ [0.5, 1.0]. Low-skill players
  //                 bluff rarely AND with poor selection; high-skill players
  //                 bluff more often with better selection. v49 had bluffFreq
  //                 uncorrelated with skill, which let low-skill players who
  //                 happened to roll high bluffFreq systematically out-bluff
  //                 high-skill, low-readingDepth opponents — inverting skill
  //                 expression at the top end of the field.
  //   readingDepth ∈ [0,   1]   — How much the AI weights opponent's prior
  //                 aggression as range-narrowing info. Half-correlated with
  //                 skill plus random variation. v50 (C): readingDepth now
  //                 modulates a Bayesian bluff-detection posterior (not a
  //                 fixed discount), so high-readingDepth players correctly
  //                 call bluffs and fold to value, while low-readingDepth
  //                 players fall back to naive "aggression = strength."
  return {
    noise: Math.max(0.005, noiseOpt + (1 - t) * 0.30 + jitter(jitterScaleN)),
    betThreshold: betOpt + dir() * (1 - t) * 0.15 + jitter(jitterScaleB),
    foldThreshold: foldOpt + dir() * (1 - t) * 0.15 + jitter(jitterScaleF),
    raiseThreshold: raiseOpt + dir() * (1 - t) * 0.10 + jitter(jitterScaleR),
    authoredSkill: t,
    aggression: Math.max(0.1, Math.min(0.9, 0.5 + (Math.random() - 0.5) * 0.6)),
    // v50 (B): bluffFreq scales with skill. Mean (0.02 + 0.10·t), multiplicative
    // jitter in [0.5, 1.0]. skill 0.05 → ~0.015, skill 0.95 → ~0.090 (typical).
    bluffFreq: Math.max(0, Math.min(0.18, (0.02 + 0.10 * t) * (0.5 + Math.random() * 0.5))),
    readingDepth: Math.max(0, Math.min(1, 0.3 + 0.4 * t + (Math.random() - 0.5) * 0.4)),
  };
}

function estimateSkillRating(profile) {
  // Skill rating measures distance from Yellow Jacket optima. Must stay in
  // sync with the constants in makeProfileForSkill — when those move, this
  // function moves with them or authoredVsMeasuredSkill goes negative for
  // structural reasons. v51: foldOpt 0.05→0.25 (the v18→v19 inversion fix);
  // betOpt 0.55→0.45 (v45 calibration that was never propagated here).
  const nT = 1 - profile.noise / 0.30;
  const bT = 1 - Math.abs(profile.betThreshold - 0.45) / 0.15;
  const fT = 1 - Math.abs(profile.foldThreshold - 0.25) / 0.15;
  const rT = 1 - Math.abs(profile.raiseThreshold - 0.75) / 0.10;
  return (nT + bT + fT + rT) / 4;
}

function makeFreshStats() {
  // EV-tracking fields: per-decision performance against best-EV alternative.
  //   evDecisions   — count of decisions made
  //   evChosenSum   — Σ EV of the action actually taken
  //   evOptimalSum  — Σ EV of the best available action at that decision
  //   evLossSum     — Σ (evOptimal − evChosen), always ≥ 0 (perfect player → 0)
  // averageEVRealization = −evLossSum / evDecisions  (closer to 0 = better poker)
  return {
    holesPlayed: 0, holesWon: 0, holesLost: 0, holesTied: 0, holesFolded: 0,
    handCounts: {}, totalScore: 0, matchesWon: 0, matchesLost: 0, strokesBetTotal: 0,
    evDecisions: 0, evChosenSum: 0, evOptimalSum: 0, evLossSum: 0,
  };
}
// playBettingRound — YJ AGREED-TOTAL MODEL (v23, full rewrite).

//   initialBet: ignored under YJ rules — there is no blind. The mandatory pot
//     is set in playHole at hole start. Kept for backward-compat signature only.

  // v43: pot-elastic cap reads the live agreedTotal so big carry pots unlock
  // proportionally larger street caps. Single-pot ceiling = 3× CurrentStrokeCap.
  const streetCap = streetCapFor(street, CurrentStrokeCap, agreedTotal);
  const tex = community.length >= 3 ? boardTexture(community) : null;
  const aHand = community.length >= 3 ? evaluate7(aCards, community) : 0;
  const bHand = community.length >= 3 ? evaluate7(bCards, community) : 0;
  function recordEV(side, decision) {

    const evO = +decision.evOptimal || 0;
    player.stats.evDecisions = (player.stats.evDecisions || 0) + 1;
    player.stats.evChosenSum = (player.stats.evChosenSum || 0) + evC;

//   - placements: { id, rankFloor, tierSize } records (1 = champion, etc.)
//   - playoffsRun: how many extra holes were needed to break a tie for first
// =============================================================================
function runStrokePlayEvent(players, holesPerRound, rounds, cfg, eventType) {
  holesPerRound = holesPerRound || 18;
  rounds = rounds || 4;
  const totalHoles = holesPerRound * rounds;
  // Final scoring normalizes total net honey by 18 in playMatch/runFinals.
  // Initialize aggregate scores.
  const agg = new Map();
  for (const p of players) agg.set(p.id, { player: p, score: 0, rounds: [] });
  // === v46 TIERED PAIRING SYSTEM ===
  // Different event tiers use different pairing logics, mirroring how real
  // tournament hierarchies work:
  //   Main: random — preserves WSOP-flavored lottery variance (current behavior)
  //   Major: skill-bracket — top-quartile vs top-quartile (Masters-flavored
  //          competitive race; champions earn it via head-to-head with peers)
  //   Regular: woven mix — skill ± recent form (weekly Tour Open feel; hot
  //            players play up, cold players play down)
  // Pairing controls who plays whom each round. With random pairing, the
  // champion is determined heavily by pairing variance (a top player gets
  // unlucky and faces strong opponents every round). With skill-bracket
  // pairing, the champion EMERGES through competitive duels with peers,
  // dramatically lifting elite-skill expression in Majors.
  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }
  function pairRandom(field) {
    const r = field.slice();
    shuffleInPlace(r);
    return r;
  }
  function pairBySkillBracket(field) {
    // Sort by authored skill (descending — best first), split into halves,
    // shuffle WITHIN each half so pairings within a tier vary across rounds,
    // then pair adjacent (so top-tier faces top-tier).
    const sorted = field.slice().sort((a, b) => {
      const sa = (a.poolRef && a.poolRef.skill) != null ? a.poolRef.skill : (a.skill || 0);
      const sb = (b.poolRef && b.poolRef.skill) != null ? b.poolRef.skill : (b.skill || 0);
      return sb - sa;
    });
    const mid = Math.floor(sorted.length / 2);
    const top = sorted.slice(0, mid);
    const bot = sorted.slice(mid);
    shuffleInPlace(top); shuffleInPlace(bot);
    return top.concat(bot);
  }
  function pairWoven(field, aggMap) {
    // Combined rating: 70% authored skill + 30% running form (negative recent
    // score = good form; rescale to [0,1]). Sort by combined rating, pair
    // adjacent. This produces organic skill matching with recency mobility:
    // a hot bottom-skill player who's been scoring well plays "up" toward
    // mid-tier opponents, while a cold elite plays "down" — exactly like
    // weekly tour pairings respect form.
    const scored = field.map(p => {
      const sk = (p.poolRef && p.poolRef.skill) != null ? p.poolRef.skill : (p.skill || 0);
      const rec = (aggMap && aggMap.get(p.id)) || null;
      // Form score: lower = better. Normalize roughly to [-1, +1] range.
      const formRaw = rec && rec.rounds.length > 0
        ? rec.rounds.reduce((a, b) => a + b.score, 0) / rec.rounds.length
        : 0;
      const formNorm = -Math.tanh(formRaw / 10); // higher = better form
      const rating = 0.7 * sk + 0.3 * (formNorm * 0.5 + 0.5);
      return { p, rating };
    });
    scored.sort((a, b) => b.rating - a.rating);
    return scored.map(x => x.p);
  }
  // v48 R1 REVERT — all events use random pairing.
  // The v46 tiered system (skill-bracket Major, woven Regular) backfired:
  // in aggregate stroke-play format, skill-matched pairings NEUTRALIZE the
  // honey-edge that Elite players need to express skill. Honey is zero-sum
  // within a pair, so Elite-vs-Elite produces ≈0 honey edge per pair, while
  // Elite-vs-Bottom produces meaningful honey edge. Random pairing gives
  // Elite a diverse opponent mix, accumulating skill edge across rounds.
  // Empirical confirmation: v47 sweep showed skillSpearman 0.44→0.25 and
  // eliteMajorDominance 0.19→0.13 under tiered pairing. Reverting.
  // Helper functions (pairBySkillBracket, pairWoven) preserved for future
  // bracket-format experiments where higher-seed-advances logic applies.
  const byeHistory = new Set();
  for (let r = 0; r < rounds; r++) {
    const rotation = pairRandom(players);
    let byePlayer = null;
    if (rotation.length % 2 === 1) {
      // Pull the first player not previously bye-d (or the first if all have).
      let idx = rotation.findIndex(p => !byeHistory.has(p.id));
      if (idx === -1) idx = 0;
      byePlayer = rotation.splice(idx, 1)[0];
      byeHistory.add(byePlayer.id);
      const a = agg.get(byePlayer.id);
      a.rounds.push({ round: r + 1, score: 0, opponent: null });
      // bye contributes 0 to score (neither helps nor hurts)
    }
    for (let i = 0; i < rotation.length; i += 2) {
      const pA = rotation[i], pB = rotation[i + 1];
      const gameContext = { mode: 'strokePlay', holeNumber: r * holesPerRound + 1, totalHoles };
      const m = playMatch(pA, pB, holesPerRound, { noPlayoff: true, noMatchStats: true, gameContext });
      const aRec = agg.get(pA.id);
      const bRec = agg.get(pB.id);
      aRec.score += m.aTotal;
      bRec.score += m.bTotal;
      aRec.rounds.push({ round: r + 1, score: m.aTotal, opponent: pB.id });
      bRec.rounds.push({ round: r + 1, score: m.bTotal, opponent: pA.id });
    }
  }
  // Sort by aggregate score (lowest first).
  const sorted = players.slice().sort((p1, p2) => agg.get(p1.id).score - agg.get(p2.id).score);
  // Sudden-death playoff: if 2+ players tied for first after 72 holes, pair
  // them up and play short 4-hole aggregates until someone leads. Bounded at
  // 8 playoff rounds total.
  let playoffsRun = 0;
  const lowest = agg.get(sorted[0].id).score;
  let tied = sorted.filter(p => agg.get(p.id).score === lowest);
  while (tied.length > 1 && playoffsRun < 8) {
    const playoffField = tied.slice();
    for (let i = playoffField.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = playoffField[i]; playoffField[i] = playoffField[j]; playoffField[j] = t;
    }
    if (playoffField.length % 2 === 1) {
      // Odd tied count — give the first a bye this playoff round.
      playoffField.shift();
    }
    for (let i = 0; i < playoffField.length; i += 2) {
      const pA = playoffField[i], pB = playoffField[i + 1];
      const gameContext = { mode: 'strokePlay', holeNumber: totalHoles + playoffsRun * 4 + 1, totalHoles };
      const m = playMatch(pA, pB, 4, { noPlayoff: true, noMatchStats: true, gameContext });
      agg.get(pA.id).score += m.aTotal;
      agg.get(pB.id).score += m.bTotal;
    }
    playoffsRun++;
    sorted.sort((p1, p2) => agg.get(p1.id).score - agg.get(p2.id).score);
    const newLowest = agg.get(sorted[0].id).score;
    tied = sorted.filter(p => agg.get(p.id).score === newLowest);
  }
  // Build placements array (1 = champion, 2 = runner-up, etc., with tied tiers).
  // Group adjacent equal-score players into tiers.
  const placements = [];
  let i = 0;
  while (i < sorted.length) {
    const tierScore = agg.get(sorted[i].id).score;
    let tierEnd = i;
    while (tierEnd < sorted.length && agg.get(sorted[tierEnd].id).score === tierScore) tierEnd++;
    const tierSize = tierEnd - i;
    const rankFloor = i + 1;
    for (let k = i; k < tierEnd; k++) {
      placements.push({ id: sorted[k].id, rankFloor, tierSize });
      sorted[k].eliminatedAtBracket = rankFloor; // re-use bracket field for rank
    }
    i = tierEnd;
  }
  return { sortedFinishers: sorted, placements, playoffsRun, aggregateMap: agg };
}
function runFinals(p1, p2) {
  // 4 days × 18 holes = 72-hole finals. Identical Honey-Stroke accounting to playMatch.
  // stats.totalScore is intentionally NOT reset here — leaving bracket-round strokes
  // intact lets careerScore represent the true per-event stroke load (bracket + finals).
  const days = [];
  let p1Scorecard = 0, p2Scorecard = 0;
  let p1HoneyTotal = 0, p2HoneyTotal = 0;
  let carryPot = 0;
  // v45 compound-tie premium (matches strokePlay applyHole)
  let consecTies = 0;
  const applyHole = (r) => {
    p1Scorecard += r.aScore; p2Scorecard += r.bScore;
    if (r.tie) {
      consecTies++;
      const bonus = Math.min(5, consecTies);
      carryPot += (r.strokes || 0) + bonus;
    } else {
      consecTies = 0;
      const aSk = r.aHoneyCredit || 0;
      const bSk = r.bHoneyCredit || 0;
      p1HoneyTotal += aSk;
      p2HoneyTotal += bSk;
      if (aSk > 0)      p1HoneyTotal += carryPot;
      else if (bSk > 0) p2HoneyTotal += carryPot;
      if (aSk > 0 || bSk > 0) carryPot = 0;
    }
    updatePlayerHoleStats(p1, r, 'a'); updatePlayerHoleStats(p2, r, 'b');
  };
  for (let day=1; day<=4; day++) {
    let dayA = 0, dayB = 0;
    let dealer = (day % 2 === 1) ? 'a' : 'b';
    for (let h=0; h<18; h++) {
      const holeNumber = (day - 1) * 18 + h + 1;
      const gameContext = { mode: 'finals', holeNumber, totalHoles: 72, isFinals: true };
      const r = playHole(p1, p2, dealer, carryPot, gameContext);
      dayA += r.aScore; dayB += r.bScore;
      applyHole(r);
      dealer = dealer === 'a' ? 'b' : 'a';
    }
    days.push({ day, p1Score: dayA, p2Score: dayB });
  }
  // YJ DYNAMIC DIVISOR (v23): finals are the canonical 72-hole event, so the
  // divisor is honeyDivisorFor(72) = 72. Explicit per-event normalization,
  // matching playMatch's behavior.
  const finalsDivisor = honeyDivisorFor(72);
  const computeFinalsTotals = () => {
    const netA = p1HoneyTotal - p2HoneyTotal;
    const netB = p2HoneyTotal - p1HoneyTotal;
    return {
      a: p1Scorecard - (netA / finalsDivisor),
      b: p2Scorecard - (netB / finalsDivisor),
    };
  };
  let totals = computeFinalsTotals();
  let p1Total = totals.a, p2Total = totals.b;
  const playoffs = [];
  let dealer = 'a';
  while (p1Total === p2Total && playoffs.length < 30) {
    const holeNumber = 72 + playoffs.length + 1;
    const gameContext = { mode: 'finals', holeNumber, totalHoles: 72, isFinals: true };
    const r = playHole(p1, p2, dealer, carryPot, gameContext);
    playoffs.push({ p1Score: r.aScore, p2Score: r.bScore });
    applyHole(r);
    dealer = dealer === 'a' ? 'b' : 'a';
    totals = computeFinalsTotals();
    p1Total = totals.a; p2Total = totals.b;
  }
  p1.stats.totalScore += p1Total; p2.stats.totalScore += p2Total;
  const winner = resolveTieWinner(p1, p2, p1Total, p2Total);
  const loser = winner === p1 ? p2 : p1;
  winner.stats.matchesWon++; loser.stats.matchesLost++;
  loser.eliminatedAtBracket = 2; winner.eliminatedAtBracket = 1;
  return { winner, loser, p1, p2, p1Total, p2Total, days, playoffs };
}

// Tour state
const POOL_SIZE = 2000;
const EVENTS_PER_SEASON = { majors: 4, regulars: 8, main: 1 };
const MAJOR_FIELD = 256;
const REGULAR_FIELD = 128;
const MAIN_FIELD = 1024;
const MAJOR_EXEMPTION = 5;
const MAJOR_NAMES = ['The Hive Invitational', 'The Nectar Open', 'The Clubhouse Classic', 'The Pollen Championship'];
const REGULAR_PREFIX = ['Spring', 'Meadow', 'Honeydew', 'Clover', 'Thistle', 'Wildflower', 'Fairway', 'Azalea'];
const MAIN_NAME = 'The Moneymaker Main Event';

const TourState = {
  pool: null, seasons: [], currentSeason: 0,
  achievements: {}, activeGame: null,
  preferences: { theme: 'day', speed: 'fast' },
};

function buildPool(size) {
  const pool = [];
  for (let i = 1; i <= size; i++) {
    const target = sampleTargetSkill();
    const profile = makeProfileForSkill(target, null);
    pool.push({
      id: i, name: 'Player #' + i, profile,
      skill: target,
      authoredSkill: target,
      majorWins: 0, regularWins: 0, mainWins: 0, totalWins: 0, runnerUps: 0,
      eventsEntered: 0, majorsEntered: 0, regularsEntered: 0, mainsEntered: 0,
      lastMajorWin: null, firstMajorWin: null,
      lastMainWin: null,
      careerSpanStart: null, careerSpanEnd: null,
      bestFinalsScore: 999, recentForm: [],
      currentSeasonPoints: 0, lastSeasonPoints: 0, qualSeasonYear: 0,
      reaches: { r1: 0, r4: 0, r2: 0, finals: 0, champ: 0 },
      buyInsPaid: 0, prizeEarned: 0, itmCount: 0, finalTableCount: 0, careerScore: 0,
    });
  }
  return pool;
}

function ensureQualifierState(p) {
  if (p.eventsThisYear == null) p.eventsThisYear = 0;
  if (p.currentSeasonPoints == null) p.currentSeasonPoints = 0;
  if (p.lastSeasonPoints == null) p.lastSeasonPoints = 0;
  if (p.qualSeasonYear == null) p.qualSeasonYear = 0;
  if (!Array.isArray(p.recentForm)) p.recentForm = [];
  if (p.finalTableCount == null) p.finalTableCount = 0;
}

function syncQualificationSeason(pool, year) {
  for (const p of pool) {
    ensureQualifierState(p);
    if (!p.qualSeasonYear) {
      p.qualSeasonYear = year;
      continue;
    }
    if (p.qualSeasonYear < year) {
      p.lastSeasonPoints = (p.qualSeasonYear === year - 1) ? (p.currentSeasonPoints || 0) : 0;
      p.currentSeasonPoints = 0;
      p.eventsThisYear = 0;
      p.qualSeasonYear = year;
    }
  }
}

function recentFormScore(p) {
  ensureQualifierState(p);
  const weights = { W: 8, RU: 5, FT: 2 };
  let score = 0;
  for (let i = 0; i < p.recentForm.length; i++) score += (weights[p.recentForm[i]] || 0) * Math.max(1, 5 - i);
  return score;
}

function seasonMeritScore(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) * 1.0 + (p.lastSeasonPoints || 0) * 0.65 + recentFormScore(p) + (p.runnerUps || 0) * 2;
}

function careerMeritScore(p) {
  ensureQualifierState(p);
  return (p.majorWins || 0) * 60 + (p.mainWins || 0) * 24 + (p.regularWins || 0) * 10 + (p.runnerUps || 0) * 6 + (p.finalTableCount || 0) * 1.5;
}

function openQualifierScore(p) {
  ensureQualifierState(p);
  // Skill-rating weight bumped 3.0 → 3.5 to match regularEntryScore. The other
  // half of open seats flow through a uniform-random "mixed seeding" path
  // (selectMajorField / selectRegularField), so free-invite elites still face
  // a balanced field of opponents drawn from across all skill levels even
  // though the score-driven half of the open bucket is now strongly elite-led.
  return seasonMeritScore(p) * 1.15 + careerMeritScore(p) * 0.18 + recentFormScore(p) * 0.8 + (p.skill || 0) * 3.5;
}

function regularEntryScore(p) {
  ensureQualifierState(p);
  // Skill-rating weight bumped 3.0 → 3.5 to fully eliminate residual low-skill
  // win bias. seasonMeritScore for an active mid-tier player can reach 50–100+,
  // so a 3.0 prior still left room for the merit bucket to occasionally seat
  // mids over elites. 3.5 widens the elite-vs-mid skill gap to 1.75 and tips
  // the merit-bucket sort decisively skill-first. Volume still bounded by
  // eventsCapMultiplier + the 0.009 ranking penalty (24–32 events/yr cap).
  // Pairs with the 50/50 mixed-seeding split on the open bucket to keep
  // eliteMajorDominance_nonMain in the 40–60% band.
  return seasonMeritScore(p) * 1.0 + careerMeritScore(p) * 0.14 + recentFormScore(p) * 0.6 + (p.skill || 0) * 3.5;
}

function regularQualifierEligible(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) >= 1 || (p.lastSeasonPoints || 0) >= 2 || (p.totalWins || 0) > 0 || (p.runnerUps || 0) > 0 || (p.finalTableCount || 0) > 0;
}

function majorQualifierEligible(p) {
  ensureQualifierState(p);
  return (p.currentSeasonPoints || 0) >= 4 || (p.lastSeasonPoints || 0) >= 8 || (p.totalWins || 0) > 0 || (p.runnerUps || 0) > 0 || (p.finalTableCount || 0) > 0 || (p.majorWins || 0) > 0;
}

function allocateMajorBucketCounts(fieldSize, cfg) {
  const raw = [
    Math.max(0, +(cfg.majorChampShare != null ? cfg.majorChampShare : 0.18)),
    Math.max(0, +(cfg.majorRankingShare != null ? cfg.majorRankingShare : 0.32)),
    Math.max(0, +(cfg.majorSeasonShare != null ? cfg.majorSeasonShare : 0.22)),
    Math.max(0, +(cfg.majorCareerShare != null ? cfg.majorCareerShare : 0.13)),
    Math.max(0, +(cfg.majorOpenShare != null ? cfg.majorOpenShare : 0.15)),
  ];
  const total = raw.reduce((a, b) => a + b, 0) || 1;
  const normalized = raw.map(v => v / total);
  const exact = normalized.map(v => v * fieldSize);
  const counts = exact.map(v => Math.floor(v));
  let remaining = fieldSize - counts.reduce((a, b) => a + b, 0);
  const order = exact.map((v, i) => ({ i, frac: v - counts[i] })).sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < order.length && remaining > 0; k++, remaining--) counts[order[k].i]++;
  return { champs: counts[0], ranking: counts[1], season: counts[2], career: counts[3], open: counts[4] };
}

// Participation-cap multiplier — used by every score-based entry bucket so a
// single elite isn't pulled into ~100% of a season's events. Returns 1.0 for
// the player's first 22 events of the year, then decays linearly to 0.10 at
// 32 events. With the default tour size (53 events/year) this naturally lands
// elites at 22–28 events/year without hard exclusion. Combined with the
// 0.009 × eventsThisYear ranking-bucket penalty (see rankPenalty in
// selectMajorField / selectRegularField), this is the primary lever keeping
// elite participation realistic and ROI separation visible.
function eventsCapMultiplier(p) {
  // Cap window: capStart 22, capEnd 32 — together with the 0.009 × events
  // ranking penalty these land elites in the 22–28 events/year band on the
  // default tour size.
  const e = (p && p.eventsThisYear) || 0;
  const capStart = 22, capEnd = 32;
  if (e <= capStart) return 1.0;
  if (e >= capEnd) return 0.10;
  return 1.0 - 0.90 * ((e - capStart) / (capEnd - capStart));
}

function takeQualified(list, count, selected, out, source, sourceCounts) {
  for (const p of list) {
    if (out.length >= count) break;
    if (selected.has(p.id)) continue;
    selected.add(p.id);
    p.majorQualPathCurrent = source || 'unknown';
    if (sourceCounts && source) sourceCounts[source] = (sourceCounts[source] || 0) + 1;
    out.push(p);
  }
}

function selectMajorField(pool, fieldSize, year, cfg) {
  syncQualificationSeason(pool, year);
  const counts = allocateMajorBucketCounts(fieldSize, cfg);
  const selected = new Set();
  const out = [];
  const sourceCounts = { champ: 0, ranking: 0, season: 0, career: 0, open: 0, fallback: 0 };
  const exemptYears = cfg.exemptionYears != null ? cfg.exemptionYears : MAJOR_EXEMPTION;

  // Champion exemption — earned-once binary entry, not score-based. No cap:
  // a 5-time major winner inside their exemption window plays free.
  const champs = pool
    .filter(p => p.lastMajorWin != null && (year - p.lastMajorWin) < exemptYears)
    .sort((a, b) => (b.majorWins - a.majorWins) || (seasonMeritScore(b) - seasonMeritScore(a)) || (b.skill - a.skill));
  takeQualified(champs, counts.champs, selected, out, 'champ', sourceCounts);

  // Ranking bucket: skill-desc with ±0.05 jitter and a 0.009 × eventsThisYear
  // participation penalty. After ~22 events a top player drops 0.20 — a full
  // skill-tier — out of the top-N. Pairs with the eventsCapMultiplier on the
  // merit/season/career/open buckets so all entry paths share the same cap.
  const rankPenalty = (p) => 0.009 * (p.eventsThisYear || 0);
  const ranking = pool.slice().sort((a, b) =>
    ((b.skill * 3.5 - rankPenalty(b)) - (a.skill * 3.5 - rankPenalty(a))) + (Math.random() - 0.5) * 0.10
  );
  takeQualified(ranking, out.length + counts.ranking, selected, out, 'ranking', sourceCounts);

  const season = pool.slice().sort((a, b) =>
    (seasonMeritScore(b) * eventsCapMultiplier(b)) - (seasonMeritScore(a) * eventsCapMultiplier(a))
    || recentFormScore(b) - recentFormScore(a) || b.skill - a.skill);
  takeQualified(season, out.length + counts.season, selected, out, 'season', sourceCounts);

  const career = pool.slice().sort((a, b) =>
    (careerMeritScore(b) * eventsCapMultiplier(b)) - (careerMeritScore(a) * eventsCapMultiplier(a))
    || seasonMeritScore(b) - seasonMeritScore(a) || recentFormScore(b) - recentFormScore(a) || b.skill - a.skill);
  takeQualified(career, out.length + counts.career, selected, out, 'career', sourceCounts);

  // OPEN bucket — split 50/50 between score-weighted (skill prior 1.5) and a
  // dedicated MIXED SEEDING path that draws uniformly random from the entire
  // unselected pool, including low-skill open/fallback players. Mixed seeding
  // ensures free-invite elites (champ exemptions, multi-year exemptions, main
  // qualifiers) face a balanced field of opponents at the same selection rate
  // as the high-skill merit/ranking buckets — the WSOP/PGA hybrid composition.
  const open = pool
    .filter(p => majorQualifierEligible(p))
    .sort((a, b) =>
      ((openQualifierScore(b) * eventsCapMultiplier(b)) + Math.random() * 3) -
      ((openQualifierScore(a) * eventsCapMultiplier(a)) + Math.random() * 3));
  const halfOpen = Math.floor(counts.open / 2);
  takeQualified(open, out.length + halfOpen, selected, out, 'open', sourceCounts);
  const mixedRemaining = counts.open - halfOpen;
  if (mixedRemaining > 0) {
    const mixed = pool.filter(p => !selected.has(p.id));
    for (let i = mixed.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = mixed[i]; mixed[i] = mixed[j]; mixed[j] = t;
    }
    takeQualified(mixed, out.length + mixedRemaining, selected, out, 'mixed', sourceCounts);
  }

  if (out.length < fieldSize) {
    const fallback = pool.slice().sort((a, b) =>
      (seasonMeritScore(b) + careerMeritScore(b) * 0.30 + recentFormScore(b) * 0.5 + b.skill * 2.5) -
      (seasonMeritScore(a) + careerMeritScore(a) * 0.30 + recentFormScore(a) * 0.5 + a.skill * 2.5)
    );
    takeQualified(fallback, fieldSize, selected, out, 'fallback', sourceCounts);
  }
  const field = out.slice(0, fieldSize);
  field.majorQualifierSourceCounts = sourceCounts;
  return field;
}

function selectRegularField(pool, fieldSize, year) {
  syncQualificationSeason(pool, year);
  const selected = new Set();
  const out = [];
  const meritCount = Math.max(1, Math.round(fieldSize * 0.65));
  const rankingCount = Math.max(0, Math.round(fieldSize * 0.20));
  const openCount = Math.max(0, fieldSize - meritCount - rankingCount);
  // All score-based buckets multiply by eventsCapMultiplier so a player who's
  // already entered ≥25 events this year drops down the list naturally.
  const merit = pool.slice().sort((a, b) =>
    (regularEntryScore(b) * eventsCapMultiplier(b)) - (regularEntryScore(a) * eventsCapMultiplier(a))
    || b.skill - a.skill);
  takeQualified(merit, meritCount, selected, out);
  // Ranking bucket: 0.009 × eventsThisYear participation penalty + ±0.05 jitter.
  const rankPenalty = (p) => 0.009 * (p.eventsThisYear || 0);
  const ranking = pool.slice().sort((a, b) =>
    ((b.skill * 3.5 - rankPenalty(b)) - (a.skill * 3.5 - rankPenalty(a))) + (Math.random() - 0.5) * 0.10
  );
  takeQualified(ranking, meritCount + rankingCount, selected, out);
  // OPEN bucket — split 50/50 between score-weighted and uniform-random
  // mixed seeding. See selectMajorField for the rationale; same WSOP/PGA
  // hybrid composition applied to regulars.
  const open = pool
    .filter(p => regularQualifierEligible(p))
    .sort((a, b) =>
      ((regularEntryScore(b) * eventsCapMultiplier(b)) + Math.random() * 2.5) -
      ((regularEntryScore(a) * eventsCapMultiplier(a)) + Math.random() * 2.5));
  const halfOpen = Math.floor(openCount / 2);
  takeQualified(open, meritCount + rankingCount + halfOpen, selected, out);
  const mixedRemaining = openCount - halfOpen;
  if (mixedRemaining > 0) {
    const mixed = pool.filter(p => !selected.has(p.id));
    for (let i = mixed.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = mixed[i]; mixed[i] = mixed[j]; mixed[j] = t;
    }
    takeQualified(mixed, meritCount + rankingCount + openCount, selected, out);
  }
  if (out.length < fieldSize) {
    const fallback = pool.slice().sort((a, b) => (regularEntryScore(b) + b.skill * 1.5) - (regularEntryScore(a) + a.skill * 1.5));
    takeQualified(fallback, fieldSize, selected, out);
  }
  return out.slice(0, fieldSize);
}

function selectField(eventType, year) {
  const pool = TourState.pool;
  if (eventType === 'main') {
    const shuffled = pool.slice();
    for (let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=t; }
    return shuffled.slice(0, MAIN_FIELD);
  }
  if (eventType === 'regular') return selectRegularField(pool, REGULAR_FIELD, year);
  if (eventType === 'major') {
    return selectMajorField(pool, MAJOR_FIELD, year, {
      exemptionYears: MAJOR_EXEMPTION,
      majorChampShare: 0.18,
      majorRankingShare: 0.32,
      majorSeasonShare: 0.22,
      majorCareerShare: 0.13,
      majorOpenShare: 0.15,
    });
  }
  return pool.slice(0, 32);
}

function runTourEvent(eventType, year, eventName) {
  const field = selectField(eventType, year);
  const players = field.map(p => ({
    id: p.id, name: p.name, profile: p.profile, poolRef: p,
    stats: makeFreshStats(), eliminatedAtBracket: null, path: [],
  }));
  let remaining = players.slice();
  while (remaining.length > 16) { const r = runKnockoutRound(remaining, 9); remaining = r.winners; }
  while (remaining.length > 2) { const r = runKnockoutRound(remaining, 18); remaining = r.winners; }
  const finals = runFinals(remaining[0], remaining[1]);
  const champ = finals.winner.poolRef;
  const ru = finals.loser.poolRef;
  // Read finals-only stroke total from runFinals's return, not from wrapper.stats.
  // The wrapper stats now include bracket-round strokes (we removed the reset that
  // used to erase them), so we must use p1Total/p2Total for champScore/ruScore.
  const champScore = finals.winner === finals.p1 ? finals.p1Total : finals.p2Total;
  const ruScore    = finals.loser  === finals.p1 ? finals.p1Total : finals.p2Total;
  const champQualifierPath = eventType === 'major' ? (champ.majorQualPathCurrent || 'unknown') : null;
  if (eventType === 'major') {
    champ.majorWins++; champ.lastMajorWin = year;
    if (champ.firstMajorWin == null) champ.firstMajorWin = year;
  } else if (eventType === 'regular') champ.regularWins++;
  else if (eventType === 'main') champ.mainWins++;
  champ.totalWins++;
  champ.recentForm.unshift('W'); if (champ.recentForm.length > 5) champ.recentForm.pop();
  ru.runnerUps++;
  ru.recentForm.unshift('RU'); if (ru.recentForm.length > 5) ru.recentForm.pop();
  if (champScore < champ.bestFinalsScore) champ.bestFinalsScore = champScore;
  for (const p of field) {
    p.eventsEntered++;
    if (eventType === 'major') p.majorsEntered++;
    else if (eventType === 'regular') p.regularsEntered++;
    else p.mainsEntered++;
    if (p.careerSpanStart == null) p.careerSpanStart = year;
    p.careerSpanEnd = year;
  }
  return { type: eventType, name: eventName, fieldSize: field.length, champId: champ.id, ruId: ru.id, champScore, ruScore, finalsDays: finals.days.map(d => [d.p1Score, d.p2Score]), playoffs: finals.playoffs.length };
}

function yieldToUI() { return new Promise(r => setTimeout(r, 0)); }
function createProgressThrottler(onProgress, opts) {
  opts = opts || {};
  const progressMs = opts.progressMs || 120;
  const yieldMs = opts.yieldMs || 160;
  let lastProgressAt = 0;
  let lastYieldAt = 0;
  return {
    async tick(info) {
      const now = performance.now();
      if (onProgress && (now - lastProgressAt >= progressMs || info.force)) {
        lastProgressAt = now;
        onProgress(info);
      }
      if (now - lastYieldAt >= yieldMs || info.force) {
        lastYieldAt = now;
        await yieldToUI();
      }
    }
  };
}

async function runSeason(year, onProgress) {
  const events = [];
  for (let m=0; m<EVENTS_PER_SEASON.majors; m++) {
    const ev = runTourEvent('major', year, MAJOR_NAMES[m]);
    ev.year = year; ev.season_slot = m+1;
    events.push(ev);
    if (onProgress) { onProgress('major', m+1, 4, events.length, events); await yieldToUI(); }
  }
  for (let r=0; r<EVENTS_PER_SEASON.regulars; r++) {
    const ev = runTourEvent('regular', year, REGULAR_PREFIX[r % REGULAR_PREFIX.length] + ' Open');
    ev.year = year; ev.season_slot = r+1;
    events.push(ev);
    if (onProgress) { onProgress('regular', r+1, 8, events.length, events); await yieldToUI(); }
  }
  const ev = runTourEvent('main', year, MAIN_NAME);
  ev.year = year; ev.season_slot = 1;
  events.push(ev);
  if (onProgress) { onProgress('main', 1, 1, events.length, events); await yieldToUI(); }
  return { year, events };
}

// Career composite weighting: majors are the prestige event (invite-gated, skill-concentrated,
// analogous to the Masters/US Open); the Main Event is the luck-dominated mega-field (WSOP
// analog); regulars are the meritocratic weekly grind. So majors > main event > regular.
function composite(p) { return p.majorWins * 10 + p.mainWins * 5 + p.regularWins * 2; }

// DOM helpers for safe SVG cloning
function buzzAvatarSVG(size) {
  const src = $('.brand-mark');
  if (!src) return el('span');
  const clone = src.cloneNode(true);
  clone.setAttribute('width', size || 54);
  clone.setAttribute('height', size || 54);
  clone.removeAttribute('class');
  return clone;
}

function formatScore(n) {
  if (n == null) return '-';
  if (typeof n !== 'number' || !Number.isFinite(n)) return String(n);
  // YJ totals can be fractional once the honey divisor is applied (e.g. 18-hole
  // game with 50 honey credits → 50/18 = 2.78). Render integers as integers,
  // and fractions to one decimal so the scorecard stays readable.
  const isInt = Math.abs(n - Math.round(n)) < 1e-9;
  const shown = isInt ? Math.round(n) : Number(n.toFixed(1));
  if (shown > 0) return '+' + shown;
  return String(shown);
}

function statCard(label, value, delta, valueClass) {
  return el('div', { class: 'stat' },

    delta ? el('div', { class: 'delta', text: delta }) : null
  );
}

function showView(name) {
  $$('.view').forEach(v => v.classList.toggle('active', v.dataset.view === name));
  $$('nav.nav a').forEach(a => a.classList.toggle('active', a.dataset.route === name));
  const content = $('#content');

function onHashChange() {
  const parsed = parseHashRoute();
  // Back-compat: redirect legacy #season and #lab to the unified #simulator route.
  if (parsed.view === 'season' || parsed.view === 'lab') {
    const mode = parsed.view === 'lab' ? 'advanced' : 'simple';
    const extra = Object.keys(parsed.params).filter(k => k !== 'mode').map(k => '&' + encodeURIComponent(k) + '=' + encodeURIComponent(parsed.params[k])).join('');
    location.replace(location.pathname + location.search + '#simulator?mode=' + mode + extra);
    return;
  }
  const valid = ['dashboard','simulator','events','players','hof','analytics','compare','rules','buzz','solo','multiplayer','codex'];
  const name = valid.indexOf(parsed.view) !== -1 ? parsed.view : 'dashboard';
  if (name === 'players' && !parsed.params.profileId) PlayersState.profileId = null;
  if (document.startViewTransition) {
    document.startViewTransition(() => showView(name));
  } else {
    const content = $('#content');
    if (content) content.classList.add('transitioning');
    setTimeout(() => { showView(name); if (content) content.classList.remove('transitioning'); }, 20);
  }
}

    t.appendChild(el('thead', null, el('tr', null,
      el('th', { text: 'Rank' }), el('th', { text: 'Player' }),

      el('th', { class: 'num', text: 'Mains' }), el('th', { class: 'num', text: 'Total' }))));
    const tb = el('tbody');
    sorted.forEach((p, i) => {
      const tr = el('tr', { onclick: () => openPlayerModal(p.id), style: 'cursor: pointer;' });
      if (i === 0) tr.className = 'gold-row';
      tr.appendChild(el('td', { text: '#' + (i+1) }));
      tr.appendChild(el('td', { text: p.name }));
      tr.appendChild(el('td', { class: 'num gold', text: String(p.majorWins) }));
      tr.appendChild(el('td', { class: 'num', text: String(p.regularWins) }));
      tr.appendChild(el('td', { class: 'num', text: String(p.mainWins) }));
      tr.appendChild(el('td', { class: 'num green', text: String(p.totalWins) }));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    lbCard.appendChild(t);
    view.appendChild(lbCard);
  }
};

function renderFeed() {
  const list = $('#feedList');
  if (!list) return;

  if (TourState.seasons.length === 0) {
    list.appendChild(el('p', { class: 'ui-sans', style: 'color: var(--fairway); font-size: 13px;', text: 'No events yet. Run your first season.' }));
    return;
  }
  const allEvents = [];
  for (const s of TourState.seasons) for (const e of s.events) allEvents.push(Object.assign({}, e, { year: s.year }));
  const recent = allEvents.slice(-10).reverse();
  recent.forEach(e => {
    const card = el('div', { class: 'event-card' });
    const badgeClass = 'ev-badge ' + (e.type === 'major' ? 'major' : e.type === 'main' ? 'main' : '');

    card.appendChild(el('div', { class: badgeClass, text: badgeText }));
    const detail = el('div', null,
      el('div', { class: 'ui-sans', style: 'font-size: 14px; color: var(--green); font-weight: 500;' },
        el('span', { text: e.name }),
        ' ',
        el('span', { class: 'chip gold', text: 'Year ' + e.year })),
      el('div', { class: 'ui-sans', style: 'font-size: 12px; color: var(--fairway); margin-top: 3px;' },
        el('b', { text: playerName(e.champId) }), ' won at ',
        el('span', { class: 'mono', style: 'color: ' + (e.champScore <= 0 ? 'var(--green)' : 'var(--charcoal)') + ';', text: formatScore(e.champScore) }),
        ' · runner-up ' + playerName(e.ruId) + ' (' + formatScore(e.ruScore) + ')'));

}

      p.majorWins = 0; p.regularWins = 0; p.mainWins = 0; p.totalWins = 0; p.runnerUps = 0;
      p.eventsEntered = 0; p.majorsEntered = 0; p.regularsEntered = 0; p.mainsEntered = 0;
      p.lastMajorWin = null; p.firstMajorWin = null;
      p.bestFinalsScore = 999; p.recentForm = [];
      p.currentSeasonPoints = 0; p.lastSeasonPoints = 0; p.qualSeasonYear = 0;

function renderFAQs() {
  const list = $('#faqList');
  if (!list) return;
  clear(list);
  const filtered = BuzzKnowledge.faqs.filter(f => {
    if (faqState.cat !== 'all' && f.cat !== faqState.cat) return false;
    if (faqState.search) {
      const q = faqState.search.toLowerCase();
      if (!f.q.toLowerCase().includes(q) && !f.a.toLowerCase().includes(q)) return false;
    }

  });

    qRow.appendChild(el('span', null,
      el('span', { class: 'chip ' + (f.cat === 'rules' ? 'gold' : ''), text: f.cat }),

Views.codex = function() {
  const view = $('[data-view="codex"]'); clear(view);

  const fmtNum = (n) => (n != null ? n.toLocaleString() : '?');

  // Helper: section card with H2 + body content.

  }
  function tbl(headers, rows) {
    const t = el('table', { style: 'margin-top: 8px; font-size: 12px;' });

    const tr = el('tr');
    headers.forEach(h => tr.appendChild(el('th', { text: h })));
