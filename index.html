  // Event feed (pulls from TourState)
  if (hasCareer) {
    const feedCard = el('div', { class: 'card', style: 'margin-top: 18px;' });
    feedCard.appendChild(el('h2', { text: 'Event Feed (Recent)' }));
    const feedList = el('div', { id: 'feedList', class: 'career-feed' });
    feedCard.appendChild(feedList);
    root.appendChild(feedCard);
    renderFeed();
  }
}

function kpiBox(label, value, delta) {
  const b = el('div', { class: 'kpi-box' });
  b.appendChild(el('div', { class: 'kpi-label', text: label }));
  b.appendChild(el('div', { class: 'kpi-value', text: String(value) }));
  if (delta) b.appendChild(el('div', { class: 'kpi-delta', text: delta }));
  return b;
}

// Career-cumulative foundation ledger: sums across every TourState.seasons event.
function computeFoundationCareer() {
  let totalRevenue = 0, totalPrizePool = 0, totalEntries = 0, totalITM = 0, eventCount = 0;
  for (const s of TourState.seasons || []) {
    for (const e of s.events) {
      totalRevenue += (e.revenue || 0);
      totalPrizePool += (e.prizePool || 0);
      totalEntries += (e.fieldSize || 0);
      totalITM += (e.itmCount || 0);
      eventCount++;
    }
  }
  const itmRate = totalEntries > 0 ? totalITM / totalEntries : 0;
  return { totalRevenue, totalPrizePool, totalEntries, totalITM, itmRate, eventCount };
}

function renderRunCard(r) {
  const card = el('div', { class: 'run-card' + (r.id === LabState.activeRunId ? ' active' : '') });
  const runCfg = r.config || r.cfg || {};
  const style = resolveScoringModel(runCfg.scoringStyle);
  card.onclick = (e) => {
    if (e.target.tagName === 'BUTTON') return;
    LabState.activeRunId = r.id;
    saveLabState();
    renderLabResults($('#labResults'));
  };
  card.appendChild(el('div', { class: 'run-name', text: r.label }));
  card.appendChild(el('div', { class: 'run-meta', text: 'Scoring style: ' + style.name }));
  card.appendChild(el('div', { class: 'run-meta', text: new Date(r.timestamp).toLocaleString() + ' · ' + r.metrics.eventCount + ' events · ' + (r.elapsedMs / 1000).toFixed(1) + 's' }));
  const kpis = el('div', { class: 'run-kpis' });
  const m = r.metrics;
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'R²: ', el('b', { text: m.varianceDecomp.skillR2.toFixed(2) })));
  if (m.varianceDecomp_nonMain) {
    kpis.appendChild(el('span', { class: 'run-kpi', title: 'Skill R² excluding Main Event' }, 'R² NM: ', el('b', { text: m.varianceDecomp_nonMain.skillR2.toFixed(2) })));
  }
  if (typeof m.skillEVSpearman_nonMain === 'number') {
    kpis.appendChild(el('span', { class: 'run-kpi', title: 'EV-skill Spearman (regulars + majors)' }, 'EV ρ NM: ', el('b', { text: m.skillEVSpearman_nonMain.toFixed(2) })));
  }
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Gini: ', el('b', { text: m.gini.toFixed(2) })));
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Below par: ', el('b', { text: (m.belowParRate * 100).toFixed(0) + '%' })));
  kpis.appendChild(el('span', { class: 'run-kpi' }, 'Repeat maj: ', el('b', { text: (m.repeatMajorRate * 100).toFixed(0) + '%' })));
  if (m.economics && m.economics.totalRevenue > 0) {
    kpis.appendChild(el('span', { class: 'run-kpi' }, 'Rev: ', el('b', { text: fmtMoney(m.economics.totalRevenue) })));
  }
  card.appendChild(kpis);
  const actions = el('div', { class: 'run-actions' });
  const expJ = el('button', { text: 'JSON' });
  expJ.onclick = (e) => { e.stopPropagation(); exportRunToJSON(r); };
  const expC = el('button', { text: 'CSV' });
  expC.onclick = (e) => { e.stopPropagation(); exportRunToCSV(r); };
  const delB = el('button', { text: '✕', title: 'Delete' });
  delB.onclick = (e) => {
    e.stopPropagation();
    if (confirm('Delete run: ' + r.label + '?')) {
      LabState.runs = LabState.runs.filter(x => x.id !== r.id);
      if (LabState.activeRunId === r.id) LabState.activeRunId = LabState.runs[0] ? LabState.runs[0].id : null;
      saveLabState(); renderLabResults($('#labResults'));
    }
  };
  actions.appendChild(expJ); actions.appendChild(expC); actions.appendChild(delB);
  card.appendChild(actions);
  return card;
}

function renderActiveRun(root, r) {
  const m = r.metrics;
  const runCfg = r.config || r.cfg || {};
  const style = resolveScoringModel(runCfg.scoringStyle);
  const wrap = el('div', { class: 'card', style: 'margin-top: 18px;' });
  wrap.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); margin-bottom: 12px;', text: 'Scoring style: ' + style.name + '. ' + style.desc }));
  wrap.appendChild(el('h2', { text: 'Active run · ' + r.label }));
  // KPI strip
  const kpis = el('div', { class: 'kpi-strip' });
  function kpi(label, value, delta) {
    const b = el('div', { class: 'kpi-box' });
    b.appendChild(el('div', { class: 'kpi-label', text: label }));
    b.appendChild(el('div', { class: 'kpi-value', text: value }));
    if (delta) b.appendChild(el('div', { class: 'kpi-delta' + (delta.startsWith('+') ? ' up' : delta.startsWith('-') ? ' down' : ''), text: delta }));
    return b;
  }
  kpis.appendChild(kpi('Skill R² (linear · wins)', m.varianceDecomp.skillR2.toFixed(3), 'lower bound — linear assumption'));
  if (m.varianceDecomp_nonMain) {
    kpis.appendChild(kpi('Skill R² · non-Main', m.varianceDecomp_nonMain.skillR2.toFixed(3), 'regulars + majors only'));
  }
  kpis.appendChild(kpi('Luck share', (m.varianceDecomp.luckR2 * 100).toFixed(0) + '%', 'incl. model noise + nonlinearity'));
  // Spearman rank correlation: non-linear-friendly version of skill signal. If skill really
  // matters but wins are lumpy/threshold-based, Spearman will be much higher than R².
  if (typeof m.skillSpearman === 'number') {
    const rho = m.skillSpearman;
    const tag = rho > 0.7 ? 'strong' : rho > 0.4 ? 'moderate' : rho > 0.2 ? 'weak' : 'near noise';
    kpis.appendChild(kpi('Skill ρ (Spearman rank)', rho.toFixed(3), tag + ' rank alignment'));
  }
  // Headline poker-skill KPIs: Spearman of authoredSkill vs EV-realization.
  // Non-Main is the cleanest read because it strips the 25k-field Main lottery.
  if (typeof m.skillEVSpearman === 'number') {
    const rho = m.skillEVSpearman;
    const tag = rho > 0.7 ? 'strong' : rho > 0.4 ? 'moderate' : rho > 0.2 ? 'weak' : 'near noise';
    kpis.appendChild(kpi('EV ρ (skill ↔ EV)', rho.toFixed(3), tag + ' poker-skill signal'));
  }
  if (typeof m.skillEVSpearman_nonMain === 'number') {
    const rho = m.skillEVSpearman_nonMain;
    const tag = rho > 0.7 ? 'strong' : rho > 0.4 ? 'moderate' : rho > 0.2 ? 'weak' : 'near noise';
    kpis.appendChild(kpi('EV ρ · non-Main', rho.toFixed(3), tag + ' (regulars + majors)'));
  }
  // Authored vs measured skill: sanity check on the simulator's internal skill metric.
  // > 0.7 = authored rating tracks empirical; < 0.3 = authored rating is decoupled (suspect).
  if (typeof m.authoredVsMeasured === 'number') {
    const r = m.authoredVsMeasured;
    const tag = r > 0.7 ? 'tracking' : r > 0.4 ? 'partial' : r > 0.2 ? 'weak' : 'decoupled';
    kpis.appendChild(kpi('Authored vs measured skill', 'r = ' + r.toFixed(2), tag));
  }
  kpis.appendChild(kpi('Gini (win concentration)', m.gini.toFixed(3)));
  kpis.appendChild(kpi('Elite major dominance', (m.eliteMajorDominance * 100).toFixed(0) + '%'));
  if (typeof m.eliteMajorDominance_nonMain === 'number') {
    kpis.appendChild(kpi('Elite non-Main dominance', (m.eliteMajorDominance_nonMain * 100).toFixed(0) + '%', 'regulars + majors'));
  }
  kpis.appendChild(kpi('Repeat major rate', (m.repeatMajorRate * 100).toFixed(0) + '%'));
  // Finals skill-edge: the single most diagnostic KPI for "does H2H skill express?"
  // Positive mean = champs are more skilled than RUs. Upset rate near 0.5 = near-coinflip finals.
  if (m.finalsSkillEdge && m.finalsSkillEdge.all && m.finalsSkillEdge.all.n > 0) {
    const f = m.finalsSkillEdge.all;
    const tag = f.mean > 0.05 ? 'skill expresses' : f.mean > 0.02 ? 'faint signal' : f.mean > -0.01 ? 'coin flip' : 'inverted';
    kpis.appendChild(kpi('Finals skill-edge', f.mean.toFixed(3), tag));
    kpis.appendChild(kpi('Finals upset rate', (f.upsetRate * 100).toFixed(0) + '%', f.upsetRate > 0.45 ? 'near-random finals' : f.upsetRate > 0.35 ? 'some skill' : 'skill dominates'));
  }
  // Below-par rate benchmark for Honey-Stroke. Calibration band: 60–85% under typical
  // cfg (most clean showdowns post a non-positive golf score; HC bogeys and decisive
  // folds push the rate up; deep-stack timewasters drag it down).
  (function () {
    const rate = (m.belowParRate || 0) * 100;
    const target = 70;
    const delta = rate - target;
    const signed = (delta >= 0 ? '+' : '') + delta.toFixed(0) + 'pp';
    kpis.appendChild(kpi('Below-par rate', rate.toFixed(0) + '%', 'vs Honey-Stroke target 70% · ' + signed));
  })();
  // v52: per-event-type finals skill-edge. Different event formats (72-hole
  // aggregate vs 9-hole bracket) express skill differently, so a single
  // pooled finals skill-edge can hide that majors are skill-dominated while
  // mains are coin-flip. Surface all three so calibration gaps are visible.
  if (m.finalsSkillEdge) {
    const formatEdge = (label, edge) => {
      if (!edge || !edge.n) return null;
      const tag = edge.mean > 0.05 ? 'skill' : edge.mean > 0.01 ? 'faint skill' : edge.mean > -0.01 ? 'coin flip' : 'inverted';
      return kpi(label, edge.mean.toFixed(3), tag + ' · ' + (edge.upsetRate * 100).toFixed(0) + '% upsets');
    };
    const tiles = [
      formatEdge('Finals edge · major', m.finalsSkillEdge.major),
      formatEdge('Finals edge · regular', m.finalsSkillEdge.regular),
      formatEdge('Finals edge · main', m.finalsSkillEdge.main),
    ].filter(Boolean);
    tiles.forEach(t => kpis.appendChild(t));
  }
  // Surface Codex's Median major-winner percentile (the headline signal for whether
  // majors are a true elite filter or a broader ecosystem). Healthy band: top 8–15%.
  if (m.majorWinnerSkillMetrics && typeof m.majorWinnerSkillMetrics.medianPercentile === 'number' && m.majorWinnerSkillMetrics.count > 0) {
    const w = m.majorWinnerSkillMetrics;
    const pct = w.medianPercentile * 100;
    kpis.appendChild(kpi('Median major-winner percentile', 'top ' + pct.toFixed(1) + '%', 'top-5 share ' + (w.top5Share * 100).toFixed(0) + '%'));
  }
  if (m.economics && m.economics.totalRevenue > 0) {
    kpis.appendChild(kpi('YJ Inc revenue', fmtMoney(m.economics.totalRevenue)));
    kpis.appendChild(kpi('Prize pool', fmtMoney(m.economics.totalPrizePool)));
    kpis.appendChild(kpi('ITM rate', (m.economics.itmRate * 100).toFixed(1) + '%'));
    const elite = m.economics.tiers[0];
    const bottom = m.economics.tiers[3];
    kpis.appendChild(kpi('Elite ROI', (elite.roi * 100).toFixed(0) + '%', 'skill tier'));
    kpis.appendChild(kpi('Bottom ROI', (bottom.roi * 100).toFixed(0) + '%', 'skill tier'));
  }
  wrap.appendChild(kpis);

  // Business insights row — YJ Inc + player P&L structure
  if (m.economics && m.economics.totalRevenue > 0 && m.economics.breakEvenRate != null) {
    const biz = el('div', { class: 'kpi-strip', style: 'margin-top: 6px;' });
    const e = m.economics;
    biz.appendChild(kpi('Break-even rate', ((e.breakEvenRate || 0) * 100).toFixed(1) + '%', (e.breakEvenCount || 0) + ' / ' + m.poolSize + ' players'));
    biz.appendChild(kpi('Payout ratio', ((e.payoutRatio || 0) * 100).toFixed(1) + '%', 'prize pool ÷ gross'));
    biz.appendChild(kpi('YoY revenue growth', ((e.yoyGrowth || 0) * 100).toFixed(1) + '%', 'avg year-over-year'));
    biz.appendChild(kpi('Biggest single payout', fmtMoney(e.biggestSinglePayout || 0), 'one champion'));
    biz.appendChild(kpi('Avg entries / player', (e.avgEntriesPerPlayer || 0).toFixed(1), 'per career'));
    biz.appendChild(kpi('Avg buy-in / player', fmtMoney(e.avgBuyInPerPlayer || 0), 'lifetime spend'));
    wrap.appendChild(biz);
  }

  // Real-world benchmark row — sim economics vs PGA / WSOP reference numbers.
  (function () {
    if (!m.economics || m.economics.totalRevenue <= 0) return;
    const e = m.economics;
    if (!e.avgPurseByType) return;
    const bench = el('div', { class: 'kpi-strip', style: 'margin-top: 6px;' });
    if ((e.countByType.major || 0) > 0) {
      bench.appendChild(kpi('Avg major purse', fmtMoney(e.avgPurseByType.major), 'Masters $20M'));
      bench.appendChild(kpi('Avg major winner prize', fmtMoney(e.avgWinnerByType.major), 'Masters $3.6M'));
    }
    if ((e.countByType.regular || 0) > 0) {
      bench.appendChild(kpi('Avg regular purse', fmtMoney(e.avgPurseByType.regular), 'PGA Tour $8M'));
      bench.appendChild(kpi('Avg regular winner prize', fmtMoney(e.avgWinnerByType.regular), 'PGA Tour ~$1.4M'));
    }
    if ((e.countByType.main || 0) > 0) {
      bench.appendChild(kpi('Avg main purse', fmtMoney(e.avgPurseByType.main), 'WSOP Main $80M (10× our field)'));
      bench.appendChild(kpi('Avg main winner prize', fmtMoney(e.avgWinnerByType.main), 'WSOP Main $12M'));
    }
    if ((e.countByType.major || 0) > 0 && (e.totalExemptSeats || 0) > 0) {
      const avgExempt = e.totalExemptSeats / e.countByType.major;
      bench.appendChild(kpi('Exempt seats / major', avgExempt.toFixed(1), 'champions playing free'));
    }
    if (bench.children.length > 0) wrap.appendChild(bench);
  })();

  // Methodology notes: makes the caveats explicit so nobody misreads headline stats.
  (function () {
    const note = el('div', { class: 'card', style: 'margin-top: 10px; padding: 12px 14px;' });
    note.appendChild(el('h3', { text: 'Methodology notes', style: 'font-size: 12px; margin-bottom: 6px;' }));
    const ul = el('ul', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); padding-left: 18px; line-height: 1.5; margin: 0;' });
    function li(t) { const x = el('li'); x.textContent = t; ul.appendChild(x); }
    li('Skill R² is the LINEAR fit of wins ~ skill. It lower-bounds skill impact — threshold/non-linear skill signals leak into "luck share".');
    li('Skill ρ (Spearman) is rank-vs-rank correlation. Shows "do better players finish higher" without requiring linearity.');
    li('Authored vs measured skill: authored skill uses hand-tuned thresholds; measured skill is (wins + 0.5·RU + 0.25·finalTables) / eventsEntered. r < 0.3 means our authored metric is decoupled.');
    li('AI is board-texture-aware: flushCount / pairedCount / straightRisk + opponent commit-fraction feed a threat score, countered by hero draw-equity. Skilled players apply the full adjustment; noisy players ignore it (realistic tilt model).');
    li('Player profiles are coupled to authored skill: skill is sampled from truncated Normal(0.5, 0.18), then the profile thresholds are constructed to match, so authored-vs-measured correlation has a firm floor and same-tier players behave consistently.');
    li('Finals skill-edge = mean(champ.skill − ru.skill) across all events. Near 0 = H2H finals are coin flips (skill expresses only via field access). Positive = finalists with higher skill win more often, as expected.');
    li('Single-run metrics have no error bars. Use "CI repeats" in config to run N parallel sims and see mean ± SD on every metric.');
    if (m.ciData) {
      const anyKey = Object.keys(m.ciData)[0];
      li('CI data present (N = ' + m.ciData[anyKey].n + ' runs). Hover the KPI deltas for SD values in the exported CSV.');
    }
    note.appendChild(ul);
    wrap.appendChild(note);
  })();

  // Perf card: surfaces throughput + progressive-slowdown diagnostic. Rendered only if
  // the session actually produced perf data (runs routed via runLabSession do).
  (function () {
    const perf = m.perf;
    if (!perf || !perf.eventCount) return;
    const card = el('div', { class: 'card', style: 'margin-top: 10px; padding: 12px 14px;' });
    card.appendChild(el('h3', { text: 'Simulation performance', style: 'font-size: 12px; margin-bottom: 6px;' }));
    const strip = el('div', { class: 'kpi-strip', style: 'margin-bottom: 8px;' });
    function chip(label, value, delta) {
      const b = el('div', { class: 'kpi-box' });
      b.appendChild(el('div', { class: 'kpi-label', text: label }));
      b.appendChild(el('div', { class: 'kpi-value', text: value }));
      if (delta) b.appendChild(el('div', { class: 'kpi-delta', text: delta }));
      return b;
    }
    const mins = perf.totalMs / 60000;
    const timeLabel = perf.totalMs < 1000 ? perf.totalMs.toFixed(0) + ' ms'
      : perf.totalMs < 60000 ? (perf.totalMs / 1000).toFixed(2) + ' s'
      : mins.toFixed(2) + ' min';
    strip.appendChild(chip('Total time', timeLabel, perf.eventCount + ' events'));
    strip.appendChild(chip('Events / sec', perf.eventsPerSec.toFixed(1), 'mean throughput'));
    strip.appendChild(chip('Ms / event', perf.msPerEvent.toFixed(1), ''));
    // Progressive-slowdown diagnostic: compare first 10% of events against last 10%.
    // Positive Δ means the sim got SLOWER over time (bad). Near zero means flat (good).
    const slow = perf.slowdownPct;
    const slowTag = slow > 15 ? 'progressive slowdown' : slow > 5 ? 'mild drift' : Math.abs(slow) <= 5 ? 'flat — no leak' : 'sped up';
    const slowStr = (slow >= 0 ? '+' : '') + slow.toFixed(1) + '%';
    strip.appendChild(chip('Slowdown (first 10% → last 10%)', slowStr, slowTag));
    card.appendChild(strip);
    // Bucket breakdown. Only render buckets we saw time in.
    const buckets = perf.buckets || {};
    const totalBucketMs = Object.values(buckets).reduce((a, b) => a + b, 0);
    if (totalBucketMs > 0) {
      const breakdown = el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary); line-height: 1.5;' });
      breakdown.appendChild(el('div', { style: 'margin-bottom: 4px; color: var(--text);', text: 'Time by phase:' }));
      const rows = Object.keys(buckets).sort((a, b) => buckets[b] - buckets[a]);
      for (const k of rows) {
        const pct = (buckets[k] / totalBucketMs) * 100;
        const msLabel = buckets[k] < 1000 ? buckets[k].toFixed(0) + ' ms' : (buckets[k] / 1000).toFixed(2) + ' s';
        breakdown.appendChild(el('div', { text: '  ' + k + ' · ' + msLabel + ' · ' + pct.toFixed(1) + '%' }));
      }
      card.appendChild(breakdown);
    }
    wrap.appendChild(card);
  })();

  // ============================================================================
  // SECTIONED CHART LAYOUT (v53 reorg). Each section has a header + its own
  // chart-grid. Order is reading-friendly: skill expression → champion profile
  // → tournament dynamics → AI decision quality → field composition → economics
  // → career arc. KPIs appropriate to each section live IN that section, not
  // crammed into one mega-strip up top.
  // ============================================================================
  function addSection(title, subtitle) {
    const div = el('div');
    div.style.cssText = 'margin-top: 28px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border, #334);';
    div.appendChild(el('h3', { text: title, style: 'font-size: 15px; margin: 0 0 4px 0; color: var(--text);' }));
    if (subtitle) div.appendChild(el('div', { class: 'ui-sans', style: 'font-size: 11px; color: var(--text-secondary);', text: subtitle }));
    wrap.appendChild(div);
    const grid = el('div', { class: 'chart-grid', style: 'margin-top: 12px;' });
    wrap.appendChild(grid);
    return grid;
  }
  function makeChartCard(title, subtitle, canvas, note) {
    const card = el('div', { class: 'chart-box' });
    card.appendChild(el('div', { class: 'chart-title', text: title }));
    if (subtitle) card.appendChild(el('div', { class: 'chart-sub', text: subtitle }));
    card.appendChild(canvas);
    if (note) card.appendChild(el('div', { class: 'chart-note', text: note }));
    return card;
  }
  const hasEco = m.economics && m.economics.totalRevenue > 0;
  const byTypeStats = m.champScoreStatsByType || {};

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 1 — SKILL EXPRESSION
  // ─────────────────────────────────────────────────────────────────────────
  const gridSkill = addSection('Skill Expression',
    'How does authored player skill translate into observed performance?');
  const cv1 = el('canvas', { width: '520', height: '240' });
  gridSkill.appendChild(makeChartCard(
    'Skill → Wins Curve',
    '20-bin smoothed · slope is the skill signal',
    cv1,
    'Steeper slope = more skill-dominated. Flat = luck-dominated.'));
  const cv2 = el('canvas', { width: '520', height: '240' });
  gridSkill.appendChild(makeChartCard(
    'Bracket Conversion by Skill Tier',
    'P(reach stage | entered) — pooled across event types',
    cv2,
    'Flat bars = bracket survival is variance-driven. Skill expresses primarily in earnings (see Economics) and aggregate champion scores, less in per-bracket survival rates.'));

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 2 — CHAMPION PROFILE
  // ─────────────────────────────────────────────────────────────────────────
  const gridChamp = addSection('Champion Profile',
    'How deep do champion scores go, and how does it vary by event type?');
  const cv6 = el('canvas', { width: '520', height: '240' });
  const champCard = makeChartCard(
    'Champion Score Distribution · all events',
    'Pooled across all event types',
    cv6, null);
  if (m.champScoreStats && m.champScoreStats.count > 0) {
    const s = m.champScoreStats;
    const common = s.common.map(x => formatScore(x.score) + ' (' + (x.rate * 100).toFixed(0) + '%)').join(' · ');
    champCard.appendChild(el('div', { class: 'chart-note',
      text: 'mean ' + formatScore(Math.round(s.mean * 10) / 10) + ' · median ' + formatScore(Math.round(s.median * 10) / 10) + ' · p10 ' + formatScore(Math.round(s.p10 * 10) / 10) + ' · p90 ' + formatScore(Math.round(s.p90 * 10) / 10) }));
  }
  gridChamp.appendChild(champCard);

  function eventTypeCard(type, label, canvas) {
    const stats = byTypeStats[type];
    const subText = stats && stats.count
      ? stats.count + ' events · mean ' + formatScore(Math.round(stats.mean * 10) / 10) + ' · ' + (stats.underParRate * 100).toFixed(0) + '% below par'
      : 'No events of this type';
    const note = type === 'main'
      ? '9-hole bracket lottery. High variance, scores skew positive — WSOP-feel by design.'
      : type === 'major'
        ? '72-hole aggregate, 256-field. Skill-dominated; champions go deeper below par.'
        : '72-hole aggregate, 512-field. Workhorse format.';
    return makeChartCard('Champion Score · ' + label, subText, canvas, note);
  }
  const cv6Major = el('canvas', { width: '520', height: '240' });
  const cv6Regular = el('canvas', { width: '520', height: '240' });
  const cv6Main = el('canvas', { width: '520', height: '240' });
  gridChamp.appendChild(eventTypeCard('major', 'Majors', cv6Major));
  gridChamp.appendChild(eventTypeCard('regular', 'Regulars', cv6Regular));
  gridChamp.appendChild(eventTypeCard('main', 'Main Event', cv6Main));

  // Calibration thresholds table — pct of events with champion score ≤ -1, -5, -10, -20.
  // Hidden in CSV; visible markers tell you where the "historic round" tail sits.
  if (m.champScoreStatsByType) {
    const calCard = el('div', { class: 'chart-box' });
    calCard.appendChild(el('div', { class: 'chart-title', text: 'Champion Calibration Thresholds' }));
    calCard.appendChild(el('div', { class: 'chart-sub', text: 'Share of events with champion at-or-below the listed score · per event type' }));
    const tbl = el('table', { style: 'width: 100%; font-size: 11px; margin-top: 8px;' });
    const thead = el('thead');
    const hr = el('tr');
    ['Event type','≤ −1','≤ −5','≤ −10','≤ −20','best'].forEach(h => hr.appendChild(el('th', { text: h, style: 'text-align: right; padding: 4px 6px;' })));
    hr.firstChild.style.textAlign = 'left';
    thead.appendChild(hr);
    tbl.appendChild(thead);
    const tbody = el('tbody');
    ['major','regular','main'].forEach(type => {
      const s = byTypeStats[type];
      if (!s || !s.count) return;
      const tr = el('tr');
      const cells = [
        type.charAt(0).toUpperCase() + type.slice(1) + ' (' + s.count + ')',
        (s.atOrBelow1 * 100).toFixed(1) + '%',
        (s.atOrBelow5 * 100).toFixed(1) + '%',
        (s.atOrBelow10 * 100).toFixed(1) + '%',
        (s.atOrBelow20 * 100).toFixed(1) + '%',
        formatScore(Math.round(s.min * 10) / 10),
      ];
      cells.forEach((c, i) => tr.appendChild(el('td', { text: c, style: 'text-align: ' + (i === 0 ? 'left' : 'right') + '; padding: 4px 6px; font-family: monospace;' })));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    calCard.appendChild(tbl);
    calCard.appendChild(el('div', { class: 'chart-note', text: '"≤ −5" is the historic-round tail. Healthy 72-hole majors hit ~10-20% at this threshold; mains rarely.' }));
    gridChamp.appendChild(calCard);
  }

  const cv3 = el('canvas', { width: '520', height: '240' });
  gridChamp.appendChild(makeChartCard(
    'Avg Champion Score · Year',
    'Does the tour get harder as elite solidifies?',
    cv3,
    'Downward drift = the tour is getting more competitive over time as exemptions stack.'));

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 3 — TOURNAMENT DYNAMICS
  // ─────────────────────────────────────────────────────────────────────────
  const gridDyn = addSection('Tournament Dynamics',
    'Finals matchups, head-to-head outcomes, and repeat-winner concentration.');
  const cv5 = el('canvas', { width: '520', height: '320' });
  gridDyn.appendChild(makeChartCard(

    'Diagonal weight = within-quartile finals (skill-similar). Top-row dominance = elite winning down.'));

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 4 — AI DECISION QUALITY
  // ─────────────────────────────────────────────────────────────────────────
  const gridAI = addSection('AI Decision Quality',
    'Are players making correct decisions at each equity level and pot size?');
  const cv4 = el('canvas', { width: '520', height: '240' });
  gridAI.appendChild(makeChartCard(
    'Action Rate by Street',
    'check / bet / call / raise / fold · across the pool',
    cv4,
    'Watch this when you widen aggression — fold/raise ratios should shift.'));
  let cv4b = null;
  if (m.equityBucketActions) {
    cv4b = el('canvas', { width: '520', height: '240' });
    gridAI.appendChild(makeChartCard(
      'Fold Rate by Equity Bucket',
      '% of fold-eligible decisions where AI folded · by perceived equity',
      cv4b,
      'YJ-correct: high fold rate at 0-20% equity, near-zero everywhere else. Folds at 40%+ are leaks (the v18-v50 inversion bug looked like this).'));
  }
  // Resolution mix donut — fold/showdown/tie share. Tells you whether the AI
  // is folding too much (healthy YJ should be ~20% fold, ~75% showdown, ~5% tie).
  let cvResMix = null;
  if (m.resolutionCounts && (m.resolutionCounts.fold + m.resolutionCounts.showdown + m.resolutionCounts.tie) > 0) {
    cvResMix = el('canvas', { width: '520', height: '240' });
    gridAI.appendChild(makeChartCard(
      'Hole Resolution Mix',
      'Share of holes ending in fold / showdown / tie (carry-pot)',
      cvResMix,
      'YJ target: ~20% fold, ~75% showdown, ~5% tie. High fold rate = AI over-folding (classic-poker tight bias).'));
  }
  // Pot-size at resolution — does the AI fold on big pots (bad) or only small?
  let cvPotRes = null;
  if (m.potBucketsAtFold && m.potBucketsAtShowdown) {
    cvPotRes = el('canvas', { width: '520', height: '260' });
    gridAI.appendChild(makeChartCard(
      'Pot Size at Resolution',
      'How big was the pot when the hole ended? · 5 buckets',
      cvPotRes,
      'Folds should cluster in small pots (<8). Big-pot folds mean AI is paying maximum honey loss instead of seeing showdown.'));
  }
  // v54 TRUE FOLD COST histogram — stroke-equivalent total cost paid by the
  // folder. Includes both the +1 bogey AND the honey forfeit converted via
  // round-end divisor. Replaces the v44 golf-only histogram, which was a
  // tautology (always 100% at +1 since v46's flat formula).
  let cvFoldCost = null;
  if (m.foldCostHist && m.foldCostHist.some(c => c > 0)) {
    cvFoldCost = el('canvas', { width: '520', height: '240' });
    gridAI.appendChild(makeChartCard(
      'True Fold Cost · stroke-equivalent',
      'Total cost paid = 1 stroke (bogey) + agreedTotal / round-end-divisor',

      'Cheap folds (1.00–1.50) = small-pot tactical bails. Expensive folds (3.00+) = the AI paid maximum honey before bailing — a leak. Healthy YJ skews left.'));
  }
  // Bluff-read suppression by readingDepth bucket (v50 C diagnostic).
  let cvBluffRead = null;
  if (m.bluffReadStats && m.bluffReadStats.some(r => r.reads > 0)) {
    cvBluffRead = el('canvas', { width: '520', height: '240' });
    gridAI.appendChild(makeChartCard(
      'Bluff-Read Suppression by Reading Depth',
      'Fraction of naive aggression-discount nullified by Bayesian bluff prior',
      cvBluffRead,
      'Should rise monotonically with readingDepth. Confirms high-readingDepth players correctly identify bluffs and refuse to overfold.'));
  }

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 5 — FIELD COMPOSITION
  // ─────────────────────────────────────────────────────────────────────────
  let cvWinSrc = null, cvFieldSrc = null;
  if (m.majorQualifierMetrics) {
    const gridField = addSection('Field Composition',
      'Where do major champions come from, and how is the field constructed?');
    const winSources = m.majorQualifierMetrics.winnerSource;
    const fieldSources = m.majorQualifierMetrics.fieldSource;
    if (winSources) {
      cvWinSrc = el('canvas', { width: '520', height: '240' });
      gridField.appendChild(makeChartCard(
        'Major Champion Sources',
        'Qualification path of each major-event champion',
        cvWinSrc,
        'High season/career/ranking share = merit-driven. High open/fallback = luck-driven entries breaking through.'));
    }
    if (fieldSources) {
      cvFieldSrc = el('canvas', { width: '520', height: '240' });
      gridField.appendChild(makeChartCard(
        'Major Field Sources',
        'Composition of the 256-player major fields by qualification path',
        cvFieldSrc,
        'Compare against Champion Sources: a path that sources X% of fields but Y% of champions has effective skill density Y/X.'));
    }
  }

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 6 — ECONOMICS
  // ─────────────────────────────────────────────────────────────────────────
  let cv7, cv7nm, cv8, cv9, cv10;
  if (hasEco) {
    const gridEco = addSection('Economics',
      'Foundation revenue, prize-pool flow, ROI by skill tier, lifetime P&L.');
    cv7 = el('canvas', { width: '520', height: '240' });
    gridEco.appendChild(makeChartCard(
      'ROI by Skill Tier · ALL events',
      '(prize earned − buy-ins) / buy-ins · includes Main lottery',
      cv7,
      'Includes Main lottery: Bottom tier rarely enters Main but pockets large prizes when they tail-win. WSOP-feel signature, not a bug.'));
    cv7nm = el('canvas', { width: '520', height: '240' });
    gridEco.appendChild(makeChartCard(
      'ROI by Skill Tier · ex-Main',
      'Regulars + Majors only · the skill-only curve',
      cv7nm,
      'Removing Main strips lottery variance. Elite should sit near or above zero; Bottom should sit at-or-below.'));

    // Per-tier breakdown table: events, profit, ITM, ROI per event. Exposes
    // structural detail that the bar charts collapse into single ROI numbers.
    if (m.economics.tiers && m.economics.tiers.length > 0) {
      const tierCard = el('div', { class: 'chart-box' });
      tierCard.appendChild(el('div', { class: 'chart-title', text: 'Per-Tier Breakdown' }));
      tierCard.appendChild(el('div', { class: 'chart-sub', text: 'Events, profit, ITM rate · all events vs ex-Main' }));
      const tbl = el('table', { style: 'width: 100%; font-size: 11px; margin-top: 8px;' });
      const thead = el('thead');
      const hr = el('tr');
      ['Tier','Avg events','Avg profit','ROI','ITM rate','ex-Main events','ex-Main profit','ex-Main ROI'].forEach((h, i) => {
        hr.appendChild(el('th', { text: h, style: 'text-align: ' + (i === 0 ? 'left' : 'right') + '; padding: 4px 6px;' }));
      });
      thead.appendChild(hr);
      tbl.appendChild(thead);
      const tbody = el('tbody');
      m.economics.tiers.forEach(t => {
        const tr = el('tr');
        const profitColor = (v) => 'color: ' + (v >= 0 ? 'var(--chart-pos, #6cc24a)' : 'var(--chart-neg, #d96a6a)') + ';';
        const cells = [
          { text: t.label, align: 'left' },
          { text: (t.avgEvents != null ? t.avgEvents.toFixed(0) : '—'), align: 'right' },
          { text: (t.avgProfit != null ? fmtMoney(t.avgProfit) : '—'), align: 'right', style: t.avgProfit != null ? profitColor(t.avgProfit) : '' },
          { text: ((t.roi || 0) * 100).toFixed(1) + '%', align: 'right', style: profitColor(t.roi || 0) },
          { text: ((t.itmRate || 0) * 100).toFixed(1) + '%', align: 'right' },
          { text: (t.avgEvents_nonMain != null ? t.avgEvents_nonMain.toFixed(0) : '—'), align: 'right' },
          { text: (t.avgProfit_nonMain != null ? fmtMoney(t.avgProfit_nonMain) : '—'), align: 'right', style: t.avgProfit_nonMain != null ? profitColor(t.avgProfit_nonMain) : '' },
          { text: ((t.roi_nonMain || 0) * 100).toFixed(1) + '%', align: 'right', style: profitColor(t.roi_nonMain || 0) },
        ];
        cells.forEach(c => {
          tr.appendChild(el('td', { text: c.text, style: 'text-align: ' + c.align + '; padding: 4px 6px; font-family: monospace; ' + (c.style || '') }));
        });
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      tierCard.appendChild(tbl);
      tierCard.appendChild(el('div', { class: 'chart-note', text: 'ex-Main columns isolate the Regulars+Majors economy. Mid-tier sometimes shows negative ex-Main ROI as the structural-squeeze cohort (lots of buy-ins, no exemptions, no tail wins).' }));
      gridEco.appendChild(tierCard);
    }

    cv8 = el('canvas', { width: '520', height: '240' });
    gridEco.appendChild(makeChartCard(
      'YJ Inc Revenue · Year',
      'Rake collected per simulated year · cumulative line',
      cv8,
      'The foundation balance — YJ Inc topline.'));
    cv9 = el('canvas', { width: '520', height: '240' });
    gridEco.appendChild(makeChartCard(
      'Revenue by Event Type',
      'Which event class fuels YJ Inc',
      cv9, null));
    cv10 = el('canvas', { width: '520', height: '240' });
    gridEco.appendChild(makeChartCard(
      'Profit Distribution (all players)',
      'Histogram of career P&L · negatives = losing players',
      cv10, null));
  }

  // ─────────────────────────────────────────────────────────────────────────
  // SECTION 7 — CAREER ARC
  // ─────────────────────────────────────────────────────────────────────────
  const gridCareer = addSection('Career Arc',
    'Lifetime distributions across all players in the pool.');
  const cv11 = el('canvas', { width: '520', height: '240' });
  gridCareer.appendChild(makeChartCard(
    'Win Distribution',
    'True total wins per player · Gini = ' + m.gini.toFixed(3),
    cv11,
    'Right tail = dynasties. Left pile = the many players who never meaningfully break through.'));
  const cv12 = el('canvas', { width: '520', height: '240' });
  const careerCard = makeChartCard(
    'Career Total Score Distribution',
    'Lifetime golf total per active player · below-par left, above-par right',
    cv12,
    'Reveals middle-of-pack structure that Win Distribution hides (most players never win, but many play par-ish golf for years).');
  // Override id for backward-compat note update
  if (careerCard.lastChild) careerCard.lastChild.id = 'careerScoreNote';
  gridCareer.appendChild(careerCard);

  // Top earners + Biggest losers (side by side)
  const ecoTop = (m.economics && m.economics.topEarners) || [];
  const ecoBot = (m.economics && m.economics.biggestLosers) || [];
  if (hasEco && (ecoTop.length > 0 || ecoBot.length > 0)) {
    function makeLeaderTable(title, rows, emphasis) {
      const card = el('div', { class: 'card' });
      card.appendChild(el('h3', { text: title }));
      const t = el('table');
      const thead = el('thead');
      thead.appendChild(el('tr', null,
        el('th', { text: 'Rank' }), el('th', { text: 'Player' }),
        el('th', { class: 'num', text: 'Skill' }),
        el('th', { class: 'num', text: 'Earned' }),
        el('th', { class: 'num', text: 'Paid' }),
        el('th', { class: 'num', text: 'Profit' }),
        el('th', { class: 'num', text: 'ROI' })
      ));
      t.appendChild(thead);
      const tb = el('tbody');
      rows.forEach((p, i) => {
        const tr = el('tr');
        if (i < 3) tr.className = 'gold-row';
        tr.appendChild(el('td', { text: '#' + (i + 1) }));
        tr.appendChild(el('td', { text: p.name }));
        tr.appendChild(el('td', { class: 'num', text: p.skill.toFixed(2) }));
        tr.appendChild(el('td', { class: 'num' + (emphasis === 'earned' ? ' gold' : ''), text: fmtMoney(p.earned) }));
        tr.appendChild(el('td', { class: 'num', text: fmtMoney(p.paid) }));
        const profitCls = p.profit >= 0 ? 'num green' : 'num';
        tr.appendChild(el('td', { class: profitCls, style: p.profit < 0 ? 'color: var(--chart-pos);' : '', text: (p.profit >= 0 ? '+' : '') + fmtMoney(p.profit) }));
        tr.appendChild(el('td', { class: 'num', text: (p.roi * 100).toFixed(0) + '%' }));
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      card.appendChild(t);
      return card;
    }
    const leaderRow = el('div', { style: 'display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; align-items: start;' });
    leaderRow.appendChild(makeLeaderTable('Top-10 Prize Earners', ecoTop, 'earned'));
    leaderRow.appendChild(makeLeaderTable('Biggest Losers (net P&L)', ecoBot, null));
    wrap.appendChild(leaderRow);
  }

  root.appendChild(wrap);

  setTimeout(() => {
    // Each draw is wrapped in safeDraw so a failure in any single chart
    // (e.g. missing field on an archived/pruned run, unexpected NaN, canvas
    // not yet attached) doesn't blank every subsequent chart in the row.
    // The fallback paints a clear "chart unavailable" placeholder so the
    // user can see WHICH chart failed.
    function safeDraw(canvas, name, fn) {
      if (!canvas) return;
      try { fn(); }
      catch (err) {
        try {
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = chartColors().text;
            ctx.font = 'italic 11px -apple-system, sans-serif';
            ctx.fillText('Chart unavailable: ' + (err && err.message ? err.message : 'unknown error'), 12, canvas.height / 2);
          }
        } catch (_) {}
        if (typeof console !== 'undefined' && console.warn) {
          console.warn('[dashboard] failed to draw ' + name + ':', err);
        }
      }
    }
    function noDataPlaceholder(canvas, label) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = chartColors().text;
      ctx.font = 'italic 11px -apple-system, sans-serif';
      ctx.fillText(label || 'No data for this run', 12, canvas.height / 2);
    }
    safeDraw(cv1, 'skillWinRate', () => drawCurve(cv1, m.skillWinRate.points, 'skill', 'wins', { xLabel: 'Skill', yLabel: 'Avg wins', yDecimals: 1, xDecimals: 2 }));
    safeDraw(cv2, 'bracketSurvival', () => drawTierConversions(cv2, m.bracketSurvival));
    const scoreStats = m.champScoreStats || computeScoreStats(m.champScores || []);
    safeDraw(cv3, 'scoreTrajectory', () => drawCurve(cv3, m.scoreTrajectory.map(s => ({ year: s.year, avg: s.avg })), 'year', 'avg', {
      xLabel: 'Year',
      yLabel: 'Avg champ score',
      yDecimals: 1,
      xDecimals: 0,
      color: chartColors().accent,
      yMin: Math.min(-1, Math.floor(scoreStats.min) - 1),
      yMax: Math.max(1, Math.ceil(scoreStats.max) + 1),
      bestFit: 'linear',
    }));
    safeDraw(cv4, 'actionRate', () => drawStackedArea(cv4, ['preflop','flop','turn','river'].map(s => ({ label: streetLabel(s), check: m.actionRate[s].check || 0, bet: m.actionRate[s].bet || 0, call: m.actionRate[s].call || 0, raise: m.actionRate[s].raise || 0, fold: m.actionRate[s].fold || 0 })), ['check','bet','call','raise','fold'], ['check','bet','call','raise','fold']));
    // v52: equity-bucket fold rate. Direct bar chart drawn inline since none of
    // the existing chart helpers fit single-series labeled bars. This is the
    // single most diagnostic plot for verifying YJ-correct fold polarity.
    if (cv4b) {
      safeDraw(cv4b, 'equityBucketFoldRate', () => {
        const labels = ['0.0-0.2','0.2-0.4','0.4-0.6','0.6-0.8','0.8-1.0'];
        const rates = m.equityBucketActions.map(row => {
          const total = (row.check || 0) + (row.bet || 0) + (row.call || 0) + (row.raise || 0) + (row.fold || 0);
          return total > 0 ? (row.fold || 0) / total : 0;
        });
        const ctx = cv4b.getContext('2d');
        const w = cv4b.width, h = cv4b.height, pad = 48;
        ctx.clearRect(0, 0, w, h);
        const C = chartColors();
        const yMax = Math.max(0.05, Math.max.apply(null, rates) * 1.2);
        chartAxes(ctx, w, h, pad, 0, yMax, labels, v => (v * 100).toFixed(0) + '%');
        const plotW = w - 2 * pad, plotH = h - 2 * pad;
        const colW = plotW / rates.length;
        const barW = Math.min(76, colW * 0.55);
        rates.forEach((r, i) => {
          const cx = pad + colW * (i + 0.5);
          const y = h - pad - (r / yMax) * plotH;
          // YJ-correct: red (warning) only at 0.0-0.2 (where folding is right),
          // orange/red for the higher buckets (where folding is a leak).
          ctx.fillStyle = i === 0 ? C.pos : (r > 0.01 ? C.neg : C.pos);
          ctx.fillRect(cx - barW / 2, y, barW, h - pad - y);
          ctx.fillStyle = C.text; ctx.font = '11px monospace';
          const lbl = (r * 100).toFixed(2) + '%';
          ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, y - 4);
        });
        ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
        const xt = 'Perceived equity (adj)'; ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
        ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
        const yt = 'Fold rate'; ctx.fillText(yt, -ctx.measureText(yt).width / 2, 0); ctx.restore();
      });
    }
    safeDraw(cv5, 'h2hMatrix', () => drawHeatmap(cv5, m.h2hMatrix.rate, ['Q1','Q2','Q3','Q4'], ['Q1','Q2','Q3','Q4'], { xTitle: 'Runner-up quartile', yTitle: 'Champion quartile' }));

    // v53 NEW CHARTS — resolution mix donut, pot at resolution, fold-cost
    // histogram, bluff-read suppression, winner/field source donuts.

    if (cvResMix) {
      safeDraw(cvResMix, 'resolutionMix', () => {
        const r = m.resolutionCounts || {};
        drawDonut(cvResMix, [
          { label: 'Showdown', value: r.showdown || 0 },
          { label: 'Fold',     value: r.fold || 0 },
          { label: 'Tie (carry)', value: r.tie || 0 },
        ], { centerLabel: ((r.fold || 0) + (r.showdown || 0) + (r.tie || 0)).toLocaleString() + ' holes' });
      });
    }
    if (cvPotRes) {
      safeDraw(cvPotRes, 'potAtResolution', () => {
        const labels = ['<4', '4-7', '8-11', '12-15', '16+'];
        const groups = labels.map((lbl, i) => ({
          label: lbl,
          fold:     (m.potBucketsAtFold && m.potBucketsAtFold[i]) || 0,
          showdown: (m.potBucketsAtShowdown && m.potBucketsAtShowdown[i]) || 0,
          tie:      (m.potBucketsAtTie && m.potBucketsAtTie[i]) || 0,
        }));
        drawGroupedHorizontalBars(cvPotRes, groups, [
          { key: 'fold',     label: 'Fold' },
          { key: 'showdown', label: 'Showdown' },
          { key: 'tie',      label: 'Tie' },
        ]);
      });
    }
    if (cvFoldCost) {
      safeDraw(cvFoldCost, 'trueFoldCostHist', () => {
        const items = (m.foldCostHist || []).map((v, i) => ({
          label: TRUE_FOLD_COST_LABELS[i] || String(i),
          value: +v || 0,
        }));
        drawSimpleBars(cvFoldCost, items, {
          xLabel: 'Stroke-equivalent total cost',
          yLabel: 'Folds',
        });
      });
    }
    if (cvBluffRead) {
      safeDraw(cvBluffRead, 'bluffReadSuppression', () => {
        const labels = ['0.00-0.25', '0.25-0.50', '0.50-0.75', '0.75-1.00'];
        const items = (m.bluffReadStats || []).map((row, i) => {
          const supp = (row.reads > 0 && row.naiveSum > 0)
            ? (row.naiveSum - row.appliedSum) / row.naiveSum
            : 0;
          return { label: labels[i], value: supp };
        });
        drawSimpleBars(cvBluffRead, items, {
          xLabel: 'Reading depth bucket',
          yLabel: 'Suppression fraction',
          yDecimals: 2,
          barLabel: (v) => (v * 100).toFixed(1) + '%',
        });
      });
    }
    if (cvWinSrc) {
      safeDraw(cvWinSrc, 'majorWinnerSources', () => {
        const sources = m.majorQualifierMetrics.winnerSource || {};
        const slices = Object.keys(sources)
          .filter(k => sources[k] > 0)
          .map(k => ({ label: k, value: sources[k] }));
        drawDonut(cvWinSrc, slices);
      });
    }
    if (cvFieldSrc) {
      safeDraw(cvFieldSrc, 'majorFieldSources', () => {
        const sources = m.majorQualifierMetrics.fieldSource || {};
        const slices = Object.keys(sources)
          .filter(k => sources[k] > 0)
          .map(k => ({ label: k, value: sources[k] }));
        drawDonut(cvFieldSrc, slices);
      });
    }

    const scoreVals = m.champScores || [];
    if (scoreVals.length > 0) {
      safeDraw(cv6, 'champScores', () => {
        const minScore = Math.min.apply(null, scoreVals);
        const maxScore = Math.max.apply(null, scoreVals);
        const span = Math.max(1, maxScore - minScore + 1);
        // Math.round so fractional spans (champ scores carry honey-divisor
        // fractions) yield an integer bin count for `new Array(bins)`.
        const bins = Math.max(5, Math.min(31, Math.round(span)));
        drawHistogram(cv6, scoreVals, minScore - 0.5, maxScore + 0.5, bins, {
          labelFormat: v => Math.round(v),
          xLabel: 'Champion score',
          yLabel: 'Events',
        });
      });
    } else { noDataPlaceholder(cv6); }

    // v52: per-event-type Champion Score Distributions. Reuses the same bin
    // logic as the pooled chart (cv6) so the three histograms are visually
    // comparable. Each canvas renders only if events of that type exist.
    function drawTypeHistogram(canvas, type) {
      const stats = byTypeStats[type];
      if (!stats || !stats.count || !stats.scores || stats.scores.length === 0) {
        noDataPlaceholder(canvas, 'No ' + type + ' events in this run');
        return;
      }
      safeDraw(canvas, 'champScores_' + type, () => {
        const vals = stats.scores;
        const minScore = Math.min.apply(null, vals);
        const maxScore = Math.max.apply(null, vals);
        const span = Math.max(1, maxScore - minScore + 1);
        const bins = Math.max(5, Math.min(31, Math.round(span)));
        drawHistogram(canvas, vals, minScore - 0.5, maxScore + 0.5, bins, {
          labelFormat: v => Math.round(v),
          xLabel: 'Champion score',
          yLabel: 'Events',
        });
      });
    }
    drawTypeHistogram(cv6Major, 'major');
    drawTypeHistogram(cv6Regular, 'regular');
    drawTypeHistogram(cv6Main, 'main');

    const winVals = m.winTotals || [];
    if (winVals.length > 0) {
      safeDraw(cv11, 'winTotals', () => {
        const maxWins = Math.max.apply(null, winVals);
        drawHistogram(cv11, winVals, 0, Math.max(1, maxWins + 1), Math.max(8, Math.min(20, maxWins + 1)), {
          labelFormat: v => Math.round(v),
          xLabel: 'Career wins',
          yLabel: 'Players',
          // Auto-log when the top bin is 10× the second-top. With large pools most
          // players sit at 0–1 wins while dynasties reach 20+; linear scale hides the tail.
          logScale: 'auto',
        });
      });
    } else { noDataPlaceholder(cv11, 'No win-totals data (run may be archived)'); }
    // Career Total Score Distribution
    const careerScores = m.careerScores || [];
    if (careerScores.length > 0) {
      safeDraw(cv12, 'careerScores', () => {
        // Trim p1/p99 outliers for a readable axis, then round bin edges to integers.
        const sorted = careerScores.slice().sort((a, b) => a - b);
        const p01 = sorted[Math.floor(sorted.length * 0.01)] || sorted[0];
        const p99 = sorted[Math.floor(sorted.length * 0.99)] || sorted[sorted.length - 1];
        const span = Math.max(10, p99 - p01);
        const pad = Math.max(2, Math.round(span * 0.05));
        const lo = Math.floor(p01 - pad);
        const hi = Math.ceil(p99 + pad);
        const bins = 18;
        drawHistogram(cv12, careerScores, lo, hi, bins, {
          labelFormat: v => Math.round(v),
          xLabel: 'Career golf total',
          yLabel: 'Players',
          // Career-total spreads can have a long tail (a few players with -200+
          // dominate the bin counts). Auto-log keeps the body and tail both readable.
          logScale: 'auto',
        });
        // Update note with % below par
        const underPar = careerScores.filter(v => v < 0).length;
        const note = $('#careerScoreNote');
        if (note) {
          const pct = (underPar / careerScores.length * 100).toFixed(1);
          note.textContent = pct + '% of active players have a career total below par (' + underPar + ' of ' + careerScores.length + '). Reveals middle-of-pack structure that Win Distribution hides.';
        }
      });
    } else { noDataPlaceholder(cv12, 'No career-score data (run may be archived)'); }
    if (hasEco) {
      safeDraw(cv7, 'ROITiers', () => drawROITiers(cv7, m.economics.tiers));
      // v52: ROI-ex-Main chart. Reuses drawROITiers by mapping roi_nonMain
      // onto the .roi field of a synthetic tier list. Gracefully degrades if
      // the metric pipeline didn't compute the non-Main breakdown for some
      // reason (older snapshot, archived run).
      safeDraw(cv7nm, 'ROITiers_nonMain', () => {
        const tiersNm = (m.economics.tiers || []).map(t => ({
          label: t.label,
          roi: (typeof t.roi_nonMain === 'number') ? t.roi_nonMain : 0,
        }));
        const hasNonMain = tiersNm.some(t => t.roi !== 0);
        if (!hasNonMain) {
          noDataPlaceholder(cv7nm, 'No ex-Main ROI data on this run');
          return;
        }
        drawROITiers(cv7nm, tiersNm);
      });
      // Auto-engage log-cumulative when the cumulative max exceeds 100× the first
      // year's value — that's the threshold past which linear scaling crushes
      // the early years against the floor.
      const fs = m.economics.foundationSeries || [];
      if (fs.length > 0) {
        safeDraw(cv8, 'foundationRevenue', () => {
          const firstCum = Math.max(1, fs[0].cumulative || 0);
          const lastCum = fs[fs.length - 1].cumulative || 0;
          const useLogCum = lastCum / firstCum >= 100;
          drawFoundationRevenue(cv8, fs, { logCumulative: useLogCum });
        });
      } else { noDataPlaceholder(cv8, 'No per-year revenue data'); }
      safeDraw(cv9, 'revByType', () => drawRevenueByType(cv9, m.economics.revByType));
      const buckets = m.economics.profitBuckets;
      if (buckets && buckets.length > 0) {
        // Asymmetric range — losses are bounded (you can't lose more than you paid in
        // buy-ins, capped at ~$1.5M/player), but wins are unbounded (champion can clear
        // $16M+ over a long career). Forcing the histogram to be symmetric around $0
        // creates empty padding bins on whichever side has the smaller magnitude.
        // Instead: clip outliers via p1/p99, snap bin edges so $0 lands on a boundary,
        // and use ~20 bins for smooth resolution.
        const sorted = buckets.slice().sort((a, b) => a - b);
        const p1 = sorted[Math.floor(sorted.length * 0.01)];
        const p99 = sorted[Math.floor(sorted.length * 0.99)];
        const targetBins = 20;
        const rawBinW = Math.max(1, (p99 - p1) / targetBins);
        // "Nice" bin width: round up to the next 1/2/5 × power-of-10 so labels read clean.
        const mag = Math.pow(10, Math.floor(Math.log10(rawBinW)));
        const ratio = rawBinW / mag;
        const niceBinW = (ratio <= 1 ? 1 : ratio <= 2 ? 2 : ratio <= 5 ? 5 : 10) * mag;
        // Snap lo/hi to integer multiples of niceBinW so $0 falls on a bin edge —
        // that way the negative/positive bin coloring (red vs green) is exact at zero.
        const lo = Math.floor(p1 / niceBinW) * niceBinW;
        const hi = Math.ceil(p99 / niceBinW) * niceBinW;
        const bins = Math.max(8, Math.round((hi - lo) / niceBinW));
        safeDraw(cv10, 'profitBuckets', () => drawHistogram(cv10, buckets, lo, hi, bins, {
          labelFormat: v => fmtMoney(v),
          xLabel: 'Career P&L',
          yLabel: 'Players',
          // Profit distribution is heavy-tailed: most players cluster around the
          // small-loss bin, a handful of dynasties sit at +$15M+. Auto-log so the
          // tail is visible without flattening the central pile to one tall bar.
          logScale: 'auto',
          // Money chart, NOT golf — losses (negative) should render in the
          // warning palette, winnings (positive) in the green palette.
          negativeIsBad: true,
        }));
      } else { noDataPlaceholder(cv10, 'No profit-bucket data'); }
    } else {
      // No economics-derived charts available (largeSimMode-archived run, or
      // an aggregate run with no buy-ins) — paint clear placeholders on each
      // eco canvas so the user sees WHY the panel is blank.
      noDataPlaceholder(cv7, 'No economics data (run may be archived)');
      noDataPlaceholder(cv8, 'No economics data (run may be archived)');
      noDataPlaceholder(cv9, 'No economics data (run may be archived)');
      noDataPlaceholder(cv10, 'No economics data (run may be archived)');
    }
  }, 10);
}

function fmtMoney(n) {
  if (n == null || !isFinite(n)) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1e9) return '$' + (n / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (abs >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'k';
  return '$' + n.toFixed(0);
}

function drawROITiers(canvas, tiers) {
  const w = canvas.width, h = canvas.height, pad = 48;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const rois = tiers.map(t => t.roi);
  const yMax = Math.max(0.1, Math.max.apply(null, rois.map(v => Math.max(v, 0))) * 1.15);
  const yMin = Math.min(0, Math.min.apply(null, rois) * 1.15);
  chartAxes(ctx, w, h, pad, yMin, yMax, tiers.map(t => t.label.split(' ')[0]), v => (v * 100).toFixed(0) + '%');
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / tiers.length;
  const barW = Math.min(76, colW * 0.55);
  const yZero = h - pad - ((0 - yMin) / (yMax - yMin)) * plotH;
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, yZero); ctx.lineTo(w - pad, yZero); ctx.stroke();
  tiers.forEach((t, i) => {
    const cx = pad + colW * (i + 0.5);
    const y = h - pad - ((t.roi - yMin) / (yMax - yMin)) * plotH;
    const top = Math.min(y, yZero), bot = Math.max(y, yZero);
    ctx.fillStyle = t.roi >= 0 ? C.neg : C.pos;
    ctx.fillRect(cx - barW / 2, top, barW, bot - top);
    ctx.fillStyle = C.text; ctx.font = '11px monospace';
    const lbl = (t.roi >= 0 ? '+' : '') + (t.roi * 100).toFixed(0) + '%';
    ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, t.roi >= 0 ? top - 4 : bot + 12);
  });
  // Axis titles
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const xt = 'Skill tier'; ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
  ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
  const yt = 'Return on buy-ins'; ctx.fillText(yt, -ctx.measureText(yt).width / 2, 0); ctx.restore();
}

function drawFoundationRevenue(canvas, series, opts) {
  opts = opts || {};
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  if (series.length === 0) return;

  // Log option: when cumulative spans 3+ orders of magnitude (Y1 ~$50k vs Y45
  // ~$50M), linear scaling crushes early years against the floor. log1p keeps
  // the early growth and the late plateau both legible.
  const useLogCum = !!opts.logCumulative;
  const cumT = (v) => useLogCum ? Math.log(1 + Math.max(0, v)) : v;

  const yearRevMax = Math.max(1, Math.max.apply(null, series.map(s => s.revenue)) * 1.15);
  const cumRawMax = Math.max(1, Math.max.apply(null, series.map(s => s.cumulative)));
  const cumMax = useLogCum ? cumT(cumRawMax) * 1.05 : cumRawMax * 1.05;

  // Adaptive padding driven by the widest tick label on each axis. Without this,
  // a $1.50M label at padL=66 leaves only 10px to the title slot — labels collide
  // with the rotated axis title on narrow canvases.
  ctx.font = '10px -apple-system, sans-serif';
  const sampleSteps = 5;
  let widestLeft = 0, widestRight = 0;
  for (let i = 0; i <= sampleSteps; i++) {
    const lv = (yearRevMax * i) / sampleSteps;
    widestLeft = Math.max(widestLeft, ctx.measureText(fmtMoney(lv)).width);
    const rT = (cumMax * i) / sampleSteps;
    const rRaw = useLogCum ? (Math.exp(rT) - 1) : rT;
    widestRight = Math.max(widestRight, ctx.measureText(fmtMoney(rRaw)).width);
  }
  const padL = 18 /* axis title slot */ + Math.ceil(widestLeft) + 10;
  const padR = 18 /* axis title slot */ + Math.ceil(widestRight) + 10;
  const padT = 30; // legend row + breathing
  const padB = 32; // x ticks + breathing
  const plotW = w - padL - padR, plotH = h - padT - padB;

  // axes frames
  ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, h - padB); ctx.lineTo(w - padR, h - padB); ctx.stroke();
  // right axis line
  ctx.beginPath(); ctx.moveTo(w - padR, padT); ctx.lineTo(w - padR, h - padB); ctx.stroke();

  // left-axis ticks (per-year revenue scale)
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const v = (yearRevMax * i) / steps;
    const y = h - padB - (i / steps) * plotH;
    const lbl = fmtMoney(v);
    ctx.fillText(lbl, padL - ctx.measureText(lbl).width - 6, y + 3);
    if (i > 0) {
      ctx.strokeStyle = C.grid;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    }
  }
  // right-axis ticks (cumulative scale) — display untransformed money values
  // even when plotting on a log axis, so the labels stay readable.
  for (let i = 0; i <= steps; i++) {
    const tickT = (cumMax * i) / steps;
    const tickRaw = useLogCum ? (Math.exp(tickT) - 1) : tickT;
    const y = h - padB - (i / steps) * plotH;
    const lbl = fmtMoney(tickRaw);
    ctx.fillText(lbl, w - padR + 6, y + 3);
  }

  // x-axis labels (years)
  const step = plotW / Math.max(1, series.length);
  const maxXLabels = Math.max(2, Math.floor(plotW / 40));
  const stride = Math.max(1, Math.ceil(series.length / maxXLabels));
  series.forEach((s, i) => {
    if (i % stride !== 0 && i !== series.length - 1) return;
    const x = padL + step * (i + 0.5);
    const lbl = 'Y' + s.year;
    ctx.fillText(lbl, x - ctx.measureText(lbl).width / 2, h - padB + 14);
  });

  // per-year bars (scaled to left axis). For long series (e.g., 45 years), step
  // shrinks so bars become slivers — keep at least 1px and add a 1px gap so
  // adjacent bars stay visually separable.
  const barW = Math.max(1, Math.min(32, step - 2));
  series.forEach((s, i) => {
    const x = padL + step * i + (step - barW) / 2;
    const bh = (s.revenue / yearRevMax) * plotH;
    ctx.fillStyle = C.accent;
    ctx.fillRect(x, h - padB - bh, barW, bh);
  });

  // cumulative line (scaled to right axis; transformed if log mode)
  ctx.strokeStyle = C.primary; ctx.lineWidth = 2.5;
  ctx.beginPath();
  series.forEach((s, i) => {
    const x = padL + step * (i + 0.5);
    const y = h - padB - (cumT(s.cumulative) / cumMax) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = C.primary;
  series.forEach((s, i) => {
    const x = padL + step * (i + 0.5);
    const y = h - padB - (cumT(s.cumulative) / cumMax) * plotH;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, 2 * Math.PI); ctx.fill();
  });

  // Axis titles — placed in the dedicated 18px slot at each side.
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  ctx.save(); ctx.translate(12, padT + plotH / 2); ctx.rotate(-Math.PI / 2);
  const lbl1 = 'Per-year rake ($)';
  ctx.fillText(lbl1, -ctx.measureText(lbl1).width / 2, 0); ctx.restore();
  ctx.save(); ctx.translate(w - 6, padT + plotH / 2); ctx.rotate(Math.PI / 2);
  const lbl2 = useLogCum ? 'Cumulative ($, log)' : 'Cumulative ($)';
  ctx.fillText(lbl2, -ctx.measureText(lbl2).width / 2, 0); ctx.restore();

  // Legend — measureText-positioned so swatches and labels stay clear of each
  // other, and the whole row is centered above the plot. Falls back to 11px → 10px
  // if the legend is wider than the plot.
  const legendItems = [
    { color: C.accent, text: 'Per-year rake' },
    { color: C.primary, text: useLogCum ? 'Cumulative foundation (log)' : 'Cumulative foundation' },
  ];
  const swatch = 10, gap = 6, itemGap = 18;
  function legendWidth(font) {
    ctx.font = font + ' -apple-system, sans-serif';
    let total = 0;
    legendItems.forEach((it, i) => {
      total += swatch + gap + ctx.measureText(it.text).width;
      if (i < legendItems.length - 1) total += itemGap;
    });
    return total;
  }
  let legendFont = '11px';
  let lw = legendWidth(legendFont);
  if (lw > plotW) { legendFont = '10px'; lw = legendWidth(legendFont); }
  ctx.font = legendFont + ' -apple-system, sans-serif';
  let lx = padL + Math.max(0, (plotW - lw) / 2);
  const ly = 10;
  legendItems.forEach(it => {
    ctx.fillStyle = it.color; ctx.fillRect(lx, ly, swatch, 8);
    lx += swatch + gap;
    ctx.fillStyle = C.text; ctx.fillText(it.text, lx, ly + 8);
    lx += ctx.measureText(it.text).width + itemGap;
  });
}

function drawRevenueByType(canvas, revByType) {
  const w = canvas.width, h = canvas.height, pad = 48;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const types = ['major', 'regular', 'main'];
  const colors = [C.accent, C.primary, C.tertiary];
  const vals = types.map(t => revByType[t] || 0);
  const yMax = Math.max(1, Math.max.apply(null, vals) * 1.15);
  chartAxes(ctx, w, h, pad, 0, yMax, types, v => fmtMoney(v));
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / types.length;
  const barW = Math.min(100, colW * 0.6);
  types.forEach((t, i) => {
    const cx = pad + colW * (i + 0.5);
    const bh = (vals[i] / yMax) * plotH;
    ctx.fillStyle = colors[i];
    ctx.fillRect(cx - barW / 2, h - pad - bh, barW, bh);
    ctx.fillStyle = C.text; ctx.font = '11px monospace';
    const lbl = fmtMoney(vals[i]);
    ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, h - pad - bh - 6);
  });
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  const xt = 'Event type'; ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
  ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
  const yt = 'YJ Inc revenue'; ctx.fillText(yt, -ctx.measureText(yt).width / 2, 0); ctx.restore();
}

// v53 ADDITIONAL CHART HELPERS — written for the full-coverage dashboard reorg.
// drawDonut: source breakdowns (winner sources, field sources, resolution mix).
// drawSimpleBars: single-series vertical bars (fold-cost histogram, bluff-read).
// drawGroupedHorizontalBars: grouped horizontal bars (pot-size at resolution).

function drawDonut(canvas, slices, opts) {
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const total = slices.reduce((a, s) => a + (s.value || 0), 0);
  if (total <= 0) {
    ctx.fillStyle = C.text; ctx.font = 'italic 11px -apple-system, sans-serif';
    ctx.fillText('No data', 12, h / 2);
    return;
  }
  // Donut on the left half, legend on the right half.
  const cx = h * 0.55, cy = h / 2, R = h * 0.40, r = R * 0.55;
  const palette = [C.accent, C.primary, C.tertiary || C.accent, C.pos, C.neg, '#9b8cff', '#ffb37a', '#7ad6c5'];
  let a0 = -Math.PI / 2;
  slices.forEach((s, i) => {
    const frac = (s.value || 0) / total;
    const a1 = a0 + frac * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a0) * r, cy + Math.sin(a0) * r);
    ctx.arc(cx, cy, R, a0, a1);
    ctx.arc(cx, cy, r, a1, a0, true);
    ctx.closePath();
    ctx.fillStyle = palette[i % palette.length];
    ctx.fill();
    a0 = a1;
  });
  // Center label
  ctx.fillStyle = C.text; ctx.font = 'bold 14px -apple-system, sans-serif';
  const center = opts.centerLabel || (total + ' total');
  ctx.fillText(center, cx - ctx.measureText(center).width / 2, cy + 5);
  // Legend
  const legendX = h + 8, legendY = 12;
  const lineH = Math.min(20, (h - 24) / Math.max(1, slices.length));
  ctx.font = '11px -apple-system, sans-serif';
  slices.forEach((s, i) => {
    const y = legendY + i * lineH;
    ctx.fillStyle = palette[i % palette.length];
    ctx.fillRect(legendX, y, 10, 10);
    ctx.fillStyle = C.text;
    const pct = (s.value / total * 100).toFixed(1) + '%';
    const txt = s.label + ' · ' + pct + ' · ' + s.value.toLocaleString();
    ctx.fillText(txt, legendX + 16, y + 9);
  });
}

function drawSimpleBars(canvas, items, opts) {
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height, pad = 48;
  ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  if (!items || items.length === 0) {
    ctx.fillStyle = C.text; ctx.font = 'italic 11px -apple-system, sans-serif';
    ctx.fillText('No data', 12, h / 2);
    return;
  }
  const vals = items.map(it => +it.value || 0);
  const yMax = Math.max(0.001, Math.max.apply(null, vals) * 1.15);
  const labels = items.map(it => it.label);
  const yFmt = opts.yFmt || (v => v.toFixed(opts.yDecimals != null ? opts.yDecimals : 0));
  chartAxes(ctx, w, h, pad, 0, yMax, labels, yFmt);
  const plotW = w - 2 * pad, plotH = h - 2 * pad;
  const colW = plotW / items.length;
  const barW = Math.min(60, colW * 0.6);
  items.forEach((it, i) => {
    const cx = pad + colW * (i + 0.5);
    const bh = (vals[i] / yMax) * plotH;
    ctx.fillStyle = it.color || C.accent;
    ctx.fillRect(cx - barW / 2, h - pad - bh, barW, bh);
    ctx.fillStyle = C.text; ctx.font = '11px monospace';
    const lbl = opts.barLabel ? opts.barLabel(vals[i], it) : yFmt(vals[i]);
    ctx.fillText(lbl, cx - ctx.measureText(lbl).width / 2, h - pad - bh - 6);
  });
  ctx.fillStyle = C.text; ctx.font = '10px -apple-system, sans-serif';
  if (opts.xLabel) {
    const xt = opts.xLabel;
    ctx.fillText(xt, (w + pad) / 2 - ctx.measureText(xt).width / 2, h - 4);
  }
  if (opts.yLabel) {
    ctx.save(); ctx.translate(14, h / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText(opts.yLabel, -ctx.measureText(opts.yLabel).width / 2, 0);
    ctx.restore();
  }
}

function drawGroupedHorizontalBars(canvas, groups, series, opts) {
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const C = chartColors();
  const padL = 100, padR = 100, padT = 16, padB = 32;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  // Compute max across all series within each group; total max is the axis bound.
  let maxVal = 0;
  groups.forEach(g => {
    series.forEach(s => { maxVal = Math.max(maxVal, +g[s.key] || 0); });
  });
  if (maxVal <= 0) {
    ctx.fillStyle = C.text; ctx.font = 'italic 11px -apple-system, sans-serif';
    ctx.fillText('No data', 12, h / 2);
    return;
  }
  const palette = [C.accent, C.primary, C.tertiary || C.pos];
  const groupH = plotH / groups.length;
  const seriesH = (groupH * 0.7) / series.length;
  ctx.font = '10px -apple-system, sans-serif';
  groups.forEach((g, gi) => {
    const yTop = padT + gi * groupH + groupH * 0.15;
    ctx.fillStyle = C.text;
    ctx.fillText(g.label, 8, yTop + groupH * 0.4);
    series.forEach((s, si) => {
      const v = +g[s.key] || 0;
      const barW = (v / maxVal) * plotW;
      const y = yTop + si * seriesH;
      ctx.fillStyle = palette[si % palette.length];
      ctx.fillRect(padL, y, barW, seriesH * 0.85);
      ctx.fillStyle = C.text;
      ctx.fillText(v.toLocaleString(), padL + barW + 4, y + seriesH * 0.65);
    });
  });
  // Legend on the right
  ctx.font = '11px -apple-system, sans-serif';
  series.forEach((s, si) => {
    const ly = padT + si * 18;
    ctx.fillStyle = palette[si % palette.length];
    ctx.fillRect(w - padR + 8, ly, 10, 10);
    ctx.fillStyle = C.text;
    ctx.fillText(s.label, w - padR + 22, ly + 9);
  });
}

// Parameter sensitivity sweep UI removed — Yellow Jacket Tour ships as a single optimized
// configuration. Use individual runs and compare them in the Run Registry.

function init() {
  // === UNIFIED SAVE / VERSION-AWARE RESTORE ===
  // Try the unified save bundle first. If it exists, hydrate everything from
  // it (TourState pool/seasons/preferences, LabState config/runs, moments) in
  // a single read. If absent, fall back to the legacy split-key load path so
  // pre-versioning saves still restore cleanly.
  const unified = unifiedRead();
  let restoredFromUnified = false;
  let savedVersion = null;
  if (unified) {
    savedVersion = unifiedRestore(unified);
    restoredFromUnified = true;
    if (!TourState.pool || TourState.pool.length === 0) {
      TourState.pool = buildPool(POOL_SIZE);
    }
    toast('Progress restored from last session', 2200);
  } else if (!loadState()) {
    TourState.pool = buildPool(POOL_SIZE);
    saveState();
    toast('Pool initialized — ' + POOL_SIZE + ' players ready. Run your first season!', 3500);
  } else {
    toast('Tour history restored from last session', 2000);
  }
  if (!restoredFromUnified) loadLabState();
  // honeyEVMultiplier removed — the AI's expectedSkinEV is now equity-based
  // (potValue * adj * skillFactor * 1.2) with no arbitrary multiplier. Strip
  // any legacy ai.honeyEVMultiplier value from restored saves so it can't
  // accidentally re-enter the calculation if downstream code is ever wired
  // to read it again.
  if (LabState.config && LabState.config.ai && 'honeyEVMultiplier' in LabState.config.ai) {
    delete LabState.config.ai.honeyEVMultiplier;
  }
  // v32 migration: derive gameVariant from any pre-existing loserBogey value
  // on restored saves. v31 had loserBogey as the canonical flag with no
  // variant naming; v32 introduces the user-facing 'yellowjacket' / 'bumblebee'
  // variant on top. If gameVariant is absent (legacy save), seed it from the
  // boolean: loserBogey=true → 'yellowjacket', false → 'bumblebee'. If both
  // are present, gameVariant takes precedence and re-resolves loserBogey.
  if (LabState.config) {
    if (!LabState.config.gameVariant) {
      LabState.config.gameVariant = LabState.config.loserBogey ? 'yellowjacket' : 'bumblebee';
    }
    LabState.config.loserBogey = (LabState.config.gameVariant === 'yellowjacket');
  }
  // One-time production-defaults migration — runs when APP_VERSION changes so
  // saved configs from older builds pick up the latest production values for
  // keys we explicitly want everyone on. Custom user values for OTHER keys are
  // preserved (only the listed keys are force-overwritten). The version flip
  // also fires the smart-refresh banner below.
  if (savedVersion && savedVersion !== APP_VERSION && LabState.config) {
    const productionDefaults = {
      poolSize: 25000, seasons: 3,
      majors: 12, regulars: 40, mains: 1,
      majorField: 1024, regularField: 2048, mainField: 128,
      mainQualifiersPerMajor: 512,
      payoutDecay: 0.74,
      buyInRegular: 100, buyInMajor: 1000, buyInMain: 10000,
      rakePercent: 0.03,
      satelliteTierRegular: 15,
      satelliteTierMajor: 150,
      satelliteTierMain: [500, 1500, 4000, 5000],
    };
    Object.assign(LabState.config, productionDefaults);
    toast('Production defaults updated for new build', 3500);
  }
  // Ensure the unified bundle is in sync after any legacy-path restore so the
  // next save immediately writes the canonical key.
  unifiedSave();

  // Smart-refresh banner — fires when a saved version differs from APP_VERSION.
  // Reassures the user their progress is intact and offers a one-click hard
  // reload (which re-fetches index.html bypassing browser cache).
  if (savedVersion && savedVersion !== APP_VERSION) {
    showVersionBanner(savedVersion, APP_VERSION);
  }

  setScoringStyle(LabState.config.scoringStyle || DEFAULT_SIM_CONFIG.scoringStyle);
  setStrokeCap(LabState.config.regularStrokeCap || LabState.config.strokeCap);
  setLoserBogey(!!LabState.config.loserBogey);
  setDecisionDivisor(LabState.config.decisionDivisor);
  setHoneyMagnitude(LabState.config.honeyMagnitude);
  setPotElasticK(LabState.config.potElasticK);

  window.addEventListener('hashchange', onHashChange);
  onHashChange();
  renderBackgroundSimBanner();

  $$('nav.nav a').forEach(a => {
    a.onclick = (e) => { e.preventDefault(); location.hash = '#' + a.dataset.route; };
  });

  const themeToggle = $('#themeToggle');
  if (themeToggle) themeToggle.onclick = toggleTheme;

  document.addEventListener('keydown', (e) => {
    const inInput = ['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName) !== -1;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
    else if (!inInput && e.key === '/') { e.preventDefault(); openCmd(); }
    else if (e.key === 'Escape') { closeCmd(); closeModal(); }
    else if (!inInput && e.key === '?') { showKeyboardHelp(); }
  });
  const cmdInput = $('#cmdInput');
  if (cmdInput) cmdInput.oninput = (e) => renderCmdResults(e.target.value);
  const cmdPalette = $('#cmd-palette');
  if (cmdPalette) cmdPalette.onclick = (e) => { if (e.target.id === 'cmd-palette') closeCmd(); };

  if (location.hash.startsWith('#play/')) {
    const game = decodeGameFromURL(location.href);
    if (game) {
      TourState.activeGame = game;
      location.hash = '#multiplayer';
      toast('Share-link game loaded. Your turn!');
    } else {
      toast('Invalid or tampered share-link');
    }
  }
}

try {
  init();
} catch (e) {
  console.error('Yellow Jacket boot failed:', e);
  showFatalError('Yellow Jacket failed to boot. If you opened this via file://, your browser may be blocking storage or startup APIs.', e && (e.stack || e.message) ? (e.stack || e.message) : String(e));
}
</script>
